          <td class="mono">₹${x.amount.toLocaleString('en-IN')}</td>

function renderHomeGeneric(role){

  const processing = S.orders.filter(o=>o.status==='processing').length;

    const need = S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done').length;

function isLastWorkingDayOfMonth(d){
  d = d || new Date();
  const lastDate = new Date(d.getFullYear(), d.getMonth()+1, 0); // last calendar day of month
  let probe = new Date(lastDate);
  while(probe.getDay()===0){ probe.setDate(probe.getDate()-1); } // Sunday off, roll back to Saturday
  return probe.getFullYear()===d.getFullYear() && probe.getMonth()===d.getMonth() && probe.getDate()===d.getDate();
}

/* ============================= DATA EXPORT (month-wise PDF, date-grouped) ============================= */
function loadImageAsDataURL(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img,0,0);
        resolve(canvas.toDataURL('image/png'));
      }catch(e){ reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function exportMonthPdf(year, month0){
  if(!window.jspdf || !window.jspdf.jsPDF){ showToast('PDF library failed to load', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const monthStart = new Date(year, month0, 1).getTime();
  const monthEnd = new Date(year, month0+1, 1).getTime();
  const inMonth = ts => ts>=monthStart && ts<monthEnd;
  const monthLabel = new Date(year, month0, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});

  const marginX = 40; let y = 50; const pageH = 800; const lineH = 14;
  const ensure = (need)=>{ if(y+need>pageH){ doc.addPage(); y = 50; } };
  const h1 = (t)=>{ ensure(30); doc.setFontSize(16); doc.setFont(undefined,'bold'); doc.text(t, marginX, y); y+=22; doc.setFont(undefined,'normal'); };
  const h2 = (t)=>{ ensure(22); doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text(t, marginX, y); y+=16; doc.setFont(undefined,'normal'); };
  const h3 = (t)=>{ ensure(18); doc.setFontSize(10.5); doc.setFont(undefined,'bold'); doc.text(t, marginX+6, y); y+=14; doc.setFont(undefined,'normal'); };
  const line = (t)=>{ ensure(lineH); doc.setFontSize(9.5); doc.text(t, marginX+12, y); y+=lineH; };

  let textX = marginX;
  try{
    const logoData = await loadImageAsDataURL(COMPANY_LOGO);
    doc.addImage(logoData, 'PNG', marginX, y-14, 34, 34);
    textX = marginX + 44;
  }catch(e){ /* logo couldn't load (e.g. CORS/offline) — skip it, export continues without it */ }

  doc.setFontSize(18); doc.setFont(undefined,'bold');
  doc.text('M A Products INDIA', textX, y); y+=22;
  doc.setFontSize(11); doc.setFont(undefined,'normal');
  doc.text(`Order Management System — Data export: ${monthLabel}`, marginX, y); y+=26;

  // Orders
  h1('Orders');
  const orders = S.orders.filter(o=>inMonth(o.createdAt)).sort((a,b)=>a.createdAt-b.createdAt);
  if(!orders.length) line('No orders this month.');
  groupByDate(orders.slice().sort((a,b)=>b.createdAt-a.createdAt), o=>o.createdAt).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(o=>{
      h3(`${o.customerName} — ${ORDER_STAGE_LABEL[o.status]||o.status} — by ${o.createdBy} — ${fmtTime(o.createdAt)}`);
      o.items.forEach(i=> line(`${i.name} ${i.size} × ${i.qty}`));
    });
  });
  y += 8;

  // Activity log (purchases / filling / packaging)
  h1('Stock entries (purchase / filling / packaging)');
  const logs = S.activityLog.filter(e=>inMonth(e.at));
  if(!logs.length) line('No stock entries this month.');
  groupByDate(logs.slice().sort((a,b)=>b.at-a.at), e=>e.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(e=> line(`${activityLabel(e)} — ${activityAmount(e).replace(/<[^>]+>/g,'')} — by ${e.by} — ${fmtTime(e.at)}`));
  });
  y += 8;

  // Domino printing
  h1('Domino printing');
  const dom = S.dominoPrints.filter(x=>inMonth(x.at));
  if(!dom.length) line('No entries this month.');
  groupByDate(dom.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=> line(`${x.impressions} impressions${x.note?' — '+x.note:''} — by ${x.by} — ${fmtTime(x.at)}`));
  });
  y += 8;

  // Expenses & settlements
  h1('Expenses & settlements');
  const exps = S.expenses.filter(x=>inMonth(x.at));
  if(!exps.length) line('No entries this month.');
  groupByDate(exps.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=> line(`${x.type==='settlement'?'Settled':'Expense'}: ₹${x.amount} — ${x.description||''} — ${x.byName} — ${fmtTime(x.at)}`));
  });
  y += 8;

  // Attendance
  h1('Attendance');
  const att = S.attendance.filter(a=>inMonth(a.timestamp));
  if(!att.length) line('No check-ins this month.');
  groupByDate(att.slice().sort((a,b)=>b.timestamp-a.timestamp), a=>a.timestamp).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(a=> line(`${a.name} — ${a.type} — ${fmtTime(a.timestamp)}${(a.lat||a.lng)?` — ${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}`:''}`));
  });

  const stamp = `${year}-${String(month0+1).padStart(2,'0')}`;
  doc.save(`MA-Products-OrderOps-${stamp}.pdf`);
  showToast('PDF downloaded');
}

function countPresentToday(){

  return seen.size;
}

function bindOrderRowActions(closeAfter){
  document.querySelectorAll('[data-track-link]').forEach(b=>b.addEventListener('click', async ()=>{
    const o = S.orders.find(x=>x.id===b.dataset.trackLink); if(!o) return;
    const link = trackingLinkFor(o);
    try{
      await navigator.clipboard.writeText(link);
      showToast('Tracking link copied — share it with the party');
    }catch(e){
      // Clipboard API unavailable/blocked — fall back to a prompt so it can still be copied manually.
      prompt('Copy this tracking link:', link);
    }
  }));
  document.querySelectorAll('[data-approve-order]').forEach(b=>b.addEventListener('click', ()=>{ setOrderStatus(b.dataset.approveOrder,'processing'); if(closeAfter) closeModal(); render(); }));
  document.querySelectorAll('[data-reject-order]').forEach(b=>b.addEventListener('click', ()=>{ setOrderStatus(b.dataset.rejectOrder,'rejected'); if(closeAfter) closeModal(); render(); }));
  document.querySelectorAll('[data-mark-ready-now]').forEach(b=>b.addEventListener('click', ()=>{ markOrderReadyNow(b.dataset.markReadyNow); }));
  document.querySelectorAll('[data-undo-ready]').forEach(b=>b.addEventListener('click', ()=>{ undoMarkOrderReady(b.dataset.undoReady); }));
  document.querySelectorAll('[data-dispatch-order]').forEach(b=>b.addEventListener('click', ()=>{ openDispatchModal(b.dataset.dispatchOrder); if(closeAfter) closeModal(); }));
  document.querySelectorAll('[data-edit-order]').forEach(b=>b.addEventListener('click', ()=>{
    const o = S.orders.find(x=>x.id===b.dataset.editOrder); if(o) openOrderModal(o);
  }));
  document.querySelectorAll('[data-del-order]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this order?')) return;
    const o = S.orders.find(x=>x.id===b.dataset.delOrder);
    if(o && o.stockDeducted){
      o.items.forEach(d=>{
        if(d.cancelled) return; // already credited back separately (e.g. by Mark Ready) — crediting again would double-count
        S.readyStock[d.key]=(S.readyStock[d.key]||0)+d.qty;
      });
      safeSet('app:readyStock', S.readyStock);
      syncStockTasksFromAlerts();
    }
    S.orders = S.orders.filter(x=>x.id!==b.dataset.delOrder);
    if(o) savePartitionForItem('orders', o);
    if(closeAfter) closeModal(); render();
  }));
}

let orderDraft = [];
let editingOrderId = null;
function openOrderModal(existingOrder){
  editingOrderId = existingOrder ? existingOrder.id : null;
  orderDraft = existingOrder ? existingOrder.items.map(x=>({...x})) : [];
  editingDraftIndex = null;
  showModal(`
    <h3>${existingOrder?'Edit order':'New order'}</h3>
    <div class="field"><label>Customer / Party</label>
      <input id="ordCustomer" list="ordCustomerList" required value="${existingOrder?esc(existingOrder.customerName):''}" placeholder="Type party name…" autocomplete="off" />
      <datalist id="ordCustomerList">${S.customers.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist>
    </div>
    <div class="field"><label>Add item (type to search)</label>
      ${itemPickerHtml('ordItemSel', null)}
    </div>
    <div class="field" id="ordCaseRow" style="display:none;"><label>Cases (<span id="ordCaseSizeHint"></span> pc each)</label><input id="ordItemCases" type="number" min="0" value="0" /></div>
    <div class="field"><label>Pieces (loose, on top of cases)</label>
      <div style="display:flex;gap:6px;">
        <input id="ordItemQty" type="number" min="0" max="${MAX_PC_ENTRY}" value="0" style="flex:2;" />
        <button type="button" class="btn btn-accent btn-sm" id="addItemBtn" style="flex:1;">Add</button>
      </div>
    </div>
    <div id="draftList" style="margin:10px 0;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
      <button type="button" class="btn btn-primary" id="submitOrderBtn">${existingOrder?'Save changes':'Create order'}</button>
    </div>
  `);
  const ordItemSel = document.getElementById('ordItemSel');
  const ordCaseRow = document.getElementById('ordCaseRow');
  const ordCaseSizeHint = document.getElementById('ordCaseSizeHint');
  const refreshOrdCaseRow = ()=>{
    const it = resolveItemFromText(ordItemSel.value);
    if(it && it.caseSize){ ordCaseRow.style.display='block'; ordCaseSizeHint.textContent = it.caseSize; }
    else { ordCaseRow.style.display='none'; }
  };
  ordItemSel.addEventListener('input', refreshOrdCaseRow);
  ordItemSel.addEventListener('change', refreshOrdCaseRow);
  renderDraftList();
  document.getElementById('addItemBtn').addEventListener('click', ()=>{
    const it = resolveItemFromText(ordItemSel.value);
    if(!it){ showAlert('Pick a valid item from the list.'); return; }
    const cases = parseInt(document.getElementById('ordItemCases').value)||0;
    const pcs = parseInt(document.getElementById('ordItemQty').value)||0;
    const qty = (it.caseSize ? cases*it.caseSize : 0) + pcs;
    if(qty<=0){ showAlert('Enter a quantity (cases and/or pieces).'); return; }
    if(qty>MAX_PC_ENTRY){ showAlert(`Max ${MAX_PC_ENTRY} pc per line item.`); return; }
    const key = it.key;
    const existing = orderDraft.find(d=>d.key===key);
    if(existing) existing.qty += qty; else orderDraft.push({key, name:it.name, size:it.size, qty});
    renderDraftList();
    ordItemSel.value=''; document.getElementById('ordItemCases').value='0'; document.getElementById('ordItemQty').value='0';
    ordCaseRow.style.display='none';
  });
  document.getElementById('submitOrderBtn').addEventListener('click', ()=>{
    if(orderDraft.length===0){ showAlert('Add at least one item.'); return; }
    const nameInput = document.getElementById('ordCustomer');
    const typedName = nameInput.value.trim();
    if(!typedName){ showAlert('Enter the party name.'); return; }
    const existingCust = S.customers.find(c=>c.name.trim().toLowerCase()===typedName.toLowerCase());
    let custId = existingCust ? existingCust.id : null;
    let custName = existingCust ? existingCust.name : typedName;
    let custCity = existingCust ? (existingCust.city||'') : '';
    let custPhone = existingCust ? (existingCust.phone||'') : '';
    let custAddress = existingCust ? (existingCust.address||'') : '';
    let custGstin = existingCust ? (existingCust.gstin||'') : '';
    const finish = ()=>{
      const shortItems = [];
      if(existingOrder){
        if(existingOrder.stockDeducted){
          // Already accepted — it holds reserved stock, so editing quantities
          // has to release the old amount and reserve the new amount.
          // Cancelled items were already credited back separately (e.g. by
          // Mark Ready) — skip them here too, or they'd be double-credited.
          existingOrder.items.forEach(d=>{ if(!d.cancelled) S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty; });
          orderDraft.forEach(d=>{
            S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty;
            if(S.readyStock[d.key] < 0) shortItems.push(`${d.name} ${d.size}`);
          });
          safeSet('app:readyStock', S.readyStock);
        }
        // Still pending (not yet accepted) — nothing was ever deducted, so
        // editing quantities is just an item-list change, no stock math needed.
        existingOrder.customerId = custId; existingOrder.customerName = custName; existingOrder.customerCity = custCity;
        existingOrder.customerPhone = custPhone; existingOrder.customerAddress = custAddress; existingOrder.customerGstin = custGstin;
        existingOrder.items = orderDraft.slice();
        savePartitionForItem('orders', existingOrder);
        autoAdvanceOrders();
        syncStockTasksFromAlerts();
        closeModal(); render();
        showToast(shortItems.length? `Order updated — ⚠ short on ${shortItems.join(', ')}` : 'Order updated');
      } else {
        // New orders are just a request until the owner accepts them —
        // stock is only reserved at accept time (see setOrderStatus).
        const nowTs = Date.now();
        const order = {
          id: uid(), orderNumber: generateOrderNumber(nowTs), customerId: custId, customerName: custName, customerCity: custCity, customerPhone: custPhone, customerAddress: custAddress, customerGstin: custGstin,
          items: orderDraft.slice(),
          status:'pending', fillingStatus:'pending', packagingStatus:'pending', stockDeducted:false, processedAt:null,
          createdBy: S.currentUser.name, createdByUsername: S.currentUser.username, createdByRole: S.currentUser.role, createdAt: nowTs
        };
        S.orders.push(order);
        savePartitionForItem('orders', order);
        closeModal(); render();
        showToast('Order submitted — waiting on owner to accept');
      }
    };
    if(!existingCust){
      if(confirm(`"${typedName}" is a new party — save it to the customer directory for next time?`)){
        const city = (prompt('City (used to show orders to non-admin staff without revealing the full party name):') || '').trim();
        const c = { id: uid(), name: typedName, phone:'', city, address:'', gstin:'', addedBy: S.currentUser.name, addedByUsername:S.currentUser.username, addedAt: Date.now() };
        S.customers.push(c);
        safeSet('app:customers', S.customers);
        custId = c.id; custName = c.name; custCity = city;
      }
      // else: proceed without saving a customer record — order still records the typed name.
    }
    finish();
  });
}
let editingDraftIndex = null;
function renderDraftList(){
  const el = document.getElementById('draftList');
  if(!el) return;
  if(orderDraft.length===0){ el.innerHTML = `<div style="font-size:12.5px;color:var(--ink-soft);">No items added yet.</div>`; return; }
  el.innerHTML = orderDraft.map((d,i)=>{
    const it = findItem(d.key);
    const caseSize = it ? it.caseSize : null;
    if(editingDraftIndex===i){
      const cases = caseSize ? Math.floor(d.qty/caseSize) : 0;
      const pcs = caseSize ? d.qty % caseSize : d.qty;
      return `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="font-size:13px;font-weight:700;margin-bottom:6px;">${esc(d.name)} ${esc(d.size)}${caseSize?` <span class="mono" style="font-weight:400;">(${caseSize} pc/case)</span>`:''}</div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${caseSize?`<input type="number" min="0" id="editDraftCases" value="${cases}" placeholder="Cases" style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;" />`:''}
          <input type="number" min="0" id="editDraftPcs" value="${pcs}" placeholder="Pcs" style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;" />
          <button type="button" class="btn btn-sm btn-accent" data-save-draft-edit="${i}">Save</button>
          <button type="button" class="btn btn-sm btn-outline" data-cancel-draft-edit="${i}">✕</button>
        </div>
      </div>`;
    }
    return `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px;">
      <span>${esc(d.name)} ${esc(d.size)} <span class="mono">×${fmtQtyPreferCase(d.qty, caseSize)}</span></span>
      <div class="row-actions">
        <button type="button" class="btn btn-sm btn-outline" data-edit-draft="${i}">Edit</button>
        <button type="button" class="btn btn-sm btn-outline" data-rm-draft="${i}">✕</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-rm-draft]').forEach(b=>b.addEventListener('click', ()=>{
    orderDraft.splice(parseInt(b.dataset.rmDraft),1); editingDraftIndex=null; renderDraftList();
  }));
  el.querySelectorAll('[data-edit-draft]').forEach(b=>b.addEventListener('click', ()=>{
    editingDraftIndex = parseInt(b.dataset.editDraft); renderDraftList();
  }));
  el.querySelectorAll('[data-cancel-draft-edit]').forEach(b=>b.addEventListener('click', ()=>{
    editingDraftIndex = null; renderDraftList();
  }));
  el.querySelectorAll('[data-save-draft-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const i = parseInt(b.dataset.saveDraftEdit);
    const d = orderDraft[i];
    const it = findItem(d.key);
    const caseSize = it ? it.caseSize : null;
    const casesInput = document.getElementById('editDraftCases');
    const pcsInput = document.getElementById('editDraftPcs');
    const cases = casesInput ? (parseInt(casesInput.value)||0) : 0;
    const pcs = parseInt(pcsInput.value)||0;
    const qty = (caseSize ? cases*caseSize : 0) + pcs;
    if(qty<=0){ showAlert('Enter a quantity.'); return; }
    if(qty>MAX_PC_ENTRY){ showAlert(`Max ${MAX_PC_ENTRY} pc per line item.`); return; }
    d.qty = qty;
    editingDraftIndex = null;
    renderDraftList();
  }));
}

/* ============================= CHAT-STYLE ORDER ENTRY (voice / paste / free text -> draft) ============================= */
function guessNewPartyName(text){
  // Matches the app's own example convention: "Party Name - item x5, item2 x3".
  // Only used when no existing customer already matched the text.
  const dashMatch = text.match(/^\s*([^\n,;]+?)\s+[-–—]\s+/);
  if(!dashMatch) return null;
  const candidate = dashMatch[1].trim();
  if(!candidate || candidate.length<3 || candidate.length>60) return null;
  if(/^\d+$/.test(candidate)) return null;
  const cLower = candidate.toLowerCase();
  if(CATALOG_FLAT.some(it=>cLower.includes(it.name.toLowerCase()))) return null; // looks like a product line, not a name
  return candidate;
}
function parseOrderText(text){
  const result = { customerId:null, customerName:null, items:[], unmatched:[] };
  const lower = text.toLowerCase();
  let bestCust = null, bestLen = 0;
  S.customers.forEach(c=>{
    const n = c.name.toLowerCase();
    if(n.length>=3 && lower.includes(n) && n.length>bestLen){ bestCust = c; bestLen = n.length; }
  });
  if(bestCust){ result.customerId = bestCust.id; result.customerName = bestCust.name; }
  else { result.customerName = guessNewPartyName(text); }
  const segments = text.split(/\n|,|;|\band\b/i).map(s=>s.trim()).filter(Boolean);
  segments.forEach(seg=>{
    const segLower = seg.toLowerCase();
    if(bestCust && segLower.includes(bestCust.name.toLowerCase()) && seg.replace(bestCust.name,'').trim().length<3) return;
    let bestItem = null, bestScore = 0;
    CATALOG_FLAT.forEach(it=>{
      const nameOnly = it.name.toLowerCase();
      const sizeNorm = normSize(it.size);
      const segNorm = segLower.replace(/\s+/g,'');
      let score = 0;
      if(segLower.includes(nameOnly) && segNorm.includes(sizeNorm)) score = nameOnly.length + sizeNorm.length + 10;
      else if(segLower.includes(nameOnly)) score = nameOnly.length;
      if(score>bestScore){ bestScore=score; bestItem=it; }
    });
    if(bestItem){
      const nums = seg.match(/\d+/g);
      let qty = 1;
      if(nums && nums.length){
        const sizeNum = (bestItem.size.match(/\d+/)||[])[0];
        const candidate = nums.find(n=>n!==sizeNum) || (nums.length>1?nums[nums.length-1]:null);
        if(candidate) qty = parseInt(candidate)||1;
      }
      const existing = result.items.find(d=>d.key===bestItem.key);
      if(existing) existing.qty += qty; else result.items.push({key:bestItem.key, name:bestItem.name, size:bestItem.size, qty});
    } else if(seg.length>2){
      result.unmatched.push(seg);
    }
  });
  return result;
}
function openChatOrderModal(){
  showModal(`
    <h3>Quick order</h3>
    <p class="desc" style="margin-top:-6px;">Type, paste, or speak — party &amp; items auto-detected.</p>
    <div class="field">
      <textarea id="chatOrderText" rows="5" placeholder="e.g. Ramesh Traders - Olife Gold 200ml x10, Castor Oil 100ml 5pc"></textarea>
    </div>
    <div class="row-actions" style="margin-bottom:10px;">
      <button type="button" class="btn btn-outline btn-sm" id="chatMicBtn">🎤 Voice</button>
      <button type="button" class="btn btn-accent btn-sm" id="chatParseBtn">Parse to draft</button>
    </div>
    <div id="chatDraftPreview"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
      <button type="button" class="btn btn-primary" id="chatConfirmBtn" style="display:none;">Confirm &amp; create order</button>
    </div>
  `);
  let parsed = null;
  const micBtn = document.getElementById('chatMicBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    const rec = new SR(); rec.lang='en-IN'; rec.interimResults=false;
    micBtn.addEventListener('click', ()=>{ micBtn.textContent = '🎙️ Listening…'; try{ rec.start(); }catch(e){} });
    rec.onresult = (e)=>{
      const txt = e.results[0][0].transcript;
      const ta = document.getElementById('chatOrderText');
      if(ta) ta.value = (ta.value ? ta.value+'\n' : '') + txt;
      micBtn.textContent = '🎤 Voice';
    };
    rec.onerror = ()=>{ micBtn.textContent = '🎤 Voice'; showToast('Voice input failed — try typing instead', true); };
    rec.onend = ()=>{ micBtn.textContent = '🎤 Voice'; };
  } else {
    micBtn.disabled = true; micBtn.title = 'Voice input not supported in this browser';
  }
  const renderChatDraftPreview = (p)=>{
    const box = document.getElementById('chatDraftPreview');
    box.innerHTML = `
      <div class="field"><label>Party (auto-detected — edit if wrong)</label>
        <input id="chatCustInput" list="chatCustList" value="${esc(p.customerName||'')}" placeholder="Type party name…" autocomplete="off" />
        <datalist id="chatCustList">${S.customers.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist>
      </div>
      <div style="font-size:12.5px;font-weight:700;margin:8px 0 4px;">Draft items</div>
      ${p.items.length===0?`<div class="empty" style="padding:14px;">No items recognized — edit the text and try again.</div>`:
        p.items.map((d,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span>${esc(d.name)} ${esc(d.size)} <span class="mono">×${d.qty}</span></span><button type="button" class="btn btn-sm btn-outline" data-rm-chat-item="${i}">✕</button></div>`).join('')}
      ${p.unmatched.length?`<div class="err" style="margin-top:8px;">Couldn't match: ${esc(p.unmatched.join(', '))}</div>`:''}
    `;
    const confirmBtn = document.getElementById('chatConfirmBtn');
    if(confirmBtn) confirmBtn.style.display = p.items.length? 'inline-flex':'none';
    box.querySelectorAll('[data-rm-chat-item]').forEach(b=>b.addEventListener('click', ()=>{
      parsed.items.splice(parseInt(b.dataset.rmChatItem),1);
      renderChatDraftPreview(parsed);
    }));
  };
  document.getElementById('chatParseBtn').addEventListener('click', ()=>{
    const text = document.getElementById('chatOrderText').value.trim();
    if(!text){ showAlert('Type, paste, or speak an order first.'); return; }
    parsed = parseOrderText(text);
    renderChatDraftPreview(parsed);
  });
  document.getElementById('chatConfirmBtn').addEventListener('click', ()=>{
    const nameInput = document.getElementById('chatCustInput');
    const typedName = nameInput ? nameInput.value.trim() : '';
    if(!typedName){ showAlert('Enter the party name.'); return; }
    if(!parsed || parsed.items.length===0){ showAlert('No items to order.'); return; }
    const existingCust = S.customers.find(c=>c.name.trim().toLowerCase()===typedName.toLowerCase());
    let custId = existingCust ? existingCust.id : null;
    let custName = existingCust ? existingCust.name : typedName;
    let custCity = existingCust ? (existingCust.city||'') : '';
    let custPhone = existingCust ? (existingCust.phone||'') : '';
    let custAddress = existingCust ? (existingCust.address||'') : '';
    let custGstin = existingCust ? (existingCust.gstin||'') : '';
    const finish = ()=>{
      const nowTs = Date.now();
      const order = {
        id: uid(), orderNumber: generateOrderNumber(nowTs), customerId: custId, customerName: custName, customerCity: custCity, customerPhone: custPhone, customerAddress: custAddress, customerGstin: custGstin,
        items: parsed.items.slice(),
        status:'pending', fillingStatus:'pending', packagingStatus:'pending', stockDeducted:false, processedAt:null,
        createdBy: S.currentUser.name, createdByUsername: S.currentUser.username, createdByRole: S.currentUser.role, createdAt: nowTs
      };
      S.orders.push(order);
      savePartitionForItem('orders', order);
      closeModal(); render();
      showToast('Order submitted — waiting on owner to accept');
    };
    if(!existingCust){
      if(confirm(`"${typedName}" is a new party — save it to the customer directory for next time?`)){
        const city = (prompt('City (used to show orders to non-admin staff without revealing the full party name):') || '').trim();
        const c = { id: uid(), name: typedName, phone:'', city, address:'', gstin:'', addedBy: S.currentUser.name, addedByUsername:S.currentUser.username, addedAt: Date.now() };
        S.customers.push(c);
        safeSet('app:customers', S.customers);
        custId = c.id; custName = c.name; custCity = city;
      }
    }
    finish();
  });
}

function bindCustomers(){
  document.getElementById('newCustBtn').addEventListener('click', ()=>openCustomerModal(null));
  document.querySelectorAll('[data-edit-cust]').forEach(b=>b.addEventListener('click', ()=>{
    const c = S.customers.find(x=>x.id===b.dataset.editCust); if(c) openCustomerModal(c);
  }));
  document.querySelectorAll('[data-del-cust]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this customer?')) return;
    S.customers = S.customers.filter(c=>c.id!==b.dataset.delCust);
    safeSet('app:customers', S.customers); render();
  }));
}
function openCustomerModal(existingCust){
  showModal(`
    <h3>${existingCust?'Edit customer':'Add customer'}</h3>
    <form id="custForm">
      <div class="field"><label>Name</label><input id="custName" value="${existingCust?esc(existingCust.name):''}" required /></div>
      <div class="field"><label>WhatsApp number (10-digit)</label><input id="custPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" value="${existingCust?esc(existingCust.phone||''):''}" required /></div>
      <div class="field"><label>City</label><input id="custCity" value="${existingCust?esc(existingCust.city||''):''}" placeholder="e.g. Jaipur" required /></div>
      <div class="field"><label>Address</label><textarea id="custAddr" rows="2">${existingCust?esc(existingCust.address||''):''}</textarea></div>
      <div class="field"><label>GSTIN (optional)</label><input id="custGstin" value="${existingCust?esc(existingCust.gstin||''):''}" placeholder="22AAAAA0000A1Z5" style="text-transform:uppercase;" /></div>
      <div class="field"><label>Preferred Transport (optional)</label>
        <input id="custTransport" list="custTransportList" value="${existingCust?esc(existingCust.transport||''):''}" placeholder="e.g. XYZ Roadways" />
        <datalist id="custTransportList">${S.transports.map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">${existingCust?'Save changes':'Add customer'}</button>
      </div>
    </form>
  `);
  document.getElementById('custForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const phone = document.getElementById('custPhone').value.trim();
    if(!/^\d{10}$/.test(phone)){ showAlert('Enter a valid 10-digit WhatsApp number.'); return; }
    const fields = {
      name: document.getElementById('custName').value.trim(),
      phone,
      city: document.getElementById('custCity').value.trim(),
      address: document.getElementById('custAddr').value.trim(),
      gstin: document.getElementById('custGstin').value.trim().toUpperCase(),
      transport: document.getElementById('custTransport').value.trim(),
    };
    rememberTransport(fields.transport);
    if(existingCust){
      Object.assign(existingCust, fields);
    } else {
      S.customers.push({
        id: uid(), ...fields,
        addedBy: S.currentUser.name, addedByUsername: S.currentUser.username, addedAt: Date.now()
      });
    }
    safeSet('app:customers', S.customers);
    closeModal(); render(); showToast(existingCust?'Customer updated':'Customer added');
  });
}

function renderUsers(){
  return `

function resetAllDataExceptUsers(){
  const pwd = prompt("Enter your admin password to confirm — this wipes everything except Users:");
  if(pwd===null) return;
  if(pwd !== S.currentUser.password){ showAlert('Incorrect password.'); return; }
  if(!confirm('This will permanently erase ALL orders, customers, stock levels, expenses, logs, tasks, attendance, login history, and domino records. Users stay. This cannot be undone. Continue?')) return;
  // Every day-partition row we've ever seen for these entities needs to be
  // deleted on the backend too, or old days would silently reappear the
  // next time data is merged back in from the sheet.
  const keysToDelete = [];
  PARTITIONED_ENTITIES.forEach(entity=>{
    (S._partitionKeysSeen[entity] || new Set()).forEach(day=>keysToDelete.push(entity+'_'+day));
  });
  S.orders = []; S.customers = []; S.attendance = []; S.tasks = []; S.loginLog = [];
  S.rawMaterial = {}; S.filledStock = {}; S.readyStock = {};
  S.expenses = []; S.activityLog = []; S.stockTasks = []; S.dominoPrints = [];
  S.lowStock = {raw:{}, filled:{}, ready:{}};
  PARTITIONED_ENTITIES.forEach(entity=>{ S._partitionKeysSeen[entity] = new Set(); });
  offlineQueue = {}; persistOfflineQueue(); updateSyncStatusUI(); // don't let a stale queued save push old data back after reset
  Promise.all([
    safeSet('app:customers', S.customers), safeSet('app:tasks', S.tasks),
    safeSet('app:rawMaterial', S.rawMaterial), safeSet('app:filledStock', S.filledStock),
    safeSet('app:readyStock', S.readyStock), safeSet('app:stockTasks', S.stockTasks),
    safeSet('app:lowStock', S.lowStock),
    apiDeleteKeys(keysToDelete)
  ]);
  render();
  showToast('All data reset — Users kept');
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// All user profiles are stored together as one JSON blob in a single Google
// Sheet cell (~50,000 char limit), so every photo has to stay genuinely
// small. Shrinks progressively until it fits, rather than silently failing
// to save later.
async function resizeImageFileSafe(file){
  const steps = [ [128,0.65], [100,0.55], [80,0.45], [64,0.4] ];
  let last = null;
  for(const [dim, q] of steps){
    last = await resizeImageFile(file, dim, q);
    if(last.length <= 8000) return last;
  }
  return last;
}

/* Order-driven tasks (filling/packaging) plus general tasks admin can hand out to anyone. */
function getMyEntries(username){
  const items = [];
  S.orders.forEach(o=>{ if(o.createdByUsername===username) items.push({label:`Order — ${o.customerName}`, detail:o.items.map(i=>`${i.name} ${i.size} ×${i.qty}`).join(', '), at:o.createdAt, tag:ORDER_STAGE_LABEL[o.status]||o.status}); });
  S.activityLog.forEach(e=>{ if(e.byUsername===username) items.push({label:activityLabel(e), detail:activityAmount(e), at:e.at, tag:e.kind}); });
  S.expenses.forEach(x=>{ if(x.byUsername===username || x.enteredByUsername===username) items.push({label:x.description||(x.type==='settlement'?'Settlement paid':'Expense'), detail:`₹${x.amount.toLocaleString('en-IN')}`, at:x.at, tag:x.type||'expense'}); });
  S.customers.forEach(c=>{ if(c.addedByUsername===username) items.push({label:`New party — ${c.name}`, detail:c.phone||'', at:c.addedAt, tag:'party'}); });
  S.dominoPrints.forEach(x=>{ if(x.byUsername===username) items.push({label:'Domino printing', detail:`${x.impressions.toLocaleString('en-IN')} impressions`, at:x.at, tag:'domino'}); });
  return items.sort((a,b)=>b.at-a.at).slice(0,10);
}

function renderTasks(){
  const role = S.currentUser.role;
  const isAdmin = role==='admin';

  let orderRelevant = [];
  if(role==='manager'){ orderRelevant = S.orders.filter(o=>o.status==='processing'); }
  else if(role==='filling'){ orderRelevant = S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done'); }
  else if(role==='packaging'){ orderRelevant = S.orders.filter(o=>o.status==='processing' && o.fillingStatus==='done' && o.packagingStatus!=='done'); }

  const myGeneralTasks = S.tasks.filter(t=>t.assignedTo===S.currentUser.username || t.assignedTo==='role:'+role).sort((a,b)=>b.createdAt-a.createdAt);
  const allGeneralTasks = S.tasks.slice().sort((a,b)=>b.createdAt-a.createdAt);

  let orderTasksBlock = '';
  if(role==='filling' || role==='packaging'){
    // Unified worker view: order demand + relevant stock alerts, merged into
    // one "what needs doing" list. No separate cards to check.
    const demand = {};
    orderRelevant.forEach(o=>o.items.forEach(i=>{
      if(!demand[i.key]) demand[i.key] = {qty:0, fromOrder:false, fromAlert:false, alertText:''};
      demand[i.key].qty += i.qty;
      demand[i.key].fromOrder = true;
    }));
    const myStockTasks = S.stockTasks.filter(t=>t.status==='open' && t.targetRole===role);
    const alertsNow = getStockAlerts();
    const alertListNow = role==='filling' ? alertsNow.filled : alertsNow.ready;
    myStockTasks.forEach(t=>{
      if(!demand[t.itemId]) demand[t.itemId] = {qty:0, fromOrder:false, fromAlert:false, alertText:'', tier:null};
      demand[t.itemId].fromAlert = true;
      demand[t.itemId].alertText = t.qtyText || '';
      demand[t.itemId].tier = t.tier || null;
      const am = alertListNow.find(a=>a.id===t.itemId);
      if(am && am.needQty) demand[t.itemId].suggestedQty = am.needQty;
    });
    const rows = Object.entries(demand).sort((a,b)=>{
      // Recommended-only items (no real order/urgent demand) sink to the bottom.
      const aRec = (a[1].tier==='recommended' && !a[1].fromOrder) ? 1 : 0;
      const bRec = (b[1].tier==='recommended' && !b[1].fromOrder) ? 1 : 0;
      return aRec - bRec;
    });
    orderTasksBlock = `
    <div class="card">
      <h2>${role==='filling'?'What needs to be filled':'What needs to be packed'}</h2>
      <p class="desc">Orders + stock alerts, in one place.</p>
      ${rows.length===0?`<div class="empty"><div class="big">✅</div>Nothing pending right now.</div>`:`
      <table><thead><tr><th>Item</th><th>Qty / reason</th><th></th></tr></thead><tbody>
      ${rows.map(([key,d])=>{
        const it=findItem(key);
        const alertBadge = d.tier==='recommended' ? '<span class="badge badge-processing">Recommended</span>' : '<span class="badge badge-rejected">Stock alert</span>';
        const tags = `${d.fromOrder?'<span class="badge badge-pending">Order</span> ':''}${d.fromAlert?alertBadge:''}`;
        const qtyText = d.qty>0 ? `<b>${d.qty} pc</b>` : (d.alertText||'');
        const suggestedQty = d.qty>0 ? d.qty : (d.suggestedQty||0);
        return `<tr><td>${esc(it?it.name:key)} <span class="mono">${esc(it?it.size:'')}</span><div style="margin-top:3px;">${tags}</div></td><td class="mono">${qtyText}</td><td>${role==='filling'?`<button class="btn btn-sm btn-accent" data-quick-fill="${key}|${suggestedQty}">Record</button>`:`<button class="btn btn-sm btn-accent" data-quick-pack="${key}|${suggestedQty}">Record</button>`}</td></tr>`;
      }).join('')}
      </tbody></table>`}
      ${orderRelevant.length? `<p class="desc" style="margin:10px 0 0;">${orderRelevant.length} order(s) waiting — tap once done.</p>
      <div class="row-actions" style="margin-top:6px;">${orderRelevant.map(o=>`<button class="btn btn-sm btn-accent" data-mark-${role==='filling'?'filling':'packaging'}="${o.id}">${esc(orderDisplayLabel(o))} done</button>`).join('')}</div>` : ''}
    </div>`;
  } else if(orderRelevant.length){
    orderTasksBlock = `
    <div class="card">
      <h2>Processing orders — update progress</h2>
      <p class="desc">Accepted orders in progress.</p>
      <table><thead><tr><th>Customer</th><th>Items</th><th>Filling</th><th>Packaging</th></tr></thead><tbody>
      ${orderRelevant.map(o=>`
        <tr>
          <td><b>${esc(o.customerName)}</b></td>
          <td>${o.items.map(i=>`${esc(i.name)} ${esc(i.size)} ×${i.qty}`).join('<br/>')}</td>
          <td><span class="badge badge-${o.fillingStatus==='done'?'done':'pending'}">${o.fillingStatus||'pending'}</span></td>
          <td><span class="badge badge-${o.packagingStatus==='done'?'done':'pending'}">${o.packagingStatus||'pending'}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  }

  const generalTaskRow = (t, showAssignee)=>`
    <tr>
      <td><b>${esc(t.title)}</b>${t.description?`<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${esc(t.description)}</div>`:''}</td>
      ${showAssignee?`<td class="mono">${t.assignedTo?esc(t.assignedToName):'— unassigned —'}</td>`:''}
      <td class="mono">${t.dueDate?esc(t.dueDate):'—'}</td>
      <td><span class="badge badge-${t.status==='done'?'done':'pending'}">${t.status}</span></td>
      <td class="row-actions">
        ${t.status!=='done' && !isAdmin ? `<button class="btn btn-sm btn-success" data-complete-task="${t.id}">Mark done</button>` : ''}
        ${isAdmin ? `<button class="btn btn-sm btn-outline" data-edit-task="${t.id}">Edit</button>${t.assignedTo?`<button class="btn btn-sm btn-outline" data-unassign-task="${t.id}">Unassign</button>`:''}<button class="btn btn-sm btn-danger" data-del-task="${t.id}">Delete</button>` : ''}
      </td>
    </tr>`;

  const generalTasksBlock = isAdmin ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2>Assigned tasks</h2><p class="desc">Assign a task to anyone.</p></div>
        <button class="btn btn-primary btn-sm" id="newTaskBtn">+ New task</button>
      </div>
      ${allGeneralTasks.length===0?`<div class="empty"><div class="big">🗒️</div>No tasks created yet.</div>`:`
      <table><thead><tr><th>Task</th><th>Assigned to</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>
        ${allGeneralTasks.map(t=>generalTaskRow(t,true)).join('')}
      </tbody></table>`}
    </div>` : `
    <div class="card">
      <h2>My assigned tasks</h2>
      <p class="desc">From the admin.</p>
      ${myGeneralTasks.length===0?`<div class="empty"><div class="big">🗒️</div>Nothing assigned to you right now.</div>`:`
      <table><thead><tr><th>Task</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>
        ${myGeneralTasks.map(t=>generalTaskRow(t,false)).join('')}
      </tbody></table>`}
    </div>`;

  const myEntries = getMyEntries(S.currentUser.username);
  const activityBlock = `
    <div class="card">
      <h2>Your recent entries</h2>
      <p class="desc">Everything you've added.</p>
      ${myEntries.length===0?`<div class="empty">Nothing logged by you yet.</div>`:`
      <table><thead><tr><th>Entry</th><th>Detail</th><th>When</th></tr></thead><tbody>
      ${myEntries.map(e=>`<tr><td>${esc(e.label)}<div class="mono" style="margin-top:2px;">${esc(e.tag)}</div></td><td class="mono">${esc(e.detail)}</td><td class="mono">${fmtDate(e.at)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>`;

  return quickActionIcons(role) + generalTasksBlock + orderTasksBlock + activityBlock;
}

    savePartitionForItem('orders', o); autoAdvanceOrders(); render(); showToast('Filling done — sent to packaging team');

  }));

        dueDate: document.getElementById('taskDue').value || '',
        status:'open', createdBy: S.currentUser.name, createdByUsername: S.currentUser.username, createdAt: Date.now()
      });
    }
    safeSet('app:tasks', S.tasks);
    closeModal(); render(); showToast('Task assigned');
  });
}

function openFillingModal(prefillKey, prefillQty){
  showModal(`
    <h3>Record filling</h3>
    <p class="desc" style="margin-top:-6px;">Raw material → filled stock.</p>
    <form id="fillForm">
      <div class="field"><label>Item (type to search)</label>${itemPickerHtml('fillItem', prefillKey)}</div>
      <div class="field"><label>Quantity filled (pieces, max ${MAX_PC_ENTRY})</label><input id="fillQty" type="number" min="1" max="${MAX_PC_ENTRY}" value="${prefillQty>0?prefillQty:''}" required /></div>
      ${prefillQty>0?`<p class="desc" style="margin-top:-6px;">Pre-filled with the shortfall — edit if needed.</p>`:''}
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">Record</button>
      </div>
    </form>
  `);
  document.getElementById('fillForm').addEventListener('submit', e=>{
    e.preventDefault();
    const key = prefillKey || (resolveItemFromText(document.getElementById('fillItem').value)||{}).key;
    const it = findItem(key);
    if(!it){ showAlert('Pick a valid item from the list.'); return; }
    const qty = parseInt(document.getElementById('fillQty').value)||0;
    if(qty<=0) return;
    if(qty>MAX_PC_ENTRY){ showAlert(`Max ${MAX_PC_ENTRY} pc per entry.`); return; }
    const mlNeeded = qty*it.ml;
    const rawAvail = S.rawMaterial[it.rawCat]||0;
    if(rawAvail < mlNeeded){
      const shortL = ((mlNeeded-rawAvail)/1000).toFixed(2);
      showAlert(`Not enough ${it.rawCat} — short by ${shortL} L. Record a purchase first.`);
      return;
    }
    S.rawMaterial[it.rawCat] = rawAvail - mlNeeded;
    S.filledStock[key] = (S.filledStock[key]||0) + qty;
    Promise.all([safeSet('app:rawMaterial',S.rawMaterial), safeSet('app:filledStock',S.filledStock)]);
    logActivity({kind:'filling', key, itemLabel:`${it.name} ${it.size}`, qty, rawCat:it.rawCat, mlPer:it.ml});
    completeStockTasksForItem('filled', key);
    syncStockTasksFromAlerts();
    closeModal(); render();
    showToast('Filling recorded');
  });
}

      </div>
    </form>
  `);
  const itemSel = document.getElementById('packItem');
  const caseRow = document.getElementById('packCaseRow');
  const caseHint = document.getElementById('packCaseSizeHint');
  const currentKey = ()=> prefillKey || (resolveItemFromText(itemSel.value)||{}).key;
  const refreshCaseRow = ()=>{
    const it = findItem(currentKey());
    if(it && it.caseSize){ caseRow.style.display='block'; caseHint.textContent = it.caseSize; }
    else { caseRow.style.display='none'; }
  };
  itemSel.addEventListener('input', refreshCaseRow);
  itemSel.addEventListener('change', refreshCaseRow);
  refreshCaseRow();
  document.getElementById('packForm').addEventListener('submit', e=>{
    e.preventDefault();
    const key = currentKey();
    const it = findItem(key);
    if(!it){ showAlert('Pick a valid item from the list.'); return; }
    const cases = parseInt(document.getElementById('packCases').value)||0;
    const pcs = parseInt(document.getElementById('packQty').value)||0;
    const note = document.getElementById('packNote').value.trim();
    const qty = (it && it.caseSize ? cases*it.caseSize : 0) + pcs;
    if(qty<=0){ showAlert('Enter a quantity (cases and/or pieces).'); return; }
    if(qty>MAX_PC_ENTRY){ showAlert(`Max ${MAX_PC_ENTRY} pc per entry.`); return; }

    if(filledAvail < qty){
      showAlert(`${it.name} ${it.size} is short by ${qty-filledAvail} pc in Filled stock — fill more before packing.`);
      return;
    }
    S.filledStock[key] = filledAvail - qty;
    S.readyStock[key] = (S.readyStock[key]||0) + qty;
    Promise.all([safeSet('app:filledStock',S.filledStock), safeSet('app:readyStock',S.readyStock)]);
    logActivity({kind:'packaging', key, itemLabel: it?`${it.name} ${it.size}`:key, qty, note});
    completeStockTasksForItem('ready', key);
    autoAdvanceOrders();
    syncStockTasksFromAlerts();
    closeModal(); render();
    showToast('Packaging recorded');
  });
}

function recordPresent(lat, lng, note){
  const entry = {
    id: uid(), username: S.currentUser.username, name: S.currentUser.name, type:'present',
    lat: lat, lng: lng, timestamp: Date.now(), note: note||''
  };
  S.attendance.push(entry);

function bindCheckin(){
  const btn = document.getElementById('checkBtn');
  if(!btn) return; // already marked present today — nothing to bind
  const attemptGetPosition = (opts)=> new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve, reject, opts);
  });
  const requestLocation = async (msg)=>{
    // Try a precise GPS fix first; if that fails or times out, retry once
    // with a coarser network/wifi-based fix — this alone recovers location
    // for a lot of indoor/cold-GPS cases that would otherwise fail outright.
    try{
      if(msg) msg.textContent = 'Getting a precise GPS fix…';
      const pos = await attemptGetPosition({enableHighAccuracy:true, timeout:18000, maximumAge:0});
      recordPresent(pos.coords.latitude, pos.coords.longitude, '');
      return;
    }catch(err1){
      if(err1 && err1.code===1){ // permission denied — no point retrying
        if(msg) msg.textContent = 'Location permission denied. Marked present without location.';
        recordPresent(0, 0, 'geo-error-1');
        return;
      }
      if(msg) msg.textContent = 'Retrying with a faster, lower-accuracy fix…';
      try{
        const pos = await attemptGetPosition({enableHighAccuracy:false, timeout:12000, maximumAge:30000});
        recordPresent(pos.coords.latitude, pos.coords.longitude, '');
        return;
      }catch(err2){
        const reason = err2 && err2.code===1 ? 'Location permission denied.' : err2 && err2.code===2 ? "GPS/location seems off — check phone Location settings." : 'Location timed out.';
        if(msg) msg.textContent = `${reason} Marked present without location.`;
        recordPresent(0, 0, 'geo-error-'+(err2&&err2.code));
      }
    }
  };
  btn.addEventListener('click', ()=>{
    const msg = document.getElementById('geoMsg');
    if(location.protocol === 'file:'){
      if(msg) msg.textContent = 'This file:// page can never get location — open the hosted https:// link instead.';
      return;
    }
    if(!window.isSecureContext){
      if(msg) msg.textContent = 'Needs https:// for location — marked without it.';
      recordPresent(0, 0, 'insecure-context'); return;
    }
    if(!navigator.geolocation){
      if(msg) msg.textContent='Location not supported on this device — marking without it.';
      recordPresent(0, 0, 'no-geo-support'); return;
    }
    // Pre-check permission state where supported, so we can tell the person
    // exactly what's going on instead of guessing from a generic error.
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(status=>{
        if(status.state==='denied'){
          if(msg) msg.textContent = 'Location blocked for this site — open your browser\'s site settings to allow it, then try again.';
          recordPresent(0, 0, 'permission-denied-cached');
          return;
        }
        if(msg) msg.textContent = status.state==='prompt' ? 'Waiting for you to allow location…' : 'Getting your location…';
        requestLocation(msg);
      }).catch(()=>{
        if(msg) msg.textContent = 'Waiting for location…';
        requestLocation(msg);
      });
    } else {
      if(msg) msg.textContent = 'Waiting for location…';
      requestLocation(msg);
    }
  });
}

/* ============================= DEVICE PERMISSIONS (ask once, up front) ============================= */
function primeDevicePermissions(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {timeout:8000, maximumAge:600000});
    }
  }catch(e){}
  primeAudioUnlock();
}
// Browsers block audio (our notification "ring") until the page has had a
// real user gesture — unlock it on the very first tap/click anywhere.
let audioUnlocked = false;
function primeAudioUnlock(){
  if(audioUnlocked) return;
  const unlock = ()=>{
    if(audioUnlocked) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      audioUnlocked = true;
    }catch(e){}
    document.removeEventListener('click', unlock);
    document.removeEventListener('touchstart', unlock);
  };
  document.addEventListener('click', unlock, {once:true});
  document.addEventListener('touchstart', unlock, {once:true});
}

/* ============================= NOTIFICATION "RING" ============================= */
let lastKnownNotifCount = 0;
let audioCtx = null;
function playNotifRing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18].forEach(off=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+off);
      gain.gain.exponentialRampToValueAtTime(0.18, now+off+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+off+0.16);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.18);
    });
  }catch(e){}
}
function checkForNewNotifRing(){
  if(!S.currentUser) return;
  const count = myNotifCount(getStockAlerts());
  if(count > lastKnownNotifCount) playNotifRing();
  lastKnownNotifCount = count;
}

/* ============================= INIT ============================= */
let loadAllPromise = null;
(async function init(){
  loadOfflineQueue();
  render();
  primeDevicePermissions();
  loadAllPromise = loadAll();
  await loadAllPromise;
  render();
  if(S.currentUser){ primeDevicePermissions(); lastKnownNotifCount = myNotifCount(getStockAlerts()); }
  flushOfflineQueue(); // in case saves were queued from a previous session
  window.addEventListener('online', ()=>{ showToast('Back online — syncing…'); flushOfflineQueue(); });
  window.addEventListener('offline', ()=>{ showToast('No connection — changes will be saved and synced automatically', true); });
  startSyncPolling(4000);
  startSessionExpiryWatch();
  setInterval(checkForNewNotifRing, 5000);
})();
</script>
