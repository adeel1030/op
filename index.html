// Non-admin staff may only record a NEW entry (purchase / filling /
// packaging / expense / retail sale) on a working day, inside the
// admin-configurable Daily Work entry window (attendanceSettings.entryStart
// / entryEnd -- see getAttendanceSettings, defaults 10:30 AM-8:00 PM,
// editable via the "⏰ Entry window" button in Daily Work, ROUND 14 item 6)
// -- outside that window, or on a Sunday/admin-marked holiday (isWorkingDay,
// defined further down near Attendance), the shop floor shouldn't be
// logging new work at all. Admins are exempt (they may need to
// backfill/correct data anytime, e.g. entering a purchase recorded on
// paper the previous night). This only gates CREATING something new --
// editing/deleting an already-recorded entry is governed separately by
// canEditDailyEntry (own entry, not yet booked).
function withinEntryWindow(){
  if(S.currentUser.role==='admin') return true;
  const now = new Date();
  if(!isWorkingDay(localDateKey(now.getTime()))) return false;
  const settings = getAttendanceSettings();
  return isWithinTimeWindow(settings.entryStart, settings.entryEnd, now);
}
// FEATURE (2026-09-03, explicit user request): "if he is present jbi vo
// entries dal skte hai, if absent or attendance mark nhi hui hai to red
// warning dega jo b relevant reason ki wja se entry nhi ho pa rhi hai" --
// non-admin staff (admin stays exempt, same as the window check just above)
// may now only record a NEW entry if TODAY's attendance is marked Present.
// Marked Absent, or never marked at all today, both block with their own
// specific reason -- this sits on top of (checked AFTER) the existing
// working-day/time-window check, so whichever reason is genuinely true
// first is the one the user sees, never a generic catch-all message.
// Only gates CREATING something new, exactly like the window check it
// extends -- editing an already-recorded entry is unaffected (each call
// site already only calls this for a brand-new entry, never an edit).
function entryAttendanceBlockReason(){
  if(S.currentUser.role==='admin') return null;
  const todayKey = localDateKey(Date.now());
  const status = attendanceStatusFor(S.currentUser.username, todayKey).status;
  if(status==='present') return null;
  if(status==='absent') return 'Aap aaj Absent mark hain, isliye entry nahi daal sakte.';
  return 'Aapne aaj attendance mark nahi ki hai — pehle Mark Attendance karein.';
}
function blockIfOutsideEntryWindow(){
  if(!withinEntryWindow()){
    const settings = getAttendanceSettings();
    showAlert(`Entries can only be recorded on working days, between ${fmtHHMMOfDay(settings.entryStart)} and ${fmtHHMMOfDay(settings.entryEnd)}.`);
    return true;
  }
  const attendanceReason = entryAttendanceBlockReason();
  if(attendanceReason){
    showAlert(attendanceReason);
    return true;
  }
  return false;
}

// Looks `enText` up in the current language's dictionary; English (or any
// string with no translation yet) passes through unchanged -- this is what
// keeps the sample safe to ship on top of the rest of the (still
// English-only) app without anything breaking.
function t(enText){
  if(!enText || S.language==='en') return enText;
  const dict = I18N[S.language];
  return (dict && dict[enText]) || enText;
}
function tabLabel(key){ return t(TAB_LABEL[key]||key); }
// Same shadowing hazard as tabLabel/stageLabel (renderBottomNav's own
// primary.map(t=>...) uses `t` as the tab-key loop variable, which would
// shadow the global t() if called directly there) -- route through this
// wrapper instead, exactly like tabLabel/stageLabel already do.
function tabShortLabel(key){ return t(TAB_SHORT[key]||TAB_LABEL[key]||key); }
// Same shadowing hazard again: generalTaskRow(t, showAssignee) (Tasks tab,
// Phase 3) uses `t` as its task-object parameter name, which would shadow
// the global t() if called directly inside that function's body -- route
// through this wrapper instead.
function taskLabel(text){ return t(text); }
// BUGFIX (2026-09-05, live user report: item sizes like "50mL" were
// staying in Latin script even in Hindi/Urdu). Catalog sizes are free-form
// strings ("100mL", "50 ml", "1L", ...) -- not a separate number+unit
// field -- so hand-translating all 51 of them isn't practical or safe
// (fragile against a typo). Instead this recognizes the UNIT suffix on a
// "<number><unit>" shape and translates just that word, leaving the
// number untouched; a size string that doesn't match the shape (or an
// unrecognized unit) is returned completely unchanged rather than guessed
// at -- so this can never mangle a size it doesn't understand.
const SIZE_UNIT_WORDS = {
  hi: { ml:'मिली लीटर', l:'लीटर', kg:'किलो', g:'ग्राम' },
  ur: { ml:'ملی لیٹر', l:'لیٹر', kg:'کلو', g:'گرام' },
};
function translateSizeUnit(sizeStr){
  if(!sizeStr || S.language==='en') return sizeStr;
  const words = SIZE_UNIT_WORDS[S.language];
  if(!words) return sizeStr;
  const m = String(sizeStr).match(/^(\d+(?:\.\d+)?)\s*(mL|ml|ML|L|l|Kg|kg|KG|G|g)$/);
  if(!m) return sizeStr;
  const unit = words[m[2].toLowerCase()];
  return unit ? `${m[1]} ${unit}` : sizeStr;
}
function stageLabel(status){ return t(ORDER_STAGE_LABEL[status]||status); }
// Applies S.language/S.fontSize to the actual document -- <html dir="rtl">
// for Urdu (the browser's own bidi/logical-CSS engine mirrors flex/grid
// direction, flex-start/end, text alignment on its own for free -- see the
// RTL CSS block in <style> for the handful of literal left/right rules
// that still needed an explicit mirror) and one html.fs-* class for the
// font-size scale. Called once at boot and every time either preference
// changes -- deliberately NOT part of render() itself, since <html> is a
// DOM ANCESTOR of #root, not something render()'s root.innerHTML rebuild
// ever touches (same reasoning as showModal's overlay being a sibling of
// #root -- see that function's own comment).
function applyDocumentPrefAttrs(){
  const root = document.documentElement;
  root.lang = S.language;
  root.dir = S.language==='ur' ? 'rtl' : 'ltr';
  root.classList.remove('fs-normal','fs-xl','fs-xxl');
  root.classList.add('fs-'+(FONT_SIZE_OPTIONS.some(o=>o.code===S.fontSize)?S.fontSize:'normal'));
}
// FEATURE (2026-09-03, explicit user request: "users ke hisab se unki
// language settings & font size ko bhi save rkhna hai"): called right
// after every S.currentUser = u (finalizeLogin, restoreSession, and the
// onAuthStateChanged auto-restore branch -- the 3 places a login actually
// sets S.currentUser) to load THIS PERSON's own saved preference,
// wherever they happen to log in from. u.language/u.fontSize live in
// their Firestore users/{uid} doc (see fsSaveUserPreferences) -- Firestore

// Falls back to whatever's already in S.language/S.fontSize (this

function applyUserPreferences(u){
  const lang = (u && LANG_OPTIONS.some(o=>o.code===u.language)) ? u.language : S.language;

// summary: first check-in, last check-out, and total time worked that day.
// Handles multiple check-in/out cycles in one day by summing each pair.
function computeDailySummaries(records){
  const byDateUser = {};
  records.forEach(r=>{
    const dateKey = localDateKey(r.timestamp);
    byDateUser[dateKey] = byDateUser[dateKey] || {};
    byDateUser[dateKey][r.username] = byDateUser[dateKey][r.username] || { name:r.name, events:[] };
    byDateUser[dateKey][r.username].events.push(r);
  });
  const summaries = [];
  Object.keys(byDateUser).forEach(dateKey=>{
    Object.keys(byDateUser[dateKey]).forEach(username=>{
      const entry = byDateUser[dateKey][username];
      const events = entry.events.slice().sort((a,b)=>a.timestamp-b.timestamp);
      let firstIn=null, lastOut=null, totalMs=0, openIn=null;
      events.forEach(e=>{
        if(e.type==='checkin'){ if(!firstIn) firstIn=e.timestamp; openIn=e.timestamp; }
        else if(e.type==='checkout'){ lastOut=e.timestamp; if(openIn){ totalMs += e.timestamp-openIn; openIn=null; } }

        dateKey, dateTs: events[0].timestamp, username, name: entry.name,
        checkin: firstIn, checkout: openIn?null:lastOut,
        minutes: Math.round(totalMs/60000), ongoing: !!openIn
      });
    });
  });
  return summaries.sort((a,b)=> b.dateKey.localeCompare(a.dateKey) || a.name.localeCompare(b.name));
}

// (mobile data especially), a request that never gets a response just hangs
// forever with no error and no retry, which is exactly what "stuck on the
// loading spinner forever, works on laptop/WiFi but not on mobile" looks
// like. This wraps every backend call with an AbortController so a stalled
// request is treated as a normal failure after a bounded wait — existing
// retry (loadAll's 3 attempts) and offline-queue logic already handle that
// correctly, they just never used to get the chance to.
const DEFAULT_FETCH_TIMEOUT_MS = 25000;
function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || DEFAULT_FETCH_TIMEOUT_MS);
  return fetch(url, Object.assign({}, options||{}, { signal: controller.signal }))
    .finally(()=>clearTimeout(timer));
}

let flushingQueue = false;
async function flushOfflineQueue(){
  if(flushingQueue) return;
  const keys = Object.keys(offlineQueue);
  if(keys.length===0) return;
  if(!navigator.onLine){
    showToast('No connection — saved on this device, will sync automatically', true);
    return;
  }
  flushingQueue = true;
  setSyncing(true);
  // Snapshot queuedAt per key — if a NEWER safeSet() overwrites the same key
  // while this batch is in flight, we must NOT delete that newer entry once
  // the (older) batch succeeds, or its data would be silently lost without
  // ever having been sent.
  const snapshot = keys.map(k=>({key:k, entry:offlineQueue[k]}));
  const items = snapshot.map(({key,entry})=>({key, value:entry.value}));
  setSyncLabel(items.length===1 ? `Saving ${friendlySyncLabel(items[0].key)}…` : `Saving ${items.length} changes…`);
  const settle = ()=>{
    snapshot.forEach(({key, entry})=>{
      if(offlineQueue[key] === entry) removeFromOfflineQueue(key);
      (batchResolvers[key]||[]).forEach(r=>r());
      delete batchResolvers[key];
    });
  };
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ secret:SECRET, action:'batchSave', items, actingUsername: S.currentUser && S.currentUser.username, sessionToken: S.authToken })
    });
    const json = await res.json();
    if(json.error) throw new Error(json.error);
    if(json.updatedAt) lastServerUpdatedAt = json.updatedAt;
    settle();
  }catch(e){
    console.error('batch sync failed — still queued, will retry', e);
    // SECURITY FIX (2026-08-21 audit, findings #3/#4): session_required/
    // forbidden are NOT connectivity failures -- retrying the same request
    // forever would never succeed, since the server is correctly refusing
    // an invalid/expired/insufficient session, not a dropped connection.
    // handleAuthError prompts a quick one-time re-login (session_required)
    // or shows a clear permission message (forbidden) instead of the
    // generic "no connection" toast, and re-flushes automatically once a
    // fresh session is obtained -- nothing queued here is lost either way.
    // BUGFIX (2026-08-26, "site auto update nahi ho rahi, refresh karna
    // padta hai"): handleAuthError/showToast themselves call render(), and
    // if THAT throws for any reason, the exception used to escape this
    // whole function before ever reaching the cleanup below -- leaving
    // flushingQueue/syncing stuck true FOREVER (nothing else ever resets
    // them). doSyncTick's very first check is "if(syncing) return", so a
    // single wedged flush like this permanently silenced ALL future sync
    // polling for the rest of that browser session -- exactly the "must
    // refresh to see any change" symptom, since a page reload is the only
    // thing that resets this in-memory flag. Guarded so a failure here can
    // never again block the cleanup below.
    try{
      if(!handleAuthError(e.message)){
        showToast('No connection — saved on this device, will sync automatically', true);
      }
    }catch(e2){ console.error('flushOfflineQueue: error while reporting the failure (ignored, so cleanup below still runs)', e2); }
    // Resolve pending `await safeSet(...)` callers so they don't hang
    // forever, but (per settle()'s own check) never delete anything here —
    // items simply stay queued for the next retry.
    settle();
  } finally {
    // Moved into `finally` as part of the same fix above: these three MUST
    // run no matter what happened above, or syncBusyCount never comes back
    // down and doSyncTick stays blocked until the page is manually reloaded.
    setSyncLabel(null);
    setSyncing(false);
    flushingQueue = false;
  }
}

function setSyncing(on){

  if(!syncing) syncBusySince = null;

  if(el) el.classList.toggle('syncing', syncing);
}

// Day-wise partitioned storage: orders/activityLog/attendance/expenses/
// dominoPrints/loginLog grow without bound, so each is stored on the
// backend as one row PER CALENDAR DAY ("orders_2026-08-10") instead of one
// giant cell. This keeps every row comfortably under Sheets' ~50,000
// character per-cell limit no matter how much history accumulates.
const PARTITIONED_TS_FIELD = { orders:'createdAt', activityLog:'at', attendance:'timestamp', expenses:'at', dominoPrints:'at', loginLog:'at', chatMessages:'at', retailSales:'at', trackingViewLogs:'at', siteVisitLogs:'at', stockMovementLog:'at' };
const PARTITIONED_ENTITIES = Object.keys(PARTITIONED_TS_FIELD);
// Merges whatever day-partition arrays are present in `rawData` for this
// entity into `existing` (the entity's current in-memory array) — replaces
// ONLY the days actually present in `rawData`, leaving every other day's
// already-loaded data untouched. On a FULL sync, `rawData` contains every
// day that exists server-side, so this produces exactly the same result a
// plain rebuild-from-scratch always did. On a DELTA sync (rawData only has
// the days that changed since last sync), this is what makes it safe — a
// delta that only touches today's orders can never cause yesterday's
// (unchanged) orders to silently vanish from the view. Returns `existing`
// itself (same reference, unchanged) when this entity has nothing at all
// in this payload, so callers can cheaply skip re-filtering/re-sorting an
// array that didn't change.
function mergePartitionedEntity(rawData, entity, existing){
  const touchedDays = new Set();
  Object.keys(rawData).forEach(k=>{
    if(k.indexOf(entity+'_')===0) touchedDays.add(k.substring(entity.length+1));
  });
  // 2026-08-22 fix ("messages sometimes disappear"): a day this device still
  // has an UNFLUSHED local save queued for (offlineQueue[entity_day]) must
  // NEVER be replaced by whatever this sync response says about that same
  // day — that response was necessarily fetched before (or racing with) our
  // own pending write reached the server, so it can't yet reflect it. Without
  // this guard, a message/order/etc. just added locally (visible instantly,
  // per the local-first design) could be wiped from view moments later by an
  // incoming poll that still shows the old server state, even though the
  // item is safely queued and WILL actually save — it would just vanish from
  // the screen in the meantime, which is exactly what felt like a message
  // "failing to send and disappearing". Once the queued save actually
  // flushes, offlineQueue[key] clears and the next sync applies normally.
  touchedDays.forEach(day=>{
    if(offlineQueue[entity+'_'+day]) touchedDays.delete(day);
  });
  if(!touchedDays.size) return existing || [];
  const tsField = PARTITIONED_TS_FIELD[entity];
  const kept = (existing||[]).filter(item=>!touchedDays.has(localDateKey(item[tsField])));
  const fresh = [];
  touchedDays.forEach(day=>{
    const arr = rawData[entity+'_'+day];
    if(Array.isArray(arr)) fresh.push(...arr);
  });
  return kept.concat(fresh);
}
// Merge + map(optional) + filter(optional) + sort in one call, and skips
// all of that work entirely when this entity had nothing in this payload
// (mergePartitionedEntity returns the SAME array reference in that case).
function mergeAndFilterPartition(entity, rawData, existing, filterFn, sortFn, mapFn){
  const merged = mergePartitionedEntity(rawData, entity, existing);
  if(merged === existing) return existing; // nothing for this entity in this payload — already correctly processed from last time
  let result = mapFn ? merged.map(mapFn) : merged;
  if(filterFn) result = result.filter(filterFn);
  return result.sort(sortFn);
}
// Which day-partition keys currently exist on the backend for each entity —
// tracked so "Reset all data" knows exactly what to delete (including days
// that might otherwise be left orphaned once S[entity] is cleared locally).
// Full-replace: only correct to call after a FULL sync, since it treats
// "day not present in rawData" as "day doesn't exist" — exactly right when
// rawData is everything, wrong when it's only a delta (see
// trackPartitionKeysDelta for that case).
function trackPartitionKeys(rawData){
  PARTITIONED_ENTITIES.forEach(entity=>{
    const days = new Set();
    Object.keys(rawData).forEach(k=>{
      if(k.indexOf(entity+'_')===0) days.add(k.substring(entity.length+1));
    });
    S._partitionKeysSeen[entity] = days;
  });

// Additive version for a DELTA sync — a day NOT present in this delta might
// just be unchanged (not deleted), so unlike trackPartitionKeys this must
// never DROP an already-known day, only ever add newly-seen ones. A day
// that server-side cleanup actually deleted will naturally drop off the
// next FULL resync (see FULL_RESYNC_INTERVAL_MS in startSyncPolling) —
// harmless in the meantime since the app's own display filters already
// hide anything past its normal retention age regardless of what
// _partitionKeysSeen still remembers.
function trackPartitionKeysDelta(rawData){
  PARTITIONED_ENTITIES.forEach(entity=>{
    Object.keys(rawData).forEach(k=>{
      if(k.indexOf(entity+'_')===0){
        (S._partitionKeysSeen[entity] = S._partitionKeysSeen[entity] || new Set()).add(k.substring(entity.length+1));
      }
    });
  });
}
// Task #54: the day-partition concept itself (savePartitionDay resaving a
// WHOLE day's array) doesn't carry over to Firestore -- there was never a
// real domain reason for it, just a workaround for Sheets' per-cell size
// cap (see firebase_data_model.md's opening paragraph). savePartitionDay
// itself is gone; savePartitionForItem/savePartitionAllDays keep their
// NAMES and CALL SIGNATURES (dozens of call sites elsewhere in this file
// create/edit an item by calling these, completely unchanged) but now do a
// single targeted per-document write instead.

// call savePartitionForItem(entity, item) on an item that was just DELETED

//     add/edit/delete, a timeout, or the backend's LockService genuinely
//     waiting up to 6s under contention and the request aborting first) the
//     delta was simply dropped -- caught by an empty .catch() -- and the
//     very next sync (every ~4s) would overwrite the optimistic local total
//     with the server's still-stale value, forever, since nothing ever
//     retried it.
//  2. Even with a healthy network, firing two balance-affecting actions in
//     quick succession (e.g. add expense, then immediately add another) let
//     their two HTTP responses race: whichever response happened to arrive
//     LAST simply overwrote S.expenseBalances[username] with ITS balance
//     snapshot, silently discarding the other request's already-applied
//     server-side delta from the client's view if it had resolved first.
// Fix: every delta is now tracked in a durable, per-username PENDING queue
// (persisted like the real offline queue) until the server actually
// confirms it. The synced/displayed balance is always computed as
// (server's last-known confirmed total) + (sum of this device's still-
// unconfirmed pending deltas for that user) -- see the expenseBalances
// merge in applyServerData -- so an incoming sync can never wipe a pending
// local change out from under it, a failed request is retried automatically
// (flushExpenseDeltaQueue runs on every sync tick and on 'online', exactly
// like flushOfflineQueue), and out-of-order responses can no longer clobber
// each other since each pending amount is only ever subtracted once ITS
// OWN request actually succeeds, never blindly replaced by a response
// meant for a different request.
const PENDING_EXPENSE_DELTAS_KEY = 'orderops_pending_expense_deltas';
let pendingExpenseDeltas = {}; // { username: sum of unconfirmed deltas }
let expenseDeltaInFlight = {}; // { username: true } -- prevents duplicate concurrent sends
function loadPendingExpenseDeltas(){
  try{
    const raw = localStorage.getItem(PENDING_EXPENSE_DELTAS_KEY);
    pendingExpenseDeltas = raw ? JSON.parse(raw) : {};
  }catch(e){ pendingExpenseDeltas = {}; }
}
function persistPendingExpenseDeltas(){
  try{ localStorage.setItem(PENDING_EXPENSE_DELTAS_KEY, JSON.stringify(pendingExpenseDeltas)); }catch(e){}
}
function queueExpenseDelta(username, delta){
  if(!username || !delta) return;
  pendingExpenseDeltas[username] = (pendingExpenseDeltas[username]||0) + delta;
  if(Math.abs(pendingExpenseDeltas[username]) < 1e-9) delete pendingExpenseDeltas[username]; // fully cancelled out (e.g. add then immediately delete)
  persistPendingExpenseDeltas();
}
async function flushExpenseDeltaQueue(){
  const usernames = Object.keys(pendingExpenseDeltas);
  for(const username of usernames){
    if(expenseDeltaInFlight[username]) continue;
    const amt = pendingExpenseDeltas[username];
    if(!amt) continue;
    expenseDeltaInFlight[username] = true;
    try{
      const res = await fsApplyExpenseBalanceDelta(username, amt); // FIXED (Task #54) -- was apiApplyExpenseBalanceDelta, the old Apps Script backend call; same {ok,balance} response shape, now an atomic Firestore transaction instead
      if(res && res.ok){
        // Only ever subtract exactly the amount THIS request was sent for --
        // never overwrite with res.balance directly, so a delta queued by
        // the user while this request was in flight (and already reflected
        // optimistically in pendingExpenseDeltas) is never lost.
        pendingExpenseDeltas[username] = (pendingExpenseDeltas[username]||0) - amt;
        if(Math.abs(pendingExpenseDeltas[username]) < 1e-9) delete pendingExpenseDeltas[username];
        persistPendingExpenseDeltas();
      }
      // a non-ok response (auth error etc) leaves the pending amount queued for the next retry
    }catch(e){ /* network hiccup -- stays queued, retried on the next sync tick / 'online' event */ }
    finally{ delete expenseDeltaInFlight[username]; }

}

// Progressively shrinks BOTH pixel dimensions and JPEG quality until the
// actual encoded byte size is under maxBytes -- unlike resizeImageFile
// (which only caps pixel dimensions and can still produce a file well over
// a few MB for a dense/high-detail photo), this is what actually
// guarantees "photo size zyada bada ho to 2MB me convert kar de" (explicit
// user request, Round 12) regardless of how big the original photo was.
async function resizeImageFileMaxBytes(file, maxDim, maxBytes){
  const qualitySteps = [0.82, 0.7, 0.6, 0.5, 0.4, 0.3];
  let dim = maxDim;
  for(let pass=0; pass<4; pass++){
    for(const q of qualitySteps){
      const dataUrl = await resizeImageFile(file, dim, q);
      if(dataUrlByteLength(dataUrl) <= maxBytes) return dataUrl;
    }
    dim = Math.round(dim * 0.75); // still over the cap even at the lowest quality tried -- shrink the dimensions too and walk the quality ladder again
  }
  // Absolute last resort: return whatever the smallest attempt produced
  // rather than throwing -- a photo that's still a little over the cap is
  // far better than "Upload Failed" again, which is the whole bug this
  // round exists to fix.
  return await resizeImageFile(file, dim, 0.3);
}
// Base64 -> raw byte count: every 4 base64 characters encode 3 real bytes,
// minus 1-2 for '=' padding at the end. Used to check an in-memory dataURL
// against the 2MB cap without ever needing to actually upload it first.
function dataUrlByteLength(dataUrl){
  const base64 = (dataUrl.split(',')[1] || '');
  const padding = base64.endsWith('==') ? 2 : (base64.endsWith('=') ? 1 : 0);
  return Math.floor(base64.length * 3/4) - padding;
}

// RACE FIX (2026-08-29, full security audit -- stock ledger clobber):
// walks `newVal` (a flat {itemKey:qty} map, or one level deeper for
// lowStock/watchStock: {raw:{},filled:{},ready:{}}) against `oldVal` (the
// matching branch of S._lastSyncedStock, i.e. this device's own
// last-known-good server snapshot) and returns a flat object of Firestore
// DOT-PATH field names -> new leaf values for every leaf that's actually
// different, plus firebase.firestore.FieldValue.delete() for any leaf
// present in oldVal but missing from newVal. Recurses into plain objects;
// treats anything else (number, string, ...) as a leaf.
function diffStockLeaves(pathPrefix, oldVal, newVal){
  const out = {};
  const oldObj = (oldVal && typeof oldVal==='object') ? oldVal : {};
  const newObj = (newVal && typeof newVal==='object') ? newVal : {};
  const isPlainMap = v => v && typeof v==='object' && !Array.isArray(v);
  const keys = new Set([...Object.keys(oldObj), ...Object.keys(newObj)]);
  keys.forEach(k=>{
    const path = pathPrefix + '.' + k;
    const ov = oldObj[k], nv = newObj[k];
    if(isPlainMap(nv) || isPlainMap(ov)){
      Object.assign(out, diffStockLeaves(path, ov, nv));
    } else if(!(k in newObj)){
      out[path] = firebase.firestore.FieldValue.delete();
    } else if(ov !== nv){
      out[path] = nv;
    }
  });
  return out;
}
// stock/current — 5 STATIC_KEYS live as top-level fields on one document.
//
// BUGFIX (2026-08-29, full security audit, "stock ledger clobber"): this
// used to `.set({[field]: value}, {merge:true})` with `value` being the
// ENTIRE local pool map (e.g. all of S.filledStock) every single time --
// and Firestore's per-field merge only replaces the NAMED top-level field
// WHOLESALE, it does not merge inside it. So if this device's local
// S.filledStock was even slightly stale (e.g. it hadn't yet received
// another device's concurrent change to a DIFFERENT item in the same
// pool -- routine on a multi-tablet warehouse floor), this write would
// silently overwrite that other device's change with this device's stale
// copy of it, the instant both saves landed close together. No error, no
// conflict warning -- just a wrong number sitting in the ledger. Fixed by
// diffing against S._lastSyncedStock (this device's own last-observed
// server state for this field -- see its declaration and the
// fsBindDoc('stock','current',...) listener that refreshes it) and writing
// ONLY the leaf item keys THIS device actually changed, via Firestore
// dot-path field names. A dot-path write only ever touches the exact leaf
// it names -- any sibling key changed concurrently by someone else,
// however recently, is left completely untouched, closing the race
// entirely rather than narrowing its window.
function fsSetStockField(field, value){
  const baseline = (S._lastSyncedStock && S._lastSyncedStock[field]) || {};
  const updates = diffStockLeaves(field, baseline, value);
  // Also stamps updatedByUsername on every stock write -- functions/index.js's
  // onStockPush reads this (per its own FIELD CONTRACT comment) to exclude
  // whoever made the change from their own low-stock push notification; it
  // was never actually being written from here before (2026-08-28 push-
  // notification pipeline audit).
  updates.updatedByUsername = S.currentUser ? S.currentUser.username : null;
  // Nothing actually changed relative to the last-synced baseline (e.g. a
  // save fired after a mutation that turned out to be a no-op) -- skip the
  // network round-trip entirely rather than send a pointless write.
  if(Object.keys(updates).length<=1) return Promise.resolve();
  return fsDb.collection('stock').doc('current').update(updates)
    .catch(err=>{ fsReportWriteError(err, `stock.${field}`); throw err; });
}
// HARDENING (2026-08-28, live-production incident audit): autoAdvanceFillingPackaging/
// autoAdvanceOrders/ackTask are the one place a filling/packaging-role
// session writes to `orders` (firestore.rules scopes exactly this: they
// may touch ONLY status/fillingStatus/packagingStatus -- see that rule's
// own comment). They used to go through the general savePartitionForItem/
// fsSetItem path, which does a full NON-MERGE `.set()` of the entire local
// order object -- built from S.orders, which is only as fresh as this
// device's last-received listener update. If another device's write to a
// DIFFERENT field on the same order (e.g. a manager editing customer/item
// details) landed on the server in the moment before this device's own
// listener caught up, that full-object write would silently overwrite it
// back to this device's stale value -- purely as collateral damage of a
// write that only ever intended to touch these 3 fields. Using a scoped
// merge write instead removes that risk entirely for this path, regardless
// of how stale the rest of this device's local copy of the order is.
function fsSaveOrderStatusFields(o){
  if(!o || !o.id) return Promise.resolve();
  return fsDb.collection('orders').doc(String(o.id)).set(
    { status: o.status, fillingStatus: o.fillingStatus, packagingStatus: o.packagingStatus },
    { merge: true }
  ).catch(err=>{ fsReportWriteError(err, 'orders (status)'); throw err; });
}
// FEATURE (2026-09-03, explicit user request: per-user language & font-size
// settings). A scoped merge write, same pattern/reasoning as
// fsSaveOrderStatusFields just above -- touches ONLY the fields passed in
// `fields` (e.g. {language:'hi'} or {fontSize:'xl'}), never the rest of
// the user's own profile doc (role/permissions/name/etc, all still
// admin-only -- see firestore.rules' users/{uid} rule: a signed-in user
// may update ONLY the language/fontSize keys on their OWN doc, nothing
// else about their account). Deliberately does its own uid-presence guard
// rather than reading S.currentUser itself, so setAppLanguage/setFontSize
// can call this identically whether or not someone's actually logged in
// yet (the login screen itself has nowhere per-user to persist to).
function fsSaveUserPreferences(uid, fields){
  if(!uid) return Promise.resolve();
  return fsDb.collection('users').doc(String(uid)).set(fields, { merge: true })
    .catch(err=>{ fsReportWriteError(err, 'users (preferences)'); throw err; });
}
// expenseBalances — a genuine atomic delta, same guarantee
// applyKeyedNumberDelta_'s LockService gave server-side, but now scoped to
// just this one document instead of one global lock for every write
// app-wide (see firestore_client_design.md section 3).
async function fsApplyExpenseBalanceDelta(username, delta){
  const ref = fsDb.collection('expenseBalances').doc(username);
  try{
    const newBalance = await fsDb.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      const current = (snap.exists && typeof snap.data().balance==='number') ? snap.data().balance : 0;
      const next = current + delta;
      tx.set(ref, { balance: next }, { merge:true });
      return next;
    });
    return { ok:true, balance:newBalance };
  }catch(e){
    return { ok:false, error: (e && e.message) || 'transaction_failed' };
  }
}
// BUGFIX (2026-08-29, full security audit -- "do admin ek hi expense entry
// edit karein to balance galat ho sakta hai"): editing an existing expense/
// settlement entry used to compute its balance delta against THIS DEVICE'S
// OWN local copy of the entry as "before" (applyExpenseBalanceDelta(before,
// -1) then (touched,+1)), then separately overwrite the whole expenses/{id}
// doc via savePartitionForItem's non-merge .set(). If two admins opened and
// edited the SAME entry within moments of each other, each admin's "before"
// snapshot was the ORIGINAL (pre-either-edit) entry -- so the balance ended
// up reflecting BOTH edits' deltas (double-subtracting the original amount,
// adding both new amounts), while the expenses/{id} DOCUMENT itself only
// ever ends up holding whichever admin's .set() call physically landed
// last. The document and the running balance total could silently drift
// out of sync with each other, with no error shown to either admin.
//
// Fixed: the edit, the "before" snapshot, and the balance delta(s) all now
// happen inside ONE Firestore transaction that reads the expense doc's
// CURRENT SERVER state fresh (never a possibly-stale local copy) as the
// authoritative "before" -- so two concurrent edits now correctly
// serialize (Firestore retries a transaction that loses a write race), and
// whichever edit's transaction commits second sees the FIRST edit's result
// as its own "before", producing a balance that always matches whatever
// the document actually ends up saying. Handles the entry being
// reassigned to a different person (byUsername changes) by adjusting both
// the old and new person's balance docs in the same transaction.
async function fsEditExpenseAtomic(id, newFields){
  const expRef = fsDb.collection('expenses').doc(String(id));
  const contributionOf = (entry)=> entry ? (entry.type==='settlement' ? -entry.amount : entry.amount) : 0;
  try{
    const result = await fsDb.runTransaction(async (tx)=>{
      const expSnap = await tx.get(expRef);
      const serverBefore = expSnap.exists ? expSnap.data() : null;
      const beforeUsername = serverBefore ? serverBefore.byUsername : newFields.byUsername;
      const beforeContribution = contributionOf(serverBefore);
      const afterContribution = contributionOf(newFields);
      const sameUsername = beforeUsername === newFields.byUsername;

      // All reads before any writes -- required for a Firestore transaction.
      const oldBalRef = fsDb.collection('expenseBalances').doc(beforeUsername);
      const oldBalSnap = await tx.get(oldBalRef);
      const oldBalCurrent = (oldBalSnap.exists && typeof oldBalSnap.data().balance==='number') ? oldBalSnap.data().balance : 0;
      let newBalRef = oldBalRef, newBalCurrent = oldBalCurrent;
      if(!sameUsername){
        newBalRef = fsDb.collection('expenseBalances').doc(newFields.byUsername);
        const newBalSnap = await tx.get(newBalRef);
        newBalCurrent = (newBalSnap.exists && typeof newBalSnap.data().balance==='number') ? newBalSnap.data().balance : 0;
      }

      tx.set(expRef, newFields, { merge:true });
      let finalBalance;
      if(sameUsername){
        finalBalance = oldBalCurrent + (afterContribution - beforeContribution);
        tx.set(oldBalRef, { balance: finalBalance }, { merge:true });
      } else {
        tx.set(oldBalRef, { balance: oldBalCurrent - beforeContribution }, { merge:true });
        finalBalance = newBalCurrent + afterContribution;
        tx.set(newBalRef, { balance: finalBalance }, { merge:true });
      }
      return { username: newFields.byUsername, balance: finalBalance };
    });
    return { ok:true, username: result.username, balance: result.balance };
  }catch(e){
    fsReportWriteError(e, 'expenses (atomic edit)');
    return { ok:false, error: (e && e.message) || 'transaction_failed' };
  }
}

// ---- Auth ----------------------------------------------------------
// uid === username for every account (see scripts/export_to_firestore.js)
// so Security Rules' request.auth.uid lookups and the {username} custom
// claim both just work without a separate mapping table.
async function fsLogin(username, password){
  const email = fsSyntheticEmailFor(username);
  let cred;
  try{
    cred = await fsAuth.signInWithEmailAndPassword(email, password);
  }catch(err){
    const code = err && err.code;
    if(code==='auth/wrong-password' || code==='auth/user-not-found' || code==='auth/invalid-credential' || code==='auth/invalid-email'){
      return { ok:false, error:'invalid_credentials' };
    }
    if(code==='auth/too-many-requests'){
      // Firebase Auth's OWN built-in brute-force throttling (see
      // firestore_client_design.md section 1) — it doesn't hand back an
      // exact unlock time the way the old server-side loginLockouts did,
      // so the caller shows a generic message instead of a countdown.
      return { ok:false, error:'too_many_attempts' };
    }
    throw err; // genuine network/unknown error — caller's existing offline fallback (findMatchingUser) handles this
  }
  const uid = cred.user.uid;
  const userSnap = await fsDb.collection('users').doc(uid).get();
  if(!userSnap.exists){
    // BUGFIX (2026-09-09, live report -- "new passwords se bhi Login nhi ho
    // raha hai. wrong id passwords bta rha hai", confirmed via a direct
    // Firebase Auth REST API test that the SAME username+password genuinely
    // authenticates successfully): this branch used to return the exact
    // same 'invalid_credentials' as a real wrong password -- so "Firebase
    // Auth accepted the password, but there's no matching Firestore
    // profile" was COMPLETELY INDISTINGUISHABLE on screen from "you typed
    // the wrong password," even though they're two totally different
    // problems needing two totally different fixes (one needs the person
    // to retype their password; the other needs an admin to repair their
    // account -- see createStaffUser's own repair-path comment,
    // functions/index.js). Given this session's account churn (mass
    // password reset + several accounts recreated fresh via
    // reset_all_passwords.js's create-if-Auth-missing fallback), an Auth
    // account existing with no matching Firestore doc is a real, live
    // possibility right now, not just theoretical. Returns a distinct
    // 'no_profile' error code instead so the caller can show an honest,
    // actionable message instead of the misleading "wrong ID/password" —
    // see bindLogin's handling of it.
    await fsAuth.signOut();
    return { ok:false, error:'no_profile' };
  }
  const user = Object.assign({ id: uid }, userSnap.data());
  return { ok:true, user, sessionToken:null }; // no separate session token — Firebase Auth's own ID token replaces it entirely
}
async function fsLogout(){
  try{ await fsAuth.signOut(); }catch(e){ /* local state is cleared by the caller regardless — see doLogout */ }
}
// RESTORED (2026-09-08) -- used by the self-service Change Password modal

async function fsChangePassword(newPassword){

// ---- Real-time listeners (replaces doSyncTick/startSyncPolling/
// apiFetchDelta/apiFetchAll/mergePartitionedEntity wholesale — see
// firestore_client_design.md section 2 for the full per-collection table
// and reasoning) ----
let fsUnsubscribers = [];
function fsDetachAllListeners(){
  fsUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
  fsUnsubscribers = [];
}
// BUGFIX (2026-08-28 live-production incident, "message bheja ek jaga se
// dusre ko, nahi aya"): the retired doSyncTick (see the comment on that
// function below) always checked `if(messagesModalOpen) refreshMessagesModal();
// else render();` before updating the screen -- because showModal() appends
// the Messages modal OUTSIDE #root (see showModal/closeModal), a plain
// render() only ever rebuilds #root and never touches an already-open
// modal's HTML. When this file was rewritten to use real-time Firestore
// listeners instead of doSyncTick, every listener's default onChange was
// simplified back down to plain render() -- silently dropping that
// modal-aware refresh. Net effect: if the RECEIVING device already has the
// Messages modal open at the moment a new chat message/announcement
// arrives, nothing on screen changes until they close and reopen it -- easy
// to read as "the message never arrived" even though it saved to Firestore
// correctly the whole time. This helper restores the exact old behavior;
// used as the chatMessages listener's onChange below.
function renderOrRefreshMessagesModal(){
  const messagesModalOpen = !!document.getElementById('messagesModalBody');
  if(messagesModalOpen) refreshMessagesModal(); else render();
}
function fsBindCollection(entity, query, sortFn, mapFn, onChange){
  const unsub = query.onSnapshot(snap=>{
    // BUGFIX (2026-09-08, live report -- "kisi user ka data edit krte hi
    // saare users achanak se Duplicate ho gye", "kuch User jo abhi banaye
    // the Delete nhi ho rhe"): every write path in this app follows the
    // SAME convention -- an item's own `id` field (set once, client-side,
    // via uid()) is both stored INSIDE the document body and used as the
    // Firestore document's own id (see fsDocIdFor/fsSetItem) -- so this
    // listener has always trusted d.data() alone to already carry a
    // correct `id`, never reading the real d.id off the snapshot at all.
    // createStaffUser (functions/index.js, added 2026-08-28) broke that
    // invariant for the 'users' collection specifically: its Firestore
    // write is `{name, username, role, post, phone, address, photo}` --
    // no `id` field at all. Every user created through it since then
    // loaded back into S.users with id===undefined, which broke 3 things
    // at once: (1) Edit/Delete buttons (data-edit-user/data-del-user, both
    // keyed off u.id) silently targeted the wrong record or nothing; (2)
    // far worse, ANY user edit's finishSaveUser() resaves the WHOLE
    // S.users array via safeSet -> fsSetItem for every item -- every
    // undefined-id user collapsed onto the SAME phantom doc
    // (users/undefined), each overwriting the last, which is exactly the
    // "users duplicating" symptom (a real, extra Firestore doc showing up
    // alongside the real one). Fixed at the root here instead of only in
    // createStaffUser: `id: d.id` is now always the ground truth for
    // EVERY entity's id, regardless of whether the document body also
    // happens to carry (a correct, or in this one case a missing/wrong)
    // `id` field -- self-healing for this collection's already-corrupted
    // records too (a phantom users/undefined doc now correctly shows
    // id:"undefined" and becomes deletable via the normal Delete button,
    // instead of the id never resolving to anything at all). Placed
    // LAST in the assign so the (should-always-agree, but now guaranteed)
    // real doc id wins even if the stored data disagrees or is missing it.
    let items = snap.docs.map(d=>Object.assign({}, d.data(), {id: d.id}));
    if(mapFn) items = items.map(mapFn);
    if(sortFn) items = items.slice().sort(sortFn);
    S[entity] = items;
    if(onChange) onChange(); else render();
  }, err=>console.error(`Firestore listener failed for collection "${entity}"`, err));
  fsUnsubscribers.push(unsub);
}
function fsBindDoc(collection, docId, onData){
  const unsub = fsDb.collection(collection).doc(docId).onSnapshot(snap=>{
    onData(snap.exists ? snap.data() : {});
    render();
  }, err=>console.error(`Firestore listener failed for doc "${collection}/${docId}"`, err));
  fsUnsubscribers.push(unsub);
}
// rolePermissions/holidays/dailyRecordMarks/batchReferences/
// expenseBalances/activeSessions — collections fanned out one-doc-per-key,
// reassembled here into the plain {subKey: value} object shape the rest
// of the app (S.rolePermissions[role], S.holidays[dateKey], ...) already
// expects, unchanged from today.
function fsBindStaticCollection(collection, onObject){
  const unsub = fsDb.collection(collection).onSnapshot(snap=>{
    const obj = {};
    snap.docs.forEach(d=>{ obj[d.id] = d.data(); });
    onObject(obj);
    render();
  }, err=>console.error(`Firestore listener failed for static collection "${collection}"`, err));
  fsUnsubscribers.push(unsub);
}
function attachFirestoreListeners(){
  fsDetachAllListeners();
  const db = fsDb;
  const DAY_MS = 24*60*60*1000;
  const now = Date.now();

  // Partitioned-in-the-old-model entities — each is its own flat
  // collection now (see firebase_data_model.md), one listener per entity
  // with the SAME retention window and sort order applyServerData's
  // mergeAndFilterPartition calls used, so this is a straight parity port,
  // not a behavior change. (See the FIELD CONTRACT comment at the top of
  // functions/index.js for why `createdAt`/`at`/`timestamp` are the exact
  // field names to filter/sort on — the deployed Cloud Functions depend on
  // these same fields already.)
  fsBindCollection('orders', db.collection('orders').where('createdAt','>=', now-60*DAY_MS).orderBy('createdAt'), (a,b)=>a.createdAt-b.createdAt);
  fsBindCollection('attendance', db.collection('attendance').where('timestamp','>=', now-60*DAY_MS).orderBy('timestamp'), (a,b)=>a.timestamp-b.timestamp);
  // ROUND 13 (2026-08-31, explicit user request: "30 Days ke Expenses rkho,
  // usse phle ke ... old entries 90 din tk save rhe"): was 365 days --
  // narrowed to 90, matching functions/index.js's cleanupOldExpenses
  // scheduled Cloud Function, which now actually deletes expenses/{id}
  // docs older than 90 days server-side (see that function's own comment
  // for why this is safe: S.expenseBalances is a durable running total,
  // never re-derived from this query's results). renderExpenses further
  // narrows the DISPLAYED list to just the last 30 days on top of this --
  // the extra 30-90 day slack fetched here exists only so the client isn't
  // racing the daily cleanup by a few hours right at the boundary.
  fsBindCollection('expenses', db.collection('expenses').where('at','>=', now-90*DAY_MS).orderBy('at'), (a,b)=>a.at-b.at);
  fsBindCollection('activityLog', db.collection('activityLog').where('at','>=', now-7*DAY_MS).orderBy('at'), (a,b)=>a.at-b.at);
  fsBindCollection('dominoPrints', db.collection('dominoPrints').orderBy('at'), (a,b)=>a.at-b.at); // never age-filtered — explicit exemption, see firebase_data_model.md
  fsBindCollection('loginLog', db.collection('loginLog').where('at','>=', now-7*DAY_MS).orderBy('at'), (a,b)=>a.at-b.at);
  fsBindCollection('chatMessages', db.collection('chatMessages').where('at','>=', now-7*DAY_MS).orderBy('at'), (a,b)=>chatSortKey(a)-chatSortKey(b), null, renderOrRefreshMessagesModal);
  fsBindCollection('retailSales', db.collection('retailSales').where('at','>=', now-180*DAY_MS).orderBy('at'), (a,b)=>a.at-b.at, normalizeRetailEntry);
  fsBindCollection('trackingViewLogs', db.collection('trackingViewLogs').where('at','>=', now-7*DAY_MS).orderBy('at','desc'), (a,b)=>b.at-a.at);
  fsBindCollection('siteVisitLogs', db.collection('siteVisitLogs').where('at','>=', now-7*DAY_MS).orderBy('at','desc'), (a,b)=>b.at-a.at);
  fsBindCollection('stockMovementLog', db.collection('stockMovementLog').where('at','>=', now-7*DAY_MS).orderBy('at','desc'), (a,b)=>b.at-a.at);

  // Small/low-churn reference + working-set collections — always loaded,
  // same as today.
  fsBindCollection('customers', db.collection('customers'), null);
  fsBindCollection('catalogItems', db.collection('catalogItems'), null, null, ()=>{ rebuildCatalogFlat(); render(); });
  fsBindCollection('transports', db.collection('transports'), null, d=>d.name);
  fsBindCollection('tasks', db.collection('tasks'), null);
  fsBindCollection('stockTasks', db.collection('stockTasks'), null);
  fsBindCollection('customRoles', db.collection('customRoles'), null, null, ()=>{ rebuildRolesRegistry(); render(); });
  fsBindCollection('users', db.collection('users'), null, null, ()=>{ rebuildRolesRegistry(); checkSessionStillValid(); render(); });

  fsBindDoc('stock','current', data=>{
    S.rawMaterial = data.rawMaterial || {};
    S.filledStock = data.filledStock || {};
    S.readyStock = data.readyStock || {};
    S.lowStock = data.lowStock || {raw:{},filled:{},ready:{}};
    S.watchStock = data.watchStock || {raw:{},filled:{},ready:{}};
    // RACE FIX (2026-08-29): re-baseline _lastSyncedStock to this fresh
    // server snapshot every time it fires -- see fsSetStockField and the
    // S._lastSyncedStock declaration above for why. Deep-cloned (these are
    // small, flat/one-level {itemKey:qty} maps, so JSON round-trip is
    // cheap) so later local mutations to S.rawMaterial/etc. can never
    // accidentally mutate this baseline through a shared object reference.
    S._lastSyncedStock = {
      rawMaterial: JSON.parse(JSON.stringify(S.rawMaterial)),
      filledStock: JSON.parse(JSON.stringify(S.filledStock)),
      readyStock: JSON.parse(JSON.stringify(S.readyStock)),
      lowStock: JSON.parse(JSON.stringify(S.lowStock)),
      watchStock: JSON.parse(JSON.stringify(S.watchStock)),
    };
  });
  fsBindDoc('notificationPrefs','current', data=>{ S.notificationPrefs = data || {}; });
  // Round 14 (user request): admin-configurable time windows -- one for
  // self-marking attendance (Attendance section), one for general Daily
  // Work entries (Daily Work section). Both live in the same singleton
  // doc (getAttendanceSettings() below fills in the preset defaults for
  // whichever half hasn't been customized yet), same fsBindDoc pattern as
  // notificationPrefs just above.
  fsBindDoc('attendanceSettings','current', data=>{ S.attendanceSettings = data || {}; });

  fsBindStaticCollection('rolePermissions', obj=>{ S.rolePermissions = obj; applyRolePermissionsToROLES(); });
  fsBindStaticCollection('holidays', obj=>{ S.holidays = obj; });
  fsBindStaticCollection('dailyRecordMarks', obj=>{ S.dailyRecordMarks = obj; });
  fsBindStaticCollection('batchReferences', obj=>{
    // fsSetStaticSubKey wraps a bare number as {value:number} on write —
    // unwrap it the same way on read so S.batchReferences[cat] stays a
    // plain number everywhere else in the app, unchanged from today.
    const plain = {}; Object.keys(obj).forEach(k=>{ plain[k] = (obj[k] && typeof obj[k]==='object') ? obj[k].value : obj[k]; });
    S.batchReferences = plain;
  });
  fsBindStaticCollection('expenseBalances', obj=>{
    const plain = {}; Object.keys(obj).forEach(k=>{ plain[k] = (obj[k] && typeof obj[k].balance==='number') ? obj[k].balance : 0; });
    // Same optimistic-overlay guarantee as today's applyServerData (2026-08-24
    // fix): a balance-delta round trip already applied locally but not yet
    // confirmed server-side must not be wiped out by this listener firing
    // in between — see queueExpenseDelta/flushExpenseDeltaQueue.
    const merged = Object.assign({}, plain);
    for(const pendingUser in pendingExpenseDeltas){
      if(pendingExpenseDeltas[pendingUser]) merged[pendingUser] = (merged[pendingUser]||0) + pendingExpenseDeltas[pendingUser];
    }
    S.expenseBalances = merged;
  });
  fsBindStaticCollection('activeSessions', obj=>{ S.activeSessions = obj; checkSessionStillValid(); });
  // loginLockouts/pendingNotifs are NOT listened here — Security Rules
  // block ALL client reads of loginLockouts (server-only in every
  // respect), and pendingNotifs is scoped per-user with a read rule but
  // has no UI depending on a live listener today (it's replayed once on
  // login via checkForMissedNotifsOnLogin, which still calls the Apps
  // Script action for now — see the file-header note on this block).
}

// ---- Auth bootstrap (replaces restoreSession's role) --------------------
// Fires once immediately with whatever Firebase Auth already knows
// (cached sign-in state, if any — this IS the "page refresh with an
// already-active session" case restoreSession used to handle from
// localStorage) and again on every future sign-in/sign-out.
let fsAuthReadyPromise = null;
function fsBootstrapAuth(){
  fsAuthReadyPromise = new Promise(resolve=>{
    let resolved = false;
    fsAuth.onAuthStateChanged(async (fbUser)=>{
      if(!fbUser){
        fsDetachAllListeners();
        if(S.currentUser){ S.currentUser = null; render(); }
        if(!resolved){ resolved = true; resolve(); }
        return;
      }
      attachFirestoreListeners();
      // A fresh login (finalizeLogin) already set S.currentUser
      // synchronously for the exact same uid — don't redo that work and
      // cause a redundant render/re-init right on top of it. This branch
      // is really only for "app opened with an already-active Firebase
      // Auth session" (a genuine page refresh), where nothing else has
      // set S.currentUser yet.
      //
      // ROOT-CAUSE FIX (2026-08-29, "phone me back krne..." session follow-up
      // -- "welcome screen ati hai jab hum logout karte h", "direct portal
      // khulta h delay nahi ata", "notification bar bar aa rahi h"): the
      // guard above ONLY checked S.currentUser, which finalizeLogin sets --
      // but finalizeLogin is deliberately DELAYED behind the loading (~2.25s)
      // + "Tap to Continue" welcome screen (startPostLoginSequence), and only
      // runs once the person actually taps that button. Firebase fires
      // onAuthStateChanged almost immediately after a successful sign-in --
      // WAY before that tap ever happens -- so at the moment this callback
      // ran, S.currentUser was still null every single time on a fresh
      // interactive login, and this "already active session" branch below
      // ALWAYS won the race: it set S.currentUser directly, which made
      // render() jump straight into the portal (skipping the loading/welcome
      // screens entirely -- "delay nahi ata"), and it called
      // initPushNotifications()/checkForMissedNotifsOnLogin() on its own,
      // duplicating whatever finalizeLogin would also try to do if its tap
      // handler ever still fired (duplicate "Welcome" toast + duplicate
      // missed-notification replay -- "notification bar bar aa rahi h").
      // Worse, because finalizeLogin never got the chance to run, it never
      // reached its own `S.postLoginPhase = null` line either -- so that
      // field stayed stuck at 'loading' or 'welcome' for the rest of the
      // session, invisible while logged in (render() only ever looks at
      // postLoginPhase while S.currentUser is null) -- until the person
      // eventually logged OUT, at which point render() suddenly rendered
      // that stale welcome screen again out of nowhere. Originally "fixed"
      // by also skipping this branch while S.postLoginPhase was truthy --
      // but that check alone turned out to still be TOO LATE: Firebase's
      // signInWithEmailAndPassword() updates its own internal auth state
      // and fires onAuthStateChanged as PART OF resolving that call, which
      // happens before bindLogin's submit handler even gets control back
      // from `await fsLogin(...)` -- so this callback could still fire (and
      // find S.postLoginPhase still null, since startPostLoginSequence
      // hadn't run yet either) before the login form's own handler had any
      // chance to set anything at all. The ACTUAL fix is
      // interactiveLoginInFlight (see bindLogin) -- set synchronously the
      // instant an interactive login attempt begins, before fsLogin() (and
      // therefore before Firebase's own signIn call) even starts, so no
      // matter how early this callback fires, it's already true. Checking
      // S.postLoginPhase too is now redundant but kept as harmless extra
      // safety. This branch still runs correctly for its real purpose: a
      // genuine page refresh with an already-active session, where both
      // flags are always false/null (a reload starts everything fresh).
      if(!(S.currentUser && S.currentUser.id===fbUser.uid) && !S.postLoginPhase && !interactiveLoginInFlight){
        try{
          const userSnap = await fsDb.collection('users').doc(fbUser.uid).get();
          if(userSnap.exists){
            const u = Object.assign({ id: fbUser.uid }, userSnap.data());
            S.currentUser = u;
            applyUserPreferences(u); // per-user language/font-size -- see its own header comment
            S.view = ROLES[u.role] ? ROLES[u.role].tabs[0] : S.view;
            primeDevicePermissions();
            initPushNotifications();
            checkForMissedNotifsOnLogin();
            render();
          }
        }catch(e){ console.error('Failed to load signed-in user profile', e); }
      }
      if(!resolved){ resolved = true; resolve(); }
    });
  });
  return fsAuthReadyPromise;
}

// ---- SERVER-SIDE AUTH (2026-08-21 audit, findings #3/#4) ----
// SUPERSEDED (Task #54): password verification now happens via
// fsLogin/Firebase Auth above, not this Apps Script call — kept only as
// the network-unreachable fallback path's dead code was already removed
// from bindLogin below. apiLogin itself is no longer called anywhere;
// left in place (unused) rather than deleted, so a diff against
// order-ops.html stays easy to follow.
async function apiLogin(username, password){
  const res = await fetchWithTimeout(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ secret:SECRET, action:'login', username, password })
  });
  return res.json(); // {ok:true,user,sessionToken} | {error:'invalid_credentials'} | {error:'locked',lockedUntil}
}
// Best-effort — the token is discarded client-side regardless of whether
// this reaches the server, so a failed/slow logout call never blocks the
// UI from returning to the login screen.
async function apiLogout(){
  if(!S.currentUser || !S.authToken) return;
  try{
    await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ secret:SECRET, action:'logout', username:S.currentUser.username, sessionToken:S.authToken })
    });
  }catch(e){ /* token is cleared locally either way — see doLogout */ }
}
// Actually revokes another user's session server-side (Force logout, and
// resetting someone else's password) — before this fix, both only ever
// flipped a client-visible flag (activeSessions) that the affected device
// would merely NOTICE on its next sync; its writes kept working the whole
// time since the backend never checked any token at all. Best-effort by
// design (fire-and-forget at both call sites): the client-visible
// activeSessions flag (issueNewSessionToken) still does the visible "signed
// out" UX even if this particular call fails.
async function apiInvalidateSession(username){
  if(!S.currentUser || !S.authToken) return;
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ secret:SECRET, action:'invalidateSession', username, actingUsername:S.currentUser.username, sessionToken:S.authToken })
    });
    const json = await res.json();
    if(json && json.error) handleAuthError(json.error);
  }catch(e){ /* best-effort */ }
}
// Replaces the old client-driven "save ~8 keys to empty + deleteKeys
// whatever days I've locally seen" sequence with the one atomic,
// server-comprehensive action (finding #1's literal "wipe all data"
// example) — see performResetAllData_ in order-ops-backend.gs.
async function apiResetAllData(){
  const res = await fetchWithTimeout(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ secret:SECRET, action:'resetAllData', actingUsername:S.currentUser && S.currentUser.username, sessionToken:S.authToken })
  });
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}
// ---- Graceful handling for the two auth failure reasons order-ops-
// backend.gs's OLD doPost endpoint can come back with (2026-08-21 audit,
// findings #3/#4) ----
//   "forbidden": the session IS valid, but this account's role doesn't
//     allow the action — re-login won't help, so just say so.
//   "session_required": the OLD endpoint's custom session token is
//     missing/stale.
//
// BUGFIX (2026-08-29, "bar bar password mang raha hai" -- STILL happening
// after the Round 3 session-token fix): "session_required" used to pop a
// blocking "enter your password to refresh your session" prompt right
// here -- and it was popping constantly, on things as routine as every
// single login (checkForMissedNotifsOnLogin) and every Force Logout,
// because NEITHER of those callers' underlying API_URL calls could ever
// actually succeed: this app's real login is Firebase Auth (fsLogin), which
// never produces one of this OLD endpoint's session tokens in the first
// place, so every remaining call into it was, in effect, guaranteed to
// fail with exactly this error, every time. And even when "fixed" by
// typing the password in, all that did was mint a fresh OLD token that
// nothing in this app actually depends on anymore -- the REAL session
// (Firebase Auth + firestore.rules) was never broken and didn't need it.
// It was a dead end dressed up as a fix. The two call sites that were
// actually hitting this on every login/every Force Logout are now properly
// rewired to Firestore/Cloud Functions instead (see
// checkForMissedNotifsOnLogin and the Force Logout button handler) -- the
// two remaining OLD-endpoint calls left in this file (apiUploadLR/
// apiDeleteLR -- LR photo upload/delete, still Google Drive by explicit
// user request, see apiUploadLR's own Round 12 comment for how their
// actual session_required bug got fixed without switching storage
// backends) now just fail quietly and cleanly through their own existing
// "upload failed, try again" messaging instead of ALSO throwing this
// pointless prompt in the person's face.
function handleAuthError(errMsg){
  if(errMsg === 'forbidden'){
    showToast("You don't have permission to do that.", true);
    return true;
  }
  if(errMsg === 'session_required'){
    console.warn('handleAuthError: a legacy order-ops-backend.gs call was rejected with session_required -- this is expected (no client here ever holds a valid old-style session token anymore) and intentionally silent now; see the comment above this function.');
    return true;
  }
  return false;
}

  stockBtn.addEventListener('click', ()=>{ setSelected('stock'); refresh(); });

}

// A NEW (Round 13+) photo's o.lrPhotoUrl is already a real Firebase Storage
// download URL, fine to use directly as-is for both the <img src> and the
// <a href> download link -- no Drive-specific workaround needed for it.
// Only a LEGACY (pre-Round-13) Drive-based photo needs the thumbnail-
// endpoint rewrite below: o.lrPhotoUrl there is Drive's "uc?export=
// download&id=..." link -- reliable for a real navigation (the <a href>),
// but Drive does not reliably serve raw image bytes on that same endpoint
// when hotlinked as an <img src> -- it can redirect to an interstitial
// instead, which shows up as a broken-image icon. Drive's "thumbnail"
// endpoint is the one meant for inline embedding (built from lrFileId if
// present, else parsed back out of lrPhotoUrl for older records).
function lrEmbedUrl(o){
  if(o.lrStoragePath) return o.lrPhotoUrl;
  let fileId = o.lrFileId;
  if(!fileId && o.lrPhotoUrl){
    const m = String(o.lrPhotoUrl).match(/[?&]id=([^&]+)/);
    if(m) fileId = m[1];
  }
  return fileId ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w1600` : o.lrPhotoUrl;
}
