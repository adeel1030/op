    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
      <button type="button" class="btn btn-primary" id="adjSave">${esc(t('Save'))}</button>
    </div>
  `);
  document.getElementById('adjSave').addEventListener('click', async ()=>{
    const raw = parseFloat(document.getElementById('adjVal').value)||0;
    // MEDIUM FIX (2026-08-21 audit, finding #22): this Save button is
    // type="button", not a real <form> submit, so the min/max attributes
    // just added above are never enforced by the browser -- this explicit
    // JS check is what actually catches a fat-fingered extra zero.
    // Deliberately a magnitude check (Math.abs), not a min=0 floor:
    // negative stock is a real, intentionally-displayed state elsewhere
    // in this app (see the stockneg styling on the inventory tables, used
    // for tracking a genuine deficit/overselling situation), so blocking
    // negative values here would prevent a legitimate correction.
    const adjCap = isRaw ? MAX_STOCK_ADJUST_L : MAX_STOCK_ADJUST_PC;
    if(Math.abs(raw) > adjCap){ showAlert(`${t("That's more than")} ${adjCap.toLocaleString()} ${isRaw?'L':'pc'} ${t('— please double-check for a typo (extra zero?) before saving.')}`); return; }
    const val = isRaw ? raw*1000 : raw; // Liters -> mL for raw material
    let key;
    const oldVal = kind==='raw' ? (S.rawMaterial[id]||0) : kind==='filled' ? (S.filledStock[id]||0) : (S.readyStock[id]||0);
    if(kind==='raw'){ S.rawMaterial[id]=val; key='app:rawMaterial'; }
    if(kind==='filled'){ S.filledStock[id]=val; key='app:filledStock'; }
    if(kind==='ready'){ S.readyStock[id]=val; key='app:readyStock'; }
    safeSet(key, kind==='raw'?S.rawMaterial:kind==='filled'?S.filledStock:S.readyStock);
    if(val !== oldVal) logStockMovement(id, label, 'adjust', val-oldVal, 'Manually adjusted by admin', kind);
    if(kind==='ready') autoAdvanceOrders();
    if(kind==='filled' || kind==='ready') syncStockTasksFromAlerts();
    closeModal(); render(); showToast('Updated');
  });
}

function recordPresent(lat, lng, note, fieldLocation){
  const entry = {
    id: uid(), username: S.currentUser.username, name: S.currentUser.name, type:'present',
    lat: lat, lng: lng, timestamp: Date.now(), note: note||'', fieldLocation: fieldLocation||''
  };
  S.attendance.push(entry);
  savePartitionForItem('attendance', entry);
  render(); showToast('Marked present ✅');
}
function bindCheckin(){
  const btn = document.getElementById('checkBtn');
  if(!btn) return; // already marked present today, holiday/Sunday, or outside the self-marking window (Round 14) -- nothing to bind in any of those cases
  const attemptGetPosition = (opts)=> new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve, reject, opts);
  });
  const requestLocation = async (msg, fieldLocation)=>{
    // Try a precise GPS fix first; if that fails or times out, retry once
    // with a coarser network/wifi-based fix — this alone recovers location
    // for a lot of indoor/cold-GPS cases that would otherwise fail outright.
    try{
      if(msg) msg.textContent = t('Getting a precise GPS fix…');
      const pos = await attemptGetPosition({enableHighAccuracy:true, timeout:18000, maximumAge:0});
      recordPresent(pos.coords.latitude, pos.coords.longitude, '', fieldLocation);
      return;
    }catch(err1){
      if(err1 && err1.code===1){ // permission denied — no point retrying
        if(msg) msg.textContent = t('Location permission denied. Marked present without location.');
        recordPresent(0, 0, 'geo-error-1', fieldLocation);
        return;
      }
      if(msg) msg.textContent = t('Retrying with a faster, lower-accuracy fix…');
      try{
        const pos = await attemptGetPosition({enableHighAccuracy:false, timeout:12000, maximumAge:30000});
        recordPresent(pos.coords.latitude, pos.coords.longitude, '', fieldLocation);
        return;
      }catch(err2){
        const reason = err2 && err2.code===1 ? t('Location permission denied.') : err2 && err2.code===2 ? t("GPS/location seems off — check phone Location settings.") : t('Location timed out.');
        if(msg) msg.textContent = `${reason} ${t('Marked present without location.')}`;
        recordPresent(0, 0, 'geo-error-'+(err2&&err2.code), fieldLocation);
      }
    }
  };
  btn.addEventListener('click', ()=>{
    const msg = document.getElementById('geoMsg');
    let fieldLocation = '';
    if(S.currentUser.role==='sales'){
      const flInput = document.getElementById('fieldLocationInput');
      fieldLocation = flInput ? flInput.value.trim() : '';
      if(!fieldLocation){ showAlert(t('Field Location is required — where are you going for marketing today?')); return; }
    }
    if(location.protocol === 'file:'){
      if(msg) msg.textContent = t('This file:// page can never get location — open the hosted https:// link instead.');
      return;
    }
    if(!window.isSecureContext){
      if(msg) msg.textContent = t('Needs https:// for location — marked without it.');
      recordPresent(0, 0, 'insecure-context', fieldLocation); return;
    }
    if(!navigator.geolocation){
      if(msg) msg.textContent = t('Location not supported on this device — marking without it.');
      recordPresent(0, 0, 'no-geo-support', fieldLocation); return;
    }
    // Pre-check permission state where supported, so we can tell the person
    // exactly what's going on instead of guessing from a generic error.
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(status=>{
        if(status.state==='denied'){
          if(msg) msg.textContent = t('Location blocked for this site — open your browser\'s site settings to allow it, then try again.');
          recordPresent(0, 0, 'permission-denied-cached', fieldLocation);
          return;
        }
        if(msg) msg.textContent = status.state==='prompt' ? t('Waiting for you to allow location…') : t('Getting your location…');
        requestLocation(msg, fieldLocation);
      }).catch(()=>{
        if(msg) msg.textContent = t('Waiting for location…');
        requestLocation(msg, fieldLocation);
      });
    } else {
      if(msg) msg.textContent = t('Waiting for location…');
      requestLocation(msg, fieldLocation);
    }
  });
}

function dateKeyToTs(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  return new Date(y, m-1, d, 12).getTime();
}
// Day-wise list of every employee, marked Present if they have any
// attendance record that day (works with both new 'present' entries and
// any legacy 'checkin'/'checkout' records).
function isWorkingDay(dk){
  return !isSundayDateKey(dk) && !S.holidays[dk];
}
function attendanceStatusFor(username, dk){
  if(isSundayDateKey(dk)) return {status:'sunday'};
  if(S.holidays[dk]) return {status:'holiday', label:S.holidays[dk].label};
  const dayRecords = S.attendance.filter(a=>a.username===username && localDateKey(a.timestamp)===dk).sort((a,b)=>b.timestamp-a.timestamp);
  if(!dayRecords.length) return {status:'unmarked'};
  return {status: dayRecords[0].type, record: dayRecords[0]};
}
function computePresenceByDate(){
  const relevantUsers = S.users.filter(u=>u.role!=='admin');
  const allDateKeys = new Set();
  S.attendance.forEach(a=>allDateKeys.add(localDateKey(a.timestamp)));
  Object.keys(S.holidays).forEach(dk=>allDateKeys.add(dk));
  allDateKeys.add(localDateKey(Date.now())); // always show today, even with zero records, so admin can act on it
  return [...allDateKeys].sort().reverse().slice(0,30).map(dk=>({
    dateKey: dk,
    dateTs: dateKeyToTs(dk),
    isSunday: isSundayDateKey(dk),
    holidayLabel: holidayLabelFor(dk),
    entries: relevantUsers.map(u=>{
      const st = attendanceStatusFor(u.username, dk);
      return { username:u.username, name:u.name, status:st.status, record:st.record, holidayLabel:st.label };
    })
  }));
}

function renderMonthlySummary(year, month1based){
  const box = document.getElementById('summaryResultBox');
  if(!box) return;
  const daysInMonth = new Date(year, month1based, 0).getDate();
  const employees = S.users.filter(u=>u.role!=='admin');
  const today = localDateKey(Date.now());
  let workingDaysCount = 0;
  const dayKeys = [];
  for(let d=1; d<=daysInMonth; d++){
    const dk = `${year}-${String(month1based).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(dk > today) break; // don't count days that haven't happened yet
    dayKeys.push(dk);
    if(isWorkingDay(dk)) workingDaysCount++;
  }
  const rows = employees.map(u=>{
    let presentCount = 0;
    const absentDates = [];
    dayKeys.forEach(dk=>{
      if(!isWorkingDay(dk)) return;
      const st = attendanceStatusFor(u.username, dk);
      if(st.status==='present') presentCount++;
      else absentDates.push(dk);
    });
    return { name:u.name, present:presentCount, absent:absentDates.length, absentDates };
  });

// ---- Phone/gesture back-button handling (2026-08-29, "phone me back krne
// pr app bnd hojati hai, back dabane par back hi ana chahiye") ----
// This app has exactly ONE real URL/page -- every "screen" inside it
// (a modal, the notification/profile/more side sheets) is just JS state
// (S.notifOpen etc, or an appended .modal-overlay div), never a real
// browser navigation. So the phone's hardware/gesture back button had
// NOTHING of its own to step back through, and the OS just closed or
// backgrounded the whole PWA instead -- exactly what was reported.
//
// Fix: keep a small stack of dummy history.pushState() entries in sync
// with what's actually on screen (a modal open = 1 entry; a side sheet
// open = 1 entry; both at once = 2), via syncBackStack() below. That
// gives the phone's back button somewhere of ours to land on. When a real
// back press fires 'popstate', we intercept it and close whatever is
// currently topmost (a modal first, else a side sheet) instead of letting
// the browser actually navigate anywhere -- there's nowhere for it to
// really go, this is a single-page app. Only when NOTHING of ours is open
// does a back press fall through with no interception, which at the true
// home screen is correct: that's when the app should actually exit/go to
// background, same as any normal app.
//
// syncBackStack() is called from a small, fixed set of "single choke
// point" spots -- the same pattern already used for the modal-open
// animation and the live-listener reconnect fix -- so every single
// open/close path in the whole file (~50+ modal call sites, all the
// side-sheet toggles, every showAlert/showConfirm/showPrompt) is covered
// automatically, with no changes needed at any individual call site: the
// end of showModal() and both removal points in closeModal() (modals);
// the end of render() (side sheets, since S.notifOpen/moreOpen/
// profileOpen/alertPanelOpen only ever take visible effect through a
// render() call); and showAlert/showConfirm/showPrompt's shared
// append/close pattern (styled replacements for the native alert/confirm/
// prompt popups).
let __backDepth = 0; // how many of our OWN dummy history entries are currently pushed
let __suppressNextPopstate = false; // true while WE are consuming a popstate we caused ourselves (via history.back() below), so the listener doesn't double-handle it
function computeWantedBackDepth(){
  const sheetOpen = !!(S.notifOpen || S.moreOpen || S.profileOpen || S.alertPanelOpen);
  const modalOpen = !!document.getElementById('modalOverlay');
  const alertOpen = !!document.getElementById('appAlertOverlay'); // showAlert/showConfirm/showPrompt — can be open ON TOP of an already-open modal (e.g. a validation error while filling a form), so this stacks as its own extra depth rather than replacing modalOpen
  // Round 15 follow-up #2: "home ke alawa hum agar kahi b hn (jese orders ya
  // stock) waha back dabane par app bnd ho rhi hai. me chahta hu Home page
  // par aayen. app close jb hi ho jb home pr hon or back press kren" -- being
  // on any non-Home tab now counts as its own back-stack depth too, so a
  // real back press with nothing else open lands on Home instead of falling
  // through to the browser's real back/exit. render() already calls
  // syncBackStack() unconditionally at its own tail, and every tab switch
  // goes through render(), so this is picked up automatically with no new
  // call sites needed.
  const notOnHome = !!(S.currentUser && S.view!=='home');

function syncBackStack(){
  if(!S.currentUser) return; // nothing back-able exists before login (and doLogout() already resets all the sheet flags)
  const wanted = computeWantedBackDepth();
  while(__backDepth < wanted){
    __backDepth++;
    try{ history.pushState({ omsBackDepth: __backDepth }, '', location.href); }catch(e){}
  }
  while(__backDepth > wanted){
    __backDepth--;
    __suppressNextPopstate = true;
    try{ history.back(); }catch(e){}

window.addEventListener('popstate', ()=>{

    // close whichever one is up first. Re-uses the exact same Cancel/OK
    // click handlers already wired (including calling the dialog's own
    // onCancel, for showConfirm/showPrompt) rather than duplicating that
    // logic here, so back behaves identically to tapping outside the box.
    const cancelBtn = alertOverlay.querySelector('#appConfirmCancelBtn, #appPromptCancelBtn');
    const okBtn = alertOverlay.querySelector('#appAlertOkBtn');
    if(cancelBtn) cancelBtn.click(); else if(okBtn) okBtn.click(); else alertOverlay.remove();

    // dabate hn to wapas homepage par ana chahiye" -- a modal stamped
    // viaQuickAction (see showModal()'s own comment) also jumps the app
    // back to Home once it finishes closing, regardless of which tab it
    // was opened from. Read the stamp BEFORE calling closeModal() (the
    // element is still there to read; closeModal() only marks it .closing,
    // removal is the timer below), then wait out closeModal()'s own

    // modal's exit animation isn't interrupted by a mid-flight full shell
    // re-render.
    const wasViaQuickAction = document.getElementById('modalOverlay').dataset.viaQuickAction==='1';

    S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; S.alertPanelOpen=null;
    render();

    // Round 15 follow-up #2: nothing else of ours was open, but we're not on
    // Home -- go Home instead of letting this real back press fall through
    // to the browser's actual back/exit. This is the LAST of our own
    // intercepts, so the app only genuinely closes on a back press taken
    // while already on Home with nothing else open (the case below).
    S.view = 'home';
    render();

  // If none of the above applied (we're on Home with nothing else of ours
  // open), there was nothing left of ours to intercept here — a genuine
  // "leave the app" back press, left to the OS/browser as normal.
});

/* ============================= DEVICE PERMISSIONS (ask once, up front) ============================= */
function primeDevicePermissions(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {timeout:8000, maximumAge:600000});
    }
  }catch(e){}
  primeAudioUnlock();
}
// Browsers block audio (our notification "ring") until the page has had a
// real user gesture — unlock it on the very first tap/click anywhere.
let audioUnlocked = false;
function primeAudioUnlock(){
  if(audioUnlocked) return;
  const unlock = ()=>{
    if(audioUnlocked) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      audioUnlocked = true;
    }catch(e){}
    document.removeEventListener('click', unlock);
    document.removeEventListener('touchstart', unlock);
  };
  document.addEventListener('click', unlock, {once:true});
  document.addEventListener('touchstart', unlock, {once:true});
}

/* ============================= NOTIFICATION "RING" ============================= */
let lastKnownNotifCount = 0;
let audioCtx = null;
function playNotifRing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18].forEach(off=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+off);
      gain.gain.exponentialRampToValueAtTime(0.18, now+off+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+off+0.16);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.18);
    });
  }catch(e){}
}
function checkForNewNotifRing(){
  if(!S.currentUser) return;
  const count = myNotifCount(getStockAlerts());
  if(count > lastKnownNotifCount) playNotifRing();
  lastKnownNotifCount = count;
}

/* ============================= INIT ============================= */
let loadAllPromise = null;
(async function init(){
  applyDocumentPrefAttrs(); // sets <html dir>/lang/fs-* BEFORE the first paint, off this device's localStorage-seeded default -- applyUserPreferences() (called once a session/login resolves, below) re-applies it against the actual logged-in user's own saved preference once that's known
  loadOfflineQueue(); // now-dead queue (nothing populates it any more -- Firestore's own offline persistence replaces it, see the plumbing block's header comment); loading it is a harmless no-op, kept only so a leftover queue from a pre-Task-#54 session isn't silently lost
  loadPendingExpenseDeltas();
  render();
  primeDevicePermissions();
  // REWIRED (Task #54): was `loadAllPromise = loadAll(); await loadAllPromise;`
  // -- loadAll() drove everything off one-shot apiFetchAll() calls against
  // the old Apps Script backend, which is no longer the source of truth (see
  // scripts/export_to_firestore.js). fsBootstrapAuth() is the direct
  // replacement: it resolves once Firebase Auth's cached sign-in state (if
  // any) is known, and if signed in, has already called
  // attachFirestoreListeners() so every collection's real-time listener is
  // live from this point on -- there is no more "fetch once, then poll"; the
  // listeners themselves push every future change straight into S and
  // re-render, for as long as the app stays open.
  await fsBootstrapAuth();
  S.loaded = true;
  // NOTE (Task #54): S.loadFailed intentionally stays false here --
  // fsBootstrapAuth()/onAuthStateChanged always resolves from Firebase
  // Auth's local cache, online or not, so there is no equivalent of the old
  // "couldn't reach the backend at all" case loadAll() used to hit after
  // MAX_ATTEMPTS. renderConnectionFailedScreen()/bindConnectionFailedScreen()
  // are left wired up (its retry button now calls fsBootstrapAuth() too) in
  // case a future change reintroduces a real failure path, but in practice
  // this screen should no longer be reachable.
  render();
  if(S.currentUser){ primeDevicePermissions(); lastKnownNotifCount = myNotifCount(getStockAlerts()); }
  flushOfflineQueue(); // in case saves were queued from a previous (pre-Task-#54) session
  flushExpenseDeltaQueue(); // in case an expense-balance delta was left pending from a previous session
  // REWIRED (Task #54): was `doSyncTick()` on both 'online' and
  // visibilitychange -- that forced an immediate poll against the old
  // backend to catch up after being offline/backgrounded. Firestore's
  // onSnapshot listeners are SUPPOSED to reconnect and catch up on their
  // own the instant connectivity/visibility returns.
  // BUGFIX (2026-08-28, "Messaging me Live Messenger turant nahi aata,
  // dekhne ke liye band karke dobara kholna padta hai"): in practice that
  // assumption doesn't always hold -- once a PWA/browser tab has sat
  // backgrounded for a while (screen locked, phone switched to another
  // app, laptop lid closed), the underlying real-time connection can go
  // stale for noticeably longer than expected before the SDK's own
  // reconnect logic notices, so a new message/order/etc. that arrived on
  // the server while this device was away doesn't actually show up here
  // until something forces a fresh listen -- which closing and reopening
  // the Messages modal doesn't even really do (it just re-reads whatever
  // is already in memory); only a full page reload reliably fixed it
  // before. re-attaching every Firestore listener on 'online' and on
  // becoming visible again is cheap and safe (a brand-new onSnapshot's
  // very first event is always the collection's full current state, so
  // this can never show stale/incomplete data -- it can only catch
  // things up faster) and removes the need to reload anything.
  window.addEventListener('online', ()=>{ showToast('Back online — syncing…'); flushOfflineQueue(); flushExpenseDeltaQueue(); reverifyOneSignalLogin(); if(S.currentUser) attachFirestoreListeners(); });
  window.addEventListener('offline', ()=>{ showToast('No connection — changes will be saved and synced automatically', true); });
  // Installed PWAs can stay open (backgrounded) for days without a real page
  // reload -- if the very first OneSignal.login() attempt lost its race
  // (see ensureOneSignalLogin above), this is the other natural moment to
  // quietly retry it (and now also the moment to force-refresh live data --
  // see the BUGFIX comment above).
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ reverifyOneSignalLogin(); if(S.currentUser) attachFirestoreListeners(); } });
  // Re-render (debounced) when the window crosses the desktop-sidebar
  // breakpoint, so resizing a browser window updates the nav split
  // (bottom-bar "More" overflow <-> full sidebar list) without waiting
  // for an unrelated state change to trigger the next render.
  (function watchDesktopSidebarBreakpoint(){
    let wasDesktop = window.innerWidth >= DESKTOP_SIDEBAR_MIN_WIDTH;
    let resizeTimer = null;
    window.addEventListener('resize', ()=>{
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(()=>{
        const isDesktop = window.innerWidth >= DESKTOP_SIDEBAR_MIN_WIDTH;
        if(isDesktop !== wasDesktop){ wasDesktop = isDesktop; if(S.currentUser) render(); }
      }, 150);
    });
  })();
  startHeartbeat();
  startSessionExpiryWatch();
  watchUserActivityForIdleTimeout();
  // REWIRED (Task #54): was "backstop only" alongside doSyncTick's own
  // instant check on every tick (up to every 2s). With doSyncTick retired,
  // this 5s interval is now the ONLY trigger for the notification bell/ring
  // -- a deliberate, small regression from "near-instant" to "within 5s",
  // judged an acceptable trade rather than wiring checkForNewNotifRing into
  // every individual Firestore listener's onChange callback for this pass.
  // checkForNewNotifRing is idempotent (compares against the last count it
  // saw), so this is safe to call on a plain timer.
  setInterval(checkForNewNotifRing, 5000);
})();
</script>
