<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3F1B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OMS">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>OMS - M A PRODUCTS INDIA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* FEATURE (2026-09-03, explicit user request: "English k alawa Font Size
     ko Increase ya decrease krne ka option bhi dedo, bas Normal, XL, XXL
     ye 3 option"): every font-size in this stylesheet is expressed in rem
     (relative to the <html> element's own font-size), specifically so a
     single change here scales EVERY piece of text in the app proportionally
     at once. setFontSize()/applyDocumentPrefAttrs() (see the JS below) put
     exactly one of these 3 classes on <html> -- fs-normal is also the
     unstyled default (16px, matches every browser's own base), so a page
     that somehow renders before JS has applied a class still looks
     correct. Deliberately font-size ONLY -- padding/gaps/widths elsewhere
     in this file stay in px, unchanged, so this is a pure "make the text
     bigger" control, not a full UI zoom (a full-zoom XXL could overflow
     some tight layouts; this doesn't touch spacing, so it can't).
  */
  html.fs-normal{ font-size:16px; }
  html.fs-xl{ font-size:18px; }
  html.fs-xxl{ font-size:20px; }
  :root{
    --bg:#F1F7F3;
    --surface:#FFFFFF;
    --ink:#122019;
    --ink-soft:#546358;
    --primary:#1E6B44;
    --primary-dark:#124A2E;
    --accent:#F2A93B;
    --accent-ink:#5A3B06;
    --gold:#C9A227;
    --gold-dark:#9C7C17;
    --success:#2E9E6B;
    --success-bg:#E6F5EE;
    --danger:#D8483B;
    --danger-bg:#FBEAE8;
    --warning:#9A6B0B;
    --warning-bg:#FEF2DC;
    --info:#2E5FA3;
    --info-bg:#E6EEFA;
    --border:#DCE8DF;
    /* Round 14 (user request): "tiles jitne b hn sabhi jagah unko thoda 3d
       look dedo or halka sa piche shadow dedo" -- a shared "raised tile"
       treatment applied consistently to every tile/card class below (.card,
       .stat, .stat-card-v2, .order-tile, .alert-tile, .qa-tile) instead of
       each having its own one-off shadow.
       Follow-up (2026-09-02, same user): "dome shaped" -- made explicitly
       convex, not just a flat card with a shadow. --tile-highlight is a
       radial "light source" gradient layered UNDER each tile's own
       background/color (top-left, fading to transparent) so the surface
       itself reads as curved, like light sliding off the crest of a dome;
       --tile-shadow adds a bright inset rim along the top (the crest
       catching light), an inset shadow hugging the bottom-inside edge
       (where the curve rolls away from the light, darkening it), a close
       contact shadow for a defined edge, and a soft ambient shadow
       underneath so the whole tile reads as floating/raised. Every tile
       class also got a couple of px more border-radius -- rounder corners
       read as more dome-like than sharp ones. Kept gentle on purpose (a
       business app, not meant to look glossy/glassy). */
    --tile-highlight: radial-gradient(90% 65% at 50% -8%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 72%), linear-gradient(180deg, rgba(255,255,255,0.40) 0%, rgba(255,255,255,0) 30%, rgba(14,36,71,0.07) 100%);
    --tile-shadow: 0 1.5px 0 rgba(255,255,255,1) inset, 0 -20px 22px -12px rgba(14,36,71,0.22) inset, 0 1px 3px rgba(14,36,71,0.12), 0 12px 20px -8px rgba(14,36,71,0.26), 0 30px 46px -26px rgba(14,36,71,0.42);
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --frame-w:412px;
    --frame-h:732px;
    --topbar-h:56px;
    --navbar-h:64px;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{
    background:#DADEE8;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Phone frame (desktop preview) ---------- */
  .device-wrap{
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(242,169,59,0.10), transparent 45%),
      linear-gradient(160deg,#151b2e,#232b45 60%,#151b2e);
    padding:28px;
  }
  .device{
    position:relative;width:var(--frame-w);height:var(--frame-h);
    background:#000;border-radius:44px;padding:12px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.06) inset;
  }
  .device::before{
    content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:50;
  }
  .device-screen{
    position:relative;width:100%;height:100%;
    background:linear-gradient(180deg, #DCEFE1 0%, var(--bg) 32%, var(--bg) 100%);
    border-radius:32px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  #root{height:100%;display:flex;flex-direction:column;position:relative;}
  @media (max-width:520px), (max-height:760px){
    .device-wrap{padding:0;background:var(--bg);}
    .device{width:100vw;width:100dvw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;}
    .device::before{display:none;}
    .device-screen{border-radius:0;}
  }


  /* ---------- Rich home page: icon badges, overview strip, stat cards v2, quick actions, promo banner ---------- */
  .icon-badge{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:0 0 auto;}
  .icon-badge.round{border-radius:50%;}
  .icon-badge.green{background:#DDF0E4;}
  .icon-badge.orange{background:#FDEACB;}
  .icon-badge.blue{background:#DCEAFB;}
  .icon-badge.purple{background:#EBE1FA;}
  .icon-badge.red{background:#FBE0DD;}

  /* Tinted mint-gradient panel — used for Today Overview & Quick Actions cards */
  .card-tinted{background:linear-gradient(160deg, #EAF7EE 0%, #CFEAD9 100%);border-color:transparent;}

  .overview-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .overview-head h2{margin:0;}
  .overview-head .odate{font-size:0.71875rem;color:var(--ink-soft);font-family:var(--font-mono);}
  .overview-strip{display:flex;justify-content:space-between;gap:4px;}
  .overview-col{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
  .overview-col .icon-badge{
    width:42px;height:42px;font-size:1.125rem;
    background:linear-gradient(145deg, var(--primary), var(--primary-dark));
    border:2px solid var(--gold);box-shadow:0 3px 8px -3px rgba(18,74,46,0.5);
  }
  .overview-col .n{font-family:var(--font-mono);font-size:1.125rem;font-weight:800;color:var(--primary-dark);}
  .overview-col .l{font-size:0.71875rem;color:var(--ink-soft);text-align:center;line-height:1.25;}

  .stat-grid-v2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat-card-v2{border:none;border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--tile-shadow);transition:transform .08s ease, box-shadow .15s ease;}
  .stat-card-v2:active{transform:scale(0.96);}
  .stat-card-v2:nth-child(4n+1){background:var(--tile-highlight), linear-gradient(150deg, #F1FBF5, #C9EBD9);}
  .stat-card-v2:nth-child(4n+2){background:var(--tile-highlight), linear-gradient(150deg, #E6E2A8, #B9C77E);}
  .stat-card-v2:nth-child(4n+3){background:var(--tile-highlight), linear-gradient(150deg, #CDEFEA, #86D2C6);}
  .stat-card-v2:nth-child(4n+4){background:var(--tile-highlight), linear-gradient(150deg, #E7D796, #C6AD5E);}
  .stat-card-v2:active{transform:scale(0.96);}
  .stat-card-v2 .row-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-card-v2 .icon-badge{background:rgba(255,255,255,0.55);}
  .stat-card-v2 .chev{color:var(--gold-dark);background:rgba(255,255,255,0.55);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.875rem;margin-top:8px;}
  .stat-card-v2 .n{font-family:var(--font-mono);font-size:1.375rem;font-weight:800;color:var(--primary-dark);margin-top:10px;}
  .stat-card-v2 .title{font-size:0.78125rem;font-weight:700;margin-top:3px;color:var(--ink);}
  .stat-card-v2 .sub{font-size:0.75rem;color:var(--ink-soft);margin-top:1px;}

  .qa-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .qa-head h2{margin:0;padding-left:10px;border-left:3px solid var(--gold);}
  .qa-head span{font-size:0.6875rem;color:var(--ink-soft);}
  .qa-grid{display:flex;flex-wrap:nowrap;justify-content:space-evenly;align-items:flex-start;gap:8px;}
  .qa-grid+.qa-grid{margin-top:10px;}
  /* Follow-up (2026-09-02, same user, "Quick Actions ke icon ke sizes
     Increase kro. inke Tile Size bhi thik kro perfect Square. or perfect
     fill bhi."): previously flex:0 1 auto + a 60-78px min/max-width range
     let every tile shrink toward the small end and left a fixed-size
     38px icon looking lost in the middle of it, especially on a wide
     desktop row where there was plenty of unused space. Now flex:1 1 0
     (min-width:0) makes every tile in a row share the row's width
     EQUALLY -- growing to fill real extra room instead of leaving it as
     dead gap -- and aspect-ratio:1/1 forces an exact square regardless of
     that width, capped at --qa-tile-max so it never grows absurdly big on
     a very wide window. Content is centered via flex column layout so the
     (now much bigger) icon badge + label actually fill the square instead
     of floating in a sea of padding. */
  .qa-tile{flex:1 1 0;min-width:0;max-width:var(--qa-tile-max, 104px);aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(90% 65% at 50% -8%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 72%), rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.7);border-radius:18px;padding:8px 4px;text-align:center;cursor:pointer;transition:transform .08s ease;box-shadow:0 1.5px 0 rgba(255,255,255,0.85) inset, 0 -12px 16px -8px rgba(0,0,0,0.20) inset, 0 5px 12px -6px rgba(0,0,0,0.32);}
  .qa-tile:active{transform:scale(0.94);}
  .qa-tile .icon-badge{margin:0;background:rgba(255,255,255,0.85);width:52px;height:52px;font-size:1.625rem;flex:0 0 auto;}
  .qa-tile .title{font-size:0.78125rem;font-weight:800;color:var(--ink);line-height:1.2;}
  .qa-tile .sub{display:none;}

  .promo-banner{background:linear-gradient(120deg, #0E1F14, var(--primary-dark));border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:12px;box-shadow:0 8px 20px -10px rgba(18,74,46,0.5);}
  .promo-banner .pico{font-size:1.875rem;flex:0 0 auto;}
  .promo-banner .txt{flex:1;min-width:0;}
  .promo-banner .txt b{font-size:0.875rem;display:block;margin-bottom:2px;}
  .promo-banner .txt span{font-size:0.6875rem;opacity:0.85;line-height:1.4;display:block;}
  .promo-banner button{background:#fff;color:var(--primary-dark);border:none;border-radius:10px;padding:9px 12px;font-weight:800;font-size:0.71875rem;white-space:nowrap;cursor:pointer;flex:0 0 auto;}

  /* ---------- Login ---------- */
  .login-wrap{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;
    background:
      radial-gradient(circle at 15% 15%, rgba(201,162,39,0.22), transparent 42%),
      radial-gradient(circle at 85% 85%, rgba(255,255,255,0.08), transparent 40%),
      linear-gradient(160deg, #0E1F14, var(--primary-dark) 45%, var(--primary) 100%);
    padding:24px 20px;
  }
  .login-card{
    background:var(--surface); width:100%; max-width:340px; border-radius:20px;
    padding:30px 24px; box-shadow:0 20px 60px rgba(14,36,71,0.35);
    animation:loginCardIn .35s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes loginCardIn{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .login-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(242,169,59,0.25);}
  .login-brand span{font-weight:800;letter-spacing:0.02em;font-size:0.9375rem;color:var(--primary-dark);text-transform:uppercase;}
  .login-brand-lg{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .login-logo{width:52px;height:52px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px rgba(18,74,46,0.35);flex:0 0 auto;padding:4px;border:2px solid var(--gold);}
  .login-brand-name{font-weight:800;font-size:1.0625rem;color:var(--primary-dark);letter-spacing:-0.01em;}
  .login-brand-sub{font-size:0.6875rem;color:var(--gold-dark);text-transform:uppercase;letter-spacing:0.04em;margin-top:1px;font-weight:700;}
  .login-card h1{font-size:1.4375rem;margin:4px 0 2px;letter-spacing:-0.01em;}
  .login-card p.sub{color:var(--ink-soft);font-size:0.8125rem;margin:0 0 20px;}

  /* ---------- Post-login sequence: loading -> welcome ---------- */
  .welcome-screen{text-align:center;color:#fff;max-width:320px;}
  .welcome-logo{width:76px;height:76px;border-radius:20px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 12px 28px -8px rgba(0,0,0,0.5);border:2px solid var(--gold);}
  .welcome-brand{font-size:1.625rem;font-weight:800;letter-spacing:-0.01em;margin:6px 0 22px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.25);}
  .postlogin-spinner{
    width:46px;height:46px;border-radius:50%;margin:0 auto;
    border:4px solid rgba(255,255,255,0.22);border-top-color:var(--gold);
    animation:postloginSpin 0.85s linear infinite;
  }
  .postlogin-spinner.spinner-alert{border-top-color:var(--danger);}
  @keyframes postloginSpin{ to{ transform:rotate(360deg); } }
  .loading-msg-fade{animation:loadingMsgFade .35s ease;}
  @keyframes loadingMsgFade{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  /* ---------- Skeleton loading (initial load only — the app loads all
     data upfront, then renders every other view instantly from memory,
     so this is the one place a shimmer placeholder actually adds value) ---------- */
  .skel-block{
    background:linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 37%, rgba(255,255,255,0.06) 63%);
    background-size:400% 100%; animation:skelShimmer 1.4s ease infinite; border-radius:10px;
  }
  @keyframes skelShimmer{ 0%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  .skel-nav{display:flex;gap:8px;justify-content:center;margin:26px 0 18px;}
  .skel-nav .skel-block{width:42px;height:42px;border-radius:50%;}
  .skel-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:280px;margin:0 auto;}
  .skel-cards .skel-block{height:64px;}
  .welcome-fade{opacity:0;animation:welcomeFadeIn .6s ease forwards;}
  .welcome-fade.d1{animation-delay:.05s;font-size:1rem;font-weight:600;}
  .welcome-fade.d2{animation-delay:.22s;}
  .welcome-fade.d3{animation-delay:.4s;}
  .welcome-fade.d4{animation-delay:.58s;}
  @keyframes welcomeFadeIn{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.75rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;
    font-size:1.03125rem;font-family:var(--font-body);background:#FBFBFD;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
  /* Custom in-app dropdown: replaces the native browser <select> popup with
     an inline-expanding list styled like the rest of the app, instead of
     the OS's own disconnected-looking dropdown UI. */
  .idd-wrap{width:100%;}
  .idd-trigger{
    width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;
    font-size:1.03125rem;font-family:var(--font-body);background:#FBFBFD;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:var(--ink);
  }
  .idd-trigger.idd-placeholder{color:var(--ink-soft);}
  .idd-trigger.idd-open{border-color:var(--primary);background:#fff;border-radius:11px 11px 0 0;}
  .idd-trigger .idd-chevron{flex:0 0 auto;transition:transform .15s ease;color:var(--ink-soft);}
  .idd-trigger.idd-open .idd-chevron{transform:rotate(180deg);}
  .idd-list{
    display:none;border:1.5px solid var(--primary);border-top:none;border-radius:0 0 11px 11px;
    max-height:240px;overflow-y:auto;background:#fff;box-shadow:0 8px 18px -8px rgba(10,16,32,0.18);
  }
  .idd-list.idd-list-open{display:block;}
  .idd-item{padding:11px 13px;font-size:0.9375rem;cursor:pointer;border-top:1px solid var(--border);}
  .idd-item:first-child{border-top:none;}
  .idd-item:active{background:var(--bg);}
  .idd-item.idd-selected{background:var(--success-bg);font-weight:700;color:var(--primary-dark);}
  .idd-item.idd-disabled{color:var(--ink-soft);pointer-events:none;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;padding:13px 16px;font-size:0.9375rem;font-weight:700;
    cursor:pointer;font-family:var(--font-body);letter-spacing:0.01em;transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
    min-height:44px;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:linear-gradient(135deg, var(--primary), var(--primary-dark));color:#fff;width:100%;box-shadow:0 4px 12px -4px rgba(18,74,46,0.45);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--ink);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-success{background:var(--success-bg);color:var(--success);}
  .btn-sm{padding:8px 12px;font-size:0.78125rem;border-radius:9px;width:auto;min-height:36px;}
  .err{background:var(--danger-bg);color:var(--danger);padding:9px 12px;border-radius:9px;font-size:0.8125rem;margin-bottom:14px;}
  .login-hint{margin-top:16px;font-size:0.71875rem;color:var(--ink-soft);text-align:center;line-height:1.5;}

  /* ---------- App bar ---------- */
  .topbar{
    background:linear-gradient(115deg, #4C9A6E 0%, var(--primary) 45%, var(--primary-dark) 100%);
    color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex:0 0 auto;overflow:visible;box-shadow:0 2px 10px -4px rgba(18,74,46,0.4);position:relative;z-index:20;
  }
  /* Only add the notch/status-bar safe-area padding when running installed
     as a standalone app (no browser chrome) — in a normal browser tab the
     browser's own address bar already occupies that space, so adding this
     too was creating a visibly oversized gap above the header on phones. */
  @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui){
    .topbar{ padding-top:calc(12px + var(--sat)); }
  }
  .topbar-left{display:flex;align-items:center;gap:9px;min-width:0;overflow:visible;}
  .topbar-left .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .topbar-left .titles{min-width:0;}
  .topbar-left b{letter-spacing:0.01em;font-size:1.0625rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-left .screen-label{font-size:0.75rem;opacity:0.8;text-transform:uppercase;letter-spacing:0.04em;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#7CDDB0;display:inline-block;margin-right:5px;}
  .sync-dot.syncing{background:var(--accent);animation:syncPulse 0.9s ease-in-out infinite;}
  .sync-dot.pending{background:#FF8A73;animation:syncPulse 1.4s ease-in-out infinite;}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;overflow:visible;}
  .role-pill{
    font-size:0.71875rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    padding:3px 8px;border-radius:20px;display:inline-block;
  }
  .bell, .avatar-btn{
    position:relative;background:rgba(255,255,255,0.16);border:1.5px solid rgba(201,162,39,0.6);color:#fff;
    width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;font-weight:800;
    padding:0;flex:0 0 auto;transition:background .15s ease;
  }
  .bell:active, .avatar-btn:active{background:rgba(255,255,255,0.28);}
  .avatar-btn{overflow:hidden;}
  .bell .badge{
    position:absolute;top:-3px;right:-3px;background:var(--accent);color:var(--accent-ink);
    font-size:0.625rem;font-weight:800;border-radius:20px;padding:1.5px 5.5px;min-width:16px;text-align:center;
    z-index:30;box-shadow:0 0 0 2px var(--primary-dark);line-height:1.5;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  .bell .badge-pulse-new{animation:bellBadgePulse .4s cubic-bezier(.3,1.5,.5,1);}
  @keyframes bellBadgePulse{0%{transform:scale(0);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
  /* Red notification-dot badge — for use on any tile/icon (not just the
     bell), clearly distinct from the general gray/status .badge class. */
  .notif-dot{
    position:absolute;top:-3px;right:-3px;background:#D8483B!important;color:#fff!important;
    font-size:0.625rem;font-weight:800;border-radius:20px;padding:1.5px 5.5px;min-width:16px;text-align:center;
    z-index:30;box-shadow:0 0 0 2px #fff;line-height:1.5;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  /* BUGFIX (2026-08-21): was ".notif-dot.pulse" -- but a totally unrelated
     ".pulse" class (the mono-font ticker bar below) also matches any
     element carrying class="pulse", and since it's declared LATER with
     the same specificity it silently won the cascade, inflating every
     notification badge in the app (padding:7px 16px + display:flex
     instead of the tiny padding:1.5px 5.5px it was supposed to have).
     Renamed to ".notif-pulse" so it can never collide with ".pulse"
     again -- see the class="notif-dot pulse" -> "notif-dot notif-pulse"
     updates at every badge call site below. */
  .notif-dot.notif-pulse{animation:bellBadgePulse .4s cubic-bezier(.3,1.5,.5,1);}
  .bell-sm{width:30px;height:30px;font-size:0.8125rem;}
  .bell-urgent{border-color:rgba(255,255,255,0.5);}
  .bell-urgent .badge{background:var(--danger);color:#fff;}

  .pulse{
    background:var(--ink);color:#D8DEEC;font-family:var(--font-mono);font-size:0.6875rem;
    padding:7px 16px;display:flex;gap:16px;overflow-x:auto;white-space:nowrap;flex:0 0 auto;
  }
  .pulse b{color:var(--accent);}
  .pulse b.warn{color:#FF8A73;}

  .content{flex:1;padding:14px 14px calc(18px + var(--navbar-h) + var(--sab));width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
  .card, .order-tile, .alert-tile, .stat{transition:box-shadow .15s ease, transform .1s ease;}

  .card{background:var(--tile-highlight), var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--tile-shadow);}
  .card h2{font-size:1rem;margin:0 0 4px;letter-spacing:-0.01em;color:var(--ink);}
  .card .desc{font-size:0.8125rem;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;}

  .grid-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
  .stat{background:var(--tile-highlight), var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px 14px;box-shadow:var(--tile-shadow);}
  .stat .n{font-family:var(--font-mono);font-size:1.4375rem;font-weight:800;color:var(--primary-dark);}
  .stat .l{font-size:0.6875rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:3px;line-height:1.3;}

  /* Tables: no forced min-width -> no right-swipe needed. Everything fits the screen. */
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:0.84375rem;}
  th{text-align:left;font-size:0.71875rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:7px 4px;border-bottom:1.5px solid var(--border);word-break:break-word;}
  td{padding:10px 4px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word;overflow-wrap:anywhere;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono);font-size:0.75rem;color:var(--ink-soft);}
  .stockneg{color:var(--danger)!important;font-weight:800;}
  .stocklow{color:#C9720E!important;font-weight:800;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px;}

  /* ---------- Search bar ---------- */
  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap input{width:100%;padding:11px 12px 11px 34px;border:1.5px solid var(--border);border-radius:12px;font-size:0.90625rem;background:var(--bg);font-family:var(--font-body);}
  .search-wrap input:focus{outline:none;border-color:var(--primary);background:#fff;}
  .search-wrap::before{content:"🔎";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:0.75rem;opacity:0.55;}

  /* ---------- Order tiles ---------- */
  .order-tile{background:var(--tile-highlight), var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--tile-shadow);}
  .order-tile.tile-ready{background:var(--tile-highlight), #E6F5EE;border-color:#B8E3CC;}
  .order-tile.tile-processing{background:var(--tile-highlight), #FEF6DC;border-color:#F0DDA0;}
  .order-tile.tile-packed{background:var(--tile-highlight), #F1EBFB;border-color:#D7C7F2;}
  .order-tile .ot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .order-tile .ot-name{font-weight:800;font-size:0.9375rem;}
  .order-tile .ot-items{font-size:0.8125rem;color:var(--ink-soft);line-height:1.65;margin-bottom:8px;}
  .order-tile .ot-meta{font-size:0.6875rem;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;}
  /* Round 15 tap-feedback audit (2026-09-...): the only two places an
     .order-tile itself (not just a button inside it) is directly clickable
     -- the Team-select tiles (data-select-team) and Notification-kind tiles
     (data-select-notif-kind) -- had cursor:pointer but no press feedback at
     all. Scoped (not a blanket .order-tile:active) so a plain, non-clickable
     order tile in a list never shrinks on an incidental touch, which would
     falsely suggest it's tappable. */
  .order-tile[data-select-team]:active, .order-tile[data-select-notif-kind]:active{transform:scale(0.98);}

  .stat{cursor:pointer;}
  .stat:active{transform:scale(0.96);}

  /* ---------- Alert tiles ---------- */
  .alert-tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .alert-tile-grid.stacked{grid-template-columns:1fr;}
  .alert-tile{border-radius:17px;padding:11px 12px;border:1.5px solid #E8938B;background:var(--tile-highlight), #FCE2DF;box-shadow:var(--tile-shadow);}
  .alert-tile.mild{border-color:#E8B84B;background:var(--tile-highlight), #FCEBC3;}
  .alert-tile.recommended{border-color:#8FB4E8;background:var(--tile-highlight), #E4EEFB;}
  .alert-tile .at-label{font-weight:800;font-size:0.8125rem;margin-bottom:2px;color:var(--ink);}
  .alert-tile .at-detail{font-size:0.71875rem;color:var(--ink-soft);margin-bottom:8px;}

  /* Round 15 follow-up (2026-09-...): "stock wale me low ka bada tile
     usme har item ke chote chote tiles, aese hi short ka bada tile uske
     andr chote chote har item ke tiles" -- alertBanner()'s new nested-tile
     output (see that function's own comment). .alert-banner-tile is the
     BIG outer group tile (same tile-card language as .alert-tile: rounded,
     box-shadow:var(--tile-shadow), tinted background) and .alert-item-tile
     is the SMALL inner tile per item, sitting inside it on a lighter
     translucent card so it reads as nested, not just another row. */
  .alert-banner-tile{border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--tile-shadow);border:1.5px solid #E8938B;background:var(--tile-highlight), #FCE2DF;}

  .alert-banner-tile .abt-head{font-weight:800;font-size:0.84375rem;margin-bottom:10px;}
  .alert-banner-items{display:grid;grid-template-columns:1fr;gap:8px;}
  .alert-item-tile{background:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.85);border-radius:13px;padding:9px 11px;box-shadow:0 1px 2px rgba(14,36,71,0.06);}
  .alert-item-tile .ait-label{font-weight:800;font-size:0.84375rem;margin-bottom:2px;color:var(--ink);}
  .alert-item-tile .ait-detail{font-size:0.75rem;}
  .alert-item-tile .ait-team{font-size:0.6875rem;opacity:0.75;margin-top:2px;}


  .badge{display:inline-block;font-size:0.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;padding:3px 8px;border-radius:20px;transition:background-color .3s ease, color .3s ease;}
  .badge-pending{background:var(--warning-bg);color:var(--warning);}
  .badge-processing{background:var(--info-bg);color:var(--info);}
  .badge-ready{background:rgba(242,169,59,0.18);color:var(--accent-ink);}
  .badge-packed{background:#EBE1FA;color:#5B3A9E;}
  .badge-processed{background:var(--success-bg);color:var(--success);}
  .badge-approved{background:var(--success-bg);color:var(--success);}
  .badge-rejected{background:var(--danger-bg);color:var(--danger);}

  .badge-opening{background:#FFF1C2;color:#8A6100;}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .alert-banner{background:var(--danger-bg);border:1px solid #F3C9C4;color:var(--danger);padding:11px 13px;border-radius:11px;margin-bottom:12px;font-size:0.75rem;line-height:1.65;}
  .alert-banner b{display:block;margin-bottom:4px;font-size:0.78125rem;}
  .alert-banner.warn-mild{background:#FEF6E6;border-color:#F3DFA6;color:#9A6B0B;}

  /* ---------- Bottom nav ---------- */
  .navbar{
    position:absolute;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(100deg, #0E1F14, var(--primary-dark));
    border-top:1px solid rgba(201,162,39,0.25);

  @keyframes contentFadeIn{from{opacity:0.4;}to{opacity:1;}}

  /* ---------- Employee ID Card (profile panel) ---------- */
  .id-card{
    background:linear-gradient(165deg, #0E1F14 0%, var(--primary-dark) 55%, var(--primary) 100%);
    border-radius:18px;overflow:hidden;color:#fff;
    box-shadow:0 12px 30px -12px rgba(14,31,20,0.5);border:1px solid rgba(201,162,39,0.35);
  }

  .id-card-title{font-size:0.6875rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.12em;font-weight:700;margin-top:2px;}

  .id-card-label{color:rgba(255,255,255,0.6);flex:0 0 auto;}

  /* ---------- Bottom sheet (modals + more menu + notifications) ---------- */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(10,16,32,0.5);display:flex;align-items:flex-end;justify-content:center;
    z-index:100;animation:overlayFadeIn .15s ease;
  }
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  .app-toast{animation:toastSlideUp .25s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes toastSlideUp{from{transform:translateX(-50%) translateY(10px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
  .app-alert-overlay{
    position:absolute;inset:0;background:rgba(10,16,32,0.6);display:flex;align-items:center;justify-content:center;
    z-index:500;padding:20px;
  }
  .app-alert-box{
    background:#fff;border-radius:16px;padding:22px 20px;max-width:320px;width:100%;text-align:center;
    border:2px solid var(--danger);box-shadow:0 20px 50px -12px rgba(216,72,59,0.4);
    animation:appAlertPop .18s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes appAlertPop{ from{transform:scale(0.9);opacity:0;} to{transform:scale(1);opacity:1;} }
  /* Round 15 follow-up (2026-09-...): green success dialog for a genuine
     new Daily Work entry save (see showSuccessDialog()/celebrateEntrySaved()).
     pointer-events:none on the overlay -- unlike showAlert's app-alert-
     overlay, this needs no acknowledgement and must never block a tap on
     whatever's underneath while it's auto-dismissing. */
  .success-dialog-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:550;padding:20px;pointer-events:none;}
  .success-dialog-box{
    background:linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);color:#fff;
    border-radius:18px;padding:24px 28px;max-width:280px;width:100%;text-align:center;
    box-shadow:0 20px 50px -12px rgba(18,74,46,0.5);animation:successDialogPop .3s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes successDialogPop{from{transform:scale(0.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .success-dialog-check{font-size:2.125rem;margin-bottom:8px;animation:successPop .35s cubic-bezier(.3,1.5,.5,1) .05s backwards;}
  .success-dialog-msg{font-size:0.90625rem;font-weight:800;}
  .app-alert-icon{font-size:2rem;margin-bottom:10px;}
  .app-alert-message{font-size:0.875rem;color:var(--ink);line-height:1.5;margin-bottom:18px;white-space:pre-line;}
  .app-alert-ok-btn{
    background:var(--danger);color:#fff;border:none;border-radius:11px;padding:11px 32px;
    font-weight:800;font-size:0.875rem;cursor:pointer;width:100%;
  }
  .app-alert-ok-btn:active{transform:scale(0.96);}
  .modal{
    background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + var(--sab));
    max-width:100%;width:100%;max-height:86%;overflow:auto;
    animation:sheetUp .26s cubic-bezier(.34,1.4,.4,1);
  }
  @keyframes sheetUp{from{transform:translateY(28px) scale(0.98);opacity:0.5;}to{transform:translateY(0) scale(1);opacity:1;}}
  /* Closing (2026-08-28): a matching exit instead of the dialog just
     vanishing -- see closeModal()'s non-instant path. */
  .modal-overlay.closing{animation:overlayFadeOut .18s ease forwards;}
  @keyframes overlayFadeOut{from{opacity:1;}to{opacity:0;}}
  .modal-overlay.closing .modal{animation:sheetDown .18s cubic-bezier(.4,0,1,1) forwards;}
  @keyframes sheetDown{from{transform:translateY(0) scale(1);opacity:1;}to{transform:translateY(16px) scale(0.97);opacity:0;}}
  /* Round 15 follow-up (2026-09-...): "koi bhi entry hum daale to Us page
     ko ik paper airplane ki trah bana do or fly krwa do, uske baad green
     color ka dialoge ajaye" -- closeModal('flyaway') (used ONLY by
     celebrateEntrySaved(), for the 5 genuine new-Daily-Work-entry saves --
     see that function's own comment) plays this instead of the normal
     sheetDown shrink. .flyaway overrides .closing's own default rule
     above via source order + equal specificity (both are two classes on
     the same element -- CSS resolves a tie by whichever rule comes LAST in
     the stylesheet, so this must stay after the plain .closing rule).
     The modal card itself tumbles/shrinks/fades up and to the right; a
     decorative ✈️ (appended by closeModal(), see .paper-plane-fx below)
     flies the same general direction on its own layer so the effect reads
     unambiguously as "paper airplane", not just "the box shrank". */
  .modal-overlay.closing.flyaway .modal{animation:paperPlaneFly .5s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes paperPlaneFly{
    0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}
    35%{transform:translate(8%,-5%) rotate(-7deg) scale(0.9);opacity:1;}
    100%{transform:translate(120%,-85%) rotate(26deg) scale(0.22);opacity:0;}
  }
  .paper-plane-fx{
    position:absolute;left:50%;top:40%;font-size:2.125rem;z-index:600;pointer-events:none;
    animation:paperPlaneFly2 .55s cubic-bezier(.4,0,.2,1) forwards;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  }
  @keyframes paperPlaneFly2{
    0%{transform:translate(-50%,-50%) rotate(-15deg) scale(0.6);opacity:0;}
    15%{opacity:1;transform:translate(-50%,-50%) rotate(-15deg) scale(1);}
    100%{transform:translate(210%,-250%) rotate(18deg) scale(1.1);opacity:0;}
  }
  .success-pop{display:inline-block;animation:successPop .3s cubic-bezier(.3,1.5,.5,1);}
  @keyframes successPop{0%{transform:scale(0.4);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--border);margin:4px auto 14px;}
  .modal h3{margin:0 0 14px;font-size:1rem;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}

  /* ---------- Round 15 (2026-09-...): "Suggest More & More Animations, i
     want to make this so beautiful" -- explicit user choice was "Subtle &
     professional" (tap feedback everywhere + list stagger-in + number
     count-up + status color-morph, fast even on old tablets) applied to the
     whole app in one pass, NOT "Rich & lively" (tab-slide, ripple, bell
     shake, checkmark burst, idle bobbing -- deliberately left out unless
     asked for later). Tap-feedback gaps (.order-tile[data-select-team/
     data-select-notif-kind], .more-item) were closed inline, next to each
     class's own rules above/below. The two pieces below are new:
     1) List stagger-in -- pure CSS, targets the tile GRIDS directly
        (.order-tile-grid, .alert-tile-grid, .stat-grid-v2, .more-grid) so
        no render function needed to change at all; each tile fades+slides
        up with a short per-item delay staircase, capped at 8 items so a
        long order list doesn't take forever to finish appearing.
     2) Status flash -- .badge.status-flash gets a brief currentColor glow
        pulse. This is a GLOW, not a literal old-color-to-new-color morph,
        because render() fully replaces the DOM (root.innerHTML = newHtml)
        on every change -- there is no persisting "old" badge element left
        to smoothly recolor across, only a freshly-created one. The .badge
        rule already had transition:background-color/color from a prior
        round for the (rare) case something mutates a live badge node
        in-place; this animation is the entrance-side complement for the
        far more common full-rebuild case. flashChangedBadges() (see JS,
        just above render()) adds the class only when an order's status
        actually differs from what it was at that same order's last render
        -- never on first sight, never when nothing changed. Number count-up
        is JS (animateStatNumbers(), same file, same reasoning: values are
        cached by a stable per-tile key and only animated when they actually
        changed since last render).
     Every piece here uses only transform/opacity/box-shadow (GPU-cheap, no
     layout thrash) and stays under 650ms end-to-end, and the whole set is
     disabled under prefers-reduced-motion. */
  @media (prefers-reduced-motion: reduce){
    .order-tile-grid .order-tile, .alert-tile-grid .alert-tile, .stat-grid-v2 .stat-card-v2, .more-grid .more-item, .alert-banner-items .alert-item-tile{animation:none!important;}
    .badge.status-flash{animation:none!important;}
  }
  @keyframes staggerIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .order-tile-grid .order-tile, .alert-tile-grid .alert-tile, .stat-grid-v2 .stat-card-v2, .more-grid .more-item, .alert-banner-items .alert-item-tile{

const APP_BUILD = "2026-09-09-firestore-preview44"; // BUGFIX (2026-09-09, live report -- "login k time kayi bar Blink ho rhi h login screen"): root-caused via direct code inspection of render()/startPostLoginSequence/startWrongLoginSequence, not guesswork. EVERY login attempt -- successful or failed -- runs a 3-step message sequence ("Loading Orders…" -> "Loading Stock…" -> "Updating other features…" on success, over ~2.25s; or the wrong-password sequence over ~4s), and each step called the generic render(), which unconditionally does `root.innerHTML = renderPostLoginSequence()` for the whole not-logged-in branch -- unlike the logged-in branch just below it, which explicitly skips re-rendering when nothing changed (a fix from an earlier, near-identical bug -- see that branch's own "byte-for-byte identical" comment). Tearing down and rebuilding the whole screen 3 times per login didn't just update the message text: the spinner is a brand-new DOM node each time, so its CSS rotation animation restarted from 0deg (a visible jump) every ~750ms-1330ms, and the message text's own entrance fade replayed on the freshly-created element too -- multiple visible flashes on literally every single login, exactly the reported "blink kayi bar." FIX: new updatePostLoginSequenceText() updates the message text and the spinner's alert-color class IN PLACE via direct DOM manipulation (textContent + classList) instead of replacing any DOM, for every step after the first -- the spinner now spins continuously with zero jump, and only the small text element replays its own (much smaller, non-jarring) fade. The very FIRST render() into a phase, and the FINAL transition out of one (to the welcome screen, or back to the login form with an error), are genuine screen changes and still go through a full render() -- only the repeated same-screen ticks in between were ever the problem, so the intended step-by-step "Loading Orders… / Loading Stock… / …" messaging still visibly progresses, just without the flash. Verification: new functional test (a mocked minimal DOM confirms the text/class actually update in place, and that the function correctly reports it can't apply -- returns false, not a throw -- when the expected structure isn't on screen, so its two call sites correctly fall back to a full render() instead of silently updating nothing) plus static checks that both tick() loops call the new lightweight path instead of render() unconditionally. Full 36-file suite green, syntax check green. This is a pure client-side animation/rendering fix -- touches no data, no auth logic, no Firestore reads/writes; every login-outcome bug fixed in preview42/43 (edit-crash, admin self-delete, the no_profile diagnostic) is untouched by this build. Previous build (preview43): // EMERGENCY BUGFIX (2026-09-09, follow-up live report -- "still not able to login with reseted/new passwords (all Users)"): root-caused via a DIRECT test against Firebase Auth's own REST API (bypassing this app, Cloud Functions, and even the Admin SDK entirely) -- confirmed a fresh username+password from reset_all_passwords.js genuinely authenticates successfully against Firebase Auth. So the app's own "Invalid Login ID & Password" message was categorically WRONG for this case. Root cause: fsLogin() -- AFTER a successful Firebase Auth sign-in -- reads users/{uid} from Firestore to build the app's own user object, and if THAT doc doesn't exist, it used to return the exact same 'invalid_credentials' error as a genuinely wrong password, making "your password is correct but your Firestore profile is missing" completely indistinguishable on screen from "you mistyped your password" -- someone with a 100% correct password had no way to know retyping it could never help, since only an admin can actually fix a missing profile. This exact orphaned-account shape (a real, working Auth login with no matching Firestore doc) is a live, current possibility this session specifically because of reset_all_passwords.js s deliberately NOT done for this sample, flagged to the user as a separate scope decision. Verified with a real Playwright browser session against the actual unmodified file (English baseline -> Hindi via state -> Hindi Orders tab -> Hindi Profile panel -> Urdu via a real button CLICK -> Urdu Orders tab -> language persists across a real page reload), zero page errors, plus a new static+functional regression block (t/tabLabel/stageLabel/setAppLanguage/renderLanguageSwitcher/the [data-set-lang] click wiring). A code-review pass caught two bugs before they ever shipped: several TAB_LABEL[...] call sites use `t` as a `.map(t=>...)` loop variable, which would shadow the new global t() function and throw -- fixed by always calling the separately-defined tabLabel(key)/stageLabel(status) wrappers in any scope where t is shadowed (plus renaming 2 loop variables t->x for clarity); and an HTML-entity key mismatch (t('Processed &amp; Dispatched') doesn't match the dictionary's plain-ampersand key, would have double-escaped to "&amp;amp;") -- fixed to the plain-ampersand key with esc() removed at that one site (safe, translated/fallback text has nothing needing escaping). Full 36-file test suite green. BUGFIX (2026-09-02), live user report: "order tiles me live update nhi ho rha, agla step click krne pr foran wha se hat jana chahiye lekin us tile ko close kro phir hat jata hai" -- clicking Mark Ready / Undo Ready / Mark Ready to Dispatch / Undo Ready to Dispatch on an order tile shown INSIDE one of the stat-count popups (the "Processing: N" / "Under Packing: N" / "Ready to Dispatch: N" / "Processed: N" buttons on the Orders tab and Home) correctly advanced the order (the real Orders tab tile behind the popup was already right) but the tile stayed visibly stuck in that popup's own list until the popup was manually closed. Root cause: showModal()'s .modal-overlay is deliberately rendered as a DOM SIBLING of #root (so render()'s innerHTML rebuild never disturbs an open modal mid-animation -- see showModal's own comment) -- which also means render() can never reach into an open modal to refresh its snapshotted content. The sibling Accept/Reject/Delete buttons on the same tile already handled this correctly (bindOrderRowActions's `if(closeAfter) closeModal();`), but that fix was never carried over to markOrderReadyNow/undoMarkOrderReady/markOrderPacked/undoMarkOrderPacked. Fixed by giving all 4 an optional onDone callback (invoked right after their own existing render()) and wiring bindOrderRowActions to pass closeModal through as that callback whenever the button was rendered inside a stat-count modal (closeAfter true) -- the plain Orders tab (not a modal) is unaffected, still passes null. Covered by a new regression block in test_order_ops_firestore_client.js (static checks on all 4 functions + bindOrderRowActions' wiring, plus a functional vm-executed test of the real markOrderPacked/undoMarkOrderPacked confirming onDone actually fires, exactly once, only when passed) -- full suite green. CRASH/REGRESSION/STRESS SWEEP (2026-09-02), user request: "ab zra Iska End to end Regression, Stress and Site Crash Ki Full testing krdo. only order form and order ops ki. koi Bug aye to hand to hand fix kr dena." -- full offline-mocked Playwright regression+stress+crash pass, scoped to order-ops-firestore.html and order-form-firestore.html only, every bug found fixed immediately in the same pass. ORDER-OPS (5 fixes): (1) doLogout() left a stale .modal-overlay/#appAlertOverlay sibling node behind on a shared-tablet logout (they're deliberately rendered as DOM siblings of #root, not inside it, so render()'s innerHTML rebuild never touches them mid-animation -- but that also means a LOGOUT never cleared them) plus never reset the phone-back-button dummy-history bookkeeping (__backDepth/__suppressNextPopstate), both now explicitly cleared before the post-logout render(). (2) bindTasks()'s data-mark-filling/data-mark-packaging click handlers threw if the referenced order had been deleted (e.g. by another device) between render and tap -- both now null-guard and bail out silently. (3) safeSet() for notificationPrefs/attendanceSettings could fail writing to Firestore while the UI had already optimistically updated + shown a success toast, silently diverging local state from what's actually saved -- both call sites (saveNotifKindBtn, confirmTwBtn) now await the write, catch a failure, roll the in-memory value back to its previous value, and skip the success toast/close. (4)+(5) PERFORMANCE, found only via interactive stress-testing on a synthetic 4,000-order dataset (Orders tab render time: 1.2-4.5s vs <20ms for every other tab at the same volume) -- renderOrderTile() was calling computeFifoShortages() (an O(all-orders) full order-book walk) once PER TILE instead of once per render (computeFifoShortages already carries a comment about staying "linear instead of quadratic" for autoAdvanceOrders, a fix that was never carried over to renderOrderTile) -- fixed by hoisting the computation into both callers (renderOrdersSegregated/renderOrderTilesGrouped) and passing it through as a parameter; liveCustomerFor() did a plain S.customers.find() linear scan on every call (up to 2x per tile, 8 call sites file-wide) -- fixed with a self-invalidating Map cache keyed on S.customers reference identity (safe: verified via grep that every real update path reassigns S.customers wholesale, never mutates it in place). Both confirmed via before/after instrumented call-counting (fifoShortages calls: ~2668-3333 down to 1 per render; liveCustomerFor's underlying scan: 5336 linear scans down to 1 index build per render). ORDER-FORM: see that file's own header comment for its 7 fixes from this same sweep. Full regression test suite (34 files) green. ARCHITECTURAL FINDING, not fixed this round (flagged for the user, needs an explicit UX-scope decision, not a "hand to hand" bug fix): even after both perf fixes, a single Orders-tab render against 4,000 ere else in the file, and re-verified interactively with a real Playwright harness: captured the modal's live computed transform/opacity/animationName at 0/50/120/200/260/320/340/400/500/700/1000ms after a real tap -- confirms the transform settles to identity by ~260-320ms and animationName stays 'none' with no restart all the way through 1000ms (previously it would have jumped back to the 0% keyframe state right around 320ms); also re-verified the paper-airplane flyaway close still plays correctly (overlay+plane present through ~550ms, gone by ~700ms, matching the 520ms removal timer) on a FLIP-opened modal, confirming closeModal()'s matching fix works. (2) "home ke alawa hum agar kahi b hn (jese orders ya stock) waha back dabane par app bnd ho rhi hai. me chahta hu Home page par aayen. app close jb hi ho jb home pr hon or back press kren" -- from any non-Home tab (Orders, Stock, etc.), the phone/gesture back button used to close/background the whole app instead of navigating anywhere, because computeWantedBackDepth() only ever accounted for whether a modal/side-sheet/alert was open, never for which tab was active -- so switching tabs never pushed a dummy history entry, leaving nothing of the app's own for a back press to intercept once nothing else was open. Fixed by adding a 4th factor (S.currentUser && S.view!=='home') to computeWantedBackDepth()'s summed depth, and a new terminal else-if branch in the popstate handler (after the existing alert/modal/side-sheet branches) that switches S.view to 'home' and re-renders when nothing else of ours was open but the view isn't home already -- so the app now only ever actually closes/exits on a real back press taken while already on Home with nothing else open. No new syncBackStack() call sites were needed: render() already calls it unconditionally at its own tail, and every tab switch already goes through render(). Verified with new functional tests exercising the real extracted computeWantedBackDepth() against a mocked S/document across every S.view/S.currentUser combination, plus static checks confirming the popstate handler's new branch is correctly ordered as the last resort and gated identically to computeWantedBackDepth(). Both fixes covered by an expanded test_order_ops_firestore_client.js (the now-stale rotateX-presence assertion from preview27 was replaced with regression guards for the actual bug: no perspective()/rotateX() in code, the FLIP-open cleanup never resets style.animation to '', and closeModal() explicitly clears it before adding .closing) -- full suite green. ROUND 15 FOLLOW-UP (2026-09-02), 4 explicit user requests built together after a plan was shared and confirmed ("ok krdo"): (1) "Jis tile pr bhi hum click kre, vo wala tile flip ho kr bada ho jaye or window khol de jo khulna hai" -- a genuine container-transform ("FLIP") open: the pointerdown listener now also records the tapped TILE's real on-screen rect (not just the tap point) whenever the tap lands on .order-tile/.stat-card-v2/.alert-tile/.qa-tile/.more-item/.overview-col (__lastTapRect). showModal() -- the single choke point ~50+ call sites already share -- uses that rect (when fresh, same 800ms freshness window as the existing tap-origin ox/oy) to open the modal GROWING OUT of that exact tile instead of sliding up from the bottom: suppresses the default sheetUp keyframe, measures the modal's true resting rect, then animates translate+scale+a slight rotateX tilt (the "flip" feel) from the tile's rect to identity via a real CSS transition, cleaning up all the inline styles on transitionend. Falls back to the existing sheetUp slide-up when there's no fresh tile rect (a modal opened by code, not a tap). (2) "quick access wli chize hain unpr click kre to wahi se ik window shoot honi chahiye or khulni chahiye (agar quick action ke kisi page par hum hain or back dabate hn to wapas homepage par ana chahiye)" -- the "shoot open" half is already covered by (1), since .qa-tile is in the tile-selector list and every quick action opens a modal via showModal(). The back-to-Home half: bindQuickActionIcons sets a new __modalOpenedViaQuickAction flag right before opening a quick action's modal; showModal() stamps that onto the new overlay's dataset (inherited across a same-instant showModal() REPLACE within the same flow, e.g. Messages' thread-list-to-thread navigation, and reset after being consumed so a later unrelated modal never inherits a stale flag); the phone-back popstate handler reads that stamp and, once the modal finishes its normal close, switches S.view to 'home' -- regardless of which tab the quick action was opened from (Quick Actions appear on both Home and the Tasks tab). (3) "koi bhi entry hum daale to Us page ko ik paper airplane ki trah bana do or fly krwa do, uske baad green color ka dialoge ajaye (ye entry successfully save ho chuki hai)" -- new closeModal('flyaway') mode plays a paperPlaneFly exit (the modal card tumbles/shrinks/fades up-and-right) plus a decorative ✈️ element flying the same trajectory on its own layer, instead of the default shrink-down; a new celebrateEntrySaved(msg) helper pairs that with a new centered green success dialog (showSuccessDialog(), auto-dismissing after ~1.7s, distinct from the plain dark showToast() pill) timed to appear just as the plane finishes flying off. Scoped to exactly the 5 places that call it -- Purchase/Filling/Packaging/new-Expense-or-Settlement/new-Retail-Sale-or-Sample, i.e. the same flows already gated by blockIfOutsideEntryWindow() (Round 14), matching "Daily Work entries" precisely -- every edit/delete/undo/other save in the app is UNCHANGED, still the plain closeModal()+showToast(). (4) "stock wale me low ka bada tile usme har item ke chote chote tiles, aese hi short ka bada tile uske andr chote chote har item ke tiles" -- alertBanner() (used on the Raw/Filled/Ready stock pages and the Home "Alerts for you" card, for every role) rewritten from a plain divider-separated list into nested tiles: one BIG .alert-banner-tile per severity group (red "N item(s) short" / amber "N item(s) running low", matching the app's existing tile-card language -- box-shadow:var(--tile-shadow) etc, same family as .alert-tile) containing a SMALL .alert-item-tile per item, which also picks up the existing Round 15 stagger-in entrance automatically (added to that shared selector list). Verified this whole round with: extended test_order_ops_firestore_client.js (static checks on every CSS/JS piece plus functional tests -- showSuccessDialog's own timer via a mocked render/setTimeout, and alertBanner's real extracted output against a sample mixed short+low list, both counts and content); a real interactive Playwright harness (not just a static style-injected preview like earlier rounds) built from the actual extracted showModal/closeModal/celebrateEntrySaved/showSuccessDialog/alertBanner source plus the real pointerdown listener, clicking a real tile and screenshotting the FLIP-open growing from it, triggering celebrateEntrySaved() and screenshotting the ✈️ mid-flight plus the green dialog, and rendering alertBanner()'s real output to confirm the nested-tile look -- before delivering. ROUND 15 (2026-09-02): "Suggest More & More Animations i want to make this so beautiful" -- two clarifying questions asked and answered before starting: approach = "Subtle & professional" (tap feedback everywhere, list stagger-in, number count-up, status color-morph -- fast even on old tablets -- NOT "Rich & lively": directional tab-slide, ripple, bell shake, checkmark burst, idle empty-state bobbing, none of which were added), scope = "Poore app mein ek saath" (whole app in one pass, not staged by screen). Audited the file's existing animation infra first (loginCardIn/postloginSpin/skelShimmer/welcomeFadeIn/syncPulse/bellBadgePulse/navPop/contentFadeIn/overlayFadeIn+Out/toastSlideUp/appAlertPop/sheetUp+Down/successPop/modalGrowIn+Out, plus existing :active tap-feedback on .btn/.stat/.qa-tile/.navitem/.thread-row/.contact-row) and layered four things on top without touching any of it: (1) tap-feedback gaps closed -- .order-tile[data-select-team]/[data-select-notif-kind] (Team-select and Notification-kind tiles, the only two places a whole order-tile itself is directly clickable) and .more-item (the "More" sheet grid) now scale down on press, matching the existing pattern elsewhere; deliberately scoped rather than a blanket .order-tile:active so a plain non-clickable order tile never shrinks on an incidental touch and falsely implies it's tappable. (2) List stagger-in -- pure CSS, targets .order-tile-grid/.alert-tile-grid/.stat-grid-v2/.more-grid directly so zero render-function changes were needed; each tile fades+slides up with a short nth-child delay staircase capped at 8 items (240ms max) so a long order list finishes appearing quickly. (3) Number count-up -- animateStatNumbers() (new function, just above render()) animates .stat/.stat-card-v2 numbers from their previous value to the new one over 450ms (ease-out cubic) via requestAnimationFrame, but ONLY when the value actually changed since that same tile's last render (cached by a stable data-stat/data-more-tab/label key, not by DOM node, since render() recreates every node) -- a tile seen for the first time (screen just opened) snaps straight to its value, no count-up-from-zero; correctly handles a leading minus sign (e.g. a negative expense balance, "₹-500") so a sign flip between renders doesn't misdraw. (4) Status flash -- flashChangedBadges() (new function, next to animateStatNumbers) adds a brief currentColor glow pulse (.status-flash, 0.6s) to an order's status badge the moment that SAME order's status actually differs from its own last-seen status (order identity via new data-order-id on .order-tile, added to renderOrderTile) -- implemented as a glow/pulse rather than a literal old-color-to-new-color interpolation, since render()'s root.innerHTML=newHtml fully replaces the DOM on every change, so there's no persisting "old" badge node left to smoothly recolor across (the .badge rule's pre-existing background-color/color transition stays in place for the rare case something mutates a live badge in place, unaffected). All four pieces use only transform/opacity/box-shadow (GPU-cheap, no layout thrash), stay under 650ms end-to-end, and are disabled under prefers-reduced-motion via one shared media query. UI FOLLOW-UP (2026-09-02): "Quick Actions ke icon ke sizes Increase kro. inke Tile Size bhi thik kro perfect Square. or perfect fill bhi." -- .qa-tile used to be flex:0 1 auto with a fixed 60-78px min/max-width range, which capped every tile at a small size even when a row (especially the 8-wide desktop row) had plenty of spare width -- and its icon-badge was a fixed 38px/18px-font, looking lost inside the tile. Now .qa-tile is flex:1 1 0 (equal-share growth, min-width:0) with aspect-ratio:1/1, so every tile in a row genuinely fills its equal share of the available width as a true square (capped at 104px so it doesn't grow absurdly huge on a very wide window) instead of leaving unused space as dead gaps; content is centered via flexbox column layout. The icon-badge itself is up from 38px/18px-font to 52px/26px-font, and the tile's own inner layout was simplified (padding/gap tightened) so the bigger icon+label combo actually fills the square instead of floating in a sea of margin. Verified visually with rendered screenshots at both mobile (4+4 split) and desktop (single 8-wide row) widths before delivering. BUGFIX (2026-09-02, live user report): "packing, filling, managers koi bhi message seen nhi kr pa rhe h, not saved likha aa raha h bar bar, na hi msg bhej pa rhe h" -- messaging (Messages / chatMessages) was broken for every NON-ADMIN role. Root cause: markAllAnnouncementsRead (the function actually wired up everywhere -- on open, on tab-switch, on every single live refresh while the default Announcements tab is open) still did a FULL non-merge Firestore .set() of the nset rim along the top (the dome's crest catching light), a stronger inset shadow hugging the bottom-inside edge (where the curve rolls away from the light), plus firmer outer contact + ambient shadows for real lift. Every tile class also got a few more px of border-radius -- rounder corners read as more dome-like than sharp ones. ROUND 14 (2026-09-01), user-dictated backlog implemented together, ALL 6 ITEMS COMPLETE: (1) no duplicate users -- Username is now readonly when editing an EXISTING user (the doc id/Auth uid/custom claim all stay pinned to the original username forever, so allowing it to be edited only broke that person's login while opening a duplicate-username loophole; NEW user creation was already fully protected -- client check + createStaffUser's server-side dupSnap query + Firebase Auth's own uid-uniqueness constraint). (2) Attendance self-marking now only works inside an admin-configurable window (preset 10am-12pm, non-admin only) -- new "⏰ Marking window" button in the Attendance section. (3) Admin's attendance view (renderAttendanceMap) now shows a Time column alongside Location for self-marked entries. (4) BUG FIX: the "Data Log" tab existed in name only since before this rewrite even started (nav label/icon/Permission-Manager toggle all declared it, but neither renderView() nor bindView() had a 'log' case) -- implemented for the first time as a read-only 7-day activity+login audit trail. (5) Every tile/card class (.card/.stat/.order-tile/.alert-tile/.stat-card-v2/.qa-tile) now shares one consistent subtle 3D-look + soft-shadow treatment (--tile-shadow custom property) instead of each carrying its own one-off shadow. (6) FINISHED THIS BUILD: the general Daily Work entry window (preset 10:30am-8pm, admin-editable via "⏰ Entry window" in Daily Work) is now actually enforced -- withinEntryWindow() (already wired into every non-admin new-entry submit: Purchase, Filling, Packaging, Expenses, Retail Sale/Samples -- this scope pre-dates this round and const DEFAULT_CASE_SIZE = {
  '100ml':72, '200ml':48, '440ml':20, '50ml':168, '25ml':216, '3ml':750, '500ml':24, '1l':12,
};
const CASE_SIZE_EXCEPTIONS = [
  { name:'Oliva', size:'200ml', caseSize:25 },
];
// Small-bottle "pkt" packs — every product EXCEPT Olife (both), Zeytin (both) & Olio Classico (both).
const PKT_SIZE_BY_ML = { '3ml':25, '25ml':12, '50ml':12, '100ml':6 };
const PKT_EXCLUDED_NAMES = ['Olife Gold','Olife EV','Zeytin Green','Zeytin EV','Olio Classico Pure','Olio Classico EV'];
function getPktSize(name, size){
  if(PKT_EXCLUDED_NAMES.includes(name)) return null;
  return PKT_SIZE_BY_ML[normSize(size)] || null;
}

function normSize(s){ return String(s).toLowerCase().replace(/\s+/g,''); }
function sizeToMl(s){
  const norm = normSize(s);
  const m = norm.match(/^([\d.]+)(ml|l)$/);
  if(!m) return 0;
  const num = parseFloat(m[1]);
  return m[2]==='l' ? num*1000 : num;
}
function getCaseSize(name, size){
  const norm = normSize(size);
  const ex = CASE_SIZE_EXCEPTIONS.find(e => e.name===name && normSize(e.size)===norm);
  if(ex) return ex.caseSize;
  return DEFAULT_CASE_SIZE[norm] || null;
}
function itemKey(name,size){ return name+'__'+size; }
// One-time cleanup: any catalog item saved before case-size resolution was
// persisted (or added by hand) might still have caseSize:null in the
// backend, forcing order-form.html to independently guess a fallback value.
// Resolving and saving it here keeps the backend the single source of
// truth, so both apps always show the exact same number.
function backfillCatalogCaseSizes(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const needsFix = S.catalogItems.filter(it=>it.caseSize==null);
  if(!needsFix.length) return;
  needsFix.forEach(it=>{ it.caseSize = getCaseSize(it.name, it.size); });
  rebuildCatalogFlat();
  safeSet('app:catalogItems', S.catalogItems);
}
// Transport names typed anywhere get remembered so the dropdown grows on its own.
function rememberTransport(name){
  name = (name||'').trim();
  if(!name) return;
  if(!S.transports.some(t=>t.toLowerCase()===name.toLowerCase())){
    S.transports = [...S.transports, name];
    safeSet('app:transports', S.transports);
  }
}
// Party details are looked up LIVE from the customer record (not a frozen
// snapshot on the order) — editing a customer's city/transport/etc. in Team
// & Customers instantly reflects on every one of their orders, past and
// future, and on the public tracking link too.
// PERF BUGFIX (2026-09-02, crash/stress sweep): this used to be a plain
// S.customers.find(...) -- an O(customers) linear scan -- called from 8
// different places across the file, several of them (renderOrderTile,
// renderOrdersSegregated's row-actions helper, bindTasks' task-tile
// builder) once PER ORDER TILE rendered. With thousands of orders and
// hundreds of customers (a realistic multi-year history for a real
// business), that made rendering the Orders/Tasks tabs measurably slower
// on top of the separate computeFifoShortages() quadratic-render fix right
// above -- every tile re-scanning the entire customer list from scratch.
// Self-caches a customerId->customer Map, rebuilt only when S.customers is
// actually a NEW array reference (every real update path in this file
// reassigns S.customers wholesale -- see applyServerData/deleteCustomer/
// performResetAllDataExceptUsers -- none of them mutate customer objects
// in place while keeping the same array, so reference equality is a
// correct, cheap staleness check) -- turning every call after the first
// one per render pass into an O(1) Map lookup instead of an O(customers)
// scan, with zero change to this function's signature or callers.
let __liveCustomerByIdCache = null;
let __liveCustomerByIdCacheSrc = null;
function liveCustomerFor(order){
  if(!order.customerId) return null;
  if(__liveCustomerByIdCacheSrc !== S.customers){
    __liveCustomerByIdCache = new Map();
    S.customers.forEach(c=>{ if(c && c.id!=null) __liveCustomerByIdCache.set(c.id, c); });
    __liveCustomerByIdCacheSrc = S.customers;
  }
  return __liveCustomerByIdCache.get(order.customerId) || null;
}
// Friendly, human-readable order number for display/receipts only — NOT
// used for access control. The actual tracking link is secured by the
// order's real (unguessable) id; this is just a nicer label to show people.
function generateOrderNumber(ts){
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const yyyy = d.getFullYear();
  const dayKey = localDateKey(ts);
  const countToday = S.orders.filter(o => localDateKey(o.createdAt) === dayKey).length + 1;
  return `${mm}${dd}${yyyy}-${String(countToday).padStart(3,'0')}`;
}
// Public tracking link a party can open (no login) to see their order's
// status — points at track-order.html hosted alongside this app. The day
// key is included so the tracker knows exactly which partition to read.
// order-form.html is hosted on its own subdomain, separate from this app —
// point tracking links there explicitly rather than assuming same-domain.
// order-form.html is hosted on its own subdomain, served at the domain root
// (e.g. Netlify serves it as the site's index) — not at an /order-form.html path.
const ORDER_FORM_BASE_URL = "https://order.maproductsindia.com/";
function trackingLinkFor(order){
  const dayKey = localDateKey(order.createdAt);
  return `${ORDER_FORM_BASE_URL}?id=${encodeURIComponent(order.id)}&d=${dayKey}`;
}

// The product catalog is shared, backend-synced data (S.catalogItems) — both
// this app and the customer-facing order form read the same list, and admin
// can add new items/categories here without touching any code. DEFAULT_CATALOG
// above is only the one-time seed used the very first time the app runs.
function flattenDefaultCatalog(){
  const flat = [];
  DEFAULT_CATALOG.forEach(group=>{
    group.items.forEach(it=>{
      flat.push({ key: itemKey(it.name, it.size), cat: group.cat, rawCat: group.rawCat, name: it.name, size: it.size, mrp: it.mrp, caseSize: getCaseSize(it.name, it.size) });
    });
  });
  return flat;
}
let CATALOG_FLAT = [];
let RAW_CATEGORIES = [];
function rebuildCatalogFlat(){
  CATALOG_FLAT = S.catalogItems.map(it => ({
    ...it,
    ml: sizeToMl(it.size),
    caseSize: (it.caseSize!=null && it.caseSize!=='') ? it.caseSize : getCaseSize(it.name, it.size),
    pktSize: getPktSize(it.name, it.size),
  })).sort((a,b)=> a.name.localeCompare(b.name) || (sizeToMl(a.size)-sizeToMl(b.size)));
  RAW_CATEGORIES = [...new Set(CATALOG_FLAT.map(it=>it.rawCat))].sort((a,b)=>a.localeCompare(b));
}
function findItem(key){ return CATALOG_FLAT.find(i=>i.key===key); }
function fmtMl(ml){
  ml = Math.round(ml*100)/100;
  if(Math.abs(ml) >= 1000) return (ml/1000).toFixed(2)+' L';
  return ml+' mL';
}
// Total pc on its own line, then (*case+pc) and (#pkt+pc) as secondary lines.
function fmtCase(qty, caseSize){
  if(!caseSize) return `${qty} pc`;
  const cases = Math.floor(Math.abs(qty)/caseSize);
  const rem = Math.abs(qty)%caseSize;
  const sign = qty<0 ? '-' : '';
  return `${sign}${cases}c ${rem}pc <span class="mono" style="opacity:.7">(${qty} pc)</span>`;
}
// Wherever an item's quantity is shown, prefer "X cases" when it divides
// evenly by the case size; otherwise fall back to plain pieces. Used on
// order tiles, short-item indicators, and the Ready stock primary number.
// BUGFIX (2026-09-05, live user report: unit words like "pc"/"case" were
// staying in Latin script even in Hindi/Urdu, reading as an odd mixed-
// direction fragment inside otherwise-translated RTL Urdu text) -- the
// "pc"/"case"/"cases" words now route through t() (safe for every existing
// caller: falls back to the exact original English word when S.language
// is 'en', so this function's behavior is completely unchanged there).
// t() is defined later in the file but that's fine -- by the time this
// function is actually CALLED (during rendering), every top-level function
// declaration in this script has already been hoisted.
function fmtQtyPreferCase(qty, caseSize){
  if(caseSize && qty!==0 && qty % caseSize === 0){
    const cases = qty / caseSize;
    return `${cases} ${t(Math.abs(cases)===1?'case':'cases')}`;
  }
  return `${qty} ${t('pc')}`;
}
function fmtReadyDisplay(qty, caseSize, pktSize){
  const sign = qty<0 ? '-' : '';
  const av = Math.abs(qty);
  const wholeCase = caseSize && qty!==0 && av % caseSize === 0;
  let html;
  if(wholeCase){
    const cases = av / caseSize;
    html = `<b>${sign}${cases} case${cases===1?'':'s'}</b><br/><span class="mono" style="opacity:.75">(${qty} pc)</span>`;
  } else {
    html = `<b>${qty} pc</b>`;
    if(caseSize){
      const c = Math.floor(av/caseSize), r = av%caseSize;
      html += `<br/><span class="mono" style="opacity:.75">(*${sign}${c}c ${r}pc)</span>`;
    }
  }
  if(pktSize){
    const p = Math.floor(av/pktSize), r2 = av%pktSize;
    html += `<br/><span class="mono" style="opacity:.75">(#${sign}${p}pkt ${r2}pc)</span>`;
  }
  return html;
}
// Searchable item picker: a text input with a native datalist so the person
// can type to filter instead of scrolling a long dropdown.
function itemPickerHtml(inputId, prefillKey){
  const preLabel = prefillKey ? (()=>{ const it=findItem(prefillKey); return it?`${it.name} ${it.size}`:''; })() : '';
  return `<input id="${inputId}" list="${inputId}List" value="${esc(preLabel)}" placeholder="${esc(t('Type to search item…'))}" autocomplete="off" ${prefillKey?'disabled':''} />
    <datalist id="${inputId}List">${CATALOG_FLAT.map(it=>`<option value="${esc(it.name)} ${esc(it.size)}"></option>`).join('')}</datalist>`;
}
function resolveItemFromText(text){
  const norm = String(text||'').trim().toLowerCase();
  if(!norm) return null;
  let hit = CATALOG_FLAT.find(it=>`${it.name} ${it.size}`.toLowerCase()===norm);
  if(hit) return hit;
  // fall back to a loose contains-match if no exact match
  return CATALOG_FLAT.find(it=>norm.includes(it.name.toLowerCase()) && norm.includes(normSize(it.size))) || null;
}

// Immutable snapshot of each post's default access — used as the fallback
// whenever admin hasn't customized a post's checklist yet, and as the
// canonical module order when rendering the checklist itself.
const DEFAULT_ROLE_TABS = Object.fromEntries(Object.keys(ROLES).map(r=>[r, ROLES[r].tabs.slice()]));
const MODULE_ORDER = ['home','orders','customers','stock','domino','tasks','expenses','dailywork','checkin','log','attendance','users'];
// Applies the admin-configured access checklist (S.rolePermissions) onto the
// live ROLES object, so every existing `ROLES[role].tabs` reference in the
// app automatically reflects the latest permissions without needing to be
// individually rewired.
function applyRolePermissionsToROLES(){
  Object.keys(ROLES).forEach(role=>{
    const perm = S.rolePermissions[role];
    if(perm){
      // "stock" tab visibility is derived from the 3 granular sub-views —
      // any one of Raw/Filled/Ready being viewable is enough to show the tab.
      const effective = Object.assign({}, perm, { stock: !!(perm.stock_raw || perm.stock_filled || perm.stock_ready) });
      const allowed = MODULE_ORDER.filter(t => t==='home' || effective[t]);
      ROLES[role].tabs = allowed.length ? allowed : ['home'];
    } else {
      ROLES[role].tabs = DEFAULT_ROLE_TABS[role].slice();
    }
    // Daily Work isn't in CHECKLIST_MODULES (the admin-customizable
    // Permission Manager checklist), so it can never come back from the
    // `perm` branch above -- Manager (full, view-only) and Packaging
    // (Filling + Packing only) always get it regardless of whether this
    // role's permissions were customized before this feature existed.
    if((role==='manager' || role==='packaging') && !ROLES[role].tabs.includes('dailywork')){
      ROLES[role].tabs.push('dailywork');
    }
  });
  if(S.currentUser && !ROLES[S.currentUser.role].tabs.includes(S.view)){
    S.view = ROLES[S.currentUser.role].tabs[0];
  }
}
// Which stock sub-view ('raw'|'filled'|'ready') a role can see. Falls back to
// "all three" until the admin customizes that role in the Permission Manager,
// matching the app's original behavior.
function canViewStockSub(role, sub){
  if(role==='admin') return true;
  const perm = S.rolePermissions[role];
  if(perm) return !!perm['stock_'+sub];
  return (DEFAULT_ROLE_TABS[role]||[]).includes('stock');
}
const BASE_ROLE_KEYS = ['admin','manager','sales','filling','packaging'];
// Admin-created teams beyond the 5 built-in ones. New teams start with only
// Home until the admin sets their permissions in the Permission Manager —
// they get full view/entry checklist control, but don't automatically plug
// into the specialized Filling/Packaging fulfillment-queue view, since that
// logic is tied specifically to those two built-in roles.
function rebuildRolesRegistry(){
  Object.keys(ROLES).forEach(k=>{ if(!BASE_ROLE_KEYS.includes(k) && !S.customRoles.some(c=>c.key===k)) delete ROLES[k]; });
  S.customRoles.forEach(c=>{
    if(!ROLES[c.key]) ROLES[c.key] = {label:c.label, tabs:['home']};
    else ROLES[c.key].label = c.label;
    if(!DEFAULT_ROLE_TABS[c.key]) DEFAULT_ROLE_TABS[c.key] = ['home'];
    if(!DEFAULT_ENTRY_PERMS[c.key]) DEFAULT_ENTRY_PERMS[c.key] = {};
  });
}
function slugifyTeamName(name){
  let base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!base) base = 'team';
  let key = base, n = 2;
  while(ROLES[key]){ key = base+'_'+n; n++; }
  return key;
}
