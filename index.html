function openExpenseModal(existing, type, forUsername){
  // Opening Balance checkpoints intentionally have NO edit path (scope
  // decision to limit risk around the balance math) -- this single guard
  // covers every way this modal can be reached for one (the Expenses
  // page's own Edit button, AND Daily Work's editDailyEntry dispatch),
  // instead of needing the same check duplicated at each call site.
  if(existing && existing.type==='opening_balance'){
    showAlert(t('Opening Balance checkpoints ko edit nahi kar sakte -- balance galat na ho isliye. Isko delete karke, sahi figure ke saath naya checkpoint add karo.'));
    return;
  }
  const isAdmin = S.currentUser.role==='admin';
  const managers = S.users.filter(u=>u.role==='manager');
  const isSettlement = type==='settlement';
  showModal(`
    <h3>${esc(existing?t('Edit entry'):isSettlement?(isAdmin?t('Add settlement (cash paid to manager)'):t('💵 Cash Settlement (received from Admin)')):t('Add expense'))}</h3>
    <form id="expForm">
      ${isAdmin?`<div class="field"><label>${esc(t('Manager'))}</label><select id="expManager">${managers.map(u=>`<option value="${esc(u.username)}" ${(existing?existing.byUsername:forUsername)===u.username?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`:''}
      <div class="field"><label>${esc(t('Description'))}</label><input id="expDesc" value="${existing?esc(existing.description||''):''}" required /></div>
      <div class="field"><label>${esc(t('Category (optional)'))}</label><input id="expCat" value="${existing?esc(existing.category||''):''}" placeholder="${esc(t('Fuel, transport, food…'))}" /></div>
      <div class="field"><label>${esc(t('Amount (₹)'))}</label><input id="expAmt" type="number" min="1" step="0.01" value="${existing?existing.amount:''}" required /></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
        <button type="submit" class="btn btn-primary">${esc(existing?t('Save changes'):t('Save'))}</button>
      </div>
    </form>
  `);
  document.getElementById('expForm').addEventListener('submit', withSubmitGuard((e)=>{
    e.preventDefault();
    if(!existing && blockIfOutsideEntryWindow()) return; // only gates NEW entries -- editing an existing one isn't a "new" entry
    const amount = parseFloat(document.getElementById('expAmt').value)||0;
    if(amount<=0){ showAlert(t('Enter a valid amount.')); return; }
    const managerSel = document.getElementById('expManager');
    const byUsername = isAdmin && managerSel ? managerSel.value : S.currentUser.username;
    const byUser = S.users.find(u=>u.username===byUsername);
    let touched;
    if(existing){
      // BUGFIX (2026-08-29, full security audit -- concurrent-edit balance
      // drift): used to compute the balance delta against THIS DEVICE'S own
      // (possibly stale) local copy via two separate
      // applyExpenseBalanceDelta calls, then separately overwrite the
      // expenses/{id} doc -- if another admin had edited this SAME entry
      // moments earlier, this could double-subtract/double-add against the
      // balance relative to what the document itself ends up holding. Now
      // routes through fsEditExpenseAtomic, a single Firestore transaction
      // that reads the entry's CURRENT SERVER state fresh as "before" and
      // updates the document + balance(s) together -- see that function's
      // own comment for the full story. The optimistic local update below
      // still happens instantly for UI responsiveness; the transaction's
      // authoritative result (fired async, see the .then() after this
      // handler) reconciles S.expenseBalances if the optimistic guess was
      // off because of exactly the race this fix closes.
      const beforeUsername = existing.byUsername;
      const beforeContribution = (existing.type==='settlement' ? -existing.amount : existing.amount) || 0;
      Object.assign(existing, {
        description: document.getElementById('expDesc').value.trim(),
        category: document.getElementById('expCat').value.trim(), amount,
        byUsername, byName: byUser?byUser.name:byUsername
      });
      touched = existing;
      const afterContribution = (touched.type==='settlement' ? -touched.amount : touched.amount) || 0;
      if(beforeUsername===byUsername){
        S.expenseBalances[byUsername] = (S.expenseBalances[byUsername]||0) + (afterContribution - beforeContribution);
      } else {
        S.expenseBalances[beforeUsername] = (S.expenseBalances[beforeUsername]||0) - beforeContribution;
        S.expenseBalances[byUsername] = (S.expenseBalances[byUsername]||0) + afterContribution;
      }
      fsEditExpenseAtomic(touched.id, { description:touched.description, category:touched.category, amount:touched.amount, byUsername:touched.byUsername, byName:touched.byName }).then(res=>{
        if(res && res.ok && res.username!=null && res.balance!=null){ S.expenseBalances[res.username] = res.balance; render(); }
      });
      if(isAdmin) S.expenseAdminSel = byUsername;
      closeModal(); render(); showToast('Entry updated');
      return;
    }
    {
      touched = {
        // BUGFIX (2026-08-21): this used to force type to 'expense' for
        // any non-admin submitter, regardless of what `type` was actually
        // passed in -- which silently broke the new manager-side "Cash
        // Settlement (from Admin)" self-report button (it opens this modal
        // with type='settlement', but the entry would've saved as a plain
        // expense). byUsername above is already always forced to the
        // submitter's own account for non-admins, so trusting `type`
        // itself here is safe -- it only ever arrives as 'expense' or
        // 'settlement' from the two buttons that open this modal, never
        // free-form user input.
        id:uid(), type: type || 'expense',
        description:document.getElementById('expDesc').value.trim(),
        category:document.getElementById('expCat').value.trim(), amount,
        byUsername, byName: byUser?byUser.name:S.currentUser.name,
        enteredByUsername: S.currentUser.username, enteredByName: S.currentUser.name,
        at:Date.now()
      };
      S.expenses.push(touched);
      applyExpenseBalanceDelta(touched, +1);
    }
    if(isAdmin) S.expenseAdminSel = byUsername;
    savePartitionForItem('expenses', touched);
    // Round 15 follow-up: reached only for a genuinely NEW expense/
    // settlement (the `existing` edit path already returned at its own
    // closeModal()/showToast() above) -- paper-airplane + green success
    // dialog instead of the plain toast.
    render(); celebrateEntrySaved('Saved');
  }));
}

function fmtAgo(ts){
  if(!ts) return null;
  const diffMs = Date.now() - ts;
  if(diffMs < 60000) return 'just now';
  if(diffMs < 3600000) return `${Math.floor(diffMs/60000)}m ago`;
  if(diffMs < 86400000) return `${Math.floor(diffMs/3600000)}h ago`;
  return `${Math.floor(diffMs/86400000)}d ago`;
}

function isLastWorkingDayOfMonth(d){
  d = d || new Date();
  const lastDate = new Date(d.getFullYear(), d.getMonth()+1, 0); // last calendar day of month
  let probe = new Date(lastDate);
  while(probe.getDay()===0){ probe.setDate(probe.getDate()-1); } // Sunday off, roll back to Saturday
  return probe.getFullYear()===d.getFullYear() && probe.getMonth()===d.getMonth() && probe.getDate()===d.getDate();
}

function loadImageAsDataURL(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img,0,0);
        resolve(canvas.toDataURL('image/png'));
      }catch(e){ reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function exportMonthPdf(year, month0){
  if(!window.jspdf || !window.jspdf.jsPDF){ showToast('PDF library failed to load', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const monthStart = new Date(year, month0, 1).getTime();
  const monthEnd = new Date(year, month0+1, 1).getTime();
  const inMonth = ts => ts>=monthStart && ts<monthEnd;
  const monthLabel = new Date(year, month0, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});

  // Brand palette pulled from the app's own theme, so the export actually
  // looks like it belongs to the same product instead of a plain text dump.
  const PRIMARY = [30,107,68], PRIMARY_DARK = [18,74,46], GOLD = [201,162,39];
  const INK = [18,32,25], INK_SOFT = [84,99,88], BORDER = [220,232,223], PAPER = [241,247,243];

  const marginX = 40, pageW = 595, pageH = 800, contentW = pageW - marginX*2;
  const footerY = pageH - 26;
  let y = 0;
  const ensure = (need)=>{ if(y+need>footerY-10){ doc.addPage(); y = 54; } };
  const h1 = (t)=>{
    ensure(30);
    doc.setFillColor(...PRIMARY); doc.rect(marginX, y-15, contentW, 24, 'F');
    doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.setTextColor(255,255,255);
    doc.text(t.toUpperCase(), marginX+10, y+1);
    y += 28;
    doc.setTextColor(...INK); doc.setFont(undefined,'normal');
  };
  const h2 = (t)=>{
    ensure(20);
    doc.setFontSize(10.5); doc.setFont(undefined,'bold'); doc.setTextColor(...PRIMARY_DARK);
    doc.text(t, marginX, y);
    doc.setDrawColor(...BORDER); doc.setLineWidth(0.6);
    doc.line(marginX, y+4, pageW-marginX, y+4);
    y += 17;
    doc.setTextColor(...INK); doc.setFont(undefined,'normal');
  };
  const h3 = (t)=>{
    ensure(16);
    doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(...INK);
    doc.text(t, marginX+4, y);
    y += 13;
    doc.setFont(undefined,'normal');
  };
  const line = (t)=>{
    ensure(12);
    doc.setFontSize(9); doc.setTextColor(...INK_SOFT);
    doc.text(t, marginX+16, y);
    y += 12;
    doc.setTextColor(...INK);
  };
  const emptyNote = (t)=>{ ensure(14); doc.setFontSize(9); doc.setFont(undefined,'italic'); doc.setTextColor(...INK_SOFT); doc.text(t, marginX+4, y); y+=16; doc.setFont(undefined,'normal'); doc.setTextColor(...INK); };

  // ---- Header block: colored band, logo + company name/address/GSTIN, report title ----
  doc.setFillColor(...PAPER); doc.rect(0, 0, pageW, 92, 'F');
  doc.setFillColor(...GOLD); doc.rect(0, 90, pageW, 2, 'F');
  let textX = marginX;
  try{
    const logoData = await loadImageAsDataURL(COMPANY_LOGO);
    doc.addImage(logoData, 'PNG', marginX, 18, 46, 46);
    textX = marginX + 58;
  }catch(e){ /* logo couldn't load (e.g. CORS/offline) — skip it, export continues without it */ }
  doc.setFontSize(17); doc.setFont(undefined,'bold'); doc.setTextColor(...PRIMARY_DARK);
  doc.text(COMPANY_NAME, textX, 34);
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(...INK_SOFT);
  doc.text(COMPANY_ADDRESS, textX, 48);
  doc.text(`GSTIN: ${COMPANY_GSTIN}`, textX, 60);
  doc.setFontSize(10.5); doc.setFont(undefined,'bold'); doc.setTextColor(...PRIMARY);
  doc.text(`Monthly Report — ${monthLabel}`, textX, 78);
  doc.setTextColor(...INK);
  y = 116;

  // Orders
  h1('Orders');
  // 2026-08-22 (explicit user request): the Monthly Report now groups/sorts/
  // displays a dispatched order under the date it was actually DISPATCHED,
  // not the date it was originally placed. o.processedAt is set the moment
  // an order's status becomes 'processed' (both the full dispatch flow in
  // finalizeDispatch and the simpler setOrderStatus path always set it),
  // making it the one reliable "actually dispatched" timestamp -- more so
  // than o.dispatchedAt, which only the full LR/transport dispatch modal
  // sets. An order that hasn't been dispatched yet has no dispatch date to
  // use, so it still falls back to its placed date (o.createdAt) — nothing
  // about when an order actually came in is ever discarded from the data,
  // only THIS report's own date/grouping choice. When the two dates land on
  // different calendar days, the original placed date is still shown right
  // alongside the dispatch date, so nothing is hidden. Note: since this
  // groups by dispatch date, an order placed in one month but dispatched in
  // the next will appear in the LATER month's report, not the one it was
  // placed in — and a still-pending order counted in this month's report
  // (under its placed date) will move to a later month's report once it's
  // actually dispatched, if this report is ever regenerated after that.
  const orderReportDate = o => o.processedAt || o.createdAt;
  const orders = S.orders.filter(o=>inMonth(orderReportDate(o))).sort((a,b)=>orderReportDate(a)-orderReportDate(b));
  if(!orders.length) emptyNote('No orders this month.');
  groupByDate(orders.slice().sort((a,b)=>orderReportDate(b)-orderReportDate(a)), orderReportDate).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(o=>{
      const placedDiffers = o.processedAt && localDateKey(o.processedAt) !== localDateKey(o.createdAt);
      h3(`${o.customerName} — ${ORDER_STAGE_LABEL[o.status]||o.status} — by ${o.createdBy} — ${fmtTime(orderReportDate(o))}${placedDiffers?` (placed ${fmtDateOnly(o.createdAt)})`:''}`);
      o.items.forEach(i=> line(`${i.name} ${i.size} × ${i.qty}`));
    });
  });
  y += 6;

  // Activity log (purchases / filling / packaging)
  h1('Stock entries (purchase / filling / packaging)');
  const logs = S.activityLog.filter(e=>inMonth(e.at));
  if(!logs.length) emptyNote('No stock entries this month.');
  groupByDate(logs.slice().sort((a,b)=>b.at-a.at), e=>e.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(e=> line(`${activityLabel(e)} — ${activityAmount(e).replace(/<[^>]+>/g,'')} — by ${e.by} — ${fmtTime(e.at)}`));
  });
  y += 6;

  // Retail sale & samples
  h1('Retail Sale & Samples');
  const retail = S.retailSales.filter(x=>inMonth(x.at));
  if(!retail.length) emptyNote('No retail sales or samples this month.');
  groupByDate(retail.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=>{
      const itemsText = (x.items||[]).map(i=>`${i.itemLabel} ×${i.qty}`).join(', ');
      h3(`${x.type==='sale'?'Sale':'Sample'}${x.type==='sale'?' — ₹'+(x.totalAmount||0).toLocaleString('en-IN'):''} — by ${x.by} — ${fmtTime(x.at)}`);
      line(itemsText);
    });
  });
  y += 6;

  // Domino printing
  h1('Domino printing');
  const dom = S.dominoPrints.filter(x=>inMonth(x.at));
  if(!dom.length) emptyNote('No entries this month.');
  groupByDate(dom.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=> line(`${x.impressions} impressions${x.note?' — '+x.note:''} — by ${x.by} — ${fmtTime(x.at)}`));
  });
  y += 6;

  // Expenses & settlements
  h1('Expenses & settlements');
  const exps = S.expenses.filter(x=>inMonth(x.at));
  if(!exps.length) emptyNote('No entries this month.');
  groupByDate(exps.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=> line(isOpeningBalanceEntry(x) ? `${expenseEntryAmountText(x)} — ${x.description||''} — ${x.byName} — ${fmtTime(x.at)}` : `${x.type==='settlement'?'Settled':'Expense'}: ₹${x.amount} — ${x.description||''} — ${x.byName} — ${fmtTime(x.at)}`));
  });
  y += 6;

  // Attendance
  h1('Attendance');
  const att = S.attendance.filter(a=>inMonth(a.timestamp));
  if(!att.length) emptyNote('No check-ins this month.');
  groupByDate(att.slice().sort((a,b)=>b.timestamp-a.timestamp), a=>a.timestamp).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(a=>{ const geoLatP=safeGeoCoord(a.lat), geoLngP=safeGeoCoord(a.lng); line(`${a.name} — ${a.type} — ${fmtTime(a.timestamp)}${(geoLatP!=null&&geoLngP!=null)?` — ${geoLatP.toFixed(4)}, ${geoLngP.toFixed(4)}`:''}`); });
  });

  // ---- Footer on every page: thin rule, company name, generated date, page numbers ----
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setDrawColor(...BORDER); doc.setLineWidth(0.6);
    doc.line(marginX, footerY-8, pageW-marginX, footerY-8);
    doc.setFontSize(7.5); doc.setFont(undefined,'normal'); doc.setTextColor(...INK_SOFT);
    doc.text(`${COMPANY_NAME} — Order Ops export — generated ${fmtDate(Date.now())}`, marginX, footerY);
    doc.text(`Page ${p} of ${totalPages}`, pageW-marginX, footerY, {align:'right'});
  }

  const stamp = `${year}-${String(month0+1).padStart(2,'0')}`;
  doc.save(`MA-Products-OrderOps-${stamp}.pdf`);
  showToast('PDF downloaded');
}

function countPresentToday(){
  const today = localDateKey(Date.now());
  const seen = new Set();
  S.attendance.forEach(a=>{ if(localDateKey(a.timestamp)===today) seen.add(a.username); });
  return seen.size;
}

const ORDER_STAGE_LABEL = {pending:'New', processing:'Processing', ready:'Under Packing', packed:'Ready to Dispatch', processed:'Processed & Dispatched', rejected:'Rejected'};
function orderDisplayLabel(o){
  const role = S.currentUser.role;
  if(role==='admin' || role==='manager') return o.customerName;
  const cust = liveCustomerFor(o);
  const city = (cust && cust.city) || o.customerCity;
  const transport = (cust && cust.transport) || o.transportName;
  const parts = [];
  parts.push(city ? `📍 ${city}` : '📍 City not set');
  if(transport) parts.push(`🚚 ${transport}`);
  return parts.join(' · ');
}
// FIFO stock allocation across orders sharing the same item (2026-08-28,
// explicit user request/bugfix). Before this, renderOrderTile compared each
// order's own item qty against the single GLOBAL S.readyStock[key] number
// -- fine for one order, but once several orders accept against the same
// item and push that shared global number negative (setOrderStatus really
// does subtract from it at accept time, uncapped -- see there), EVERY order
// holding that item shows the exact same "short by N" using that one
// shared negative number, even orders that were fully covered when they
// were accepted. Concretely: item has 170pc, order A(created first) needs
// 100, B needs 50, C(created last) needs 40 -- accepting all three drives
// readyStock to -20, and the old code showed "short by 20" on A, B, AND C
// alike, instead of only on C (the one that actually ran out).
// Fixed by reconstructing, per item, the shared pool those orders drew
// from (current stock + everything they've collectively taken), then
// handing it out oldest-order-first (o.createdAt) exactly like a real
// warehouse fulfilling a queue -- only the order(s) that arrived after the
// pool ran dry come up short, and only for the piece count actually
// missing for THEM.
// Returns a Map keyed `${orderId}::${itemKey}` -> shortfall (only present
// when >0; absent/undefined means that order's claim on that item is fully
// covered).
function computeFifoShortages(){
  const shortByOrderItem = new Map();
  const demandByItem = {}; // itemKey -> [{orderId, qty, createdAt}]
  S.orders.forEach(o=>{
    if(!o.stockDeducted) return; // not yet accepted (or rejected/undone back) -- holds no claim on the pool
    o.items.forEach(d=>{
      if(d.cancelled) return;
      (demandByItem[d.key] = demandByItem[d.key] || []).push({ orderId:o.id, qty:d.qty, createdAt:o.createdAt||0 });
    });
  });
  Object.keys(demandByItem).forEach(key=>{
    const claims = demandByItem[key];
    const totalDemand = claims.reduce((sum,c)=>sum+c.qty, 0);
    const currentStock = S.readyStock[key]||0; // reflects every one of these claims already subtracted, possibly negative
    // Reconstruct the pool this set of orders started with: whatever's left
    // now, plus everything they've collectively taken out of it. Clamped at
    // 0 so a shortfall that already existed BEFORE these orders (a separate,
    // older problem) doesn't make today's orders look worse than they are.
    let pool = Math.max(0, currentStock + totalDemand);
    claims.sort((a,b)=> a.createdAt - b.createdAt); // FIFO: whoever's order arrived first gets served first
    claims.forEach(c=>{
      const given = Math.min(c.qty, pool);
      pool -= given;
      const short = c.qty - given;
      if(short > 0) shortByOrderItem.set(`${c.orderId}::${key}`, short);
    });
  });
  return shortByOrderItem;
}
function orderMrpValue(o){
  return o.items.reduce((sum,i)=>{
    if(i.cancelled) return sum;
    const it = findItem(i.key);
    return sum + (it ? it.mrp*i.qty : 0);
  }, 0);
}
// PERF BUGFIX (2026-09-02, crash/stress sweep): renderOrderTile used to call
// computeFifoShortages() itself, ONCE PER TILE -- and computeFifoShortages()
// walks every single order (and every item on it) in S.orders each time it
// runs (see its own header comment: "Computed ONCE per call (not per-order)
// ... keeps autoAdvanceOrders linear instead of quadratic in the order
// count" -- that exact same fix was already applied to autoAdvanceOrders,
// but renderOrderTile itself was missed). With N active orders rendered as
// tiles on the Orders tab (no pagination there -- renderOrdersSegregated(0)
// shows everything), that made the WHOLE Orders tab O(N x total-orders):
// every tile re-walked the entire order book from scratch. Measured on a
// synthetic 4,000-order dataset (thousands of active orders is a realistic
// multi-year history for a real business), this took 1.2-3.7 SECONDS per
// render of the Orders tab -- vs under 20ms for every other tab at the same
// data volume -- easily reading as "the app froze/crashed" on a staff
// tablet. Fixed by hoisting computeFifoShortages() out to the two callers
// (renderOrdersSegregated/renderOrderTilesGrouped), each of which now
// computes it exactly ONCE per render pass and passes the same map through
// to every tile, restoring linear-time rendering. The internal fallback
// below (`|| computeFifoShortages()`) keeps any future/overlooked caller
// correct (never wrong, just not fast) rather than silently broken.
function renderOrderTile(o, showUndoDispatch, fifoShortages){
  const isAdmin = S.currentUser.role==='admin';
  const isLRUploader = S.currentUser.role==='admin' || S.currentUser.role==='manager';
  fifoShortages = fifoShortages || computeFifoShortages();
  const tileCls = o.status==='ready' ? ' tile-ready' : o.status==='processing' ? ' tile-processing' : o.status==='packed' ? ' tile-packed' : '';
  return `<div class="order-tile${tileCls}" data-order-id="${esc(String(o.id))}">
    <div class="ot-top"><span class="ot-name">${esc(orderDisplayLabel(o))}${o.source==='website'?' <span class="mono" style="font-weight:400;">🌐 Website</span>':''}</span><span class="badge badge-${o.status}">${esc(stageLabel(o.status))}</span></div>
    ${isLRUploader ? (()=>{ const lc=liveCustomerFor(o); const city=(lc&&lc.city)||o.customerCity; const transport=(lc&&lc.transport)||o.transportName; const bits=[]; if(city) bits.push(`📍 ${esc(city)}`); if(transport) bits.push(`🚚 ${esc(transport)}`); return bits.length?`<div class="ot-meta" style="margin-top:-2px;">${bits.join(' · ')}</div>`:''; })() : ''}
    <div class="ot-items">${o.items.map((i,idx)=>{
      const it = findItem(i.key);
      const caseSize = it ? it.caseSize : null;
      const qtyLabel = `${esc(t(i.name))} ${esc(translateSizeUnit(i.size))} <span class="mono">- ${fmtQtyPreferCase(i.qty, caseSize)}</span>`;
      if(i.cancelled){
        return `<span style="color:var(--ink-soft);text-decoration:line-through;">✖ ${qtyLabel} <i>(${esc(t('cancelled'))})</i></span>`;
      }
      const stockNow = S.readyStock[i.key]||0;
      let avail, shortQty;
      if(!o.stockDeducted){
        // Not yet accepted -- just a live preview of "would accepting right
        // now be covered?", against whatever's left after every ALREADY-
        // accepted order's claim (stockNow already reflects those).
        avail = stockNow >= i.qty;
        shortQty = avail ? 0 : (i.qty - Math.max(stockNow,0));
      } else {
        // FIXED (2026-08-28, "3 orders share one item, all 3 showed short"):
        // was `avail = stockNow>=0; shortQty = -stockNow` -- that's the
        // single GLOBAL stock number, so every order holding this item
        // showed the SAME shortfall even if this particular order was fully
        // covered when it was accepted. computeFifoShortages() allocates
        // the shared pool oldest-order-first and reports only what THIS
        // order specifically didn't get.
        const short = fifoShortages.get(`${o.id}::${i.key}`) || 0;
        avail = short === 0;
        shortQty = short;
      }
      const mark = avail ? '<span class="success-pop" style="color:var(--success);">✔</span>' : `<span style="color:var(--danger);">✘ (${esc(t('short by'))} ${fmtQtyPreferCase(shortQty, caseSize)})</span>`;
      return `${mark} ${qtyLabel}`;
    }).join('<br/>')}</div>
    ${o.transportName?`<div class="ot-meta"><b>🚚 ${esc(o.transportName)}</b>${o.totalCases?` · ${o.totalCases} cases`:''}${o.dispatchedAt?` · ${fmtDate(o.dispatchedAt)}`:''}</div>`:''}
    ${(()=>{ const geoLat=safeGeoCoord(o.orderLat), geoLng=safeGeoCoord(o.orderLng); const hasGeo = isAdmin && geoLat!=null && geoLng!=null; return `<div class="ot-meta">${o.orderNumber?`#${esc(o.orderNumber)} · `:''}by ${esc(o.createdBy)} · ${fmtTime(o.createdAt)}${hasGeo ? ` · <a href="https://www.google.com/maps?q=${encodeURIComponent(geoLat)},${encodeURIComponent(geoLng)}" target="_blank" rel="noopener" style="color:var(--primary);">📍 Order location</a>` : ''}${isAdmin ? ` · <button type="button" class="mono" data-view-tracking-logs="${o.id}" style="background:none;border:none;color:var(--primary);cursor:pointer;padding:0;font-size:inherit;">📜 Logs</button>` : ''}</div>`; })()}
    ${isAdmin ? (()=>{ const liveCust = liveCustomerFor(o); const disc = liveCust ? (liveCust.discountPercent||0) : 0; return `<div class="ot-meta"><b>MRP Value: ₹${orderMrpValue(o).toLocaleString('en-IN')}${disc>0?` (${disc}% off)`:''}</b></div>`; })() : ''}
    <div class="row-actions">
      ${(isAdmin || (S.currentUser.role==='sales' && o.createdByUsername===S.currentUser.username)) ? `<button class="btn btn-sm btn-outline" data-track-link="${o.id}">🔗 Track link</button>` : ''}
      ${isAdmin?`
      ${o.status==='pending'?`<button class="btn btn-sm btn-success" data-approve-order="${o.id}">${esc(t('Accept'))}</button><button class="btn btn-sm btn-danger" data-reject-order="${o.id}">${esc(t('Reject'))}</button>`:''}
      ${o.status==='processing'?`<button class="btn btn-sm btn-outline" data-mark-ready-now="${o.id}">${esc(t('Mark Ready'))}</button>`:''}
      ${o.status==='ready' && o.items.some(it=>it.autoCancelledByReady)?`<button class="btn btn-sm btn-outline" data-undo-ready="${o.id}">↩ Undo Ready</button>`:''}
      `:''}
      ${(isAdmin || S.currentUser.role==='manager')?`
      ${o.status==='ready'?`<button class="btn btn-sm btn-success" data-mark-packed="${o.id}">${esc(t('🚚 Mark Ready to Dispatch'))}</button>`:''}
      ${o.status==='packed'?`<button class="btn btn-sm btn-outline" data-undo-packed="${o.id}">↩ Undo Ready to Dispatch</button>`:''}
      ${o.status==='packed'?`<button class="btn btn-sm btn-success" data-dispatch-order="${o.id}">${t('Processed & Dispatched')}</button>`:''}
      ${o.status==='processed' && showUndoDispatch?`<button class="btn btn-sm btn-outline" data-undo-dispatch="${o.id}">↩ Undo Dispatch</button>`:''}
      `:''}
      ${isAdmin?`<button class="btn btn-sm btn-outline" data-edit-order="${o.id}">${esc(t('Edit'))}</button>`:''}
      ${(isLRUploader && (o.status==='packed'||o.status==='processed'))?(((o.lrPhotoUrl && (Date.now()-o.lrUploadedAt)<30*24*60*60*1000) || o.lrNumber)?`<button class="btn btn-sm btn-outline" data-view-lr="${o.id}">${o.photoType==='stock'?'📦 Stock':'📄 LR'}</button>`:`<button class="btn btn-sm btn-outline" data-upload-lr="${o.id}">📄 Upload LR</button>`):''}
      ${isAdmin?`<button class="btn btn-sm btn-outline" data-del-order="${o.id}">${esc(t('Delete'))}</button>`:''}
    </div>
  </div>`;
}
// Home page's quick view — only orders still "in motion" (excludes
// Processed, which has its own dedicated button on the Orders tab),
// segregated by stage so admin sees each bucket clearly instead of one
// mixed date-sorted list.
// Segregates active (non-Processed — that's button-only now) orders by
// stage, in New -> Ready -> Processing order. `limit` caps each section
// (used on Home for a compact view); pass 0/undefined to show everything
// (used on the full Orders tab).
function renderOrdersSegregated(limit){
  const relevant = S.orders.filter(o=>o.status!=='processed');
  const byStage = (status)=>{
    const list = relevant.filter(o=>o.status===status).sort((a,b)=>b.createdAt-a.createdAt);
    return limit ? list.slice(0,limit) : list;
  };
  const pending = byStage('pending'), ready = byStage('ready'), packed = byStage('packed'), processing = byStage('processing');
  // PERF BUGFIX (2026-09-02, crash/stress sweep): compute the FIFO shortage
  // map ONCE for this whole render pass -- see renderOrderTile's own
  // comment for the full story on why this must never be computed per-tile.
  const fifoShortages = computeFifoShortages();
  const section = (title, icon, list)=> list.length ? `<div style="margin-bottom:14px;">

function findRecentDuplicateOrder(customerName, draftItems){

  const normName = customerName.trim().toLowerCase();
  return S.orders.find(o=>{

    const proceedWithSubmit = ()=>{

    let custAddress = existingCust ? (existingCust.address||'') : '';
    let custGstin = existingCust ? (existingCust.gstin||'') : '';
    const finish = ()=>{
      const shortItems = [];
      if(existingOrder){
        if(existingOrder.stockDeducted){
          // Already accepted — it holds reserved stock, so editing quantities
          // has to release the old amount and reserve the new amount.
          // Cancelled items were already credited back separately (e.g. by
          // Mark Ready) — skip them here too, or they'd be double-credited.
          existingOrder.items.forEach(d=>{ if(!d.cancelled){ S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty; logStockMovement(d.key, `${d.name} ${d.size}`, 'order', d.qty, `Order edited — ${orderDisplayLabel(existingOrder)} (released old qty)`); } });
          // BUGFIX (2026-08-29, full security audit): this loop used to
          // deduct stock for EVERY item in orderDraft with no cancelled
          // check -- but a cancelled item (e.g. auto-cancelled-for-shortage
          // by "Mark Ready Now", see markOrderReadyNow above) already had
          // its stock credited back separately and, per the release loop
          // just above, deliberately holds NO claim on the pool while
          // cancelled. Editing an order that still carries that same

          // time here, phantom-reserving stock nothing in the order

          // does, for the same reason.
          orderDraft.forEach(d=>{
            if(d.cancelled) return;
            S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty;
            if(S.readyStock[d.key] < 0) shortItems.push(`${d.name} ${d.size}`);
            logStockMovement(d.key, `${d.name} ${d.size}`, 'order', -d.qty, `Order edited — ${orderDisplayLabel(existingOrder)} (new qty)`);
          });
          safeSet('app:readyStock', S.readyStock);
        }
        // Still pending (not yet accepted) — nothing was ever deducted, so
        // editing quantities is just an item-list change, no stock math needed.
        existingOrder.customerId = custId; existingOrder.customerName = custName; existingOrder.customerCity = custCity;
        existingOrder.customerPhone = custPhone; existingOrder.customerAddress = custAddress; existingOrder.customerGstin = custGstin;
        existingOrder.items = orderDraft.slice();
        savePartitionForItem('orders', existingOrder);
        autoAdvanceOrders();
        syncStockTasksFromAlerts();
        closeModal(); render();
        showToast(shortItems.length? `Order updated — ⚠ short on ${shortItems.join(', ')}` : 'Order updated');
      } else {
        // ROUND 12 (2026-08-31, explicit user request -- "Jo Order OMS me
        // se add ho rhe h vo direct hi Accepted me ajaye or Jo Order form
        // se arhe h Approval sirf uska ho"): an order entered directly here
        // in OMS is created ALREADY ACCEPTED (status:'processing', stock

        const order = {
          id: uid(), orderNumber: generateOrderNumber(nowTs), customerId: custId, customerName: custName, customerCity: custCity, customerPhone: custPhone, customerAddress: custAddress, customerGstin: custGstin,
          items: orderDraft.slice(),
          status:'processing', fillingStatus:'pending', packagingStatus:'pending', stockDeducted:false, processedAt:null,
          createdBy: S.currentUser.name, createdByUsername: S.currentUser.username, createdByRole: S.currentUser.role, createdAt: nowTs
        };
        const shortItemsNew = reserveStockForAcceptedOrder(order);
        S.orders.push(order);
        savePartitionForItem('orders', order);
        autoAdvanceOrders(); // may instantly become 'ready' if stock already covers it -- mirrors setOrderStatus's own 'processing' branch
        syncStockTasksFromAlerts(); // accepting reserves stock and can create shortages -- always resync after, mirrors setOrderStatus
        closeModal(); render();

      }
    };

function guessNewPartyName(text){
  // Matches the app's own example convention: "Party Name - item x5, item2 x3".
  // Only used when no existing customer already matched the text.
  const dashMatch = text.match(/^\s*([^\n,;]+?)\s+[-–—]\s+/);
  if(!dashMatch) return null;
  const candidate = dashMatch[1].trim();
  if(!candidate || candidate.length<3 || candidate.length>60) return null;
  if(/^\d+$/.test(candidate)) return null;
  const cLower = candidate.toLowerCase();
  if(CATALOG_FLAT.some(it=>cLower.includes(it.name.toLowerCase()))) return null; // looks like a product line, not a name
  return candidate;
}
function parseOrderText(text){
  const result = { customerId:null, customerName:null, items:[], unmatched:[] };
  const lower = text.toLowerCase();
  let bestCust = null, bestLen = 0;
  S.customers.forEach(c=>{
    const n = c.name.toLowerCase();
    if(n.length>=3 && lower.includes(n) && n.length>bestLen){ bestCust = c; bestLen = n.length; }
  });
  if(bestCust){ result.customerId = bestCust.id; result.customerName = bestCust.name; }
  else { result.customerName = guessNewPartyName(text); }
  const segments = text.split(/\n|,|;|\band\b/i).map(s=>s.trim()).filter(Boolean);
  segments.forEach(seg=>{
    const segLower = seg.toLowerCase();
    if(bestCust && segLower.includes(bestCust.name.toLowerCase()) && seg.replace(bestCust.name,'').trim().length<3) return;
    let bestItem = null, bestScore = 0;
    CATALOG_FLAT.forEach(it=>{
      const nameOnly = it.name.toLowerCase();
      const sizeNorm = normSize(it.size);
      const segNorm = segLower.replace(/\s+/g,'');
      let score = 0;
      if(segLower.includes(nameOnly) && segNorm.includes(sizeNorm)) score = nameOnly.length + sizeNorm.length + 10;
      else if(segLower.includes(nameOnly)) score = nameOnly.length;
      if(score>bestScore){ bestScore=score; bestItem=it; }
    });
    if(bestItem){
      const nums = seg.match(/\d+/g);
      let qty = 1;
      if(nums && nums.length){
        const sizeNum = (bestItem.size.match(/\d+/)||[])[0];
        const candidate = nums.find(n=>n!==sizeNum) || (nums.length>1?nums[nums.length-1]:null);
        if(candidate) qty = parseInt(candidate)||1;
      }
      const existing = result.items.find(d=>d.key===bestItem.key);
      if(existing) existing.qty += qty; else result.items.push({key:bestItem.key, name:bestItem.name, size:bestItem.size, qty});
    } else if(seg.length>2){
      result.unmatched.push(seg);
    }
  });
  return result;
}

function renameTransportEverywhere(oldName, newName){
  // Editing a transporter is only ever meant to fix a spelling mistake, so
  // (unlike catalog renames, which involve real inventory-key migration)
  // this simply retro-updates every place the old spelling was recorded —
  // customers' preferred transport and every order's transportName.
  S.transports = S.transports.map(t=>t===oldName?newName:t);
  safeSet('app:transports', S.transports);
  let customersChanged = false;
  S.customers.forEach(c=>{
    if(c.transport===oldName){ c.transport = newName; customersChanged = true; }
  });
  if(customersChanged) safeSet('app:customers', S.customers);
  S.orders.forEach(o=>{
    if(o.transportName===oldName){ o.transportName = newName; savePartitionForItem('orders', o); }
  });
}

function resetAllDataExceptUsers(){
  showPrompt('Enter your admin password to confirm — this wipes everything except Users:', '', async (pwd)=>{
    if(!pwd) return;
    if(!(await verifyPassword(S.currentUser, pwd))){ showAlert('Incorrect password.'); return; }
    showConfirm('This will permanently erase ALL orders, customers, stock levels, expenses, logs, tasks, attendance, login history, and domino records. Users stay. This cannot be undone. Continue?', ()=>{
      performResetAllDataExceptUsers();
    }, {confirmLabel:'Yes, erase everything'});
  }, {password:true});
}
async function performResetAllDataExceptUsers(){
  // SECURITY FIX (2026-08-21 audit, finding #1's literal "wipe all data"
  // example): this used to separately save ~8 STATIC_KEYS to empty values
  // and call apiDeleteKeys with whatever day-partitions THIS DEVICE
  // happened to have seen locally -- fragile (a dropped connection
  // mid-sequence could leave things half-wiped) and, before the backend
  // fix, gated on nothing but the shared staff SECRET.
  //
  // ROUND 10 (2026-08-29, full security audit, CRITICAL): this used to call
  // apiResetAllData(), which hits order-ops-backend.gs -- the OLD Apps
  // Script/Sheets backend, a Task #54 leftover never finished when this app
  // moved to Firestore. That meant confirming this dialog (after typing the
  // admin password and an explicit "erase everything" confirmation) did
  // NOTHING to the live Firestore data this app actually reads/writes today
  // -- every real order/customer/expense/stock number stayed exactly as it
  // was, while the admin was given every reason to believe it had all just
  // been permanently erased. Now calls the new resetAllDataExceptUsers
  // Cloud Function, which is the real, Firestore-native wipe (see its own
  // comment in functions/index.js for exactly what it deletes and what it
  // deliberately leaves alone). The client's own local wipe below still
  // runs AFTER the server confirms success, purely as an optimistic UI
  // update -- not the source of truth.
  showToast('Erasing all data…');
  let result;
  try{

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// All user profiles are stored together as one JSON blob in a single Google
// Sheet cell (~50,000 char limit), so every photo has to stay genuinely
// small. Shrinks progressively until it fits, rather than silently failing
// to save later.
async function resizeImageFileSafe(file){
  const steps = [ [128,0.65], [100,0.55], [80,0.45], [64,0.4] ];
  let last = null;
  for(const [dim, q] of steps){
    last = await resizeImageFile(file, dim, q);
    if(last.length <= 8000) return last;
  }
  return last;
}

function markAnnouncementRead(id){
  const m = S.chatMessages.find(x=>x.id===id && x.type==='announcement');
  if(m && !(m.readBy||[]).includes(S.currentUser.username)){
    // RACE FIX (2026-08-28, fsSetItem non-merge race audit): used to mutate
    // the local `readBy` array then savePartitionForItem -> fsSetItem's
    // full non-merge .set() -- two staff opening the same announcement
    // around the same time could race, and whichever device's full-object
    // write landed last would silently overwrite the other's readBy entry
    // (a classic lost update on a shared array). arrayUnion is an atomic,
    // additive server-side operation -- immune to this regardless of how
    // stale either device's local copy of readBy is.
    m.readBy = m.readBy || []; m.readBy.push(S.currentUser.username); // optimistic local update for instant UI feedback
    fsDb.collection('chatMessages').doc(String(id)).set(
      { readBy: firebase.firestore.FieldValue.arrayUnion(S.currentUser.username) }, { merge: true }
    ).catch(err=>{ fsReportWriteError(err, 'chatMessages (read receipt)'); });
  }
}
function markThreadRead(otherUsername){
  S.chatMessages.forEach(m=>{
    if(m.type==='personal' && m.toUsername===S.currentUser.username && m.fromUsername===otherUsername && !m.read){
      // Same race fix as markAnnouncementRead above -- a scoped merge write
      // touching only `read` instead of a full non-merge object resave.
      m.read = true; // optimistic local update
      fsDb.collection('chatMessages').doc(String(m.id)).set({ read: true }, { merge: true })
        .catch(err=>{ fsReportWriteError(err, 'chatMessages (read receipt)'); });
    }
  });
}

// BUGFIX (2026-08-29, "naya message aata h, reply krte h, to reply uske
// niche hona chahiye lekin upar ho raha hai"): every message's `at` was
// stamped with Date.now() on whichever PHONE sent it -- if two devices'
// clocks aren't in sync (extremely common on real staff phones -- auto
// time-sync off, wrong timezone, a few minutes fast/slow), a reply sent
// AFTER a message could still get an `at` value LOWER than the message it
// replies to, and every sort in this file is a plain a.at-b.at, so it
// would render ABOVE the message it's replying to -- permanently, since
// nothing ever corrected it. Changing the STORED `at` field itself to
// Firestore's serverTimestamp() would fix this cleanly, but chatMessages'
// existing 7-day query (`where('at','>=', ...)`) filters on that exact
// field, and Firestore comparison queries require a consistent type --
// switching `at` from number to Timestamp would make every ALREADY-
// STORED message (still a plain number) silently stop matching that query
// and disappear from view. Too risky for live chat history. Instead: a
// SEPARATE `serverAt` field (server-authoritative, immune to any device's
// clock) is added alongside the existing `at` (unchanged, still what the
// 7-day query filters on), and every place that sorts/groups/displays
// chat messages uses this helper -- serverAt once Firestore has confirmed
// it (self-correcting within about a second of sending), falling back to
// the original client `at` only for the brief moment before that (or for
// messages sent before this fix, which never got a serverAt at all).
function chatSortKey(m){
  return (m && m.serverAt && typeof m.serverAt.toMillis==='function') ? m.serverAt.toMillis() : ((m && m.at) || 0);
}

// BUGFIX (2026-09-02, live user report -- "packing, filling, managers koi
// bhi message seen nhi kr pa rhe h, not saved likha aa raha h bar bar, na hi
// msg bhej pa rhe h"): this used to mutate each unread announcement's
// `readBy` locally and then savePartitionForItem -> fsSetItem's FULL
// non-merge .set(m) -- exactly the "lost update" race markAnnouncementRead
// just above was already fixed for (see its RACE FIX comment, 2026-08-28),
// but that fix only ever landed in markAnnouncementRead -- which turned out
// to be dead code, never actually called from anywhere. This function
// (markAllAnnouncementsRead) is the one genuinely wired up everywhere
// (refreshMessagesModal, closing the modal, switching tabs), and it kept
// the old, broken full-object write. firestore.rules' chatMessages update
// rule for a non-admin marking an announcement read requires the write to
// touch ONLY the `readBy` field (`diff(...).affectedKeys().hasOnly(['readBy'])`)
// -- a full non-merge .set() sends the whole local copy of the message as
// the new document, which is fragile (any local/server drift on ANY other
// field silently turns "just mark it read" into "also touch other fields",
// failing that hasOnly check) and, crucially, ONLY non-admin has to satisfy
// this narrow rule at all -- admin's own writes always pass via the
// isAdmin() bypass regardless of what's in the payload, which is exactly
// why this was invisible unless you tested as a non-admin role. Since
// refreshMessagesModal calls this on EVERY live chatMessages update while
// the (default) Announcements tab is open, the failed write retried and
// failed again and again, popping a fresh "Save failed" toast each time --
// the reported "bar bar not saved". Fixed by routing every unread
// announcement through markAnnouncementRead's already-correct, narrowly-
// scoped merge + arrayUnion write instead of duplicating (and diverging
// from) that logic here.
function markAllAnnouncementsRead(){
  S.chatMessages.forEach(m=>{
    if(m.type==='announcement' && !(m.readBy||[]).includes(S.currentUser.username)){
      markAnnouncementRead(m.id);
    }
  });
}

    announcementInput.addEventListener('keydown', (e)=>{

    // this used to deliberately leave Enter alone (a plain newline, mobile-

    // Bluetooth keyboard on a tablet) every mainstream chat app sends on a

    // as "the button doesn't work". Now matches that standard: plain Enter
    // sends, Shift+Enter still inserts a newline. Mobile's on-screen

function refreshMessagesModal(){
  const body = document.getElementById('messagesModalBody');
  if(!body) return;
  // LIVE READ RECEIPTS (2026-08-29, "perfect messaging app" audit): before
  // this fix, markThreadRead/markAllAnnouncementsRead only ever ran ONCE,
  // at the moment a thread/tab was first opened via a click handler (see
  // the [data-open-thread]/[data-chat-tab] handlers in bindMessagesModal
  // below). So a message/announcement that arrived WHILE that exact
  // thread/tab was already open -- delivered here via the live Firestore
  // listener through renderOrRefreshMessagesModal -> this function -- never
  // got marked read until the person backed out and back in again: the
  // sender's checkmark never turned blue, and the unread badge counts
  // stayed inflated the whole time the person was actually looking right
  // at the new message. Re-running the same mark-as-read call on every
  // refresh (not just the initial click) fixes this. Both calls are
  // already idempotent -- they only touch messages that are still
  // unread/unseen by this user -- so redundant calls here (e.g. one from
  // the click handler, then another from this refresh a moment later) are
  // harmless. Runs before re-rendering so the tab badges below already
  // reflect zero for whatever the person is currently looking at.
  if(S.chatView==='announcements') markAllAnnouncementsRead();
  else if(S.chatActiveThread) markThreadRead(S.chatActiveThread);
  const oldInput = document.getElementById('threadReplyInput');
  const draftText = oldInput ? oldInput.value : null;
  const wasFocused = oldInput && document.activeElement===oldInput;
  const selStart = oldInput ? oldInput.selectionStart : null;
  const selEnd = oldInput ? oldInput.selectionEnd : null;
  const oldList = document.getElementById('threadMsgList');
  // "Near the bottom" = within ~60px of the true bottom — if they've
  // scrolled up to read older messages, a background refresh shouldn't
  // yank them back down (same as WhatsApp).
  const wasNearBottom = !oldList || (oldList.scrollHeight - oldList.scrollTop - oldList.clientHeight < 60);
  body.innerHTML = renderMessagesModalContent();
  enhanceFormControls(body);
  bindMessagesModal(!wasNearBottom);
  if(draftText){
    const newInput = document.getElementById('threadReplyInput');
    if(newInput){
      newInput.value = draftText;
      newInput.dispatchEvent(new Event('input', {bubbles:true})); // keeps the Send button's enabled/disabled state in sync
      if(wasFocused){ newInput.focus(); if(selStart!=null) newInput.setSelectionRange(selStart, selEnd); }
    }
  }
}

// order can have several items where only one is genuinely still short —

// need (same cascade-aware alert data the demand table already uses)
// instead of just the crude status flag, so filling/packaging don't get
// notified about orders that have nothing left for them to actually do.
function orderNeedsRoleWork(o, role, stockAlerts){
  if(role==='filling'){
    const needIds = new Set(stockAlerts.filled.map(a=>a.id));
    return o.items.some(i=>!i.cancelled && needIds.has(i.key));
  }
  if(role==='packaging'){
    const needIds = new Set(stockAlerts.ready.map(a=>a.id));
    return o.items.some(i=>!i.cancelled && needIds.has(i.key));
  }
  return true;
}
function renderTasks(){
  const role = S.currentUser.role;
  const isAdmin = role==='admin';
  const stockAlertsForFilter = getStockAlerts();

  let orderRelevant = [];
  if(role==='manager'){ orderRelevant = S.orders.filter(o=>o.status==='processing'); }
  else if(role==='filling'){ orderRelevant = S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done' && orderNeedsRoleWork(o,'filling',stockAlertsForFilter)); }
  else if(role==='packaging'){ orderRelevant = S.orders.filter(o=>o.status==='processing' && o.fillingStatus==='done' && o.packagingStatus!=='done' && orderNeedsRoleWork(o,'packaging',stockAlertsForFilter)); }

  const myGeneralTasks = S.tasks.filter(t=>t.assignedTo===S.currentUser.username || t.assignedTo==='role:'+role).sort((a,b)=>b.createdAt-a.createdAt);
  const allGeneralTasks = S.tasks.slice().sort((a,b)=>b.createdAt-a.createdAt);

  let orderTasksBlock = '';
  if(role==='filling' || role==='packaging'){
    // Unified worker view: order demand + relevant stock alerts, merged into
    // one "what needs doing" list. No separate cards to check.
    const demand = {};
    const alertsNow = getStockAlerts();
    const alertListNow = role==='filling' ? alertsNow.filled : alertsNow.ready;
    const stillNeeded = new Set(alertListNow.map(a=>a.id));
    orderRelevant.forEach(o=>o.items.forEach(i=>{
      if(i.cancelled) return; // cancelled items need no work
      if(!stillNeeded.has(i.key)) return; // stock already covers this item's aggregate need — nothing pending
      if(!demand[i.key]) demand[i.key] = {qty:0, fromOrder:false, fromAlert:false, alertText:''};
      demand[i.key].qty += i.qty;
      demand[i.key].fromOrder = true;
    }));
    const myStockTasks = S.stockTasks.filter(t=>t.status==='open' && t.targetRole===role);
    myStockTasks.forEach(t=>{
      if(!demand[t.itemId]) demand[t.itemId] = {qty:0, fromOrder:false, fromAlert:false, alertText:'', tier:null};
      demand[t.itemId].fromAlert = true;
      demand[t.itemId].alertText = t.qtyText || '';
      demand[t.itemId].tier = t.tier || null;
      const am = alertListNow.find(a=>a.id===t.itemId);
      if(am && am.needQty) demand[t.itemId].suggestedQty = am.needQty;
    });
    const rows = Object.entries(demand).sort((a,b)=>{
      // Recommended-only items (no real order/urgent demand) sink to the bottom.
      const aRec = (a[1].tier==='recommended' && !a[1].fromOrder) ? 1 : 0;
      const bRec = (b[1].tier==='recommended' && !b[1].fromOrder) ? 1 : 0;
      return aRec - bRec;
    });
    orderTasksBlock = `
    <div class="card">
      <h2>${esc(role==='filling'?t('What needs to be filled'):t('What needs to be packed'))}</h2>
      <p class="desc">${esc(t('Orders + stock alerts, in one place.'))}</p>
      ${rows.length===0?`<div class="empty"><div class="big">✅</div>${esc(t('Nothing pending right now.'))}</div>`:`
      <table><thead><tr><th>${esc(t('Item'))}</th><th>${esc(t('Qty / reason'))}</th><th></th></tr></thead><tbody>
      ${rows.map(([key,d])=>{
        const it=findItem(key);
        const alertBadge = d.tier==='recommended' ? `<span class="badge badge-processing">${esc(t('Recommended'))}</span>` : `<span class="badge badge-rejected">${esc(t('Stock alert'))}</span>`;
        const tags = `${d.fromOrder?`<span class="badge badge-pending">${esc(t('Order'))}</span> `:''}${d.fromAlert?alertBadge:''}`;
        const qtyText = d.qty>0 ? `<b>${d.qty} ${esc(t('pc'))}</b>` : (d.alertText||'');
        const suggestedQty = d.qty>0 ? d.qty : (d.suggestedQty||0);
        return `<tr><td>${esc(it?t(it.name):key)} <span class="mono">${esc(it?translateSizeUnit(it.size):'')}</span><div style="margin-top:3px;">${tags}</div></td><td class="mono">${qtyText}</td><td>${role==='filling'?`<button class="btn btn-sm btn-accent" data-quick-fill="${key}|${suggestedQty}">${esc(t('Record'))}</button>`:`<button class="btn btn-sm btn-accent" data-quick-pack="${key}|${suggestedQty}">${esc(t('Record'))}</button>`}</td></tr>`;
      }).join('')}
      </tbody></table>`}
    </div>`;
    if(role==='packaging' && orderRelevant.length){
      orderTasksBlock += `
      <div class="card">
        <h2>${esc(t('Orders in Processing'))}</h2>
        <p class="desc">${esc(t('City + preferred transport for each order currently being worked on.'))}</p>
        <table><thead><tr><th>${esc(t('City'))}</th><th>${esc(t('Transport'))}</th><th>${esc(t('Items'))}</th></tr></thead><tbody>
        ${orderRelevant.map(o=>{
          const cust = liveCustomerFor(o);
          const city = (cust && cust.city) || o.customerCity || '—';
          const transport = (cust && cust.transport) || o.transportName || '—';
          return `<tr><td><b>📍 ${esc(city)}</b></td><td>🚚 ${esc(transport)}</td><td>${o.items.map(i=>`${esc(t(i.name))} ${esc(translateSizeUnit(i.size))} ×${i.qty}`).join('<br/>')}</td></tr>`;
        }).join('')}
        </tbody></table>
      </div>`;
    }
  } else if(orderRelevant.length){
    orderTasksBlock = `
    <div class="card">
      <h2>${esc(t('Processing orders — update progress'))}</h2>
      <p class="desc">${esc(t('Accepted orders in progress.'))}</p>
      <table><thead><tr><th>${esc(t('Customer'))}</th><th>${esc(t('Items'))}</th><th>${esc(t('Filling'))}</th><th>${esc(t('Packaging'))}</th></tr></thead><tbody>
      ${orderRelevant.map(o=>`
        <tr>
          <td><b>${esc(o.customerName)}</b></td>
          <td>${o.items.map(i=>`${esc(t(i.name))} ${esc(translateSizeUnit(i.size))} ×${i.qty}`).join('<br/>')}</td>
          <td><span class="badge badge-${o.fillingStatus==='done'?'done':'pending'}">${o.fillingStatus||'pending'}</span></td>
          <td><span class="badge badge-${o.packagingStatus==='done'?'done':'pending'}">${o.packagingStatus||'pending'}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  }

  const generalTaskRow = (t, showAssignee)=>`
    <tr>
      <td><b>${esc(t.title)}</b>${t.description?`<div style="font-size:0.75rem;color:var(--ink-soft);margin-top:2px;">${esc(t.description)}</div>`:''}</td>
      ${showAssignee?`<td class="mono">${t.assignedTo?esc(t.assignedToName):esc(taskLabel('— unassigned —'))}</td>`:''}
      <td class="mono">${t.dueDate?esc(t.dueDate):'—'}</td>
      <td><span class="badge badge-${t.status==='done'?'done':'pending'}">${t.status}</span></td>
      <td class="row-actions">
        ${t.status!=='done' && !isAdmin ? `<button class="btn btn-sm btn-success" data-complete-task="${t.id}">${esc(taskLabel('Mark done'))}</button>` : ''}
        ${isAdmin ? `<button class="btn btn-sm btn-outline" data-edit-task="${t.id}">${esc(taskLabel('Edit'))}</button>${t.assignedTo?`<button class="btn btn-sm btn-outline" data-unassign-task="${t.id}">${esc(taskLabel('Unassign'))}</button>`:''}<button class="btn btn-sm btn-danger" data-del-task="${t.id}">${esc(taskLabel('Delete'))}</button>` : ''}
      </td>
    </tr>`;

  const generalTasksBlock = isAdmin ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2>${esc(t('Assigned tasks'))}</h2><p class="desc">${esc(t('Assign a task to anyone.'))}</p></div>
        <button class="btn btn-primary btn-sm" id="newTaskBtn">${esc(t('+ New task'))}</button>
      </div>
      ${allGeneralTasks.length===0?`<div class="empty"><div class="big">🗒️</div>${esc(t('No tasks created yet.'))}</div>`:`
      <table><thead><tr><th>${esc(t('Task'))}</th><th>${esc(t('Assigned to'))}</th><th>${esc(t('Due'))}</th><th>${esc(t('Status'))}</th><th></th></tr></thead><tbody>
        ${allGeneralTasks.map(t=>generalTaskRow(t,true)).join('')}
      </tbody></table>`}
    </div>` : `
    <div class="card">
      <h2>${esc(t('My assigned tasks'))}</h2>
      <p class="desc">${esc(t('From the admin.'))}</p>
      ${myGeneralTasks.length===0?`<div class="empty"><div class="big">🗒️</div>${esc(t('Nothing assigned to you right now.'))}</div>`:`
      <table><thead><tr><th>${esc(t('Task'))}</th><th>${esc(t('Due'))}</th><th>${esc(t('Status'))}</th><th></th></tr></thead><tbody>
        ${myGeneralTasks.map(t=>generalTaskRow(t,false)).join('')}
      </tbody></table>`}
    </div>`;

  const myEntries = getMyEntries(S.currentUser.username);
  const activityBlock = `
    <div class="card">
      <h2>${esc(t('Your recent entries'))}</h2>
      <p class="desc">${esc(t('Everything you\'ve added.'))}</p>
      ${myEntries.length===0?`<div class="empty">${esc(t('Nothing logged by you yet.'))}</div>`:`
      <table><thead><tr><th>${esc(t('Entry'))}</th><th>${esc(t('Detail'))}</th><th>${esc(t('When'))}</th></tr></thead><tbody>
      ${myEntries.map(e=>`<tr><td>${esc(e.label)}<div class="mono" style="margin-top:2px;">${esc(e.tag)}</div></td><td class="mono">${esc(e.detail)}</td><td class="mono">${fmtDate(e.at)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>`;

  return quickActionIcons(role) + generalTasksBlock + orderTasksBlock + activityBlock;
}
function bindTasks(){
  bindQuickActionIcons();
  document.querySelectorAll('[data-mark-filling]').forEach(b=>b.addEventListener('click', ()=>{
    // BUGFIX (2026-09-02, crash/regression sweep): the order this tile
    // referred to could have been deleted (or its doc otherwise removed) by
    // another device's live write between this device's last render and the
    // tap landing -- every other .find() in this function already guards
    // against that (see data-edit-task/data-unassign-task/data-complete-task
    // below); this one didn't, and threw a TypeError reading .fillingStatus
    // off undefined, silently killing the click (no save, no toast, stale
    // tile left on screen with zero feedback).
    const o = S.orders.find(x=>x.id===b.dataset.markFilling); if(!o) return;
    o.fillingStatus='done';
    savePartitionForItem('orders', o); autoAdvanceOrders(); render(); showToast('Filling done — sent to packaging team');
  }));
  document.querySelectorAll('[data-mark-packaging]').forEach(b=>b.addEventListener('click', ()=>{
    const o = S.orders.find(x=>x.id===b.dataset.markPackaging); if(!o) return; // BUGFIX -- see data-mark-filling's comment just above, same issue
    o.packagingStatus='done';
    savePartitionForItem('orders', o); autoAdvanceOrders(); render(); showToast('Packaging done');
  }));
  document.querySelectorAll('[data-quick-fill]').forEach(b=>b.addEventListener('click', ()=>{
    const [key, qty] = b.dataset.quickFill.split('|');
    openFillingModal(key, parseInt(qty)||0);

  document.querySelectorAll('[data-quick-pack]').forEach(b=>b.addEventListener('click', ()=>{

  const newTaskBtn = document.getElementById('newTaskBtn');
  if(newTaskBtn) newTaskBtn.addEventListener('click', ()=>openTaskModal(null));
  document.querySelectorAll('[data-edit-task]').forEach(b=>b.addEventListener('click', ()=>{
    const t = S.tasks.find(x=>x.id===b.dataset.editTask); if(t) openTaskModal(t);
  }));
  document.querySelectorAll('[data-unassign-task]').forEach(b=>b.addEventListener('click', ()=>{
    const t = S.tasks.find(x=>x.id===b.dataset.unassignTask); if(!t) return;
    t.assignedTo = null; t.assignedToName = '— unassigned —';
    safeSet('app:tasks', S.tasks); render(); showToast('Task unassigned');
  }));
  document.querySelectorAll('[data-complete-task]').forEach(b=>b.addEventListener('click', ()=>{
    const t = S.tasks.find(x=>x.id===b.dataset.completeTask); if(!t) return;
    t.status='done'; t.completedAt=Date.now();
    safeSet('app:tasks', S.tasks); render(); showToast('Task marked done');
  }));
  document.querySelectorAll('[data-del-task]').forEach(b=>b.addEventListener('click', ()=>{
    showConfirm('Delete this task?', ()=>{
      const delTaskId = b.dataset.delTask;
      S.tasks = S.tasks.filter(x=>x.id!==delTaskId);
      deleteStaticArrayItem('tasks', delTaskId); render(); // EXPLICIT DELETE (Task #54)
    });
  }));
}

        <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
        <button type="submit" class="btn btn-primary">${esc(t(existingTask?'Save changes':'Create task'))}</button>
      </div>
    </form>
  `);
  document.getElementById('taskForm').addEventListener('submit', withSubmitGuard((e)=>{
    e.preventDefault();

    let assignedTo = value, assignedToName;
    if(value.startsWith('role:')){
      assignedToName = t('All') + ' ' + t(ROLES[value.slice(5)].label);
    } else {
      const u = S.users.find(x=>x.username===value);
      assignedToName = u ? u.name : value;
    }
    if(existingTask){
      Object.assign(existingTask, {
        title: document.getElementById('taskTitle').value.trim(),
        description: document.getElementById('taskDesc').value.trim(),
        assignedTo, assignedToName,
        dueDate: document.getElementById('taskDue').value || ''
      });
    } else {
      S.tasks.push({
        id: uid(), title: document.getElementById('taskTitle').value.trim(),
        description: document.getElementById('taskDesc').value.trim(),
        assignedTo, assignedToName,
        dueDate: document.getElementById('taskDue').value || '',
        status:'open', createdBy: S.currentUser.name, createdByUsername: S.currentUser.username, createdAt: Date.now()
      });
    }
    safeSet('app:tasks', S.tasks);
    closeModal(); render(); showToast('Task assigned');
  }));
}

function renderStockLogModal(key, label, pool){
  const inferPool = m => m.pool || (RAW_CATEGORIES.includes(m.key) ? 'raw' : (m.kind==='filling' ? 'filled' : 'ready')); // old entries (pre-fix) never stored their pool — infer it the same way logStockMovement itself would have
  const entries = S.stockMovementLog.filter(m=>m.key===key && inferPool(m)===pool).sort((a,b)=>b.at-a.at);
  const kindLabel = {purchase:'🛢️ Purchase', filling:'🧴 Filling', packaging:'📦 Packaging', order:'🛍️ Order', retail:'💵 Retail/Sample', adjust:'✏️ Admin adjust'};
  // Older log entries (from before "unit"/"totalAfter" were tracked) fall
  // back to the old purchase-only mL guess, and show "—" for the total
  // since we don't know which pool it was at the time.
  const fmtQty = (m, val)=> (m.unit ? m.unit==='mL' : m.kind==='purchase') ? fmtMl(Math.abs(val)) : Math.abs(val)+' pc';
  showModal(`<h3>📜 Stock Log — ${esc(label)}</h3><p class="desc" style="margin-top:-6px;">Last 7 days.</p>
    ${entries.length===0?`<div class="empty">No movements recorded (last 7 days).</div>`:`
    <table><thead><tr><th>Type</th><th>Change</th><th>Total after</th><th>Note</th><th>By</th><th>Time</th></tr></thead><tbody>
    ${entries.map(m=>`<tr><td>${kindLabel[m.kind]||m.kind}</td><td class="mono ${m.delta>=0?'':'stockneg'}" style="${m.delta>=0?'color:var(--success);font-weight:800;':''}">${m.delta>=0?'+':''}${fmtQty(m,m.delta)}</td><td class="mono">${m.totalAfter!=null?fmtQty(m,m.totalAfter):'—'}</td><td>${esc(m.note)}</td><td>${esc(m.by)}</td><td class="mono">${fmtDate(m.at)}</td></tr>`).join('')}
    </tbody></table>`}
    <div class="modal-actions"><button type="button" class="btn btn-outline" id="cancelModal">Close</button></div>`);
}

  // the search input itself is never touched, so the DOM node keeping
  // focus never gets destroyed/recreated. Rebuilding the whole page (the
  // old behaviour) briefly closed and reopened the on-screen keyboard on
  // every keystroke, since mobile browsers tie keyboard visibility to that
  // specific focused node, not just "an element with the same id".
  bindSearchBar('raw', ()=>{
    const tbody = document.getElementById('stockRows_raw');
    if(tbody){ tbody.innerHTML = renderRawMaterialRows(); bindRawMaterialRows(); }
  });

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
        <button type="submit" class="btn btn-primary">${esc(t('Record'))}</button>
      </div>
    </form>
  `);
  document.getElementById('fillForm').addEventListener('submit', withSubmitGuard(e=>{
    e.preventDefault();
    if(blockIfOutsideEntryWindow()) return;
    const key = prefillKey || (resolveItemFromText(document.getElementById('fillItem').value)||{}).key;
    const it = findItem(key);
    if(!it){ showAlert(t('Pick a valid item from the list.')); return; }
    const qty = parseInt(document.getElementById('fillQty').value)||0;
    if(qty<=0) return;
    if(qty>MAX_PC_ENTRY){ showAlert(`${t('Max')} ${MAX_PC_ENTRY} ${t('pc per entry.')}`); return; }
    const mlNeeded = qty*it.ml;
    const rawAvail = S.rawMaterial[it.rawCat]||0;
    if(rawAvail < mlNeeded){
      const shortL = ((mlNeeded-rawAvail)/1000).toFixed(2);
      showAlert(`${t('Not enough')} ${it.rawCat} ${t('— short by')} ${shortL} ${t('L. Record a purchase first.')}`);
      return;
    }
    S.rawMaterial[it.rawCat] = rawAvail - mlNeeded;
    S.filledStock[key] = (S.filledStock[key]||0) + qty;
    Promise.all([safeSet('app:rawMaterial',S.rawMaterial), safeSet('app:filledStock',S.filledStock)]);
    logActivity({kind:'filling', key, itemLabel:`${it.name} ${it.size}`, qty, rawCat:it.rawCat, mlPer:it.ml});
    logStockMovement(key, `${it.name} ${it.size}`, 'filling', qty, 'Filling recorded');
    completeStockTasksForItem('filled', key);
    syncStockTasksFromAlerts();
    render(); celebrateEntrySaved('Filling recorded'); // Round 15 follow-up: paper-airplane + green success dialog for a new entry
  }));
}

/* ============================= BATCH NUMBER ============================= */
// Batch numbers are per item CATEGORY (product group) — every size of the
// same product shares one batch number, per the business requirement.
// The admin sets a January-2026 starting reference once per item; every
// month after that adds 1 automatically. No lookup table is stored for
// each month — it's derived fresh every time from (reference + months
// elapsed since Jan 2026), so there's nothing to keep in sync.
function monthsSinceJan2026(ts){
  const d = new Date(ts||Date.now());
  return (d.getFullYear()-2026)*12 + d.getMonth(); // getMonth() is 0-based -> Jan=0
}
function currentMonthLabel(ts){
  const d = new Date(ts||Date.now());
  return d.toLocaleDateString('en-US',{month:'short',year:'numeric'});
}
function batchNumberFor(cat, ts){
  const ref = S.batchReferences[cat];
  if(ref==null || ref==='') return null;
  const num = Number(ref) + monthsSinceJan2026(ts);
  const digits = num>=1000 ? 4 : 3; // grows past 3 digits naturally if it ever crosses 999
  return String(Math.max(num,0)).padStart(digits,'0');
}
function openBatchModal(){
  // Batch numbers are per PRODUCT (category), shared across all its sizes —
  // so the picker lists each product name once, not once per size.

/* ============================= RETAIL SALE / SAMPLES ============================= */
let retailDraft = [];
function openRetailModal(type, existingEntry){
  // type: 'sale' (counter/cash sale, one combined total) | 'sample' (free, no amount)
  // existingEntry: pass an existing retailSales record to EDIT it instead of creating a new one
  const isSale = type==='sale';
  retailDraft = existingEntry ? (existingEntry.items||[]).map(x=>({key:x.key, name:findItem(x.key)?findItem(x.key).name:x.itemLabel, size:findItem(x.key)?findItem(x.key).size:'', qty:x.qty})) : [];
  showModal(`
    <h3>${existingEntry?esc(t('Edit'))+' ':''}${isSale?esc(t('💵 Retail / Cash Sale')):esc(t('🎁 Give Sample'))}</h3>
    <p class="desc" style="margin-top:-6px;">${isSale?esc(t('Sold directly from ready stock — deducted immediately.')):esc(t('Given free from ready stock — deducted immediately.'))}</p>
    <div class="field"><label>${esc(t('Add item (type to search)'))}</label>${itemPickerHtml('retailItemSel', null)}</div>
    <div class="field"><label>${esc(t('Quantity (pieces)'))}</label>
      <div style="display:flex;gap:6px;">
        <input id="retailItemQty" type="number" min="0" max="${MAX_PC_ENTRY}" placeholder="${esc(t('Qty'))}" style="flex:2;" />
        <button type="button" class="btn btn-accent btn-sm" id="addRetailItemBtn" style="flex:1;">${esc(t('Add'))}</button>
      </div>
    </div>
    <div id="retailDraftList" style="margin:10px 0;"></div>
    ${isSale?`<div class="field"><label>${esc(t('Total Amount Received (₹)'))}</label><input id="retailTotalAmount" type="number" min="0.01" step="0.01" placeholder="${esc(t('Amount'))}" required ${existingEntry?`value="${existingEntry.totalAmount}"`:''} /></div>`:''}
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
      <button type="button" class="btn btn-primary" id="submitRetailBtn">${esc(t(existingEntry?'Save changes':'Record'))}</button>
    </div>
  `);
  renderRetailDraftList();
  const itemSel = document.getElementById('retailItemSel');
  document.getElementById('addRetailItemBtn').addEventListener('click', ()=>{
    const it = resolveItemFromText(itemSel.value);
    if(!it){ showAlert(t('Pick a valid item from the list.')); return; }
    const qty = parseInt(document.getElementById('retailItemQty').value)||0;
    if(qty<=0){ showAlert(t('Enter a quantity.')); return; }
    if(qty>MAX_PC_ENTRY){ showAlert(`${t('Max')} ${MAX_PC_ENTRY} ${t('pc per line item.')}`); return; }
    const existing = retailDraft.find(d=>d.key===it.key);
    if(existing) existing.qty += qty; else retailDraft.push({key:it.key, name:it.name, size:it.size, qty});
    renderRetailDraftList();
    itemSel.value=''; document.getElementById('retailItemQty').value='0';
  });
  document.getElementById('submitRetailBtn').addEventListener('click', ()=>{
    // BUG FIX (Round 10 audit): booked entries must lock, same as every
    // other Daily Work entry type (see canEditDailyEntry) -- re-checked
    // here at save time (not just at open time in editRetailEntry) so a
    // booking that happens WHILE this modal is open (another admin books
    // it from the Daily Work panel) can't slip a save through.
    if(existingEntry && existingEntry.booked){
      showAlert(t('This entry has already been booked and can no longer be edited.'));
      closeModal(); render(); return;
    }
    if(existingEntry && (!withinSelfEditWindow(existingEntry) || (S.currentUser.role!=='admin' && existingEntry.byUsername!==S.currentUser.username))){
      showAlert(t('This entry can no longer be edited (past the 5-minute window).'));
      closeModal(); render(); return;
    }
    if(!existingEntry && blockIfOutsideEntryWindow()) return; // only gates a NEW sale/sample -- editing an existing one is handled above
    if(retailDraft.length===0){ showAlert(t('Add at least one item.')); return; }
    // BUG FIX (Round 10 audit): double-submit guard -- this is a plain
    // button click, not a <form submit>, so withSubmitGuard isn't wired to
    // it (same reason submitOrderBtn disables itself directly, see the
    // 2026-08-21 audit finding #9 comment above). Guard placed here, but
    // NOT yet disabled: the stock-availability and amount checks just
    // below can still legitimately fail and need a retry within the same
    // open modal, so the element is only disabled once we're past every
    // check that can send the user back to fix something.
    const submitRetailBtnEl = document.getElementById('submitRetailBtn');
    if(submitRetailBtnEl.disabled) return;
    // When editing, this entry's OWN current quantities are already
    // deducted from readyStock — add them back in before checking
    // availability, since they'll be released and re-deducted below.
    const ownQty = key => existingEntry ? ((existingEntry.items||[]).find(x=>x.key===key)?.qty||0) : 0;
    for(const d of retailDraft){
      const currentAvail = (S.readyStock[d.key]||0) + ownQty(d.key);
      if(currentAvail < d.qty){
        showAlert(`${d.name} ${d.size} ${t('— only')} ${currentAvail} ${t('pc available, not enough for')} ${d.qty} ${t('pc.')}`);
        return;
      }
    }
    const totalAmount = isSale ? (parseFloat(document.getElementById('retailTotalAmount').value)||0) : 0;
    if(isSale && totalAmount<=0){ showAlert(t('Enter the amount received.')); return; }
    submitRetailBtnEl.disabled = true; // committed to submitting from here on -- every path below is synchronous and ends in closeModal(), which removes the button
    if(existingEntry) (existingEntry.items||[]).forEach(d=>{ S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty; logStockMovement(d.key, d.itemLabel, 'retail', d.qty, 'Retail entry edited — released for re-recording'); }); // release old
    retailDraft.forEach(d=>{ S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty; logStockMovement(d.key, `${d.name} ${d.size}`, 'retail', -d.qty, `${isSale?'Retail sale':'Sample given'}${existingEntry?' (edited)':''}`); }); // deduct new
    const entry = existingEntry || { id:uid(), type, by:S.currentUser.name, byUsername:S.currentUser.username, at:Date.now() };
    entry.items = retailDraft.map(d=>({ key:d.key, itemLabel:`${d.name} ${d.size}`, qty:d.qty }));
    entry.totalAmount = totalAmount;
    if(!existingEntry) S.retailSales.push(entry);
    safeSet('app:readyStock', S.readyStock);
    savePartitionForItem('retailSales', entry);
    syncStockTasksFromAlerts(); // this deduction can itself create/worsen a shortage
    render();
    // Round 15 follow-up: only a genuinely NEW sale/sample gets the paper-
    // airplane + green success dialog -- editing an existing entry keeps
    // the plain close+toast, unchanged.
    if(existingEntry){ closeModal(); showToast('Updated'); }
    else celebrateEntrySaved(isSale?'Sale recorded':'Sample recorded');
  });
}
function renderRetailDraftList(){
  const el = document.getElementById('retailDraftList');
  if(!el) return;
  if(retailDraft.length===0){ el.innerHTML = `<div style="font-size:0.78125rem;color:var(--ink-soft);">${esc(t('No items added yet.'))}</div>`; return; }
  el.innerHTML = retailDraft.map((d,i)=>`

}
function editRetailEntry(id){
  if(S.currentUser.role!=='admin') return; // Edit is admin-only — this guards against any path besides the (already admin-gated) button
  const entry = S.retailSales.find(e=>e.id===id);
  if(!entry) return;
  // BUG FIX (Round 10 audit): booked entries must lock, same as every
  // other Daily Work entry type (see canEditDailyEntry) -- this is the
  // single dispatch point both the Orders-page Retail Sale card's Edit
  // button (renderRetailSalesCard, admin-only, previously had NO booked

}

  document.getElementById('bulkStockSave').addEventListener('click', ()=>{
    // BUG FIX (Round 10 audit): the single-item "Adjust" modal

    // catches a fat-fingered extra zero via a magnitude cap -- bulk edit
    // had no such check at all, even though it's the same kind of raw
    // number input (type="button" Save, so browser min/max attributes on
    // the per-row inputs are never actually enforced either). Reusing the
    // same MAX_STOCK_ADJUST_L/PC caps here, validated across every row
    // BEFORE any store value is touched, so one bad row can't cause a
    // partial save.
    const bulkAdjCap = kind==='raw' ? MAX_STOCK_ADJUST_L : MAX_STOCK_ADJUST_PC;
    let badRow = null;
    document.querySelectorAll('[data-bulk-qty]').forEach(inp=>{
      if(badRow || inp.value==='') return;
      const raw = parseFloat(inp.value)||0;
      if(Math.abs(raw) > bulkAdjCap) badRow = { id: inp.dataset.bulkQty, raw };
    });
    if(badRow){
      const it = items.find(x=>x.id===badRow.id);
      showAlert(`${it?it.label:badRow.id}: ${badRow.raw.toLocaleString()} ${unit} ${t('is more than')} ${bulkAdjCap.toLocaleString()} ${unit} ${t('— please double-check for a typo (extra zero?) before saving. Nothing was saved.')}`);
      return;
    }
    let qtyChanged=false, lowChanged=false;
    document.querySelectorAll('[data-bulk-qty]').forEach(inp=>{
      if(inp.value==='') return; // left blank -> skip, no change
      const id = inp.dataset.bulkQty;
      const raw = parseFloat(inp.value)||0;
      const val = kind==='raw' ? raw*1000 : raw; // Liters -> mL for raw material
      const store = kind==='raw'?S.rawMaterial:kind==='filled'?S.filledStock:S.readyStock;
      if(store[id]!==val){ store[id]=val; qtyChanged=true; }
    });
    document.querySelectorAll('[data-bulk-low]').forEach(inp=>{
      const id = inp.dataset.bulkLow;
      const raw = inp.value==='' ? 0 : (parseFloat(inp.value)||0);
      const val = kind==='raw' ? raw*1000 : raw; // Liters -> mL for raw material
      const store = kind==='raw'?S.lowStock.raw:kind==='filled'?S.lowStock.filled:S.lowStock.ready;
      const cur = store[id]||0;
      if(val>0){ if(cur!==val){ store[id]=val; lowChanged=true; } }
      else if(cur){ delete store[id]; lowChanged=true; }
    });
    if(qtyChanged){
      const key = kind==='raw'?'app:rawMaterial':kind==='filled'?'app:filledStock':'app:readyStock';
      safeSet(key, kind==='raw'?S.rawMaterial:kind==='filled'?S.filledStock:S.readyStock);
      if(kind==='ready') autoAdvanceOrders();
      if(kind==='filled' || kind==='ready') syncStockTasksFromAlerts();
    }
    if(lowChanged) safeSet('app:lowStock', S.lowStock);
    closeModal();
    if(!qtyChanged && !lowChanged){ showToast('No changes made'); return; }
    render(); showToast('Bulk update saved');
  });
}

function openAdjustModal(kind, id, currentVal, label){
  const isRaw = kind==='raw';
  const displayVal = isRaw ? +(currentVal/1000).toFixed(2) : currentVal;
  showModal(`
    <h3>${esc(t('Adjust —'))} ${esc(label)}</h3>
