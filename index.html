let loginSubmitting = false;
// See bindLogin's submit handler (below) and fsBootstrapAuth's
// onAuthStateChanged handler (above) for the full story -- set true the
// instant an interactive login attempt begins (before Firebase's own
// signIn call, which can fire onAuthStateChanged before this async
// function even gets control back), cleared on every failure path in the
// submit handler and by finalizeLogin once a successful attempt's loading
// + "Tap to Continue" sequence actually completes.
let interactiveLoginInFlight = false;
// ---- Failed-login lockout (security feature, 2026-08-21): 5 wrong
// attempts in a row locks that USERNAME (not just this browser) out for
// 120 seconds, synced via S.loginLockouts/app:loginLockouts so it's a real
// cross-device limit. As of this same date's server-side auth fix (findings
// #3/#4), the actual failCount/lockedUntil bookkeeping moved to the server
// (recordFailedLoginServer_/clearFailedLoginsServer_ in
// order-ops-backend.gs, run as part of action:"login" itself) since login
// verification moved there too — a client-only write here would now just
// be rejected (session_required) anyway, since it happens before any
// session exists. S.loginLockouts is still read here (see bindLogin below)
// purely as a fast local pre-check to skip an unnecessary round-trip when
// we already know from normal sync that this username is locked; the
// server's own check in the login action is what's actually authoritative.
function bindLogin(){
  loginSubmitting = false; // reset every time the login form is (re)shown — e.g. after logout — so a stuck flag from a prior successful login never blocks the next one
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    // Guards against a double-submit (e.g. impatient double-click / double
    // Enter) firing this handler twice while still awaiting loadAllPromise —
    // that used to race two loading sequences against each other and made
    // the delay look like it got skipped or cut short.
    if(loginSubmitting) return;
    loginSubmitting = true;
    // BUGFIX (2026-08-29, "click krte hi foran kaam krni chahiye" -- the
    // Round 7 onAuthStateChanged fix above turned out to be too late to
    // actually close this race): the fix gated onAuthStateChanged's
    // auto-login branch on S.postLoginPhase being unset -- but Firebase's
    // signInWithEmailAndPassword() itself already updates its internal auth
    // state and fires onAuthStateChanged as PART OF resolving, before this
    // async function even gets control back from `await fsLogin(...)`
    // below. So onAuthStateChanged was firing (and finding S.postLoginPhase
    // still null, since startPostLoginSequence hadn't run yet) BEFORE this
    // handler ever reached the line that sets it -- the Round 7 fix
    // narrowed the race window but never actually closed it, which is
    // exactly why login could still jump straight to the portal with no
    // loading/welcome screen. Fixed properly this time: set
    // interactiveLoginInFlight=true SYNCHRONOUSLY, right here, before
    // fsLogin() (and therefore before Firebase's own signIn call) even
    // starts -- so no matter how early onAuthStateChanged fires, it's
    // already true. Cleared on every exit path below except success, where
    // finalizeLogin (once the person actually taps "Tap to Continue") is
    // what clears it -- see finalizeLogin's own comment.
    interactiveLoginInFlight = true;
    // Safety net: every real exit path already clears this (see below and
    // finalizeLogin), but if some future change ever adds a path that
    // doesn't, a permanently-stuck true here would silently disable the
    // "restore an already-active session" branch for the rest of the page
    // session. Auto-clears itself well past any legitimate login attempt's
    // duration (loading+welcome alone is ~2.25s+); harmless no-op if the
    // real clear already ran.
    setTimeout(()=>{ interactiveLoginInFlight = false; }, 20000);
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if(loadAllPromise) await loadAllPromise; // data may still be loading in the background — wait for it before checking credentials
    const uKey = u.trim().toLowerCase();
    const lock = S.loginLockouts[uKey];
    if(lock && lock.lockedUntil && lock.lockedUntil > Date.now()){
      loginSubmitting = false;
      interactiveLoginInFlight = false;
      const waitSec = Math.max(1, Math.ceil((lock.lockedUntil - Date.now())/1000));
      loginError = `Too many failed attempts — try again in ${waitSec}s.`;
      render();
      return;
    }
    // Task #54: password verification now happens via Firebase Auth
    // (fsLogin, real hash check + Firebase's own brute-force throttling
    // server-side) instead of Apps Script's action:'login'.
    let result;
    try{
      result = await fsLogin(u, p);
    }catch(netErr){
      // Server unreachable (not a wrong password). UNLIKE the old
      // Sheets-backed app, there is no local-hash fallback available here
      // any more — Task #52's export deliberately never puts a password
      // hash on the client (S.users never carries one, migrated or not),
      // so a genuinely fresh sign-in on this device requires connectivity
      // the first time, same as any standard Firebase Auth app. A device
      // that was ALREADY signed in before going offline stays signed in
      // regardless (see fsBootstrapAuth — Firebase Auth's own persisted
      // session handles that case entirely separately from this form).
      console.error('Firebase Auth unreachable — cannot verify a fresh sign-in offline', netErr);
      loginSubmitting = false;
      interactiveLoginInFlight = false;
      loginError = 'No connection — please reconnect and try again.';
      render();
      return;
    }
    if(result && result.ok && result.user){
      loginError = '';
      // Defensive reset (matches the other two branches below) — normally
      // unnecessary since a successful login moves on to the loading/welcome
      // screens (no login form left to resubmit), but bindLogin() resetting
      // it again is the ONLY thing that ever clears this otherwise, so if
      // any future change ever lands back on the login form after a
      // "successful" result without going through bindLogin again, this
      // stops the submit button from staying permanently stuck disabled.
      loginSubmitting = false;
      // interactiveLoginInFlight deliberately stays true here — the loading
      // + "Tap to Continue" sequence is about to run, and finalizeLogin (not
      // this handler) is what clears it once that sequence actually
      // completes and hands off to the real portal.
      // Prefer the already-loaded local user record (same object identity
      // as everything else in S.users) when we have it; Firestore's own
      // copy is only a fallback for the rare case the local list hasn't
      // synced this account yet.
      const matched = S.users.find(x=>(x.username||'').toLowerCase()===result.user.username.toLowerCase()) || result.user;
      startPostLoginSequence(matched);
    } else if(result && result.error === 'too_many_attempts'){
      loginSubmitting = false;
      interactiveLoginInFlight = false;
      loginError = 'Too many failed attempts — please wait a few minutes and try again.';
      render();
    } else if(result && result.error === 'no_profile'){
      // BUGFIX (2026-09-09) -- see fsLogin's own comment on this error code.
      // Deliberately NOT startWrongLoginSequence() here -- that animation
      // and its final "Invalid Login ID & Password" message are for a
      // genuinely wrong password (the person should just retype it), which
      // this isn't: the password was CORRECT, but there's no staff profile
      // for this account, which only an admin can fix (Users → Delete this
      // account, then + Add user again with the same username re-creates
      // it correctly — see createStaffUser's own repair-path comment).
      // Showing the same "wrong password" message here would send someone
      // with a perfectly correct password down a pointless retry loop.
      loginSubmitting = false;
      interactiveLoginInFlight = false;
      loginError = 'Your password is correct, but no staff profile was found for this account. Please ask an admin to fix this account (Users → Team).';
      render();
    } else {
      loginSubmitting = false;
      interactiveLoginInFlight = false;
      startWrongLoginSequence();
    }
  });
}

/* ============================= POST-LOGIN SEQUENCE (loading -> welcome) ============================= */
// BUGFIX (2026-08-29, "login single click me kaam nahi karta"): both
// sequences below used to guard with a blanket `if(S.postLoginPhase)
// return;`, and each one's own setTimeout tick chain ran to completion
// unconditionally once started, sharing the SAME S.postLoginLoadingStep
// counter. Concretely: someone mistypes their password -> startWrongLoginSequence
// starts its ~4s "Fake login found... Report sent to company" animation,
// but ALREADY resets loginSubmitting=false as soon as it starts (see the
// submit handler above) -- so the form can be submitted again immediately,
// while that animation is still playing. If their SECOND attempt (this
// time correct) resolves during those ~4 seconds, startPostLoginSequence's
// guard saw postLoginPhase==='wrongLogin' (truthy) and silently dropped
// the successful login entirely -- then, a moment later, the still-running
// wrongLogin tick chain finished on its own and overwrote the screen with
// "Invalid Login ID & Password", even though the most recent attempt was
// actually correct. From the person's side this looks exactly like "I
// typed it right and it still said invalid" / "took multiple tries".
// Fixed with a generation counter: a NEW sequence starting is always
// allowed to supersede an in-progress 'wrongLogin' animation (it's just a
// rejected-attempt animation, nothing worth protecting), which bumps the
// generation so the OLD sequence's still-pending tick(s) recognize they've
// been superseded and quietly no-op instead of corrupting the new
// sequence's postLoginPhase/postLoginLoadingStep out from under it. A
// genuinely in-progress 'loading'/'welcome' sequence (a real successful
// login already under way) still can't be interrupted -- there's no
// legitimate reason for a second one of those to start.
let postLoginSequenceGen = 0;
// BUGFIX (2026-09-09, live report -- "login k time kayi bar Blink ho rhi h
// login screen"): root-caused via code inspection, not guesswork -- render()
// unconditionally does `root.innerHTML = renderPostLoginSequence()` for the
// whole `!S.currentUser && S.postLoginPhase` branch (unlike the logged-in
// branch just below it, which explicitly skips a re-render when nothing
// actually changed -- see render()'s own "byte-for-byte identical" comment,
// added for a near-identical earlier bug). Both startPostLoginSequence
// (every successful login: 3 steps, 750ms apart) and startWrongLoginSequence
// (every failed login: 3 steps, 1330ms apart) call render() once PER STEP
// just to update one line of message text -- so EVERY login, successful or
// not, tore down and rebuilt the entire welcome-screen subtree 3 times in a
// row. Rebuilding it doesn't just update the text: the spinner is a fresh
// DOM node each time, so its CSS rotation animation restarts from 0deg
// (a visible jump), and .loading-msg-fade's own entrance animation restarts
// on the freshly-created element too -- multiple visible flashes/restarts
// per login, exactly the reported "blink kayi bar." Fixed by updating the
// message text (and the spinner's alert-color class) IN PLACE for every
// step after the first, instead of replacing the DOM at all -- the spinner
// keeps spinning continuously with no jump, and only the small text element
// re-plays its own fade (a much smaller, less jarring transition than the
// whole screen flashing). The FIRST render() into a phase, and the FINAL
// transition out of one (to 'welcome', or back to the plain login form with
// an error), are genuine screen changes and still go through the normal
// full render() -- only the repeated same-screen message-text ticks in
// between were ever the problem.
function updatePostLoginSequenceText(){
  const msgEl = document.querySelector('.loading-msg-fade');
  const spinnerEl = document.querySelector('.postlogin-spinner');
  if(!msgEl || !spinnerEl) return false; // the expected structure isn't on screen (e.g. this is the very first tick, or some other screen is showing) — caller falls back to a full render()
  const msg = S.postLoginPhase === 'wrongLogin'
    ? (WRONG_LOGIN_MSGS[S.postLoginLoadingStep] || 'Checking…')
    : (POST_LOGIN_LOADING_MSGS[S.postLoginLoadingStep] || 'Loading…');
  msgEl.textContent = msg;
  // Re-trigger just THIS element's own fade-in (not the whole screen) by
  // removing the animation class, forcing a reflow so the browser actually
  // notices it was removed, then re-adding it — a much smaller, less
  // jarring visual than rebuilding the entire screen ever was.
  msgEl.classList.remove('loading-msg-fade');
  void msgEl.offsetWidth;
  msgEl.classList.add('loading-msg-fade');
  spinnerEl.classList.toggle('spinner-alert', S.postLoginPhase==='wrongLogin');
  return true;
}
const POST_LOGIN_LOADING_MSGS = ['Loading Orders…','Loading Stock…','Updating other features…'];
function startPostLoginSequence(user){
  if(S.postLoginPhase==='loading' || S.postLoginPhase==='welcome') return; // a genuine successful-login sequence is already running — never restart that one
  const myGen = ++postLoginSequenceGen; // supersedes any still-ticking wrongLogin sequence from a moment ago
  S.pendingUser = user;
  S.postLoginPhase = 'loading';
  S.postLoginLoadingStep = 0;
  render();
  const stepMs = 750; // 3 steps ≈ 2.25s total, comfortably over the requested 2s
  const tick = ()=>{
    if(myGen !== postLoginSequenceGen) return; // superseded by a newer sequence — let that one own postLoginPhase/postLoginLoadingStep instead
    S.postLoginLoadingStep++;
    if(S.postLoginLoadingStep < POST_LOGIN_LOADING_MSGS.length){
      if(!updatePostLoginSequenceText()) render(); // see this function's own header comment — avoids the "blink"
      setTimeout(tick, stepMs);
    } else {
      S.postLoginPhase = 'welcome';
      render();
    }
  };
  setTimeout(tick, stepMs);
}
const WRONG_LOGIN_MSGS = ['Searching for employee ID…','Fake login found','Report sent to company'];
function startWrongLoginSequence(){
  if(S.postLoginPhase==='loading' || S.postLoginPhase==='welcome') return; // never stomp a genuine successful-login sequence already in progress
  const myGen = ++postLoginSequenceGen;
  S.postLoginPhase = 'wrongLogin';
  S.postLoginLoadingStep = 0;
  render();
  const stepMs = 1330; // 3 steps ≈ 4s total
  const tick = ()=>{
    if(myGen !== postLoginSequenceGen) return; // superseded by a newer sequence (e.g. a correct retry submitted while this animation was still playing) — don't overwrite its state
    S.postLoginLoadingStep++;
    if(S.postLoginLoadingStep < WRONG_LOGIN_MSGS.length){
      if(!updatePostLoginSequenceText()) render(); // see updatePostLoginSequenceText's own header comment — avoids the "blink"
      setTimeout(tick, stepMs);
    } else {
      S.postLoginPhase = null;
      loginError = 'Invalid Login ID & Password';
      render();
    }
  };
  setTimeout(tick, stepMs);
}
function renderPostLoginSequence(){
  if(S.postLoginPhase === 'welcome'){
    const name = S.pendingUser ? S.pendingUser.name : '';
    return `<div class="login-wrap">
      <div class="welcome-screen">
        <div class="welcome-fade d1">Hello, ${esc(name)}</div>
        <div class="welcome-fade d2" style="opacity:0.75;font-size:0.875rem;margin-top:10px;">Welcome to</div>
        <div class="welcome-fade d3 welcome-brand">M A Products INDIA</div>
        <div class="welcome-fade d4"><img src="${COMPANY_LOGO}" alt="M A Products India" class="welcome-logo" /></div>
        <button class="btn btn-primary welcome-fade d4" id="continueBtn" style="width:auto;padding:13px 30px;margin-top:8px;">Tap to Continue ›</button>
      </div>
    </div>`;
  }
  const msg = S.postLoginPhase === 'wrongLogin'
    ? (WRONG_LOGIN_MSGS[S.postLoginLoadingStep] || 'Checking…')
    : (POST_LOGIN_LOADING_MSGS[S.postLoginLoadingStep] || 'Loading…');
  return `<div class="login-wrap">
    <div class="welcome-screen">
      <img src="${COMPANY_LOGO}" alt="M A Products India" class="welcome-logo" style="margin-bottom:22px;" />
      <div class="postlogin-spinner ${S.postLoginPhase==='wrongLogin'?'spinner-alert':''}"></div>
      <div class="loading-msg-fade" style="margin-top:18px;font-size:0.875rem;font-weight:700;letter-spacing:0.02em;">${esc(msg)}</div>
    </div>
  </div>`;
}
function bindPostLoginSequence(){
  const btn = document.getElementById('continueBtn');
  // BUG FIX (Round 10 audit): double-submit guard. finalizeLogin is
  // synchronous and its own render() call replaces this welcome screen
  // (removing this exact button) once it's done, but on a slow device --
  // or a fast enough double-tap -- a second click can still queue and
  // fire before that render() finishes, running the whole login-finalize
  // sequence (session token issuance, login log entry, push init, missed-
  // notification replay) a second time. Disabling synchronously, before
  // finalizeLogin runs, closes that window the same way every other
  // plain-button double-submit fix in this round does.
  if(btn) btn.addEventListener('click', ()=>{
    if(btn.disabled) return;
    btn.disabled = true;
    finalizeLogin(S.pendingUser);
  });
}

function myRoleAlerts(stockAlerts){
  // Each role only sees alerts relevant to their own job. Sales doesn't
  // handle stock at all, so they get none — no "Alerts for you" card, no
  // alert bells (see myRoleAlertKinds below, which drives those bells).
  const role = S.currentUser.role;
  if(role==='admin' || role==='manager') return [...stockAlerts.raw, ...stockAlerts.filled, ...stockAlerts.ready];
  if(role==='filling') return stockAlerts.filled;   // filled stock short -> filling team fills more
  if(role==='packaging') return stockAlerts.ready;  // ready stock short -> packaging team packs more
  return [];
}
// Splits this role's relevant stock alerts into the 3 severity tiers,
// grouped by kind (raw/filled/ready) for rendering. Recommended is only
// meaningful to surface when there's nothing more pressing for this role.
function myAlertTiers(stockAlerts){
  const role = S.currentUser.role;
  const kinds = myRoleAlertKinds(role);
  const urgentByKind = {}, lowByKind = {}, recByKind = {};
  kinds.forEach(k=>{
    urgentByKind[k] = stockAlerts[k].filter(a=>a.level==='critical');
    lowByKind[k] = stockAlerts[k].filter(a=>a.level==='low');
    recByKind[k] = stockAlerts.recommended[k] || [];
  });
  const urgentCount = kinds.reduce((s,k)=>s+urgentByKind[k].length,0);
  const lowCount = kinds.reduce((s,k)=>s+lowByKind[k].length,0);
  const recCount = kinds.reduce((s,k)=>s+recByKind[k].length,0);
  return { kinds, urgentByKind, lowByKind, recByKind, urgentCount, lowCount, recCount, showRecommended: recCount>0 && (urgentCount+lowCount)===0 };
}
function myNotifCount(stockAlerts){
  const role = S.currentUser.role;
  const pendingOrders = S.orders.filter(o=>o.status==='pending').length;
  const reviewTasks = S.orders.filter(o => o.fillingStatus==='review' || o.packagingStatus==='review').length;
  if(role==='admin') return pendingOrders+reviewTasks;
  if(role==='manager') return S.orders.filter(o=>o.status==='processing' && (o.fillingStatus!=='done'||o.packagingStatus!=='done')).length;
  if(role==='filling') return S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done' && orderNeedsRoleWork(o,'filling',stockAlerts)).length;
  if(role==='packaging') return S.orders.filter(o=>o.status==='processing' && o.fillingStatus==='done' && o.packagingStatus!=='done' && orderNeedsRoleWork(o,'packaging',stockAlerts)).length;
  return 0;
}

        ${tiers.lowCount>0?`<button class="bell bell-sm bell-low" id="lowBellBtn" title="Low stock">⚠️<span class="badge badge-pulse-new">${tiers.lowCount}</span></button>`:''}

// RESTORED (2026-09-08, explicit user request: "sare users ko apna apna
// pwd change krne ka b option wps dedo" -- give everyone back the option
// to change their own password): this self-service flow was removed on
// 2026-08-29 (see the old comment this replaced, kept in the file's git-
// style history/status doc) at the time to match the pre-Firestore
// system, which never had it -- but after this session's mass password
// reset (every account force-set to a random temporary password so admin
// could recover from a broken login), everyone needs their OWN way to
// set a real, memorable password instead of relying on the admin to
// reset each one individually forever. Re-wired exactly as it was left
// (reauthenticate with the CURRENT password via Firebase Auth's own
// EmailAuthProvider, then updatePassword) -- nothing about the mechanism
// needed to change, only the missing button + click handler. The admin-
// only Reset Password (Users → Edit → Reset password, no old password
// needed) still exists unchanged alongside this -- this is now an EITHER/
// OR: a staff member can set their own, or an admin can force a fresh one
// for them (e.g. if they forget it entirely and can't reauthenticate).
function openChangePasswordModal(){
  showModal(`
    <h3>${esc(t('Change password'))}</h3>
    <form id="changePasswordForm">
      <div class="field"><label>${esc(t('Current password'))}</label><input id="cpCurrent" type="password" autocomplete="current-password" required /></div>
      <div class="field"><label>${esc(t('New password'))}</label><input id="cpNew" type="password" autocomplete="new-password" minlength="6" required /></div>
      <div class="field"><label>${esc(t('Confirm new password'))}</label><input id="cpConfirm" type="password" autocomplete="new-password" minlength="6" required /></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
        <button type="submit" class="btn btn-primary">${esc(t('Change password'))}</button>
      </div>
    </form>
  `);
  document.getElementById('changePasswordForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const submitBtn = document.querySelector('#changePasswordForm button[type="submit"]');
    if(submitBtn && submitBtn.disabled) return;
    if(submitBtn) submitBtn.disabled = true;
    const reenable = ()=>{ if(submitBtn) submitBtn.disabled = false; };
    const current = document.getElementById('cpCurrent').value;
    const nextPw = document.getElementById('cpNew').value;
    const confirmPw = document.getElementById('cpConfirm').value;
    if(nextPw.length < 6){ showAlert(t('New password must be at least 6 characters.')); reenable(); return; }
    if(nextPw !== confirmPw){ showAlert(t("New passwords don't match.")); reenable(); return; }
    const fbUser = fsAuth.currentUser;
    if(!fbUser || !fbUser.email){ showAlert(t('Your session has expired — please log in again.')); reenable(); closeModal(); return; }
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(fbUser.email, current);
      await fbUser.reauthenticateWithCredential(cred);
      await fsChangePassword(nextPw);
      closeModal();
      showToast(t('Password changed ✅'));
    }catch(err){
      const code = err && err.code;
      if(code==='auth/wrong-password' || code==='auth/invalid-credential' || code==='auth/invalid-login-credentials'){
        showAlert(t('Current password is incorrect.'));
      } else if(code==='auth/weak-password'){
        showAlert(t('That new password is too weak — try a longer one.'));
      } else if(code==='auth/too-many-requests'){
        showAlert(t('Too many attempts — please wait a bit and try again.'));
      } else {
        console.error('Change password failed', err);
        showAlert(t('Could not change password — check your connection and try again.'));
      }
      reenable();
    }
  });
}

// BUGFIX (2026-08-29, full security audit): used to check
// `(S.readyStock[d.key]||0) >= 0` -- the GLOBAL, shared pool for that item
// -- which cannot tell "THIS order is covered" apart from "some OTHER,
// later order sharing the same item is the one that's short." When two+
// processing orders claim the same item and the pool can't cover all of
// them, the global readyStock figure goes negative for EVERY one of those
// orders alike, even the earliest one that has full FIFO priority over the
// shortfall -- so that earliest order could sit stuck in Processing forever
// even though its own order tile already correctly shows "✔ Fully Stocked"
// (renderOrderTile computes that badge via computeFifoShortages, the
// FIFO-aware source of truth this function was never actually using).
// Fixed to take the SAME computeFifoShortages() map renderOrderTile already
// trusts, and check per-order-per-item shortage instead of the shared pool.
function orderIsFullyStocked(o, fifoShortages){
  return o.items.every(d => d.cancelled || !fifoShortages.has(`${o.id}::${d.key}`));
}
// Orders move Processing -> Ready automatically the moment every item on
// them is actually covered by current stock — driven purely by the normal
// Record Packaging flow, no separate manual step needed.
function autoAdvanceOrders(){
  let changed = false;
  // FIXED (same bug/fix as autoAdvanceFillingPackaging above -- see its
  // comment for the full explanation): `savePartitionDay` doesn't exist.
  const touchedOrders = new Set();
  // Computed ONCE per call (not per-order) -- computeFifoShortages already
  // walks every order/item itself, so this keeps autoAdvanceOrders linear
  // instead of quadratic in the order count, and guarantees every order in
  // this pass is judged against the exact same FIFO snapshot.
  const fifoShortages = computeFifoShortages();
  S.orders.forEach(o=>{
    if(o.status==='processing' && orderIsFullyStocked(o, fifoShortages)){
      o.status='ready'; changed=true; touchedOrders.add(o);
    }
  });
  touchedOrders.forEach(o=>fsSaveOrderStatusFields(o));
  return changed;
}
// Admin can jump straight to Ready before stock naturally catches up on
// every item — whatever's still short right now gets marked Cancelled.
// Undoable: reverses only the items THIS action cancelled, and puts the
// order back to Processing.
// BUGFIX (2026-09-02, live user report: "order tiles me live update nhi ho
// rha, agla step click krne pr foran wha se hat jana chahiye lekin us tile
// ko close kro phir hat jata hai" -- an order advanced via one of these 4
// buttons stayed visible in whichever STAT-COUNT MODAL it was opened from
// (the "Processing: N"/"Under Packing: N"/"Ready to Dispatch: N" popups
// opened via openStatModal) until that modal was manually closed, even
// though the order genuinely had advanced (the real Orders tab tile behind
// it was already correct). Root cause: showModal()'s .modal-overlay is
// deliberately a DOM SIBLING of #root (see showModal's own comment), so
// render()'s root.innerHTML rebuild -- which these 4 functions already
// correctly call on every status change -- can never touch an open modal's
// content; the modal keeps showing whatever list was snapshotted at
// showModal() time. The sibling approve/reject/delete handlers in
// bindOrderRowActions() already solved this exact problem (an explicit
// `if(closeAfter) closeModal();`) but that fix was never carried over to
// these 4 -- they now take an optional onDone callback, invoked right after
// their own render(), so bindOrderRowActions can pass closeModal through
// when (and only when) the button was rendered inside one of those modals.
function markOrderReadyNow(orderId, onDone){
  if(S.currentUser.role!=='admin') return; // admin-only
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  showConfirm('Mark this order Ready now? Any item still short in stock will be marked Cancelled.', ()=>{
    let stockChanged = false;
    o.items.forEach(it=>{
      if(it.cancelled) return;
      const stockNow = S.readyStock[it.key]||0;
      if(stockNow < 0){
        it.cancelled = true; it.autoCancelledByReady = true;
        // This item's need no longer exists — credit back the qty that was
        // deducted for it at accept time, same as deleting an order does.
        // Otherwise the shortage number (and the filling/packing task it
        // drives) stays inflated for a need that's no longer real.
        S.readyStock[it.key] = stockNow + it.qty;
        logStockMovement(it.key, `${it.name} ${it.size}`, 'order', it.qty, `Mark Ready — item cancelled (short), credited back — ${orderDisplayLabel(o)}`);
        stockChanged = true;
      }
    });
    o.status = 'ready';
    o.updatedByUsername = S.currentUser.username; // FIELD CONTRACT (functions/index.js) -- excludes this device's own action from its push notification
    savePartitionForItem('orders', o);
    if(stockChanged){ safeSet('app:readyStock', S.readyStock); syncStockTasksFromAlerts(); }
    render();
    showToast('Order marked Ready — short items cancelled (undoable)');
    if(onDone) onDone();
  }, {danger:false, confirmLabel:'Mark Ready'});
}
function undoMarkOrderReady(orderId, onDone){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  let stockChanged = false;
  o.items.forEach(it=>{
    if(it.autoCancelledByReady){
      it.cancelled = false; delete it.autoCancelledByReady;
      // Re-deduct the qty that was credited back, since this item is
      // needed again now that the order is back in Processing.
      S.readyStock[it.key] = (S.readyStock[it.key]||0) - it.qty;
      logStockMovement(it.key, `${it.name} ${it.size}`, 'order', -it.qty, `Undo Mark Ready — item needed again, re-deducted — ${orderDisplayLabel(o)}`);
      stockChanged = true;
    }
  });
  o.status = 'processing';
  o.updatedByUsername = S.currentUser.username;
  savePartitionForItem('orders', o);
  if(stockChanged){ safeSet('app:readyStock', S.readyStock); syncStockTasksFromAlerts(); }
  render();
  showToast('Undone — back to Processing');
  if(onDone) onDone();
}
// Ready -> Packed is a manual physical-packing checkpoint (admin/manager
// only) that sits between the order being fully stocked (Ready) and the
// actual dispatch booking (Processed & Dispatched, which opens the LR/
// transport modal). No stock side-effects — purely a status + audit trail.
function markOrderPacked(orderId, onDone){
  if(S.currentUser.role!=='admin' && S.currentUser.role!=='manager') return;
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  if(o.status!=='ready') return;
  o.status = 'packed';
  o.packedAt = Date.now();
  o.packedBy = S.currentUser.name;
  o.updatedByUsername = S.currentUser.username;
  savePartitionForItem('orders', o);
  render();
  showToast('Order marked Ready to Dispatch');
  if(onDone) onDone();
}
function undoMarkOrderPacked(orderId, onDone){
  if(S.currentUser.role!=='admin' && S.currentUser.role!=='manager') return;
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  if(o.status!=='packed') return;
  o.status = 'ready';
  delete o.packedAt; delete o.packedBy;
  o.updatedByUsername = S.currentUser.username;
  savePartitionForItem('orders', o);
  render();
  showToast('Undone — back to Under Packing');
  if(onDone) onDone();
}

    <div class="field"><label>${esc(t('Transport Name'))}</label>
      <input id="dispatchTransport" list="dispatchTransportList" value="${esc(prefillTransport)}" placeholder="${esc(t('e.g. XYZ Roadways'))}" required />
      <datalist id="dispatchTransportList">${S.transports.map(tr=>`<option value="${esc(tr)}"></option>`).join('')}</datalist>
    </div>
    <div class="field"><label>${esc(t('Total No. of Cases'))}</label><input id="dispatchCases" type="number" min="0" placeholder="${esc(t('e.g. 12'))}" /></div>
    ${photoTypeToggleHtml('lr')}
    <div class="field"><label>${esc(t('Photo (optional)'))}</label><input id="dispatchLRFile" type="file" accept="image/*" capture="environment" /></div>
    <div class="field" id="dispatchLRNumberField"><label>${esc(t('LR Number (optional)'))}</label><input id="dispatchLRNumber" placeholder="${esc(t('e.g. LR-4821'))}" /></div>
    <div id="dispatchLRStatus" style="font-size:0.75rem;color:var(--ink-soft);margin:-6px 0 4px;"></div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
      <button type="button" class="btn" id="dispatchSubmitBtn" style="background:var(--warning);color:#fff;">${esc(t('Submit Without LR'))}</button>
    </div>
  `);
  let dispatchPhotoType = 'lr';
  const dispatchLRNumberField = document.getElementById('dispatchLRNumberField');
  const lrFileInputEl = document.getElementById('dispatchLRFile');
  const submitBtnEl = document.getElementById('dispatchSubmitBtn');
  const refreshDispatchSubmitBtn = ()=>{
    const hasLR = lrFileInputEl.files && lrFileInputEl.files[0];
    const isStockType = dispatchPhotoType==='stock';
    submitBtnEl.textContent = hasLR
      ? (isStockType ? t('Submit with Stock Photo') : t('Submit with LR'))
      : (isStockType ? t('Submit Without Stock Photo') : t('Submit Without LR'));
    submitBtnEl.style.background = hasLR ? 'var(--success)' : 'var(--warning)';
  };
  // Stock Photo (loose-goods pickup) has no real Lorry Receipt document
  // behind it -- hide the LR Number field for it (Round 13.1, user
  // question "stock photo me to LR No ki zrurt nhi h na"), and keep the
  // submit button's own LR/Stock wording in sync with the chosen type too.
  wirePhotoTypeToggle(()=>dispatchPhotoType, (v)=>{ dispatchPhotoType = v; }, (v)=>{
    if(dispatchLRNumberField) dispatchLRNumberField.hidden = (v==='stock');
    refreshDispatchSubmitBtn();
  });
  lrFileInputEl.addEventListener('change', refreshDispatchSubmitBtn);
  const finalizeDispatch = async (includeLR)=>{
    const transportName = document.getElementById('dispatchTransport').value.trim();
    if(!transportName){ showAlert(t('Enter a transport name.')); return; }
    // RACE FIX (2026-08-28, fsSetItem non-merge race audit): the outer `o`
    // was captured once, back when this modal first opened -- but the LR
    // photo upload just below can take several real seconds on a slow
    // connection, during which another device could legitimately write to
    // this SAME order (e.g. a filling/packaging entry closing out
    // fillingStatus/packagingStatus). Re-resolving here, immediately
    // before this modal's own mutations begin (shadows the outer `o` on
    // purpose), keeps that staleness window as short as it can be --
    // savePartitionForItem's full non-merge save below then carries the
    // freshest fields this device can have for everything it doesn't
    // itself touch, instead of whatever was true when the modal opened.
    const o = S.orders.find(x=>x.id===orderId);
    if(!o){ showAlert(t('This order no longer exists — it may have been deleted or already dispatched elsewhere.')); closeModal(); render(); return; }
    const casesVal = document.getElementById('dispatchCases').value.trim();
    const lrFile = includeLR ? document.getElementById('dispatchLRFile').files[0] : null;
    // Stock Photo: LR Number never applies -- ignore whatever the (now-
    // hidden) input still holds, same as the standalone Upload Photo modal.
    const lrNumber = (includeLR && dispatchPhotoType!=='stock') ? document.getElementById('dispatchLRNumber').value.trim() : '';
    const statusEl = document.getElementById('dispatchLRStatus');
    const bookedBtn = document.getElementById('dispatchSubmitBtn');
    // BUG FIX (Round 10 audit): double-submit guard. This used to only
    // disable the button inside the lrFile branch (right before the LR
    // upload's await), which meant dispatching WITHOUT an LR photo -- the
    // whole rest of this function is synchronous -- had no protection at
    // all against a rapid double-click firing finalizeDispatch twice.
    // Disabling here, unconditionally, right after the only validation
    // that can legitimately fail and need a retry (missing transport
    // name), covers both paths; the click handler below also checks this
    // before ever calling finalizeDispatch.
    bookedBtn.disabled = true;
    if(lrFile){
      statusEl.textContent = 'Uploading photo…';
      try{
        // Round 13: Firebase Storage (see fsUploadOrderPhoto's own comment
        // for why) + hard-capped to 2MB (resizeImageFileMaxBytes), same as
        // the standalone Upload LR modal.
        const dataUrl = await resizeImageFileMaxBytes(lrFile, 1600, LR_PHOTO_MAX_BYTES);
        const result = await fsUploadOrderPhoto(o.id, dataUrl, dispatchPhotoType);
        const oldStoragePath = o.lrStoragePath;
        if(result && result.ok){
          o.lrPhotoUrl = result.url; o.lrStoragePath = result.storagePath;
          delete o.lrFileId;
          o.photoType = dispatchPhotoType;
          o.lrUploadedAt = Date.now(); o.lrUploadedBy = S.currentUser.name;
          if(oldStoragePath && oldStoragePath!==result.storagePath) fsDeleteOrderPhoto(oldStoragePath).catch(()=>{});
        } else {
          statusEl.textContent = 'Photo upload failed — dispatching without it.';
          await new Promise(r=>setTimeout(r, 900));
        }
      }catch(err){
        statusEl.textContent = 'Photo upload failed — dispatching without it.';
        await new Promise(r=>setTimeout(r, 900));
      }
    }
    if(lrNumber) o.lrNumber = lrNumber; else if(dispatchPhotoType==='stock') delete o.lrNumber;
    rememberTransport(transportName);
    o.transportName = transportName;
    o.totalCases = casesVal ? parseInt(casesVal) : null;
    o.dispatchedAt = Date.now();
    o.status = 'processed';
    o.processedAt = Date.now(); // tracking link expires 7 days after this
    o.updatedByUsername = S.currentUser.username;
    savePartitionForItem('orders', o);
    closeModal(); render();
    showToast('Order Processed & Dispatched ✅');
  };
  document.getElementById('dispatchSubmitBtn').addEventListener('click', ()=>{
    if(submitBtnEl.disabled) return; // BUG FIX (Round 10 audit): double-submit guard -- see finalizeDispatch's own disable comment above
    const hasLR = lrFileInputEl.files && lrFileInputEl.files[0];
    finalizeDispatch(!!hasLR);
  });
}

// Reserves stock for an order being accepted -- deducts readyStock for
// every item, logs the movement, and flips stockDeducted. Shared between
// setOrderStatus's own explicit-Accept-button path AND, as of Round 12
// (2026-08-31, "Jo Order OMS me se add ho rhe h vo direct hi Accepted me
// ajaye" -- explicit user request), order CREATION itself for orders
// entered directly in OMS (openOrderModal/chat "Quick order") -- those now
// skip the pending/"New" stage entirely and reserve stock immediately at
// creation time, exactly as if an admin had clicked Accept the instant it
// was saved. Extracted into one function specifically so both call sites
// can never drift apart on the stock math -- copy-pasting this a second
// time was the one thing to avoid here.
function reserveStockForAcceptedOrder(o){
  const shortItems = [];
  o.items.forEach(d=>{
    S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty;
    if(S.readyStock[d.key] < 0) shortItems.push(`${d.name} ${d.size}`);
    logStockMovement(d.key, `${d.name} ${d.size}`, 'order', -d.qty, `Order accepted — ${orderDisplayLabel(o)}`);
  });
  o.stockDeducted = true;
  safeSet('app:readyStock', S.readyStock);
  return shortItems;
}
function setOrderStatus(id, status){
  if((status==='processing' || status==='rejected') && S.currentUser.role!=='admin') return; // Accept/Reject are admin-only
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  let shortItems = [];
  if(status==='processing' && !o.stockDeducted){
    // Stock is only reserved once the owner actually accepts the order —
    // until then it was just a live preview, nothing was touched.
    shortItems = reserveStockForAcceptedOrder(o);
  }
  if(status==='rejected' && o.stockDeducted){
    o.items.forEach(d=>{
      if(!d.cancelled){
        S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty;
        logStockMovement(d.key, `${d.name} ${d.size}`, 'order', d.qty, `Order rejected — ${orderDisplayLabel(o)}`);
      }
    });
    o.stockDeducted = false;
    safeSet('app:readyStock', S.readyStock);
  }
  o.status = status;
  if(status==='processed') o.processedAt = Date.now(); // tracking link expires 7 days after this
  o.updatedByUsername = S.currentUser.username; // FIELD CONTRACT (functions/index.js) -- excludes this device's own action from its push notification
  if(status==='processing') autoAdvanceOrders(); // may instantly become 'ready' if stock already covers it
  savePartitionForItem('orders', o);
  syncStockTasksFromAlerts(); // accepting reserves stock and can create shortages — always resync after
  showToast(status==='processing'
    ? (shortItems.length ? `Order accepted — ⚠ short on ${shortItems.join(', ')}` : 'Order accepted — fully stocked')
    : status==='processed' ? 'Order marked processed' : `Order ${status}`);
}
function ackTask(id, kind){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  if(kind==='filling') o.fillingStatus='done'; else o.packagingStatus='done';
  fsSaveOrderStatusFields(o); // scoped write -- see fsSaveOrderStatusFields' own comment
  autoAdvanceOrders();
  showToast('Task confirmed');
}

/* ============================= DAILY WORK (admin — for updating external accounting) ============================= */
// RESTRUCTURED (2026-09-08, "finish everything" pass): Daily Work's 6
// section headings used to splice a dynamic entry COUNT and pluralized
// "entry"/"entries" directly into the middle of the heading string (e.g.
// "🛢️ Purchase — 5 entries") -- flagged back in Phase 4 as not fitting the
// established "whole string is the dictionary key" pattern without either
// fragile string-splicing or restructuring first. entryCountText(n) is that
// restructuring: Hindi/Urdu don't need a separate singular/plural noun form
// here (एंट्री/اندراج reads fine either way), so 'entry'/'entries' both
// exist as ordinary dictionary keys and the ENGLISH singular/plural split
// is preserved exactly as before (falls straight through t() unchanged).
function entryCountText(n){ return n + ' ' + t(n===1 ? 'entry' : 'entries'); }
function renderDailyWork(){
  const role = S.currentUser.role;
  const isAdmin = role==='admin';
  const isManager = role==='manager';
  // Anyone else who reaches this page (today that's the Packaging team)
  // only ever sees Filling + Packing -- the two categories that are their
  // shop floor's business -- never Purchase/Expenses/Retail/New Orders,
  // which stay admin/manager-only. They see EVERY filling/packing entry
  // for the day regardless of who logged it ("by anyone"), not just their own.
  const restrictedToProduction = !isAdmin && !isManager;
  const myUsername = S.currentUser.username;
  const date = S.dailyWorkDate || localDateKey(Date.now());
  const purchaseEntries = S.activityLog.filter(e=>e.kind==='purchase' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const fillingEntries = S.activityLog.filter(e=>e.kind==='filling' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const packagingEntries = S.activityLog.filter(e=>e.kind==='packaging' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const expenseEntries = S.expenses.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalExpense = expenseEntries.filter(e=>e.type!=='settlement' && !isOpeningBalanceEntry(e)).reduce((s,e)=>s+(e.amount||0),0);
  const retailEntries = S.retailSales.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalRetail = retailEntries.filter(e=>e.type==='sale').reduce((s,e)=>s+(e.totalAmount||0),0);
  const newOrderEntries = S.orders.filter(o=>localDateKey(o.createdAt)===date).sort((a,b)=>a.createdAt-b.createdAt);
  const totalOrderValue = newOrderEntries.reduce((s,o)=>s+orderMrpValue(o),0);

  const allEntries = restrictedToProduction
    ? [...fillingEntries, ...packagingEntries]
    : [...purchaseEntries, ...fillingEntries, ...packagingEntries, ...expenseEntries, ...retailEntries, ...newOrderEntries];
  const bookedCount = allEntries.filter(e=>e.booked).length;
  const totalCount = allEntries.length;

  // Backlog check: does any day BEFORE the one currently shown here still
  // have unbooked entries sitting around? Surfaced as a warning banner up
  // top so old, un-booked-into-accounting entries piling up get noticed
  // instead of only ever seeing whatever single day happens to be
  // selected. orders key their date off createdAt; everything else off at.
  // Scoped the same way as allEntries above -- Packaging shouldn't see (or
  // be alerted about) backlog in categories they can't view at all.
  const entryDateKey = e => localDateKey(e.createdAt!=null ? e.createdAt : e.at);
  const backlogSource = restrictedToProduction
    ? S.activityLog.filter(e=>e.kind==='filling'||e.kind==='packaging')
    : [...S.activityLog, ...S.expenses, ...S.retailSales, ...S.orders];
  const prevUnbookedDates = [...new Set(
    backlogSource.filter(e => !e.booked && entryDateKey(e) < date).map(entryDateKey)
  )].sort();

  // Action cell, role-aware:
  //  - Manager: view only -- no buttons at all, on anything.
  //  - Admin: unchanged -- Edit/Delete/Book any entry until booked, Undo
  //    once booked (booking is how "reflected in accounting software" gets
  //    tracked, so it's kept an admin-only action).
  //  - Everyone else (e.g. Packaging team): only THEIR OWN, still-unbooked
  //    entry gets Edit/Delete -- no Book/Undo. Someone else's entry, or
  //    their own once it's been booked, shows no action buttons at all.
  const actionCell = (e, source, canDelete, hideEdit) => {
    if(isManager) return '';
    if(isAdmin){
      return e.booked
        ? `<button type="button" class="btn btn-sm btn-outline" data-book="${source}|${e.id}">${esc(t('↩ Undo'))}</button>`
        : `<div class="row-actions" style="flex-wrap:wrap;gap:4px;">
            ${hideEdit?'':`<button type="button" class="btn btn-sm btn-outline" data-edit-entry="${source}|${e.id}">${esc(t('Edit'))}</button>`}
            ${canDelete?`<button type="button" class="btn btn-sm btn-danger" data-del-entry="${source}|${e.id}">${esc(t('Delete'))}</button>`:''}
            <button type="button" class="btn btn-sm btn-accent" data-book="${source}|${e.id}">${esc(t('✅ Book'))}</button>
          </div>`;
    }
    if(e.byUsername===myUsername && !e.booked){
      return `<div class="row-actions" style="flex-wrap:wrap;gap:4px;">
          <button type="button" class="btn btn-sm btn-outline" data-edit-entry="${source}|${e.id}">${esc(t('Edit'))}</button>
          ${canDelete?`<button type="button" class="btn btn-sm btn-danger" data-del-entry="${source}|${e.id}">${esc(t('Delete'))}</button>`:''}
        </div>`;
    }
    return e.booked ? `<span class="mono" style="font-size:0.6875rem;opacity:0.7;">${esc(t('✅ Booked'))}</span>` : '';
  };

  const purchaseHtml = `<div class="card">
    <h2>🛢️ ${esc(t('Purchase'))} — ${entryCountText(purchaseEntries.length)}</h2>
    ${purchaseEntries.length===0?`<div class="empty">${esc(t('No purchases recorded this day.'))}</div>`:`
    <table><thead><tr><th>${esc(t('Category'))}</th><th>${esc(t('Qty'))}</th><th>${esc(t('By'))}</th><th>${esc(t('Time'))}</th><th></th></tr></thead><tbody>
    ${purchaseEntries.map(e=>`<tr${e.booked?' style="opacity:0.55;"':''}><td>${esc(e.cat)}</td><td class="mono">${fmtMl(e.ml)}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'activityLog',true)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;

  const fillingHtml = `<div class="card">
    <h2>🧴 ${esc(t('Filling'))} — ${entryCountText(fillingEntries.length)}</h2>
    ${fillingEntries.length===0?`<div class="empty">${esc(t('No filling recorded this day.'))}</div>`:`
    <table><thead><tr><th>${esc(t('Item'))}</th><th>${esc(t('Qty'))}</th><th>${esc(t('By'))}</th><th>${esc(t('Time'))}</th><th></th></tr></thead><tbody>
    ${fillingEntries.map(e=>{
      const it = findItem(e.key);
      const qtyDisplay = it && it.caseSize ? fmtCase(e.qty, it.caseSize) : `${e.qty} pc`;
      return `<tr${e.booked?' style="opacity:0.55;"':''}><td>${esc(e.itemLabel)}</td><td class="mono">${qtyDisplay}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'activityLog',true)}</td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;

  const packagingHtml = `<div class="card">
    <h2>📦 ${esc(t('Packing'))} — ${entryCountText(packagingEntries.length)}</h2>
    ${packagingEntries.length===0?`<div class="empty">${esc(t('No packing recorded this day.'))}</div>`:`
    <table><thead><tr><th>${esc(t('Item'))}</th><th>${esc(t('Qty'))}</th><th>${esc(t('By'))}</th><th>${esc(t('Time'))}</th><th></th></tr></thead><tbody>
    ${packagingEntries.map(e=>{
      const it = findItem(e.key);
      const qtyDisplay = it && it.caseSize ? fmtCase(e.qty, it.caseSize) : `${e.qty} pc`;
      // "Updated Qty" = Ready stock total for this item right after this
      // packing entry was recorded (captured on e.totalAfter at write-time
      // -- see the packaging-record submit handler and applyActivityForward
      // -- so it stays historically accurate even if today's live Ready
      // stock has since moved). Older entries recorded before this field
      // existed simply won't have it, so nothing extra renders for them.
      const totalDisplay = e.totalAfter!=null ? (it && it.caseSize ? fmtCase(e.totalAfter, it.caseSize) : `${e.totalAfter} pc`) : null;
      return `<tr${e.booked?' style="opacity:0.55;"':''}><td>${esc(e.itemLabel)}${e.note?` <span class="mono">(${esc(t('Batch no-'))} ${esc(e.note)})</span>`:''}${totalDisplay?`<div class="mono" style="margin-top:2px;">${esc(t('Updated Qty:'))} ${totalDisplay}</div>`:''}</td><td class="mono">${qtyDisplay}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'activityLog',true)}</td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;

  const expensesHtml = `<div class="card">
    <h2>💰 ${esc(t('Expenses'))} — ${entryCountText(expenseEntries.length)}${totalExpense?` · ₹${totalExpense.toLocaleString('en-IN')}`:''}</h2>
    ${expenseEntries.length===0?`<div class="empty">${esc(t('No expenses recorded this day.'))}</div>`:`
    <table><thead><tr><th>${esc(t('To'))}</th><th>${esc(t('Description'))}</th><th>${esc(t('Amount'))}</th><th>${esc(t('Entered by'))}</th><th>${esc(t('Time'))}</th><th></th></tr></thead><tbody>
    ${expenseEntries.map(e=>`<tr${e.booked?' style="opacity:0.55;"':''}><td><b>${esc(e.byName)}</b></td><td>${esc(e.description||e.category||'—')}</td><td class="mono">${expenseEntryAmountText(e)}</td><td>${esc(e.enteredByName||e.byName)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'expenses',true,isOpeningBalanceEntry(e))}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;

  const retailHtml = `<div class="card">
    <h2>💵 ${esc(t('Retail Sale & Samples'))} — ${entryCountText(retailEntries.length)}${totalRetail?` · ₹${totalRetail.toLocaleString('en-IN')}`:''}</h2>
    ${retailEntries.length===0?`<div class="empty">${esc(t('No retail sales or samples this day.'))}</div>`:`
    <table><thead><tr><th>${esc(t('Items'))}</th><th>${esc(t('Type'))}</th><th>${esc(t('Total'))}</th><th>${esc(t('By'))}</th><th>${esc(t('Time'))}</th><th></th></tr></thead><tbody>
    ${retailEntries.map(e=>`<tr${e.booked?' style="opacity:0.55;"':''}><td>${(e.items||[]).map(i=>`${esc(i.itemLabel)} <span class="mono">×${i.qty}</span>`).join('<br/>')}</td><td>${e.type==='sale'?`<span class="badge badge-approved">${esc(t('Sale'))}</span>`:`<span class="badge badge-pending">${esc(t('Sample'))}</span>`}</td><td class="mono">${e.type==='sale'?'₹'+(e.totalAmount||0).toLocaleString('en-IN'):'—'}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'retailSales',true)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;

  const newOrdersHtml = `<div class="card">
    <h2>🛍️ ${esc(t('New Orders'))} — ${entryCountText(newOrderEntries.length)}${totalOrderValue?` · ₹${totalOrderValue.toLocaleString('en-IN')}`:''}</h2>
    <p class="desc" style="margin-top:-6px;">${esc(t('Delete an order from Home/Orders\' Accept · Reject · Delete flow, not from here.'))}</p>
    ${newOrderEntries.length===0?`<div class="empty">${esc(t('No orders created this day.'))}</div>`:`
    <table><thead><tr><th>${esc(t('Party'))}</th><th>${esc(t('Items'))}</th><th>${esc(t('MRP Value'))}</th><th>${esc(t('By'))}</th><th>${esc(t('Time'))}</th><th></th></tr></thead><tbody>
    ${newOrderEntries.map(o=>{ const liveCust = liveCustomerFor(o); const disc = liveCust ? (liveCust.discountPercent||0) : 0; return `<tr${o.booked?' style="opacity:0.55;"':''}><td>${esc(orderDisplayLabel(o))}</td><td>${o.items.filter(i=>!i.cancelled).map(i=>`${esc(i.name)} ${esc(i.size)} <span class="mono">×${i.qty}</span>`).join('<br/>')}</td><td class="mono">₹${orderMrpValue(o).toLocaleString('en-IN')}${disc>0?` (${disc}% ${esc(t('off'))})`:''}</td><td>${esc(o.createdBy)}</td><td class="mono">${fmtTime(o.createdAt)}</td><td>${actionCell(o,'orders',false)}</td></tr>`; }).join('')}
    </tbody></table>`}
  </div>`;

  // Sections with entries surface first; empty (0-entry) sections sink to
  // the bottom, so the day's actual activity isn't buried below a wall of
  // "No X recorded this day" placeholders. Packaging team only ever gets
  // the Filling + Packing cards -- see restrictedToProduction above.
  const sections = restrictedToProduction
    ? [
        { count: fillingEntries.length, html: fillingHtml },
        { count: packagingEntries.length, html: packagingHtml },
      ]
    : [
        { count: purchaseEntries.length, html: purchaseHtml },
        { count: fillingEntries.length, html: fillingHtml },
        { count: packagingEntries.length, html: packagingHtml },
        { count: expenseEntries.length, html: expensesHtml },
        { count: retailEntries.length, html: retailHtml },
        { count: newOrderEntries.length, html: newOrdersHtml },
      ];
  sections.sort((a,b)=> (b.count>0?1:0) - (a.count>0?1:0));

  return `
  <div class="card">
    <h2>📆 ${esc(t('Daily Work'))}</h2>
    <p class="desc">${esc(restrictedToProduction
      ? t('Filling & Packing entries for the day, from everyone on the team. You can edit or delete your own entry until it\'s booked — once booked, it\'s locked.')
      : t('Every entry for the day, in one place — book each as you update your accounting software.')+(isManager?' '+t('View only.'):' '+t('Editing or deleting stays available until it\'s booked.')))}</p>
    <div class="field"><label>${esc(t('Date'))}</label><input type="date" id="dwDateSel" value="${date}" max="${localDateKey(Date.now())}" /></div>
    ${prevUnbookedDates.length ? `<div style="background:#FCE2DF;border:1.5px solid #E8938B;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:0.78125rem;">
      <div style="font-weight:800;color:#D8483B;margin-bottom:6px;">${esc(t('⚠️ Previous Entry Not Booked'))}${prevUnbookedDates.length>1?` (${prevUnbookedDates.length} ${esc(t('days'))})`:''}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${prevUnbookedDates.map(d=>`<button type="button" class="btn btn-sm btn-outline" style="border-color:#E8938B;color:#D8483B;" data-goto-dw-date="${d}">${fmtDateOnly(dateKeyToTs(d))}</button>`).join('')}
      </div>
    </div>` : ''}
    <button type="button" class="btn btn-outline" id="dwPrintBtn" style="width:100%;margin-bottom:6px;">${esc(t('🖨️ Print this day'))}</button>
    ${isAdmin ? `<button type="button" class="btn btn-outline" id="dwEntryWindowBtn" style="width:100%;margin-bottom:6px;">${esc(t('⏰ Entry window'))} (${fmtHHMMOfDay(getAttendanceSettings().entryStart)}–${fmtHHMMOfDay(getAttendanceSettings().entryEnd)})</button>` : ''}
    ${totalCount>0 ? `<div style="background:${bookedCount===totalCount?'var(--success-bg)':'var(--bg)'};border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:0.78125rem;font-weight:700;">${bookedCount===totalCount?'✅':'📋'} ${bookedCount} ${esc(t('of'))} ${totalCount} ${esc(t('entries booked'))}</div>` : ''}
    ${(isAdmin && totalCount>0 && bookedCount<totalCount) ? `<button type="button" class="btn btn-outline" id="dwBookAllBtn" style="width:100%;">${esc(t('✅ Book all remaining'))} (${totalCount-bookedCount})</button>` : ''}
  </div>
  ${sections.map(s=>s.html).join('')}`;

// Shared "can THIS user touch THIS Daily Work entry" check, re-verified
// here (not just at button-render time) so a stale button or a direct call
// can never bypass it. Booked always locks an entry, even for admin (an
// admin must Undo it first, same as what the action buttons already show);
// everyone else may only touch their OWN, still-unbooked entry.
function canEditDailyEntry(e){
  if(!e || e.booked) return false;
  if(S.currentUser.role==='admin') return true;
  return e.byUsername===S.currentUser.username;
}
function editDailyEntry(source, id){
  let e;
  if(source==='activityLog') e = S.activityLog.find(x=>x.id===id);
  else if(source==='expenses') e = S.expenses.find(x=>x.id===id);
  else if(source==='retailSales') e = S.retailSales.find(x=>x.id===id);
  else if(source==='orders') e = S.orders.find(x=>x.id===id);
  if(!canEditDailyEntry(e)){ showAlert('This entry can no longer be edited.'); render(); return; }
  if(source==='activityLog') openEditLogModal(e, {allowUntilBooked:true});
  else if(source==='expenses') openExpenseModal(e, e.type||'expense', e.byUsername);
  else if(source==='retailSales') editRetailEntry(id);
  else if(source==='orders') openOrderModal(e);
}
function deleteDailyEntry(source, id){
  let e;
  if(source==='activityLog') e = S.activityLog.find(x=>x.id===id);
  else if(source==='expenses') e = S.expenses.find(x=>x.id===id);
  else if(source==='retailSales') e = S.retailSales.find(x=>x.id===id);
  if(!canEditDailyEntry(e)){ showAlert('This entry can no longer be edited.'); render(); return; }
  if(source==='activityLog'){
    showConfirm('Delete this entry? Its stock effect will be reversed.', ()=>{
      revertActivity(e, 'delete');
      S.activityLog = S.activityLog.filter(x=>x.id!==id);
      saveAfterActivityChange(e, true); // EXPLICIT DELETE (Task #54) -- see saveAfterActivityChange's isDelete param
      syncStockTasksFromAlerts(); // FIXED (2026-08-28) -- see the identical fix + comment in editLogSave's handler above; deleting can reintroduce a shortage the checklist needs to show again
      render(); showToast('Entry deleted & stock reverted');
    });
  } else if(source==='expenses'){
    showConfirm('Delete this entry?', ()=>{
      S.expenses = S.expenses.filter(x=>x.id!==id);
      deletePartitionItem('expenses', id); // EXPLICIT DELETE (Task #54) -- was savePartitionForItem('expenses', e), which would have written the deleted entry back
      applyExpenseBalanceDelta(e, -1);
      render();
    });
  } else if(source==='retailSales'){
    deleteRetailEntry(id);
  }
  // orders are intentionally NOT deletable from here -- see actionCell's canDelete=false above
}
function toggleEntryBooked(source, id){
  // Booking/unbooking marks an entry as reflected in the external
  // accounting software -- that's an admin-only accounting action, not
  // something any team member recording their own work should do.
  if(S.currentUser.role!=='admin') return;
  const list = source==='expenses' ? S.expenses : source==='retailSales' ? S.retailSales : source==='orders' ? S.orders : S.activityLog;
  const e = list.find(x=>x.id===id); if(!e) return;
  e.booked = !e.booked;
  savePartitionForItem(source, e);
  render();
  showToast(e.booked ? 'Booked ✅' : 'Unbooked');
}
function printDailyWork(){
  // Mirrors renderDailyWork's own visibility rule -- Packaging team only
  // ever prints Filling + Packing, never Purchase/Expenses/Retail/Orders.
  const restrictedToProduction = S.currentUser.role!=='admin' && S.currentUser.role!=='manager';
  const date = S.dailyWorkDate || localDateKey(Date.now());
  const purchaseEntries = S.activityLog.filter(e=>e.kind==='purchase' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const fillingEntries = S.activityLog.filter(e=>e.kind==='filling' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const packagingEntries = S.activityLog.filter(e=>e.kind==='packaging' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const expenseEntries = S.expenses.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalExpense = expenseEntries.filter(e=>e.type!=='settlement' && !isOpeningBalanceEntry(e)).reduce((s,e)=>s+(e.amount||0),0);
  const retailEntries = S.retailSales.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalRetail = retailEntries.filter(e=>e.type==='sale').reduce((s,e)=>s+(e.totalAmount||0),0);
  const newOrderEntries = S.orders.filter(o=>localDateKey(o.createdAt)===date).sort((a,b)=>a.createdAt-b.createdAt);
  const totalOrderValue = newOrderEntries.reduce((s,o)=>s+orderMrpValue(o),0);

  const table = (headers, rows) => rows.length===0 ? `<p style="font-size:0.6875rem;color:#777;">None</p>` :
    `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;

  let html = `<h1>${esc(COMPANY_NAME)}</h1><div style="font-size:0.6875rem;color:#555;margin-bottom:10px;">Daily Work — ${esc(fmtDateOnly(dateKeyToTs(date)))}</div>`;

  if(!restrictedToProduction){
    html += `<h2>🛢️ Purchase</h2>` + table(['Category','Qty','By','Time'],
      purchaseEntries.map(e=>`<tr><td>${esc(e.cat)}</td><td>${fmtMl(e.ml)}</td><td>${esc(e.by)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));
  }

  html += `<h2>🧴 Filling</h2>` + table(['Item','Qty','By','Time'],
    fillingEntries.map(e=>`<tr><td>${esc(e.itemLabel)}</td><td>${e.qty} pc</td><td>${esc(e.by)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

  html += `<h2>📦 Packing</h2>` + table(['Item','Qty','By','Time'],
    packagingEntries.map(e=>`<tr><td>${esc(e.itemLabel)}${e.note?` (Batch no- ${esc(e.note)})`:''}</td><td>${e.qty} pc</td><td>${esc(e.by)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

  if(!restrictedToProduction){
    html += `<h2>💰 Expenses ${totalExpense?`— Total ₹${totalExpense.toLocaleString('en-IN')}`:''}</h2>` + table(['To','Description','Amount','Time'],
      expenseEntries.map(e=>`<tr><td>${esc(e.byName)}</td><td>${esc(e.description||e.category||'—')}</td><td>${expenseEntryAmountText(e)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

    html += `<h2>💵 Retail Sale &amp; Samples ${totalRetail?`— Total ₹${totalRetail.toLocaleString('en-IN')}`:''}</h2>` + table(['Items','Type','Total','Time'],
      retailEntries.map(e=>`<tr><td>${(e.items||[]).map(i=>`${esc(i.itemLabel)} ×${i.qty}`).join(', ')}</td><td>${e.type==='sale'?'Sale':'Sample'}</td><td>${e.type==='sale'?'₹'+(e.totalAmount||0).toLocaleString('en-IN'):'—'}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

    html += `<h2>🛍️ New Orders ${totalOrderValue?`— Total ₹${totalOrderValue.toLocaleString('en-IN')}`:''}</h2>` + table(['Party','Items','MRP Value','By','Time'],
      newOrderEntries.map(o=>`<tr><td>${esc(orderDisplayLabel(o))}</td><td>${o.items.filter(i=>!i.cancelled).map(i=>`${esc(i.name)} ${esc(i.size)} ×${i.qty}`).join(', ')}</td><td>₹${orderMrpValue(o).toLocaleString('en-IN')}</td><td>${esc(o.createdBy)}</td><td>${fmtTime(o.createdAt)}</td></tr>`).join(''));
  }

  const printArea = document.getElementById('printArea');
  printArea.innerHTML = html;
  window.print();
}

    S.activityLog.filter(e=>(e.kind==='purchase'||e.kind==='filling'||e.kind==='packaging') && localDateKey(e.at)===date && !e.booked).forEach(e=>{ e.booked = true; savePartitionForItem('activityLog', e); });
    S.expenses.filter(e=>localDateKey(e.at)===date && !e.booked).forEach(e=>{ e.booked = true; savePartitionForItem('expenses', e); });
    S.retailSales.filter(e=>localDateKey(e.at)===date && !e.booked).forEach(e=>{ e.booked = true; savePartitionForItem('retailSales', e); });
    S.orders.filter(o=>localDateKey(o.createdAt)===date && !o.booked).forEach(o=>{ o.booked = true; savePartitionForItem('orders', o); });
    render();
    showToast('All entries booked ✅');
  });
}

/* ============================= DOMINO PRINTING (impressions log) ============================= */
function parseHHMM(s){
  const m = String(s||'').match(/^(\d{1,3}):([0-5]?\d)$/);
  if(!m) return 0;
  return parseInt(m[1])*60 + parseInt(m[2]);
}
function fmtHHMM(mins){
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}:${String(m).padStart(2,'0')}`;
}
function renderDomino(){
  const isAdmin = S.currentUser.role==='admin';
  const total = S.dominoPrints.reduce((s,x)=>s+x.impressions,0);
  const totalMin = S.dominoPrints.reduce((s,x)=>s+(x.durationMin||0),0);
  const list = S.dominoPrints.slice().sort((a,b)=>b.at-a.at);
  const sections = groupByDate(list, x=>x.at);
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div><h2>${esc(t('Domino Printing'))}</h2><p class="desc">${esc(t('Impressions log.'))}</p></div>
      <button class="btn btn-primary btn-sm" id="newDominoBtn">${esc(t('+ Record impressions'))}</button>
    </div>
    <div class="grid-stats" style="margin-bottom:12px;">
      <div class="stat"><div class="n">${total.toLocaleString('en-IN')}</div><div class="l">${esc(t('Total impressions'))}</div></div>
      <div class="stat"><div class="n">${fmtHHMM(totalMin)}</div><div class="l">${esc(t('Total duration (HH:MM)'))}</div></div>
    </div>
    ${list.length===0?`<div class="empty"><div class="big">🖨️</div>${esc(t('No entries yet.'))}</div>`:
      sections.map(s=>dateGroupHeaderHtml(s.heading)+`<table><thead><tr><th>${esc(t('Impressions'))}</th><th>${esc(t('Duration'))}</th><th>${esc(t('Note'))}</th><th>${esc(t('By'))}</th><th>${esc(t('Time'))}</th>${isAdmin?'<th></th>':''}</tr></thead><tbody>
      ${s.items.map(x=>`<tr><td class="mono"><b>${x.impressions.toLocaleString('en-IN')}</b></td><td class="mono">${fmtHHMM(x.durationMin||0)}</td><td>${esc(x.note||'—')}</td><td class="mono">${esc(x.by)}</td><td class="mono">${fmtTime(x.at)}</td>${isAdmin?`<td><button class="btn btn-sm btn-danger" data-del-domino="${x.id}">${esc(t('Delete'))}</button></td>`:''}</tr>`).join('')}
      </tbody></table>`).join('')}
  </div>`;
}
function bindDomino(){
  const btn = document.getElementById('newDominoBtn');
  if(btn) btn.addEventListener('click', openDominoModal);

    showConfirm('Delete this entry?', ()=>{
      const item = S.dominoPrints.find(x=>x.id===b.dataset.delDomino);

function openDominoModal(){
  showModal(`
    <h3>Record Domino Printing</h3>
    <form id="dominoForm">
      <div class="field"><label>No. of impressions</label><input id="domImpr" type="number" min="1" required /></div>

  document.getElementById('dominoForm').addEventListener('submit', withSubmitGuard((e)=>{

    closeModal(); render(); showToast('Recorded');

/* ============================= EXPENSES (manager pocket expenses; admin settles & can add/edit) ============================= */
// BUGFIX (2026-08-21, explicit user request): this used to recompute the
// balance live by summing S.expenses every time -- which meant the balance
// would silently drift once the 1-year retention cleanup deleted an old
// unsettled expense/settlement row, even though nothing was actually paid.
// Now it's a durable running total (S.expenseBalances[username]), kept in
// sync incrementally on every create/edit/delete via
// applyExpenseBalanceDelta, exactly like rawMaterial/filledStock/readyStock
// already are for stock. The live-sum path below only ever runs ONCE per
// user, the very first time this code sees them with no durable balance
// recorded yet -- it seeds S.expenseBalances from whatever expense history
// currently exists (self-healing migration), then every call after that
// reads the durable number straight away.
function expenseBalanceFor(username){
  if(Object.prototype.hasOwnProperty.call(S.expenseBalances, username)){
    return S.expenseBalances[username];
  }
  const mine = S.expenses.filter(x=>x.byUsername===username);
  const spent = mine.filter(x=>x.type!=='settlement').reduce((s,x)=>s+x.amount,0);
  const settled = mine.filter(x=>x.type==='settlement').reduce((s,x)=>s+x.amount,0);
  const seed = spent - settled; // positive = still owed to the manager
  S.expenseBalances[username] = seed;
  // FIXED (Task #54): was safeSet('app:expenseBalances', S.expenseBalances)
  // -- that routed through the generic fan-out wrapper, which writes
  // {value:seed} while fsApplyExpenseBalanceDelta (and the read-side
  // listener) both expect {balance:seed}. Write directly in the shape the
  // rest of the expenseBalances plumbing actually uses, and only for this
  // one username, not the whole local map.
  fsDb.collection('expenseBalances').doc(username).set({ balance: seed }, { merge:true });
  return seed;
}
// Applies (sign=+1) or reverses (sign=-1) one expense/settlement entry's
// effect on its owner's durable balance. An expense INCREASES what's owed
// to them; a settlement (cash paid back) DECREASES it. Call with sign=-1
// on an entry's OLD state before an edit changes it, then sign=+1 with the
// NEW state -- this correctly handles an admin re-assigning an entry to a
// different manager or changing its amount mid-edit.
function applyExpenseBalanceDelta(entry, sign){
  if(!entry || !entry.byUsername) return;
  const delta = (entry.type==='settlement' ? -entry.amount : entry.amount) || 0;
  const finalDelta = sign*delta;
  // Optimistic local update — the UI (e.g. the balance shown at the top of
  // My Expenses) reflects the change instantly, same local-first pattern
  // as everywhere else in this app.
  S.expenseBalances[entry.byUsername] = (S.expenseBalances[entry.byUsername]||0) + finalDelta;
  // SECURITY FIX (2026-08-21 audit, finding #12): the value actually
  // PERSISTED is applied atomically server-side against whatever is
  // currently stored there, not this whole local S.expenseBalances object
  // pushed via safeSet/"save" — see apiApplyExpenseBalanceDelta's own
  // comment.
  // BUGFIX (2026-08-24): queued (durable, retried) instead of a bare
  // fire-and-forget call whose response could race with another one and
  // clobber the local total, or get silently dropped on a network failure
  // -- see queueExpenseDelta/flushExpenseDeltaQueue above for the full
  // reasoning. The queue is also what protects this optimistic value from
  // being overwritten by the very next sync tick before the server round
  // trip completes (see the expenseBalances merge in applyServerData).
  queueExpenseDelta(entry.byUsername, finalDelta);
  flushExpenseDeltaQueue();
}
// ---- Opening Balance (2026-08-31, "totalling me bohot zyada mistakes"
// request): a special expenses entry, type:'opening_balance', used by admin
// to set a manager's running balance to a known-correct absolute figure --
// a checkpoint, not real spending. Its `amount` field is the SIGNED DELTA
// needed to move the CURRENT balance to that target (targetBalance -
// currentBalance), computed once at save time in openOpeningBalanceModal --
// that's exactly why applyExpenseBalanceDelta/fsEditExpenseAtomic's
// contributionOf need ZERO changes to support it: they already do
// `type==='settlement' ? -amount : amount`, and opening_balance (not
// 'settlement') already gets a plain +amount, which is the correct delta.
// `targetBalance` is stored separately, purely for display/audit, so a
// screen never has to show a confusing raw delta -- always the actual
// checkpoint figure the admin typed in.
//
// These three helpers are the ONE place that knows how to display or
// exclude an opening_balance entry correctly -- used by every render/print/
// total spot below (Expenses page, Daily Work, printDailyWork, the monthly
// report, and the Home "recent activity" feed) so all of them stay
// consistent with each other. Per the user's explicit instruction to be
// extra careful with the totaling math, changing this in one place changes
// it everywhere at once instead of risking one spot getting missed.
function isOpeningBalanceEntry(x){ return !!(x && x.type==='opening_balance'); }
function expenseEntryAmountText(x){
  if(isOpeningBalanceEntry(x)) return `📌 Set to ₹${(x.targetBalance||0).toLocaleString('en-IN')}`;

// ---- AUTO "Previous Balance" (2026-08-31, "Round 13" -- explicit user
// request: "Manager wala Checkpoint khud hi ban jaye ... 30 Days ke
// Expenses rakho, usse pehle ke apne aap hi previous balance ke naam se
// save karte raho"): replaces having to rely on the admin manually
// clicking "📌 Opening Balance" every month just to keep the list from
// growing forever. The Expenses list itself now only ever shows the last
// EXPENSE_VISIBLE_WINDOW_MS (30 days) of entries -- everything before that
// is summarized into one always-correct, zero-effort "📌 Previous Balance"
// line instead, computed live, with no extra Firestore writes and no
// scheduled job needed for the DISPLAY side of this.
//
// This is safe specifically BECAUSE S.expenseBalances[username] is a
// DURABLE running total (see expenseBalanceFor's own comment above) that
// is NEVER recomputed by re-summing expense history -- so:
//   previousBalance = durable total − sum(contribution of the entries
//   actually shown, i.e. the last 30 days)
// is exactly the balance as it stood at the start of the visible window,
// and stays correct even after old entries are actually deleted from
// Firestore (see cleanupOldExpenses in functions/index.js -- entries
// older than 90 days are removed automatically once a day; safe for the
// exact same "durable total, not re-summed" reason -- retention window is
// deliberately longer than the 30-day display window so there's a little
// slack before a not-yet-cleaned-up entry actually disappears).
const EXPENSE_VISIBLE_WINDOW_MS = 30*24*60*60*1000;
function expenseEntryContribution(x){ return x ? ((x.type==='settlement' ? -x.amount : x.amount) || 0) : 0; }
function computeVisibleExpenses(allForUser, durableBalance){
  const cutoff = Date.now() - EXPENSE_VISIBLE_WINDOW_MS;
  const visible = allForUser.filter(x=>x.at>=cutoff).sort((a,b)=>b.at-a.at);
  const visibleContribution = visible.reduce((s,x)=>s+expenseEntryContribution(x),0);
  const previousBalance = durableBalance - visibleContribution;
  return { visible, previousBalance };
}
function previousBalanceRowHtml(previousBalance){
  if(previousBalance===0) return ''; // nothing to summarize -- e.g. a brand-new manager, or a window with no prior history

// 'YYYY-MM' key for whichever month `ts` (default now) falls in -- reuses
// localDateKey (already the app's one source of truth for local-timezone
// date math) rather than rolling fresh Date logic, so this can't drift out
// of sync with how every other date-keyed feature in the app computes

// checkpoint for the CURRENT month been set yet" for the reminder banner --

}
