// Retail Sale/Samples originally stored one item directly on the entry
// (key/itemLabel/qty/amount) before it became multi-item (items[]/
// totalAmount). Old entries saved under that earlier format would otherwise
// have no `items` array at all — every place that reads .items (display,
// edit, delete) assumes it exists, so an un-normalized old entry shows up
// blank and silently fails to edit or delete. Converting on load fixes
// both at once, for any entry no matter how old.
function normalizeRetailEntry(e){
  if(e.items) return e; // already current format
  if(e.key){
    e.items = [{ key:e.key, itemLabel:e.itemLabel||e.key, qty:e.qty||0 }];
    e.totalAmount = e.amount||0;
  } else {
    e.items = []; // truly malformed / unrecoverable — at least won't crash anything now
    e.totalAmount = e.totalAmount||0;
  }
  return e;
}
// isFullSync=true means `data` is the ENTIRE dataset (initial load, or a
// periodic safety-net resync) — every S.* field gets set from it exactly
// as before. isFullSync=false means `data` may be a DELTA (only the keys
// that changed since the last sync) — any key simply absent from `data`
// is left completely untouched in S, instead of being wiped to a default.
// This single function safely handles both cases so there's only ever one
// place that needs to know about every field order-ops syncs — a delta
// merge bug here would mean a field silently stops updating, so every
// static key uses the same "only touch it if it's actually present"
// pattern, and every partitioned entity goes through
// mergeAndFilterPartition (which has that exact same guarantee for
// day-partitioned data).
function applyServerData(data, isFullSync){
  const has = k => Object.prototype.hasOwnProperty.call(data, k);
  if(has('users')) S.users = data.users || [];
  S.orders = mergeAndFilterPartition('orders', data, S.orders, o=>o.createdAt >= Date.now()-60*24*60*60*1000, (a,b)=>a.createdAt-b.createdAt);
  if(has('customers')) S.customers = data.customers || [];
  S.attendance = mergeAndFilterPartition('attendance', data, S.attendance, a=>a.timestamp >= Date.now()-60*24*60*60*1000, (a,b)=>a.timestamp-b.timestamp);
  if(has('tasks')) S.tasks = data.tasks || [];
  if(has('rawMaterial')) S.rawMaterial = data.rawMaterial || {};
  if(has('filledStock')) S.filledStock = data.filledStock || {};
  if(has('readyStock')) S.readyStock = data.readyStock || {};
  // expenses/retailSales are financial records — a longer, accounting-scale
  // retention window (1 year / 6 months) rather than the short log windows
  // below. activityLog/loginLog are pure logs, so they get a short 7-day
  // window like chatMessages/trackingViewLogs. Until this change all of
  // these had NO age filter at all (filterFn was null) and NO backend
  // cleanup — they'd grown, unbounded, one row per calendar day, since the
  // app's very first use, and every one of those rows was included in
  // every FULL sync. That was the main reason a fresh/first fetch (a new
  // device, a cleared cache, or the periodic full-resync safety net) kept
  // getting slower over time, hitting older/slower hardware hardest — see
  // cleanupOldFinancialData/cleanupOldMiscLogs below for the matching
  // backend-side cleanup that keeps this bounded going forward, including
  // a one-time sweep of the already-accumulated backlog.
  S.expenses = mergeAndFilterPartition('expenses', data, S.expenses, e=>e.at >= Date.now()-365*24*60*60*1000, (a,b)=>a.at-b.at);
  S.activityLog = mergeAndFilterPartition('activityLog', data, S.activityLog, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>a.at-b.at);
  if(has('lowStock')) S.lowStock = data.lowStock || {raw:{}, filled:{}, ready:{}};
  if(has('watchStock')) S.watchStock = data.watchStock || {raw:{}, filled:{}, ready:{}};
  if(has('stockTasks')) S.stockTasks = data.stockTasks || [];
  // BUGFIX (2026-08-21, explicit user request): Domino print entries must
  // NEVER be auto-deleted, no matter how old — dominoPrints used to share
  // the same 7-day window as activityLog/loginLog (see git history / the
  // comment block above), which was silently wiping older Domino history
  // both from the client's view (this filter) AND from the backend sheet
  // itself (see cleanupOldMiscLogs below, which used to include
  // 'dominoPrints' in its deletion sweep). No age filter here at all now —
  // every Domino day the server sends back is kept, same as e.g. customers.
  S.dominoPrints = mergeAndFilterPartition('dominoPrints', data, S.dominoPrints, null, (a,b)=>a.at-b.at);
  S.loginLog = mergeAndFilterPartition('loginLog', data, S.loginLog, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>a.at-b.at);
  S.chatMessages = mergeAndFilterPartition('chatMessages', data, S.chatMessages, m=>m.at >= Date.now()-7*24*60*60*1000, (a,b)=>a.at-b.at);
  S.retailSales = mergeAndFilterPartition('retailSales', data, S.retailSales, r=>r.at >= Date.now()-180*24*60*60*1000, (a,b)=>a.at-b.at, normalizeRetailEntry);
  if(isFullSync) trackPartitionKeys(data); else trackPartitionKeysDelta(data);
  if(has('customRoles')) S.customRoles = data.customRoles || [];
  if(has('rolePermissions')) S.rolePermissions = data.rolePermissions || {};
  if(has('notificationPrefs')) S.notificationPrefs = data.notificationPrefs || {};
  // BUGFIX (2026-08-24, "bug in calculation of Expenses of manager"): must
  // NOT blindly replace with the server's snapshot -- this sync poll fires
  // every ~4s and can easily land in the middle of this device's own
  // balance-delta round trip (or after one that failed and hasn't retried
  // yet), which used to wipe the just-applied local change back out. The
  // displayed/stored total is always server-confirmed + whatever this
  // device still has queued-but-unconfirmed for that user (0 for everyone
  // with nothing pending) -- see queueExpenseDelta/flushExpenseDeltaQueue.
  if(has('expenseBalances')){
    const incomingBalances = data.expenseBalances || {};
    const mergedBalances = Object.assign({}, incomingBalances);
    for(const pendingUser in pendingExpenseDeltas){
      if(pendingExpenseDeltas[pendingUser]) mergedBalances[pendingUser] = (mergedBalances[pendingUser]||0) + pendingExpenseDeltas[pendingUser];
    }
    S.expenseBalances = mergedBalances;
  }
  if(has('loginLockouts')) S.loginLockouts = data.loginLockouts || {};
  if(has('pendingNotifs')) S.pendingNotifs = data.pendingNotifs || {};
  rebuildRolesRegistry();
  applyRolePermissionsToROLES();
  if(has('catalogItems')) S.catalogItems = (data.catalogItems && data.catalogItems.length) ? data.catalogItems : flattenDefaultCatalog();
  rebuildCatalogFlat();
  if(has('transports')) S.transports = data.transports || [];
  if(has('dailyRecordMarks')) S.dailyRecordMarks = data.dailyRecordMarks || {};
  if(has('batchReferences')) S.batchReferences = data.batchReferences || {};
  if(has('holidays')) S.holidays = data.holidays || {};
  if(has('activeSessions')) S.activeSessions = data.activeSessions || {};
  S.trackingViewLogs = mergeAndFilterPartition('trackingViewLogs', data, S.trackingViewLogs, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>b.at-a.at);
  S.siteVisitLogs = mergeAndFilterPartition('siteVisitLogs', data, S.siteVisitLogs, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>b.at-a.at);
  S.stockMovementLog = mergeAndFilterPartition('stockMovementLog', data, S.stockMovementLog, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>b.at-a.at);
  cleanupOldChatDays();
  cleanupOldLogDays();
  cleanupOldBusinessData();
  cleanupOldMiscLogs();
  cleanupOldFinancialData();
  // Single-device login enforcement (security feature, 2026-08-21): every
  // sync re-checks whether this device's own session token still matches
  // what the backend says is the CURRENT valid token for this user. A
  // mismatch means a newer login (or an admin's force-logout) elsewhere
  // has superseded this device.
  checkSessionStillValid();
}
// Chat messages are only meant to live 7 days — reconcile the backend to
// match (admin-only, mirrors how "Reset all data" already deletes
// partition-day keys). Runs after every full data load.
function cleanupOldChatDays(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const seen = S._partitionKeysSeen.chatMessages;
  if(!seen || !seen.size) return;
  const cutoff = localDateKey(Date.now() - 7*24*60*60*1000);
  const stale = [...seen].filter(dk=>dk < cutoff).map(dk=>'chatMessages_'+dk);
  if(stale.length) apiDeleteKeys(stale).catch(()=>{});
}
function cleanupOldLogDays(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const cutoff = localDateKey(Date.now() - 7*24*60*60*1000);
  const stale = [];
  ['trackingViewLogs','siteVisitLogs','stockMovementLog'].forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) apiDeleteKeys(stale).catch(()=>{});
}
// Orders and attendance get a longer, 60-day window (they're real business
// records, not just logs) before being cleared from the LIVE app — the
// weekly Drive backup already has everything, so nothing is actually lost,
// it just moves from "in the app" to "in that backup file" after 60 days.
function cleanupOldBusinessData(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const cutoff = localDateKey(Date.now() - 60*24*60*60*1000);
  const stale = [];
  ['orders','attendance'].forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) apiDeleteKeys(stale).catch(()=>{});
}
// Deletes a (possibly large) list of stale keys in small chunks instead of
// one single call. The backend's deleteKeys handler does one real
// Sheets deleteRow() per key while holding the write lock for the whole
// batch — a single huge call (months/years of never-before-cleaned
// backlog, see cleanupOldMiscLogs/cleanupOldFinancialData below) would hold
// that lock long enough to fail other people's concurrent saves. Chunking
// keeps every individual lock hold short; each chunk is awaited before the
// next fires, so the natural request/response latency also gives other
// pending writers room to get in between chunks. Fire-and-forget at the
// call site — errors are swallowed per-chunk and whatever's left just gets
// retried on the next sync tick, same as the existing cleanup functions.
async function deleteKeysBatched(keys, batchSize){
  batchSize = batchSize || 20;
  for(let i=0; i<keys.length; i+=batchSize){
    try{ await apiDeleteKeys(keys.slice(i, i+batchSize)); }catch(e){ /* rest retried next tick */ }
  }
}
// activityLog/loginLog are pure logs — same 7-day window as
// chatMessages/trackingViewLogs/siteVisitLogs/stockMovementLog. Unlike
// those, these 2 had NO cleanup at all until now, so the first run after
// this ships can have a large backlog to clear — hence the batched delete.
// NOTE (2026-08-21): 'dominoPrints' used to be cleaned up here too (same
// 7-day window), which was actually DELETING Domino print history from the
// backend sheet, permanently, on every admin sync. Per explicit user
// request, Domino entries must never be auto-deleted — removed from this
// list entirely. Domino history is now unbounded, same as customers/orders
// on the "kept forever unless someone explicitly deletes a row" side.
function cleanupOldMiscLogs(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const cutoff = localDateKey(Date.now() - 7*24*60*60*1000);
  const stale = [];
  ['activityLog','loginLog'].forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) deleteKeysBatched(stale);
}
// expenses/retailSales are real financial/business records, so they get a
// longer, accounting-scale retention window than the plain logs above
// instead of sharing the 7-day cutoff: expenses 1 year, retailSales 6
// months. Same "no cleanup ever existed before" backlog concern as above.
function cleanupOldFinancialData(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const stale = [];
  const windows = { expenses: 365, retailSales: 180 };
  Object.keys(windows).forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    const cutoff = localDateKey(Date.now() - windows[entity]*24*60*60*1000);
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) deleteKeysBatched(stale);
}

// SUPERSEDED (Task #54): replaced by fsBootstrapAuth() (see init()'s own
// comment) -- no longer called anywhere. Kept, unused, as a reference for
// what the old one-shot-fetch-then-poll startup sequence used to do, same
// as apiLogin above.
async function loadAll(){
  setSyncing(true);
  setSyncLabel('Loading data…');
  const MAX_ATTEMPTS = 3;
  let lastErr = null;
  for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
    try{
      const { data, updatedAt, systemHealth: sh } = await apiFetchAll();
      lastServerUpdatedAt = updatedAt || 0;
      if(sh) systemHealth = sh;
      applyServerData(data || {}, true);
      lastFullResyncAt = Date.now();

      if(S.users.length === 0){
        S.users.push({id:uid(), username:'admin', password:'admin123', name:'Admin', role:'admin'});
        await safeSet('app:users', S.users);
      }
      if(!data || !data.catalogItems || !data.catalogItems.length){
        safeSet('app:catalogItems', S.catalogItems); // first run ever — seed the backend so the order form can read it too
      }
      restoreSession();
      if(S.currentUser){
        // page refresh with an already-active session -- finalizeLogin() won't
        // run again, so this is the only other place a session actually "starts"
        initPushNotifications();
        checkForMissedNotifsOnLogin(); // safety net -- normally nothing to replay here since a still-valid session was never actually logged out/unsubscribed in between
      }
      backfillCatalogCaseSizes(); // resolve any legacy items missing a saved case size
      S.loadFailed = false;
      lastErr = null;
      break; // success
    }catch(e){
      lastErr = e;
      console.error(`initial load failed (attempt ${attempt}/${MAX_ATTEMPTS})`, e);
      if(attempt < MAX_ATTEMPTS){
        setSyncLabel(`Connecting… retry ${attempt}/${MAX_ATTEMPTS-1}`);
        await new Promise(r=>setTimeout(r, 1500)); // brief pause helps a lot with Apps Script cold-start
      }
    }
  }
  if(lastErr){
    // Never show a login screen with an empty/stale user list — that's what
    // was causing correct credentials to be falsely rejected as "invalid".
    // Show a clear, honest retry state instead.
    S.loadFailed = true;
    showToast('Could not connect — check your internet and try again', true);
  }
  S.loaded = true;
  setSyncLabel(null);
  setSyncing(false);
}

// Poll the backend so every device stays in sync in near real time,
// without disturbing whatever the person is doing (typing in a modal etc).
function sendHeartbeat(){
  if(!S.currentUser) return;
  // Preserve the existing session token (see issueNewSessionToken) --
  // the heartbeat only ever updates "last seen", it must never touch which
  // token is currently the valid one for this account.
  const prev = S.activeSessions[S.currentUser.username];
  const entry = Object.assign({}, (prev && typeof prev==='object') ? prev : null, { lastSeen: Date.now() });
  S.activeSessions[S.currentUser.username] = entry;
  fsSetStaticSubKey('activeSessions', S.currentUser.username, entry); // FIXED (Task #54) -- was safeSet('app:activeSessions', S.activeSessions), which re-writes EVERY user's subkey from this device's local copy on every 60s heartbeat tick, risking stomping another user's concurrently-updated session (force-logout, fresh login) with stale cached data. Write only this device's own subkey instead.
}
function startHeartbeat(){
  sendHeartbeat(); // fire immediately so status is correct right after login, not up to 60s stale
  setInterval(()=>{
    if(!S.currentUser) return;
    const messagesModalOpen = !!document.getElementById('messagesModalBody');
    const modalOpen = !!document.getElementById('modalOverlay') && !messagesModalOpen;
    if(modalOpen) return; // same "don't disturb active form-editing" principle as the main sync poll
    sendHeartbeat();
  }, 60000);
}
// SUPERSEDED (Task #54): replaced by Firestore's own onSnapshot listeners
// (see attachFirestoreListeners()) -- no longer called anywhere (was
// setInterval(doSyncTick,...) via startSyncPolling, itself no longer called
// from init()). Kept, unused, as a reference for the old polling logic.
// One sync-poll tick, pulled out of the setInterval below so it can be
// tested directly. Whenever the server version has advanced, this fetches
// either a DELTA (only what changed since lastServerUpdatedAt — the normal
// case) or, once every FULL_RESYNC_INTERVAL_MS, a FULL resync — the safety
// net that catches deletions a delta can never report (see
// FULL_RESYNC_INTERVAL_MS's own comment).
async function doSyncTick(){
  if(!S.currentUser) return;
  flushOfflineQueue(); // fire-and-forget; retries any saves that failed while offline
  flushExpenseDeltaQueue(); // fire-and-forget; retries any expense-balance deltas that failed to reach the server
  // BUGFIX (2026-08-26, "site auto update nahi ho rahi, refresh karna padta
  // hai"): root cause was flushOfflineQueue's `syncing` flag getting stuck
  // true forever if its own failure-handling code threw (see the fix on
  // flushOfflineQueue above) -- since every tick bails out immediately
  // below whenever `syncing` is true, one wedged flush silently killed ALL
  // future polling on that device until the page was manually reloaded.
  // That's fixed at the source now, but as a second line of defense against
  // any other path ever leaving this flag unbalanced, self-heal here: if
  // it's been "busy" far longer than any real request could legitimately
  // take, force it back to a known-good state instead of staying wedged.
  if(syncing && syncBusySince && (Date.now()-syncBusySince) > SYNC_STUCK_WATCHDOG_MS){
    console.error('doSyncTick: syncing flag stuck for', Date.now()-syncBusySince, 'ms — forcibly resetting so polling can resume');
    syncBusyCount = 0; syncing = false; syncBusySince = null; flushingQueue = false;
  }
  if(syncing) return;
  const messagesModalOpen = !!document.getElementById('messagesModalBody');
  const modalOpen = !!document.getElementById('modalOverlay') && !messagesModalOpen;
  if(modalOpen) return;
  try{
    const serverUpdatedAt = await apiFetchVersion();
    lastSuccessfulSyncAt = Date.now();
    if(serverUpdatedAt && serverUpdatedAt > lastServerUpdatedAt){
      setSyncLabel('Updating…');
      const needsFullResync = (Date.now() - lastFullResyncAt) > FULL_RESYNC_INTERVAL_MS;
      const { data, updatedAt, systemHealth: sh } = needsFullResync ? await apiFetchAll() : await apiFetchDelta(lastServerUpdatedAt);
      lastServerUpdatedAt = updatedAt || serverUpdatedAt;
      if(sh) systemHealth = sh;
      applyServerData(data || {}, needsFullResync);
      if(needsFullResync) lastFullResyncAt = Date.now();
      autoAdvanceOrders();
      syncStockTasksFromAlerts();
      setSyncLabel(null);
      // SPEED (2026-08-21, "notifications ko zda se zda fast kro" -- as fast
      // as possible, like WhatsApp): checking the bell/ring right HERE, the
      // instant real new data has actually landed, instead of on its own
      // separate 5s timer (see the old setInterval(checkForNewNotifRing,
      // 5000) this replaced) means the badge/sound latency is bounded by
      // ONLY this poll's own interval, not by however far out of phase the
      // two independent timers happened to drift relative to each other.
      checkForNewNotifRing();
      if(messagesModalOpen) refreshMessagesModal(); else render();
    } else if(S.view==='home' && !messagesModalOpen){
      // Nothing changed server-side, but time-sensitive things on Home
      // still need to tick forward on their own: the System Health
      // panel's "last synced Xs ago" text (admin), and the 5-minute
      // self-edit window on "Your recent activity" (everyone else) —
      // an Edit button must actually disappear once the window closes,
      // not just whenever the next real data change happens to arrive.
      // render()'s own diff-check keeps this cheap (skips the actual DOM
      // write on every OTHER tab where none of this is even shown).
      render();
    }
  }catch(e){ /* transient network hiccup — try again next tick */ }
}
// SUPERSEDED (Task #54): no longer called from init() -- see doSyncTick's
// own SUPERSEDED note just above.
function startSyncPolling(intervalMs){
  setInterval(doSyncTick, intervalMs || 4000);
}

/* ============================= AUTH ============================= */
// Session persists across app restarts using localStorage, but auto-expires
// after 48 hours of INACTIVITY (SESSION_MAX_MS) -- not 48 hours since login.
// Every genuine user interaction (click/keypress/touch, see
// watchUserActivityForIdleTimeout below) pushes SESSION_AT_KEY forward, so
// someone actively working stays logged in all day; only a device that's
// truly been left untouched for 48 hours signs itself out. (This was a flat
// 6-hour timer from login regardless of activity, then briefly a 12-hour
// idle timer -- changed to 48 hours idle per explicit user request on
// 2026-08-21.)
// Note: this only works when the app is actually hosted/opened in a real browser
// tab (as this Apps-Script-backed app is meant to be) — a claude.ai artifact
// preview iframe blocks storage APIs, so persistence won't show there.
const SESSION_KEY = 'orderops_session_user_id';
const SESSION_AT_KEY = 'orderops_session_started_at'; // last-activity timestamp (despite the name, kept for compatibility)
const SESSION_MAX_MS = 48 * 60 * 60 * 1000; // 48 hours of inactivity
function persistSession(user){
  try{
    localStorage.setItem(SESSION_KEY, user ? user.id : '');
    localStorage.setItem(SESSION_AT_KEY, user ? String(Date.now()) : '');
  }catch(e){}
}
// SECURITY FIX (2026-08-21 audit, findings #3/#4): the real server session
// token (from action:"login"), stored separately from SESSION_KEY (which is
// just "who was last logged in on this device, for restoring the UI").
// This is what every write now has to send for requireSession_ to accept it.
const AUTH_TOKEN_KEY = 'orderops_auth_token';
function persistAuthToken(token){
  try{
    if(token) localStorage.setItem(AUTH_TOKEN_KEY, token);
    else localStorage.removeItem(AUTH_TOKEN_KEY);
  }catch(e){}
}
function restoreAuthToken(){
  try{ return localStorage.getItem(AUTH_TOKEN_KEY) || null; }catch(e){ return null; }
}
// Called on every genuine user interaction while logged in -- refreshes
// just the activity timestamp (not the whole session) so the 48-hour idle
// clock resets. Throttled to at most once every 30s so a flurry of clicks
// doesn't hammer localStorage.
let lastActivityRefreshAt = 0;
function refreshSessionActivity(){
  if(!S.currentUser) return;
  const now = Date.now();
  if(now - lastActivityRefreshAt < 30000) return;
  lastActivityRefreshAt = now;
  try{ localStorage.setItem(SESSION_AT_KEY, String(now)); }catch(e){}
}
function watchUserActivityForIdleTimeout(){
  ['click','keydown','touchstart'].forEach(evt=>{
    document.addEventListener(evt, refreshSessionActivity, {passive:true});
  });
}
function restoreSession(){
  try{
    const id = localStorage.getItem(SESSION_KEY);
    const startedAt = parseInt(localStorage.getItem(SESSION_AT_KEY))||0;
    if(!id) return;
    if(!startedAt || (Date.now()-startedAt) > SESSION_MAX_MS){
      persistSession(null); // expired — force a fresh login
      return;
    }
    const u = S.users.find(x=>x.id===id);
    if(u){
      S.currentUser = u;
      applyUserPreferences(u); // per-user language/font-size -- see its own header comment
      S.view = ROLES[u.role].tabs[0];
      // The real server session token (if any) survives an app restart too
      // -- if it's stale/expired, requireSession_ will reject the first
      // write that needs it and the app prompts a quick re-login then (see
      // handleAuthError), rather than forcing a full re-login just to
      // restore this READ-ONLY view of already-synced local data.
      S.authToken = restoreAuthToken();
    }
  }catch(e){}
}
function startSessionExpiryWatch(){
  setInterval(()=>{
    if(!S.currentUser) return;
    try{
      const startedAt = parseInt(localStorage.getItem(SESSION_AT_KEY))||0;
      if(startedAt && (Date.now()-startedAt) > SESSION_MAX_MS){
        doLogout();
        showToast('No activity for 48 hours — signed out. Please log in again.');
      }
    }catch(e){}
  }, 60000);
}

// ---- Single-device login (2026-08-21, explicit user request) ----
// REMOVED from a REGULAR login (2026-08-28, live-production incident --
// user report: "bar bar password mang raha hai... kabhi nahi hona chahiye").
// Root cause: in real day-to-day use, several staff share ONE role login
// (e.g. "packaging") open on multiple tablets/phones around the warehouse
// AT THE SAME TIME -- completely normal for this business. The old
// behavior minted a BRAND NEW token on every single finalizeLogin() call,
// which unconditionally invalidated every other device already signed in
// as that account -- so any time a second device logged in as "packaging",
// the first device got silently signed all the way out of Firebase Auth
// (checkSessionStillValid -> doLogout) and had to type the password again,
// often mid-task. That is exactly the "keeps asking for the password"
// complaint, and it could happen many times a day purely from normal
// shared-login usage, not any actual security event.
// Fixed: a regular login now ADOPTS whatever token is already current for
// that username (adoptOrIssueSessionToken) instead of minting a new one --
// multiple simultaneous logins as the same account now simply coexist, and
// none of them get force-logged-out of each other. The token mechanism
// itself is kept (not deleted) because it still does something genuinely
// useful: an ADMIN can explicitly kick a specific device via "Force logout"
// (Team page) -- see issueNewSessionToken, still called from there with
// isThisDevice=false. That remains a deliberate, explicit admin action, not
// something a normal login triggers on its own any more.
// The backend just stores whatever token is "current" for each username
// (S.activeSessions[username].token) -- every device compares its own
// remembered token against that on every regular sync (see
// checkSessionStillValid, called at the end of applyServerData) and logs
// itself out the moment it no longer matches (now only ever caused by an
// explicit admin Force logout, not by another ordinary login).
const DEVICE_SESSION_TOKEN_KEY = 'orderops_device_session_token';
const DEVICE_SESSION_TOKEN_AT_KEY = 'orderops_device_session_token_at';
function makeSessionToken(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// isThisDevice=true means the caller IS the affected user's own current
// device (an admin editing their own account) -- their local copy is
// updated too so they don't immediately kick themselves out on the very
// next sync. As of the 2026-08-28 fix above, the only remaining caller of
// this with isThisDevice=false is the Team page's explicit "Force logout"
// button -- a regular login no longer calls this at all (see
// adoptOrIssueSessionToken below, which finalizeLogin calls instead).
function issueNewSessionToken(username, isThisDevice){
  const token = makeSessionToken();
  const at = Date.now();
  const prev = S.activeSessions[username];
  const entry = Object.assign({}, (prev && typeof prev==='object') ? prev : null, { token, at, lastSeen: at });
  S.activeSessions[username] = entry;
  fsSetStaticSubKey('activeSessions', username, entry); // FIXED (Task #54) -- was safeSet('app:activeSessions', S.activeSessions); see sendHeartbeat's identical fix above for why writing the whole object is unsafe
  if(isThisDevice){
    try{
      localStorage.setItem(DEVICE_SESSION_TOKEN_KEY, token);
      localStorage.setItem(DEVICE_SESSION_TOKEN_AT_KEY, String(at));
    }catch(e){}
  }
  return token;
}
// Called from a REGULAR login (finalizeLogin) instead of issueNewSessionToken
// -- see the big comment block above for why. If the account already has a
// current session token (near-certain in practice -- some device somewhere
// has logged into this account before), this device just adopts it locally
// with NO Firestore write and NO effect on any other device. Only a
// genuinely brand-new account with no session record at all gets a freshly
// minted one (matches checkSessionStillValid's own "no local token yet"
// adoption branch, which handles the same situation from the other side).
function adoptOrIssueSessionToken(username){
  const rec = S.activeSessions[username];
  const remoteToken = (rec && typeof rec==='object') ? rec.token : null;
  if(remoteToken){
    try{
      localStorage.setItem(DEVICE_SESSION_TOKEN_KEY, remoteToken);
      localStorage.setItem(DEVICE_SESSION_TOKEN_AT_KEY, String(rec.at || Date.now()));
    }catch(e){}
    return remoteToken;
  }
  return issueNewSessionToken(username, true);
}
function checkSessionStillValid(){
  if(!S.currentUser) return;
  const rec = S.activeSessions[S.currentUser.username];
  const remoteToken = (rec && typeof rec==='object') ? rec.token : null;
  const remoteAt = (rec && typeof rec==='object') ? (rec.at||0) : 0;
  let myToken = '', myTokenAt = 0;
  try{
    myToken = localStorage.getItem(DEVICE_SESSION_TOKEN_KEY) || '';
    myTokenAt = parseInt(localStorage.getItem(DEVICE_SESSION_TOKEN_AT_KEY))||0;
  }catch(e){}
  if(!myToken){
    // No local token yet -- either this device logged in before this
    // feature shipped, or storage was cleared. Silently adopt whatever
    // the backend already has (or claim a fresh one if there's nothing
    // yet) instead of treating "I don't have one" as a mismatch.
    if(remoteToken){
      try{
        localStorage.setItem(DEVICE_SESSION_TOKEN_KEY, remoteToken);
        localStorage.setItem(DEVICE_SESSION_TOKEN_AT_KEY, String(remoteAt||Date.now()));
      }catch(e){}
    } else {
      issueNewSessionToken(S.currentUser.username, true);
    }
    return;
  }
  // Only trust a mismatch when the backend's record is strictly NEWER than
  // the token THIS device issued -- this is what makes the check safe
  // against the save-hasn't-landed-yet race right after a fresh login: a
  // sync that arrives before our own login write has been persisted still
  // shows the OLD (or no) token with an OLDER timestamp, so remoteAt >
  // myTokenAt is false and nothing happens; once our write lands, the
  // token itself matches too. A genuinely newer login (or a force-logout)
  // elsewhere is the only way remoteAt ends up newer with a different token.
  if(remoteToken && remoteToken!==myToken && remoteAt>myTokenAt){
    doLogout();
    // As of the 2026-08-28 fix (see issueNewSessionToken/adoptOrIssueSessionToken
    // above), an ordinary login on another device no longer causes this --
    // the only remaining trigger is an admin's explicit "Force logout".
    showAlert('An admin signed this account out remotely, so you have been signed out here automatically.');
  }
}
// ---- Password hashing (Web Crypto API — built into every browser) ----
// Passwords are never stored in plaintext going forward. Existing
// plaintext passwords transparently upgrade to a salted hash the next
// time that user logs in — no manual migration step needed.
async function hashPassword(password, salt){
  const enc = new TextEncoder();
  const data = enc.encode(salt + '::' + password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function setUserPassword(user, plainPassword){
  const salt = randomSalt();
  user.passwordHash = await hashPassword(plainPassword, salt);
  user.passwordSalt = salt;
  delete user.password; // plaintext never lingers once a hash exists
}
async function verifyPassword(user, enteredPassword){
  if(user.passwordHash && user.passwordSalt){
    return (await hashPassword(enteredPassword, user.passwordSalt)) === user.passwordHash;
  }
  // Legacy plaintext account, not yet migrated — compare directly this once.
  return user.password === enteredPassword;
}
async function findMatchingUser(username, password){
  // BUGFIX (2026-09-08, live report -- a corrupted/blank user record with
  // no username field crashed Add/Edit user AND put login itself at risk):
  // x.username.toLowerCase() threw for any record missing/blank its
  // username field, which .find()/.some() evaluate against EVERY element
  // up to a match -- (x.username||'') makes a blank/missing username just
  // never match, instead of throwing and silently aborting the whole
  // calling function (an uncaught rejection inside these async handlers,
  // invisible in the UI). See the other 3 identical sites this round.
  const u = S.users.find(x => (x.username||'').toLowerCase() === username.trim().toLowerCase());
  if(!u) return null;
  const valid = await verifyPassword(u, password);
  if(!valid) return null;
  if(!u.passwordHash){
    // Transparent one-time upgrade: this successful login proves they know
    // the real password, so it's safe to hash it now and drop the plaintext.
    await setUserPassword(u, password);
    safeSet('app:users', S.users);
  }
  return u;
}
function finalizeLogin(u){
  S.currentUser = u;
  applyUserPreferences(u); // per-user language/font-size -- see its own header comment
  S.view = ROLES[u.role].tabs[0];
  persistSession(u);
  // FIXED (2026-08-28, "bar bar password mang raha hai"): a regular login
  // now ADOPTS the account's existing session token instead of minting a
  // new one that force-logs-out every other device signed in as the same
  // account -- see the big comment above issueNewSessionToken for why. An
  // admin's explicit "Force logout" (Team page) is still the way to
  // actually kick a specific device.
  adoptOrIssueSessionToken(u.username);
  primeDevicePermissions();
  S.loginLog.push({id:uid(), username:u.username, name:u.name, role:u.role, at:Date.now()});
  if(S.loginLog.length>2000) S.loginLog = S.loginLog.slice(-2000); // day-partitioned now, but keep an overall sanity cap
  savePartitionForItem('loginLog', S.loginLog[S.loginLog.length-1]);
  S.postLoginPhase = null; S.pendingUser = null;
  interactiveLoginInFlight = false; // this login attempt has now fully completed end-to-end -- safe to let onAuthStateChanged's auto-restore branch run again for any FUTURE sign-in event (e.g. a much later token refresh)
  render();
  backfillCatalogCaseSizes();
  sendHeartbeat();
  initPushNotifications();
  checkForMissedNotifsOnLogin();
}
function doLogout(){
  // DEFENSIVE HARDENING (2026-08-29, "logout karte h to welcome screen ati
  // hai, niche 'failed to save' likha ata hai"): the real root cause of the
  // stray welcome screen was a separate onAuthStateChanged race (see its
  // big fix comment above) that could leave S.postLoginPhase stuck non-null
  // for the rest of the session -- invisible while logged in, since render()
  // only ever looks at postLoginPhase while S.currentUser is null, so it
  // would suddenly reappear the moment THIS function set currentUser back
  // to null. That race is fixed at the source now, but resetting it here
  // too costs nothing and guards against any other future path that might
  // leave it dangling. Also detaches every live Firestore listener BEFORE
  // signing out (rather than only later, async, once onAuthStateChanged's
  // own fbUser-null branch gets around to it) -- shrinks the window where a
  // listener-triggered background write (e.g. a read-receipt mark from an
  // incoming message) could still be in flight right as auth goes away and
  // get rejected by firestore.rules once request.auth is gone, which is
  // exactly what was popping the "Save failed" toast during/right after
  // logout. Any write that's already in flight at this exact instant can
  // still lose that race — __intentionalLogoutInProgress (see
  // fsReportWriteError) is the actual fix for that: it's expected and not
  // worth alarming the person about on the login screen they just asked to
  // see.
  __intentionalLogoutInProgress = true;
  setTimeout(()=>{ __intentionalLogoutInProgress = false; }, 5000); // generous window for any already-in-flight write to settle/fail silently before treating a future failure as a real problem again
  fsDetachAllListeners();
  fsLogout(); // Task #54: Firebase Auth sign-out -- never awaited, never blocks the local logout below
  unsubscribePushNotifications(); // "login mandatory for notifications" -- see its own comment
  S.currentUser = null; S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; S.alertPanelOpen=null;
  S.postLoginPhase = null; S.pendingUser = null;
  interactiveLoginInFlight = false; // defensive reset, same reasoning as the S.postLoginPhase reset just above
  S.authToken = null; persistAuthToken(null);
  persistSession(null);
  try{ localStorage.removeItem(DEVICE_SESSION_TOKEN_KEY); localStorage.removeItem(DEVICE_SESSION_TOKEN_AT_KEY); }catch(e){}
  // BUGFIX (2026-09-02, found during a full crash/regression sweep): a modal
  // or app-alert dialog (showModal/showAlert/showConfirm/showPrompt) is
  // appended as a SIBLING of #root, directly to .device-screen -- see
  // showModal's own comment -- specifically so render()'s root.innerHTML
  // rebuild never clobbers it mid-animation. That also means it survives a
  // LOGOUT untouched, since logout only ever resets S.notifOpen/moreOpen/
  // profileOpen/alertPanelOpen (rendered inside #root) and calls render().
  // On a shared tablet this app is designed to stay logged in on for days,
  // that left a previous person's still-fully-interactive modal (an
  // half-filled order/expense/customer form, or a chat) sitting on top of
  // the next person's fresh login screen -- and since the remote
  // force-logout path (checkSessionStillValid(), fired from a live
  // activeSessions listener) can interrupt a logout at ANY moment, this
  // wasn't even limited to someone manually tapping "Log out" mid-edit.
  // Fixed by removing both overlay kinds directly here (not via
  // closeModal()/an alert's own Cancel handler -- those play exit
  // animations and call syncBackStack() against the OUTGOING user's stale
  // S.view, neither of which is wanted for an instant logout teardown).
  const staleModalOverlay = document.getElementById('modalOverlay');
  if(staleModalOverlay) staleModalOverlay.remove();
  const staleAlertOverlay = document.getElementById('appAlertOverlay');
  if(staleAlertOverlay) staleAlertOverlay.remove();
  // Same sweep: the back-button dummy history-stack bookkeeping also needs a
  // hard reset here, not just left to drift. syncBackStack() no-ops
  // entirely while !S.currentUser (see its own comment), so a nonzero
  // __backDepth left over from before this logout (e.g. a modal open PLUS a
  // non-Home tab active = wanted depth 2) is never unwound by the normal
  // path -- the NEXT login's first syncBackStack() call would then need to
  // issue two synchronous history.back() calls to correct it, but
  // __suppressNextPopstate is a single boolean and can only correctly
  // swallow the FIRST resulting popstate; the second would fire unsuppressed
  // and be handled as a genuine user back-press moments after a fresh login.
  __backDepth = 0;
  __suppressNextPopstate = false;
  render();
}
// Manual, on-demand backup — fetches everything fresh from the backend
// (not just what's currently in memory) and downloads it as one JSON file.
// Mirrors scripts/export_to_firestore.js's own key coverage (PARTITIONED_PREFIXES
// + STOCK_FIELDS + the remaining STATIC_KEYS), minus that script's SKIP_KEYS
// (activeSessions/pendingNotifs/pushTopicState/authSessions/loginLockouts --
// transient or server-side-only, not "data" worth backing up).
const BACKUP_DATA_KEYS = [
  'orders','activityLog','attendance','expenses','dominoPrints','loginLog',
  'chatMessages','retailSales','trackingViewLogs','siteVisitLogs','stockMovementLog',
  'rawMaterial','filledStock','readyStock','lowStock','watchStock',
  'users','customers','tasks','stockTasks','catalogItems','customRoles','transports',
  'rolePermissions','dailyRecordMarks','batchReferences','holidays','expenseBalances','notificationPrefs','attendanceSettings',
];
async function downloadBackupNow(){
  showToast('Preparing backup…');
  try{
    // FIXED (Task #54): was `const { data } = await apiFetchAll();`, which
    // hit the OLD Apps Script/Sheets backend -- since
    // scripts/export_to_firestore.js's one-time migration that backend is no
    // longer written to and goes increasingly stale. Firestore's own
    // real-time listeners (attachFirestoreListeners) keep S itself live and
    // current now, so the backup is just a snapshot of S's already-current
    // in-memory state -- no network round trip needed at all.
    const data = {};
    BACKUP_DATA_KEYS.forEach(k=>{ data[k] = S[k]; });
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `OrderOps-Backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded ✅');
  }catch(e){
    console.error(e);
    showToast('Could not download backup — try again', true);
  }
}

/* ============================= STOCK ALERTS (cascading) =============================
   If ready stock is short: check filled stock can cover it -> if not, check raw oil
   can cover the remaining shortfall -> if raw also can't cover it, raise all 3 alerts. */
function getStockAlerts(){
  const raw = Object.entries(S.rawMaterial).filter(([c,v])=>v<0).map(([c,v])=>({id:c, label:c, text:fmtMl(v), team:'Owner / Manager — purchase more raw oil', level:'critical'}));
  const filledDirect = Object.entries(S.filledStock).filter(([k,v])=>v<0).map(([k,v])=>{const it=findItem(k); return {id:k, label: it?`${it.name} ${it.size}`:k, text:`${v} pc — need ${-v} pc`, needQty:-v, level:'critical', team:'Filling team — fill more'};});
  const ready = [];
  const filledCascade = [];
  const rawCascade = [];
  const recRaw = [], recFilled = [], recReady = [];
  Object.entries(S.readyStock).filter(([k,v])=>v<0).forEach(([k,v])=>{
    const it = findItem(k); if(!it) return;
    const shortfall = -v; // pieces short in ready
    const filledAvail = S.filledStock[k]||0;
    ready.push({id:k, label:`${it.name} ${it.size}`, text:`${v} pc — need ${shortfall} pc`, needQty:shortfall, team:'Packaging team — package more', level:'critical'});
    if(filledAvail < shortfall){
      const stillShort = shortfall - Math.max(filledAvail,0);
      filledCascade.push({id:k, label:`${it.name} ${it.size}`, text:`need ${stillShort} more pc`, needQty:stillShort, team:'Filling team — fill more', level:'critical'});
      const rawAvail = S.rawMaterial[it.rawCat]||0;
      const mlNeeded = stillShort * it.ml;
      if(rawAvail < mlNeeded){
        rawCascade.push({id:it.rawCat, label:it.rawCat, text:`short ~${fmtMl(mlNeeded-rawAvail)}`, team:'Owner / Manager — purchase more raw oil', level:'critical'});
      }
    }
  });
  // Low-stock (owner-set threshold), only when not already negative
  RAW_CATEGORIES.forEach(cat=>{
    const v = S.rawMaterial[cat]||0; const th = S.lowStock.raw[cat];
    if(th && v>=0 && v<=th) raw.push({id:cat, label:cat, text:`${fmtMl(v)} (low, alert at ${fmtMl(th)})`, team:'Owner / Manager — running low, plan a purchase', level:'low'});
  });
  CATALOG_FLAT.forEach(it=>{
    const vf = S.filledStock[it.key]||0; const thf = S.lowStock.filled[it.key];
    if(thf && vf>=0 && vf<=thf) filledDirect.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vf} pc — low (alert at ${thf} pc)`, needQty:Math.max(thf-vf,1), team:'Filling team — running low', level:'low'});
    const vr = S.readyStock[it.key]||0; const thr = S.lowStock.ready[it.key];
    if(thr && vr>=0 && vr<=thr){
      const needQty = Math.max(thr-vr,1);
      ready.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vr} pc — low (alert at ${thr} pc)`, needQty, team:'Packaging team — running low', level:'low'});
      // A low (not yet critical) ready shortage still needs enough FILLED
      // stock to actually pack from — if there isn't enough, give filling
      // team a heads-up too, just at "recommended" (not urgent) severity,
      // matching the softer severity of the ready-side alert itself.
      const filledAvail = S.filledStock[it.key]||0;
      if(filledAvail < needQty && !filledDirect.some(a=>a.id===it.key)){
        recFilled.push({id:it.key, label:`${it.name} ${it.size}`, text:`${filledAvail} pc (recommend filling — packaging is running low)`, needQty:needQty-Math.max(filledAvail,0), team:'Filling team — plan ahead', level:'recommended'});
      }
    }
  });
  // merge direct + cascaded, de-duped by id (keep most severe)
  const dedupe = (list)=>{ const seen=new Map(); list.forEach(a=>{ const ex=seen.get(a.id); if(!ex || (ex.level!=='critical'&&a.level==='critical')) seen.set(a.id,a); }); return [...seen.values()]; };
  const filled = dedupe([...filledDirect, ...filledCascade]);
  const rawAll = dedupe([...raw, ...rawCascade]);
  // Recommended (preemptive heads-up) — only for items that aren't already
  // flagged critical/low, based on a separate, higher "watch" threshold the
  // admin can set. This is a softer, forward-looking suggestion, not an alert.
  RAW_CATEGORIES.forEach(cat=>{
    if(rawAll.some(a=>a.id===cat)) return;
    const v = S.rawMaterial[cat]||0; const th = S.watchStock.raw[cat];
    if(th && v>=0 && v<=th) recRaw.push({id:cat, label:cat, text:`${fmtMl(v)} (recommend purchasing soon)`, team:'Owner / Manager — plan ahead', level:'recommended'});
  });
  CATALOG_FLAT.forEach(it=>{
    if(!filled.some(a=>a.id===it.key)){
      const vf = S.filledStock[it.key]||0; const thf = S.watchStock.filled[it.key];
      if(thf && vf>=0 && vf<=thf && !recFilled.some(a=>a.id===it.key)) recFilled.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vf} pc (recommend filling soon)`, needQty:Math.max(thf-vf,1), team:'Filling team — plan ahead', level:'recommended'});
    }
    if(!ready.some(a=>a.id===it.key)){
      const vr = S.readyStock[it.key]||0; const thr = S.watchStock.ready[it.key];
      if(thr && vr>=0 && vr<=thr) recReady.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vr} pc (recommend packing soon)`, needQty:Math.max(thr-vr,1), team:'Packaging team — plan ahead', level:'recommended'});
    }
  });
  return {raw:rawAll, filled, ready, recommended:{raw:recRaw, filled:recFilled, ready:recReady}, total: rawAll.length+filled.length+ready.length};
}

/* Search + "non-zero on top" sort helper for inventory lists */
function filterSortInventory(list, searchKey, valueFn, labelFn){
  const q = (S.search[searchKey]||'').trim().toLowerCase();
  let out = list.filter(it => !q || labelFn(it).toLowerCase().includes(q));
  out = out.slice().sort((a,b)=>{
    const va = valueFn(a), vb = valueFn(b);
    const tierOf = v => v<0 ? 0 : v>0 ? 1 : 2; // 0: short (negative), 1: in stock, 2: empty
    const ta = tierOf(va), tb = tierOf(vb);
    if(ta!==tb) return ta-tb;
    return labelFn(a).localeCompare(labelFn(b)); // alphabetical within every tier
  });
  return out;
}

// Enhances every <select> within `container` into a custom in-app dropdown
// (an inline-expanding list styled like the rest of the app) instead of the
// browser's own native dropdown popup. The real <select> stays in the DOM
// (visually hidden) so every existing .value read/write and 'change'
// listener throughout the app keeps working completely unchanged — this
// is purely a visual layer on top of it.
// Enhances every <input list="..."> within `container` into a custom
// in-app searchable autocomplete (an inline-filtering list styled like the
// rest of the app) instead of the browser's own native datalist suggestion
// popup. The input keeps working exactly as before (free typing still
// allowed, for cases like entering a brand-new party name) — this only
// replaces the SUGGESTION UI on top of it.
function enhanceAutocomplete(container){
  (container || document).querySelectorAll('input[list]:not([data-idac-enhanced])').forEach(input=>{
    const datalistId = input.getAttribute('list');
    const datalist = document.getElementById(datalistId);
    if(!datalist) return;
    input.dataset.idacEnhanced = '1';
    input.removeAttribute('list'); // stop the native browser suggestion popup — we render our own below instead
    const options = [...datalist.options].map(o=>o.value);

    const wrap = document.createElement('div');
    wrap.className = 'idd-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    const list = document.createElement('div');
    list.className = 'idd-list';
    wrap.appendChild(list);

    const closeList = ()=>{ list.classList.remove('idd-list-open'); };
    const buildList = (filterText)=>{
      if(input.disabled){ closeList(); return; }
      const norm = (filterText||'').trim().toLowerCase();
      const filtered = (norm ? options.filter(o=>o.toLowerCase().includes(norm)) : options).slice(0,50); // cap for perf on long catalogs
      list.innerHTML = '';
      if(filtered.length===0){ closeList(); return; }
      filtered.forEach(opt=>{
        const item = document.createElement('div');
        item.className = 'idd-item';
        item.textContent = opt;
        // mousedown (not click) fires before the input's blur, so the
        // selection registers before blur's delayed close removes the list
        item.addEventListener('mousedown', (e)=>{
          e.preventDefault();
          input.value = opt;
          input.dispatchEvent(new Event('input', {bubbles:true}));
          input.dispatchEvent(new Event('change', {bubbles:true}));
          closeList();
        });
        list.appendChild(item);
      });
      list.classList.add('idd-list-open');
    };
    input.addEventListener('input', ()=>buildList(input.value));
    input.addEventListener('focus', ()=>buildList(input.value));
    input.addEventListener('blur', ()=>{ setTimeout(closeList, 150); });
  });
}
function enhanceFormControls(container){
  enhanceDropdowns(container);
  enhanceAutocomplete(container);
}
function enhanceDropdowns(container){
  (container || document).querySelectorAll('select:not([data-idd-enhanced])').forEach(sel=>{
    sel.dataset.iddEnhanced = '1';
    const wrap = document.createElement('div');
    wrap.className = 'idd-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    sel.style.display = 'none';
    wrap.appendChild(sel);
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'idd-trigger';
    trigger.innerHTML = `<span class="idd-trigger-text"></span><span class="idd-chevron">▾</span>`;
    const list = document.createElement('div');
    list.className = 'idd-list';
    wrap.appendChild(trigger);
    wrap.appendChild(list);

    const textSpan = trigger.querySelector('.idd-trigger-text');
    const refreshTrigger = ()=>{
      const opt = sel.options[sel.selectedIndex];
      const isPlaceholder = !opt || !opt.value;
      textSpan.textContent = opt ? opt.textContent : '';
      trigger.classList.toggle('idd-placeholder', isPlaceholder);
      trigger.classList.toggle('idd-disabled-trigger', sel.disabled);
    };
    const closeList = ()=>{ list.classList.remove('idd-list-open'); trigger.classList.remove('idd-open'); };
    const buildList = ()=>{
      list.innerHTML = '';
      [...sel.options].forEach((opt, idx)=>{
        const item = document.createElement('div');
        item.className = 'idd-item' + (opt.selected?' idd-selected':'') + (opt.disabled?' idd-disabled':'');
        item.textContent = opt.textContent;
        if(!opt.disabled){
          item.addEventListener('click', ()=>{
            sel.selectedIndex = idx;
            sel.dispatchEvent(new Event('change', {bubbles:true}));
            refreshTrigger();
            closeList();
          });
        }
        list.appendChild(item);
      });
    };
    trigger.addEventListener('click', ()=>{
      if(sel.disabled) return;
      const isOpen = list.classList.contains('idd-list-open');
      document.querySelectorAll('.idd-list.idd-list-open').forEach(l=>{ l.classList.remove('idd-list-open'); if(l.previousElementSibling) l.previousElementSibling.classList.remove('idd-open'); });
      if(!isOpen){ buildList(); list.classList.add('idd-list-open'); trigger.classList.add('idd-open'); }
    });
    // Most code elsewhere that sets sel.value directly also dispatches a
    // 'change' event right after (the established pattern throughout this
    // app), which is what keeps the visible trigger text in sync with it.
    sel.addEventListener('change', refreshTrigger);
    refreshTrigger();
  });
}
// Close any open custom dropdown when tapping outside of it.
document.addEventListener('click', (e)=>{
  if(e.target.closest('.idd-wrap')) return;
  document.querySelectorAll('.idd-list.idd-list-open').forEach(l=>{ l.classList.remove('idd-list-open'); if(l.previousElementSibling) l.previousElementSibling.classList.remove('idd-open'); });
});
function bindSearchBar(searchKey, updateResultsFn){
  const el = document.getElementById('search_'+searchKey);
  if(!el) return;
  let t = null;
  el.addEventListener('input', ()=>{
    S.search[searchKey]=el.value;
    clearTimeout(t);
    t = setTimeout(()=>{
      if(updateResultsFn){
        updateResultsFn(); // the search input's own DOM node is never touched — no focus loss, no keyboard flicker
      } else {
        render();
        setTimeout(()=>{ const e2=document.getElementById('search_'+searchKey); if(e2){ e2.focus(); e2.setSelectionRange(e2.value.length,e2.value.length); } },0);
      }
    }, 120);
  });
}

/* ============================= STOCK TASKS (owner sends a low/short-stock alert to the relevant team) ============================= */
function sendStockTask(kind, itemId, label, qtyText){
  const targetRole = kind==='filled' ? 'filling' : kind==='ready' ? 'packaging' : null;
  if(!targetRole){ showToast('Owner purchases raw material — nothing to send.', true); return; }
  const already = S.stockTasks.some(t=>t.status==='open' && t.kind===kind && t.itemId===itemId);
  if(already){ showToast('Already sent — still open'); return; }
  S.stockTasks.push({id:uid(), kind, itemId, label, qtyText:qtyText||'', targetRole, createdBy:S.currentUser.name, createdAt:Date.now(), status:'open'});
  safeSet('app:stockTasks', S.stockTasks);
  showToast('Sent to '+(targetRole==='filling'?'filling team':'packaging team'));
}
// Filling team fills more -> clears any open "filled stock low" task for that item.
function completeStockTasksForItem(kind, key){
  let changed=false;
  S.stockTasks.forEach(t=>{ if(t.status==='open' && t.kind===kind && t.itemId===key){ t.status='done'; changed=true; } });
  if(changed) safeSet('app:stockTasks', S.stockTasks);
}
// Auto-closes any open stock task whose underlying shortage/low-stock alert
// no longer exists — e.g. an order was deleted or edited and the item is no
// longer short, so the task the team was working on is removed automatically.
function reconcileStockTasks(){
  const alerts = getStockAlerts();
  const stillAlerting = (t)=>{
    const list = t.tier==='recommended'
      ? (t.kind==='filled' ? alerts.recommended.filled : alerts.recommended.ready)
      : (t.kind==='filled' ? alerts.filled : alerts.ready);
    return list.some(a=>a.id===t.itemId);
  };
  let changed = false;
  S.stockTasks.forEach(t=>{
    if(t.status==='open' && !stillAlerting(t)){ t.status='done'; changed=true; }
  });
  if(changed) safeSet('app:stockTasks', S.stockTasks);
  return changed;
}
// Automatically pushes every active filled/ready shortage into the relevant
// team's task list — no manual "send" needed. Idempotent (skips ones already open).
// Once every non-cancelled item on a processing order genuinely no longer
// needs filling (or, after that, packing) — per the same cascade-aware
// stock check the demand table uses — the order's status advances on its
// own. This replaces the old manual "mark done" buttons: completion is now
// a fact about the stock, not a claim someone has to remember to make.
function autoAdvanceFillingPackaging(alerts){
  let changed = false;
  // FIXED (found during a 2026-08-28 security-rules audit, never caught by
  // this build's own test suite): this called `savePartitionDay('orders',
  // d)` -- a function that does not exist anywhere in this file (a
  // leftover from an incomplete Task #54 port; the old Sheets model's
  // "resave a whole day partition" concept has no Firestore equivalent,
  // see savePartitionForItem's own header comment). Every call threw a
  // ReferenceError, which is EVERY time this ran -- i.e. after essentially
  // any filling/packing entry -- silently breaking order auto-advancement
  // and leaving the triggering UI handler's own closeModal()/render()/
  // showToast() calls never reached (uncaught throw). Fixed to track the
  // touched ORDER OBJECTS (not day keys -- there's no day concept left)
  // and save each one via savePartitionForItem, exactly like
  // markOrderReadyNow/markOrderPacked/etc. already correctly do.
  const touchedOrders = new Set();
  S.orders.forEach(o=>{
    if(o.status!=='processing') return;
    if(o.fillingStatus!=='done' && !orderNeedsRoleWork(o,'filling',alerts)){
      o.fillingStatus='done'; changed=true; touchedOrders.add(o);
    }
    if(o.fillingStatus==='done' && o.packagingStatus!=='done' && !orderNeedsRoleWork(o,'packaging',alerts)){
      o.packagingStatus='done'; changed=true; touchedOrders.add(o);
    }
  });
  touchedOrders.forEach(o=>fsSaveOrderStatusFields(o));
  return changed;
}
function syncStockTasksFromAlerts(){
  let changed = false;
  // Anyone's action can resolve a shortage, so reconciliation (closing tasks
  // that no longer apply) always runs. Only admin/manager *create* new tasks,
  // to avoid every role's routine actions spawning tasks on a technicality.
  if(S.currentUser && ['admin','manager'].includes(S.currentUser.role)){
    const alerts = getStockAlerts();
    const ensure = (kind, list, tier)=>{
      list.forEach(a=>{
        const already = S.stockTasks.some(t=>t.status==='open' && t.kind===kind && t.itemId===a.id && (t.tier||null)===(tier||null));
        if(!already){
          S.stockTasks.push({id:uid(), kind, itemId:a.id, label:a.label, qtyText:a.text||'', targetRole: kind==='filled'?'filling':'packaging', createdBy:'Auto', createdAt:Date.now(), status:'open', ...(tier?{tier}:{})});
          changed = true;
        }
      });
    };
    ensure('filled', alerts.filled);
    ensure('ready', alerts.ready);
    // Recommended (preemptive) tasks are always created too — they're just
    // kept out of the bell when there's more pressing work (see renderNotifPanel).
    ensure('filled', alerts.recommended.filled, 'recommended');
    ensure('ready', alerts.recommended.ready, 'recommended');
  }
  if(autoAdvanceFillingPackaging(getStockAlerts())) changed = true;
  if(reconcileStockTasks()) changed = true;
  if(changed) safeSet('app:stockTasks', S.stockTasks);
  return changed;
}
function assignAllStockTasks(kind){
  const alerts = getStockAlerts();
  const list = kind==='filled' ? alerts.filled : alerts.ready;
  let count = 0;
  list.forEach(a=>{
    const already = S.stockTasks.some(t=>t.status==='open' && t.kind===kind && t.itemId===a.id);
    if(!already){
      S.stockTasks.push({id:uid(), kind, itemId:a.id, label:a.label, qtyText:a.text||'', targetRole: kind==='filled'?'filling':'packaging', createdBy:S.currentUser.name, createdAt:Date.now(), status:'open'});
      count++;
    }
  });
  if(count) safeSet('app:stockTasks', S.stockTasks);
  showToast(count ? `${count} task(s) assigned to the ${kind==='filled'?'filling':'packaging'} team` : 'Already all assigned');
  render();
}

// Records a single stock movement for the per-item audit trail (admin-only,
// 7-day retention). kind: 'purchase'|'filling'|'packaging'|'order'|'retail'|'adjust'.
// delta is signed (+added, -deducted) so the log reads naturally either way.
function logStockMovement(key, itemLabel, kind, delta, note, poolOverride){
  // Unit/pool isn't always obvious from `kind` alone (e.g. 'adjust' could be
  // raw/filled/ready; packaging's filled-side line also uses kind='packaging'
  // just like its ready-side line) — poolOverride disambiguates those.
  // Raw material categories are auto-detected by key, since they're never
  // ambiguous with a catalog item key.
  const isRaw = poolOverride==='raw' || (!poolOverride && RAW_CATEGORIES.includes(key));
  const isFilledPool = poolOverride==='filled' || (!poolOverride && !isRaw && kind==='filling');
  const pool = isRaw ? 'raw' : isFilledPool ? 'filled' : 'ready';
  const unit = isRaw ? 'mL' : 'pc';
  const totalAfter = isRaw ? (S.rawMaterial[key]||0) : isFilledPool ? (S.filledStock[key]||0) : (S.readyStock[key]||0);
  const entry = { id:uid(), key, itemLabel, kind, delta, note: note||'', unit, pool, totalAfter, by:S.currentUser.name, byUsername:S.currentUser.username, at:Date.now() };
  S.stockMovementLog.push(entry);
  savePartitionForItem('stockMovementLog', entry);
}
function applyActivityForward(e){
  if(e.kind==='purchase'){ S.rawMaterial[e.cat] = (S.rawMaterial[e.cat]||0) + e.ml; logStockMovement(e.cat, e.cat, 'purchase', e.ml, `${activityLabel(e)} — entry edited`); }
  if(e.kind==='filling'){
    const mlUsed = e.actualMl!=null ? e.actualMl : (e.qty*e.mlPer);
    S.rawMaterial[e.rawCat] = (S.rawMaterial[e.rawCat]||0) - mlUsed;
    S.filledStock[e.key] = (S.filledStock[e.key]||0) + e.qty;
    logStockMovement(e.rawCat, e.rawCat, 'filling', -mlUsed, `${activityLabel(e)} — entry edited`);
    logStockMovement(e.key, e.itemLabel, 'filling', e.qty, `${activityLabel(e)} — entry edited`);
  }
  if(e.kind==='packaging'){
    S.filledStock[e.key] = (S.filledStock[e.key]||0) - e.qty;
    S.readyStock[e.key] = (S.readyStock[e.key]||0) + e.qty;
    // Keep the "Updated Qty" shown on the Daily Work packing row accurate
    // after an edit re-applies this entry's stock effect.
    e.totalAfter = S.readyStock[e.key];
    logStockMovement(e.key, e.itemLabel, 'packaging', -e.qty, `${activityLabel(e)} — entry edited (from filled)`, 'filled');
    logStockMovement(e.key, e.itemLabel, 'packaging', e.qty, `${activityLabel(e)} — entry edited`);
  }
}
function revertActivity(e, reason){
  const tag = reason==='delete' ? 'entry deleted' : 'reverted';
  if(e.kind==='purchase'){ S.rawMaterial[e.cat] = (S.rawMaterial[e.cat]||0) - e.ml; logStockMovement(e.cat, e.cat, 'purchase', -e.ml, `${activityLabel(e)} — ${tag}`); }
  if(e.kind==='filling'){
    const mlUsed = e.actualMl!=null ? e.actualMl : (e.qty*e.mlPer);
    S.rawMaterial[e.rawCat] = (S.rawMaterial[e.rawCat]||0) + mlUsed;
    S.filledStock[e.key] = (S.filledStock[e.key]||0) - e.qty;
    logStockMovement(e.rawCat, e.rawCat, 'filling', mlUsed, `${activityLabel(e)} — ${tag}`);
    logStockMovement(e.key, e.itemLabel, 'filling', -e.qty, `${activityLabel(e)} — ${tag}`);
  }
  if(e.kind==='packaging'){
    S.filledStock[e.key] = (S.filledStock[e.key]||0) + e.qty;
    S.readyStock[e.key] = (S.readyStock[e.key]||0) - e.qty;
    logStockMovement(e.key, e.itemLabel, 'packaging', e.qty, `${activityLabel(e)} — ${tag} (to filled)`, 'filled');
    logStockMovement(e.key, e.itemLabel, 'packaging', -e.qty, `${activityLabel(e)} — ${tag}`);
  }
}

function openEditLogModal(e, opts){
  // allowUntilBooked: used by Daily Work (see editDailyEntry) where the
  // rule is "your own entry, editable until it's booked" -- NOT the
  // general 5-minute self-edit window used everywhere else (e.g. Home's
  // "Your recent activity" quick-fix list). Booked itself always blocks
  // editing regardless of this flag -- see the save handler below.
  const allowUntilBooked = !!(opts && opts.allowUntilBooked);
  const isPurchase = e.kind==='purchase';
  const isFilling = e.kind==='filling';
  const currentActualL = isFilling ? ((e.actualMl!=null ? e.actualMl : (e.qty*e.mlPer))/1000).toFixed(2) : null;
  const standardL = isFilling ? ((e.qty*e.mlPer)/1000).toFixed(2) : null;
  showModal(`
    <h3>${esc(t('Edit'))} — ${esc(activityLabel(e))}</h3>
    <div class="field"><label>${esc(isPurchase?t('New quantity (Liters)'):t('New quantity (pieces)'))}</label>
      <input id="editLogVal" type="number" min="0" ${isPurchase?`max="${MAX_PURCHASE_L}" step="0.01"`:`max="${MAX_PC_ENTRY}"`} value="${isPurchase?(e.ml/1000):e.qty}" />
    </div>
    ${isFilling ? `
    <div class="field"><label>${esc(t('Actual oil used (Liters)'))}</label>
      <input id="editLogActualL" type="number" min="0" step="0.01" value="${currentActualL}" />
      <div class="mono" style="margin-top:6px;">${esc(t('Standard for this qty:'))} ${standardL} L. ${esc(t('Adjust here if more/less oil was actually used (spillage, wastage, etc.) — the difference is reflected in raw material stock.'))}</div>
    </div>` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">${esc(t('Cancel'))}</button>
      <button type="button" class="btn btn-primary" id="editLogSave">${esc(t('Save'))}</button>
    </div>
  `);
  document.getElementById('editLogSave').addEventListener('click', ()=>{
    const isAdmin = S.currentUser.role==='admin';
    const isOwner = e.byUsername===S.currentUser.username;
    const windowOk = allowUntilBooked || withinSelfEditWindow(e); // withinSelfEditWindow already always true for admin
    if(e.booked || (!isAdmin && !isOwner) || (!isAdmin && !windowOk)){
      showAlert(e.booked ? t('This entry has already been booked and can no longer be edited.') : t('This entry can no longer be edited (past the 5-minute window).'));
      closeModal(); render(); return;
    }
    let val = parseFloat(document.getElementById('editLogVal').value)||0;
    // MEDIUM FIX (2026-08-21 audit, finding #20): this Save button is
    // type="button" with its own click handler, not a real <form> submit
    // -- so the input's min="0" HTML attribute is never actually enforced
    // by the browser's constraint validation (that only runs on a real
    // form submission). Without this explicit check, typing a negative
    // quantity here silently corrupts stock totals via
    // applyActivityForward/revertActivity below.
    if(val<0){ showAlert(t('Quantity cannot be negative.')); return; }
    const cap = isPurchase ? MAX_PURCHASE_L : MAX_PC_ENTRY;
    if(val>cap){ showAlert(`${t('Max allowed is')} ${cap} ${isPurchase?'L':t('pc')} ${t('per entry.')}`); return; }
    revertActivity(e);
    if(isPurchase){ e.ml = val*1000; }
    else {
      e.qty = Math.round(val);
      if(isFilling){
        const actualLInput = document.getElementById('editLogActualL');
        const actualL = actualLInput ? parseFloat(actualLInput.value) : NaN;
        e.actualMl = !isNaN(actualL) && actualL>=0 ? actualL*1000 : null; // null = fall back to standard qty*mlPer
      }
    }
    applyActivityForward(e); // already logs "entry edited" internally (see applyActivityForward)
    saveAfterActivityChange(e);
    // FIXED (2026-08-28, "delete/edit se daily work/checklist bhi update
    // ho" bugfix): the stock NUMBERS above were already correctly reverted
    // + reapplied, but the derived filling/packaging stock-tasks checklist
    // was never resynced to match -- every OTHER stock-changing flow in
    // this file (the original filling/packaging entry, purchase, order
    // accept/reject, etc.) calls this right after touching stock; editing
    // an entry from Daily Work was the one place that didn't, so a task
    // that should have reappeared (edit made the shortage worse) or
    // disappeared (edit fixed it) silently stayed stale until some other,
    // unrelated stock change happened to trigger a resync.
    syncStockTasksFromAlerts();
    closeModal(); render(); showToast('Entry updated');
  });
}

/* ---------- Round 15 animation helpers (see the CSS comment above
   #map for the full "subtle & professional, whole app" writeup) ----------
   Both helpers are called once from render(), right after a genuine DOM
   rebuild (root.innerHTML = newHtml), never on the "nothing actually
   changed" early-return path. Both cache "what was here last render" in a
   module-level Map keyed by something stable across renders (a data
   attribute, or a label's own text) -- NOT by DOM node, since every render
   creates brand-new nodes -- so a value/status is only animated when it
   genuinely changed since the last time that same tile/order was seen, and
   never animates on first sight (no count-up-from-zero when a screen first
   opens, no false "just changed" flash for an order you're loading for the
   first time). */
const _numAnimCache = new Map();
function animateStatNumbers(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('.stat .n, .stat-card-v2 .n').forEach((el, idx)=>{
    const raw = el.textContent.trim();
    // Only plain formatted numbers, e.g. "42", "1,234", "₹12,345", "₹-500"
    // -- NOT things like a "3:45" HH:MM duration (fmtHHMM output), which
    // this deliberately leaves untouched (counting "up" through a duration
    // string makes no sense).
    const m = raw.match(/^([^\d-]*)(-?[\d,]+)([^\d]*)$/);
    if(!m) return;
    const prefix = m[1], suffix = m[3];
    const target = parseInt(m[2].replace(/,/g,''), 10);
    if(!Number.isFinite(target)) return;
    const tileEl = el.closest('[data-stat],[data-more-tab],.stat,.stat-card-v2');
    const labelEl = tileEl ? tileEl.querySelector('.l,.title') : null;
    const key = (tileEl && (tileEl.getAttribute('data-stat') || tileEl.getAttribute('data-more-tab')))
                || (labelEl && labelEl.textContent.trim()) || ('statnum'+idx);
    const prev = _numAnimCache.get(key);
    _numAnimCache.set(key, target);
    if(prev===undefined || prev===target) return; // first sight, or genuinely unchanged -- snap, don't animate
    const start = prev, delta = target-start, dur = 450, t0 = performance.now();
    (function tick(now){
      const p = Math.min(1, (now-t0)/dur);
      const eased = 1 - Math.pow(1-p, 3); // ease-out cubic
      const val = Math.round(start + delta*eased);
      el.textContent = prefix + val.toLocaleString('en-IN') + suffix;
      if(p<1) requestAnimationFrame(tick);
    })(t0);
  });
}
const _statusFlashCache = new Map();
function flashChangedBadges(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('.order-tile[data-order-id]').forEach(tile=>{
    const id = tile.getAttribute('data-order-id');
    const badge = tile.querySelector('.badge');
    if(!badge) return;
    const statusClass = Array.from(badge.classList).find(c=>c.indexOf('badge-')===0) || '';
    const prev = _statusFlashCache.get(id);
    _statusFlashCache.set(id, statusClass);
    if(prev!==undefined && prev!==statusClass) badge.classList.add('status-flash');
  });
}
function render(){
  const root = document.getElementById('root');
  if(!S.loaded){
    root.innerHTML = renderBrandedLoadingScreen();

  }
  if(S.loadFailed && !S.currentUser){
    root.innerHTML = renderConnectionFailedScreen();
    bindConnectionFailedScreen();
    return;
  }
  if(!S.currentUser){
    if(S.postLoginPhase){
      root.innerHTML = renderPostLoginSequence();
      bindPostLoginSequence();
      return;
    }
    root.innerHTML = renderLogin();
    bindLogin();
    lastRenderedView = null;
    return;

  // Rebuilding innerHTML resets scroll to 0 by default — capture and restore
  // the scrollable .content area's position so clicking anything doesn't
  // yank the page back to the top. Only do this when staying on the same
  // screen; switching tabs should still start fresh at the top.
  const sameView = lastRenderedView === S.view;
  navJustSwitched = !sameView; // read by the nav-item template to pop only the tab that's genuinely becoming active
  const prevContent = root.querySelector('.content');
  const savedScrollTop = sameView && prevContent ? prevContent.scrollTop : 0;
  const newHtml = renderShell();
  // Most background sync updates don't actually change anything THIS user
  // can currently see (someone else marked attendance while you're viewing
  // Orders, say) — skip the DOM replacement entirely when the screen would
  // come out byte-for-byte identical. This is what was causing the visible
  // "jump to top and back" on every sync tick: a full shell rebuild for a
  // screen that hadn't actually changed at all.
  if(sameView && newHtml === lastRenderedHtml) return;
  lastRenderedHtml = newHtml;
  root.innerHTML = newHtml;
  bindShell();
  enhanceFormControls(root);
  const newContent = root.querySelector('.content');
  if(newContent){
    newContent.style.scrollBehavior = 'auto'; // land instantly — don't let the smooth-scroll CSS animate this correction
    newContent.scrollTop = savedScrollTop;
  }
  // Round 15: number count-up + status flash -- see the two functions'
  // own header comment. Only runs on an actual rebuild (this line is after
  // the "byte-for-byte identical, skip it" early return above), and each
  // is itself a no-op unless the specific value/status it's looking at
  // genuinely changed since the last time it saw that same key.
  animateStatNumbers(newContent || root);
  flashChangedBadges(newContent || root);
  lastRenderedView = S.view;
  syncBackStack(); // keep the phone back-button history stack in sync with whichever side sheet (notif/more/profile/alerts) is now showing -- see syncBackStack's header comment
}

let loginError = '';
